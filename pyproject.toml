[project]
name = "arch-design-doc-generator"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
hc = ["tomli>=2.0; python_version < '3.11'", "curl_cffi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "scripts/shared/lib",
    "scripts/hld_lld/ai/deterministic",
    "scripts/hld_lld/ai",
    "scripts/shared/tools",
    "scripts/health_check",
]
