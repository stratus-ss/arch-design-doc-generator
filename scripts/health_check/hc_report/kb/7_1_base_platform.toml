[[checks]]
check_id = "7.1.sys.firewall"
title = "Firewall configuration"
description = "This engine check is titled Firewalls (TSR 1.5.5) but it evaluates the cluster Proxy\nobject. It WARNs when `httpProxy` or `httpsProxy` is set, because a proxy implies extra\nallow-list, noProxy, and firewall work. It does not probe host iptables or security-group ports.\n"
recommendation = "1. This check warns when a cluster-wide proxy is configured. Review it first:\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. If a proxy is set, confirm firewalls, security groups, proxy allow-lists, and `noProxy` permit the required OCP endpoints (API, registry, update graph).\n3. Identify the CNI. This prints the plugin name only (for example `OVNKubernetes`), not a port list:\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}'`\n4. Use that name to pick the overlay port, then confirm it is allowed between nodes:\n   - OVNKubernetes: Geneve UDP 6081\n   - OpenShiftSDN (removed in 4.17): VXLAN UDP 4789\n   Common to all: API 6443, etcd peer 2380, kubelet 10250, NodePort 30000-32767.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "affected nodes and external network controls"
impact_detail = "Security-group or ACL changes can be live, but host-firewall changes may briefly interrupt traffic and can require coordinated node-level rollout."

