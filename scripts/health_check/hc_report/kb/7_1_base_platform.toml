[[checks]]
check_id = "7.1.tsr.1_4_1_5_master_schedulable"
title = "1.4.1.5. Master Schedulable"
description = "Control-plane schedulability is topology-specific. Compact 3-node and SNO\nclusters must keep masters schedulable. Dedicated-worker clusters often set\n`mastersSchedulable` to false so user pods stay off the control plane.\n"
recommendation = "Set `mastersSchedulable` to match topology. Leave it true on compact and single-node clusters so the control plane can run workloads. Patch it to false on dedicated-worker clusters unless user pods on masters are an accepted design. Changing the flag does not resize nodes."
verification = "1. Print `spec.mastersSchedulable` from the Scheduler object:\n   `oc get scheduler cluster -o jsonpath='{.spec.mastersSchedulable}{\"\\n\"}'`\n2. Print the unique node roles to determine topology:\n   `oc get nodes --no-headers | awk '{print $3}' | sort -u`\n      Compact or SNO shows one line with `control-plane,master,worker`. Dedicated-worker topology shows separate `control-plane,master` and `worker` lines.\n3. On compact or SNO clusters, `mastersSchedulable` should be true.\n4. On a dedicated-worker cluster, set it to false if the control plane should not run user pods:\n   `oc patch scheduler cluster --type=merge -p '{\"spec\":{\"mastersSchedulable\":false}}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "control-plane scheduling"
impact_detail = "Changing mastersSchedulable to false prevents new workloads from landing on control-plane nodes but does not evict existing pods or reboot nodes. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

