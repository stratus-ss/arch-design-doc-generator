[[checks]]
check_id = "7.1.tsr.1_5_6_proxy"
title = "1.5.6. Proxy"
description = "Cluster-wide proxy configuration controls how nodes and pods reach external\nnetworks. Misconfigured proxy settings cause image pull failures, operator\ndegradation, and inability to reach update services.\n"
recommendation = "1. Print `httpProxy`, `httpsProxy`, and `noProxy` only:\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. If those are set, `noProxy` must include clusterNetwork, serviceNetwork, machineNetwork, and `.cluster.local` (see 1.5.4 and 1.5.10).\n3. Print trustedCA ConfigMap name only:\n   `oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}{\"\\n\"}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "cluster-wide egress"
impact_detail = "Proxy configuration changes roll out through Machine Config Operator and may cause node reboots if trustedCA bundle changes."

