[[checks]]
check_id = "7.1.tsr.1_5_9_swap"
title = "1.5.9. Swap"
description = "Kubernetes does not support swap on nodes by default. Enabled swap can cause\nunpredictable pod memory behavior, OOM kill ordering issues, and is\nunsupported in production OCP deployments.\n"
recommendation = "Disable swap on every node. If swap is enabled, disable it via MachineConfig so it survives reboot. Do not leave swap as accepted risk. Empty `swapon --show` means swap is already off."
verification = "1. Check whether swap is enabled on each node:\n   `oc debug node/<name> -- chroot /host swapon --show`\n2. **PASS** when the output is empty (no swap configured).\n3. If swap appears, it should be disabled via MachineConfig so the change persists across reboots."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

