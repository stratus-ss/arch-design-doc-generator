[[checks]]
check_id = "7.1.tsr.1_5_14_entropy"
title = "1.5.14. Entropy"
description = "Sufficient entropy is required for cryptographic operations, TLS handshakes,\nand certificate generation. Low entropy causes random number generation\nblocking, slow TLS negotiations, and pod startup delays.\n"
recommendation = "Raise `entropy_avail` above 200 on every node (expect 3000+ on virtio-rng or RDRAND hosts). If entropy is low, enable virtio-rng or equivalent on the hypervisor and re-check. Do not ignore low entropy on nodes that terminate TLS."
verification = "1. Print the available entropy on each node:\n   `oc debug node/<name> -- chroot /host cat /proc/sys/kernel/random/entropy_avail`\n2. **FAIL** when the value is below `200`. Investigate the entropy source.\n3. Modern kernels with `virtio-rng` or `RDRAND` typically report `3000+`."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

