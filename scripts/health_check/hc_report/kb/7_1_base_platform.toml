[[checks]]
check_id = "7.1.clusterversion.updates"
title = "Available updates"
description = "The Cluster Version Operator (CVO) lists supported upgrade targets in status.availableUpdates. The presence of available updates is a lifecycle-management indicator rather than a cluster health failure. Review the recommended update path, assess release notes and compatibility requirements, and schedule the upgrade within an appropriate maintenance window.\n"
recommendation = "Schedule a maintenance window to apply a recommended update shown in the OpenShift upgrade graph. Select an approved z-stream or minor-version target, follow only the upgrade paths offered by the graph."
verification = "1. Print the cluster version, channel, and available updates:\n   `oc get clusterversion version -o jsonpath='{.status.desired.version}{\" \"}{.spec.channel}{\"\\n\"}{range .status.availableUpdates[*]}available={.version}{\"\\n\"}{end}'`\n   `oc adm upgrade`\n2. Check the supported upgrade path using the OCP Upgrade Graph at https://access.redhat.com/labs/ocpupgradegraph/.\n3. After validating the path in a non-production cluster, apply the chosen release:\n   `oc adm upgrade --to=<target-version>`\n4. Monitor the ClusterVersion conditions until the rollout completes:\n   `oc get clusterversion version -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Minor or z-stream upgrades reconcile cluster operators and can drain, reboot, or roll nodes and workloads over time."

