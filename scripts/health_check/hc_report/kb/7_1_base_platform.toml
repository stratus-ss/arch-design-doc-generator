[[checks]]
check_id = "7.1.tsr.1_5_17_authentication"
title = "1.5.17. Authentication"
description = "Cluster authentication configuration determines identity providers, token\nlifetimes, and access controls. Production clusters should use enterprise\nidentity providers and remove the default kubeadmin account.\n"
recommendation = "1. Print identity provider names and types only:\n   `oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}{\"\\t\"}{.spec.identityProviders[*].type}{\"\\n\"}'`\n2. Print token max age if set:\n   `oc get oauth cluster -o jsonpath='{.spec.tokenConfig.accessTokenMaxAgeSeconds}{\"\\n\"}'`\n3. Check whether kubeadmin still exists:\n   `oc get secret kubeadmin -n kube-system --ignore-not-found`\n4. If an external identity provider is configured and validated, remove kubeadmin for security.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "authentication components"
impact_detail = "OAuth configuration changes roll authentication pods but do not reboot nodes or stop running workloads."

