[[checks]]
check_id = "7.1.sys.auth"
title = "Authentication configuration"
description = "Cluster authentication determines how users and service accounts authenticate.\nThe default kubeadmin user should be removed after external identity providers\nare configured and validated.\n"
recommendation = "Configure an external identity provider (LDAP, OIDC, or SAML), validate login, and only then remove kubeadmin. Document emergency access. Do not delete kubeadmin until that login works."
verification = "1. List the configured identity providers on the OAuth object:\n   `oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}{\"\\t\"}{.spec.identityProviders[*].type}{\"\\n\"}'`\n2. HTPasswd alone is a weak production IdP. LDAP, OIDC, or SAML should be configured and tested before removing kubeadmin.\n3. Confirm break-glass emergency access is documented in case the identity provider becomes unavailable."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "authentication components"
impact_detail = "Editing the cluster OAuth configuration rolls authentication pods and can briefly affect user logins, but it does not reboot nodes or stop running workloads."

