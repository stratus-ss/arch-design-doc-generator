[[checks]]
check_id = "7.1.sys.firewall"
title = "Firewall configuration"
description = "A cluster-wide proxy (`httpProxy` or `httpsProxy`) implies extra allow-list, noProxy,\nand firewall work. Presence of those fields is a warning to review egress paths. This\ndoes not probe host iptables or security-group ports.\n"
recommendation = "Where a cluster-wide proxy is configured, validate that the proxy, noProxy entries, DNS, firewall rules, and outbound allow-lists support all required OpenShift control-plane and platform egress paths. Ensure internal destinations bypass the proxy—including cluster, service, and machine-network CIDRs, .svc and .cluster.local domains, and the internal API endpoint so node-to-node and in-cluster traffic is not incorrectly proxied. Confirm that the proxy or egress firewall permits required external endpoints such as registries, Red Hat services, cloud-provider APIs, and any organization-specific dependencies."
verification = "1. Print the cluster-wide proxy settings:\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. If a proxy is set, confirm that `noProxy` includes cluster, service, and machine CIDRs plus internal API and .cluster.local.\n3. Print the CNI plugin name (for example `OVNKubernetes`):\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}'`\n4. Confirm the overlay port for that plugin is allowed between nodes:\n      - OVNKubernetes: Geneve UDP 6081\n      - OpenShiftSDN (removed in 4.17): VXLAN UDP 4789\n      Common to all: API 6443, etcd peer 2380, kubelet 10250, NodePort 30000-32767."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "affected nodes and external network controls"
impact_detail = "Security-group or ACL changes can be live, but host-firewall changes may briefly interrupt traffic and can require coordinated node-level rollout."

