[[checks]]
check_id = "7.1.identity.channel"
title = "Identity update channel"
description = "The update channel determines which OCP releases are offered as updates.\nFor production clusters `stable-X.Y` is recommended. `fast` receives\nupdates 2-4 weeks earlier but with less soak time. `eus` channels allow\nskipping minor versions on supported paths.\n"
recommendation = "1. Confirm the current release exists in the target `stable-X.Y` or `eus-X.Y` channel before switching.\n2. Patch `ClusterVersion` to the supported update stream:\n   `oc patch clusterversion version --type=merge -p '{\"spec\":{\"channel\":\"stable-<minor>\"}}'`\n3. Re-check `availableUpdates` and `conditionalUpdates`.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "cluster update service"
impact_detail = "Changing the update channel does not restart nodes or workloads; it only changes which releases the Cluster Version Operator offers."

