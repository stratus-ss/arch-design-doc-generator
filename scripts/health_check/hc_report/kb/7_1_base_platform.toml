[[checks]]
check_id = "7.1.tsr.1_5_12_huge_pages"
title = "1.5.12. Huge Pages"
description = "Huge pages provide large memory page allocations (2Mi or 1Gi) for performance-\nsensitive workloads like databases and DPDK applications. Configuration must\nmatch workload requirements without over-allocating node memory.\n"
recommendation = "Reserve huge pages only when the design needs DPDK or database pages, at the matching size (2Mi versus 1Gi). If pages are required but both columns are 0, reserve them through the documented Node/MCP path. Leftover unused reservation is accepted capacity cost or a planned MCP removal. Capacity 0/0 is N/A."
verification = "1. Print the huge-page capacity per node (`status.capacity.hugepages-2Mi` and `hugepages-1Gi`). A value of `0` means none allocated:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,HUGE_2MI:.status.capacity.hugepages-2Mi,HUGE_1GI:.status.capacity.hugepages-1Gi`\n2. Interpret the output:\n      - Both `0`: huge pages are not configured. This is informational unless the design requires DPDK or database huge pages.\n      - Non-zero: pages are reserved. Confirm the size (2Mi versus 1Gi) matches the workload requirement."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

