[[checks]]
check_id = "7.1.clusterversion.channel"
title = "Update channel"
description = "The update channel selects which OCP releases the Cluster Version Operator offers.\n`fast` and `stable` are both fully supported; the only documented difference is\npromotion delay (typically a week or two for z-stream, often 45-90 days for a\nnew minor). `eus` channels allow skipping minor versions on supported EUS paths.\n`candidate` is unsupported early access.\n"
recommendation = "Put production on `stable` or `eus` to match the support policy. Move off `candidate`; it is unsupported. Leave fast only if the shorter promotion delay is an accepted operational choice. Do not patch until the running release exists in the target channel."
verification = "1. List the current channel and available updates:\n   `oc adm upgrade`\n2. Confirm the running release exists in the target `stable-X.Y` or `eus-X.Y` channel before switching.\n3. If a channel change is needed, patch the `ClusterVersion` object (`version`):\n   `oc patch clusterversion version --type=merge -p '{\"spec\":{\"channel\":\"stable-<minor>\"}}'`\n4. Re-check `availableUpdates` and `conditionalUpdates`. `fast` is a supported channel with shorter promotion delay."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "cluster update service"
impact_detail = "Changing the update channel does not restart nodes or workloads; it only changes which releases the Cluster Version Operator offers."

