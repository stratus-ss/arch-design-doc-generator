[[checks]]
check_id = "7.1.tsr.1_5_18_security_context_constraints"
title = "1.5.18. Security Context Constraints"
description = "Security Context Constraints control the actions pods can perform and what\nresources they can access. Overly permissive SCCs (especially privileged or\nanyuid) increase the attack surface of the cluster.\n"
# why-rec
# CORRECTED. `-o json` dumps every SCC. Rec prints privilege flags as columns and lists only
# pods using `privileged` or `anyuid`. Investigation only (impact none).
recommendation = "1. List SCC privilege flags:\n   `oc get scc -o custom-columns=NAME:.metadata.name,PRIV:.allowPrivilegedContainer,ALLOWPRIVESC:.allowPrivilegeEscalation,RUNAS:.runAsUser.type`\n2. List pods using `privileged` or `anyuid`:\n   `oc get pods -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,SCC:.metadata.annotations.openshift\\.io/scc --no-headers | awk '$3==\"privileged\" || $3==\"anyuid\" {print}'`\n3. Minimize `privileged` and `anyuid` to only validated workloads.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

