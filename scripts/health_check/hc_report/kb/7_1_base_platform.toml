[[checks]]
check_id = "7.1.tsr.1_1_identification_and_state"
title = "1.1. Identification and State"
description = "This check records cluster identity, version, and support lifecycle. Evidence may show full support or maintenance support; that is a lifecycle class, not a degraded ClusterOperator by itself."
# why-rec
# CORRECTED. This check is identity/version/lifecycle, not a 30-row ClusterOperator dump.
# Combined `oc get clusterversion,clusteroperator` is too much to interpret. Rec now reads
# named `clusterversion version` (version + channel) and `oc adm upgrade`. `oc get co` is
# optional and only to separate Degraded operators from lifecycle class. Step 2 now links
# https://access.redhat.com/support/policy/updates/openshift (KB links pointed at architecture
# overview, which does not show support dates).
recommendation = "1. Read version and channel from the named ClusterVersion object:\n   `oc get clusterversion version -o jsonpath='{.status.desired.version}{\" \"}{.spec.channel}{\"\\n\"}'`\n   `oc adm upgrade`\n2. Compare that version to the OpenShift Container Platform life cycle dates:\n   https://access.redhat.com/support/policy/updates/openshift\n   That page is what classifies the release as fully supported, maintenance, or EOL. `oc get co` does not.\n3. ClusterOperator Degraded/Progressing is a different problem. If you need it, list only the unhealthy rows:\n   `oc get co | grep -v 'True.*False.*False'`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

