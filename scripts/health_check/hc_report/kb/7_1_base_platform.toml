[[checks]]
check_id = "7.1.subs.approval"
title = "Subscription approval policy"
description = "Automatic installPlanApproval causes operators to upgrade automatically when\nnew versions are available in the channel. This can introduce breaking changes\nwithout notice. Use Manual approval and review release notes before upgrades.\n"
recommendation = "1. List subscription approval strategies:\n   `oc get subscription -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,APPROVAL:.spec.installPlanApproval,STATE:.status.state`\n2. For production clusters, prefer `Manual` so operators do not upgrade without review:\n   `oc patch subscription <name> -n <ns> --type=merge -p '{\"spec\":{\"installPlanApproval\":\"Manual\"}}'`\n3. Automatic approval is supported. Treat a change to Manual as an operational preference except where docs require Manual (for example cloud STS or workload-identity installs).\n4. Review pending InstallPlans and approve them only during planned windows:\n   `oc get installplan -A`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "affected operator namespace"
impact_detail = "Changing installPlanApproval updates Subscription behavior immediately without rebooting nodes or evicting workloads."
finding_group = "operator-approval"
finding_group_title = "Operator subscription installPlanApproval"

