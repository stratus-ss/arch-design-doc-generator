[[checks]]
check_id = "7.1.identity.updates"
title = "Identity available updates"
description = "The Cluster Version Operator publishes recommended update targets in\n`status.availableUpdates`. Presence of recommended updates is a lifecycle\nhygiene signal, not a vendor-defined health failure. Plan a supported path\nand apply it when the maintenance window allows.\n"
# why-rec
# CORRECTED. The engine warns when `availableUpdates` is non-empty (engineering judgment), not a
# vendor 'stay within 2 minors' rule. Rec prints version, channel, and available update versions
# from named `clusterversion version` — do not dump `-o yaml`. Applying an update is a
# maintenance-window; listing updates is not.
recommendation = "1. Print version, channel, and recommended updates:\n   `oc get clusterversion version -o jsonpath='{.status.desired.version}{\" \"}{.spec.channel}{\"\\n\"}{range .status.availableUpdates[*]}available={.version}{\"\\n\"}{end}'`\n   `oc adm upgrade`\n2. Plan the upgrade using the OCP Upgrade Graph at https://access.redhat.com/labs/ocpupgradegraph/.\n3. After validating the supported path in non-production, apply the chosen release:\n   `oc adm upgrade --to=<target-version>`\n4. Monitor ClusterVersion conditions until the rollout completes:\n   `oc get clusterversion version -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}'`\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Minor or z-stream upgrades reconcile cluster operators and can drain, reboot, or roll nodes and workloads over time."

