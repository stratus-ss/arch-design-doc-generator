[[checks]]
check_id = "7.1.subs.approval"
title = "Subscription approval policy"
description = "Automatic `installPlanApproval` causes operators to upgrade automatically when\nnew versions are available in the channel. This can introduce breaking changes\nwithout notice. Use Manual approval and review release notes before upgrades.\n"
recommendation = "Set production subscriptions to Manual unless the install method requires Automatic (STS or workload identity). OpenShift Virtualization `kubevirt-hyperconverged` Automatic is not a WARNING. Patch other Automatic subscriptions to Manual and approve pending `InstallPlan`s only in planned windows."
verification = "1. List the Subscription approval policy per namespace:\n   `oc get subscription -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,APPROVAL:.spec.installPlanApproval,STATE:.status.state`\n2. To switch a subscription to `Manual` approval:\n   `oc patch subscription <name> -n <ns> --type=merge -p '{\"spec\":{\"installPlanApproval\":\"Manual\"}}'`\n3. Automatic is also a supported policy, required in some cases such as STS or workload-identity installs.\n4. List pending `InstallPlan`s:\n   `oc get installplan -A`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "affected operator namespace"
impact_detail = "Changing `installPlanApproval` updates Subscription behavior immediately without rebooting nodes or evicting workloads."
finding_group = "operator-approval"
finding_group_title = "Operator subscription installPlanApproval"

