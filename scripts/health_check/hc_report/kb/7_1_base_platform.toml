[[checks]]
check_id = "7.1.tsr.1_5_2_3_dns_alerts"
title = "TSR DNS alerts"
description = "DNS-related alerts indicate resolution failures that can cascade into pod\nscheduling issues, service discovery failures, and operator degradation. DNS\nis a foundational cluster service — any degradation must be resolved promptly.\n"
recommendation = "1. List the CoreDNS alerting rules:\n   `oc get prometheusrule dns -n openshift-dns-operator -o jsonpath='{range .spec.groups[*].rules[?(@.alert)]}{.alert}{\"\\n\"}{end}'`\n   The DNS Operator ships `CoreDNSErrorsHigh`, `CoreDNSHealthCheckSlow`, and `CoreDNSPanicking`.\n2. See which of those are firing (query Prometheus):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.alertname | test(\"^CoreDNS\")) | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n3. Use the firing name:\n   - `CoreDNSErrorsHigh`: SERVFAIL share >1% for 5m. Inspect logs for SERVFAIL:\n     `oc -n openshift-dns logs -l dns.operator.openshift.io/daemonset-dns --tail=100`\n   - `CoreDNSHealthCheckSlow`: health-check p95 >10s. Check DNS pod Ready/restarts:\n     `oc get pods -n openshift-dns`\n   - `CoreDNSPanicking`: panics in 10m. Same logs, then `oc describe pod <name> -n openshift-dns` for that instance.\n4. Upstream resolver tests and NetworkPolicy/firewall on port 53 belong to 1.5.2.1 and 1.5.5. Ignore Thanos*DNS* alerts; those are the monitoring stack looking up its own services.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

