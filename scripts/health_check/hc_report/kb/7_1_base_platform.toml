[[checks]]
check_id = "7.1.tsr.1_2_subscriptions"
title = "1.2. Subscriptions"
description = "Operator subscriptions track installed operators, their channels, and update\npolicies. Unhealthy subscriptions lead to stale operator versions, failed\nCSVs, and degraded cluster capabilities.\n"
# why-rec
# CORRECTED. `oc get subscription -A -o json` is a generic dump. The engine reads
# status.state, installedCSV vs currentCSV, channel, and CSV phase. Rec now uses a
# custom-columns table of those fields and says what "good" looks like (AtLatestKnown,
# INSTALLED=CURRENT). JSON dump removed.
recommendation = "1. List the fields this check actually evaluates:\n   `oc get subscription -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,CHANNEL:.spec.channel,STATE:.status.state,INSTALLED:.status.installedCSV,CURRENT:.status.currentCSV`\n2. Healthy rows are `STATE=AtLatestKnown` and `INSTALLED` equals `CURRENT`. If they differ, an upgrade is pending.\n3. Check InstallPlan phase and approval (this is how a pending upgrade gets stuck):\n   `oc get installplan -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,CSV:.spec.clusterServiceVersionNames,APPROVED:.spec.approved,PHASE:.status.phase`\n4. List CSV phase. `Failed` is a FAIL; inspect that CSV only:\n   `oc get csv -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase`\n   `oc describe csv <csv-name> -n <ns>`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

