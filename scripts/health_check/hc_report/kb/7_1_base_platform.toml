recommendation = "1. This CR is `dns.operator default` (operator.openshift.io). `dns cluster` (config.openshift.io) has `baseDomain`, not these fields:\n   `oc get dns.operator default -o custom-columns=NAME:.metadata.name,UPSTREAM:.spec.upstreamResolvers.upstreams[*].type,SERVERS:.spec.servers`\n2. `spec.servers` is often `<none>`. That is the default. It is only set for extra / split-horizon zones.\n3. `UPSTREAM` is `.spec.upstreamResolvers.upstreams[*].type`:\n   - `SystemResolvConf`: CoreDNS uses each node's `/etc/resolv.conf`. There is no upstream IP in this CR.\n   - `Network`: explicit address+port in that CR.\n4. If type is `Network`, the upstream is that IP; if `SystemResolvConf`, it is the node resolver.\n"
