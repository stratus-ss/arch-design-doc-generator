[[checks]]
check_id = "7.1.tsr.1_3_2_2_hypervisor_checks"
title = "1.3.2.2. Hypervisor Checks"
description = "For virtualized deployments, hypervisor compatibility and configuration\ndirectly impacts cluster stability. CPU features, nested virtualization\nsettings, and resource overcommit affect node performance.\n"
# why-rec
# CORRECTED. Engine is N/A unless vsphere/ovirt/openstack/kubevirt. Rec gates on
# PLATFORM first, then providerID + nodeInfo columns (not `-o json`). DMI via debug
# only on those platforms (starts a node pod; not executed). Capacity is 1.4.
# Nested virt/overcommit are hypervisor-manager settings, not Node fields.
recommendation = "1. Gate first. This check is N/A unless `status.platform` is vSphere, oVirt, OpenStack, or kubevirt:\n   `oc get infrastructure cluster -o custom-columns=PLATFORM:.status.platform`\n   BareMetal, AWS, Azure, GCP, and `None`: hypervisor checks end here.\n2. On those virtual platforms, confirm `spec.providerID` prefix matches (`vsphere://`, `ovirt://`, `openstack://`, `kubevirt://`).. CPU/memory capacity is 1.4:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,PROVIDER:.spec.providerID,ARCH:.status.nodeInfo.architecture,OS:.status.nodeInfo.osImage,UUID:.status.nodeInfo.systemUUID`\n3. Confirm DMI vendor/product matches that hypervisor. `oc debug` starts a node pod — only after step 1 is a virtual platform:\n   `oc debug node/<name> -- chroot /host cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name`\n   From a must-gather:\n   `tar -xzf <must-gather>/nodes/<node>/sysinfo.tgz sys/class/dmi/id/product_name --to-stdout`\n4. Nested virtualization and overcommit live in the hypervisor manager (vCenter, RHV, OpenStack). They are not Node fields.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

