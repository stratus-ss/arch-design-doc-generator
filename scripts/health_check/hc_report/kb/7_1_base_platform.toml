[[checks]]
check_id = "7.1.infra.topology"
title = "Infrastructure topology"
description = "Highly Available topology requires at least 3 control plane nodes and ensures\nloss of any single node does not cause an outage. SingleReplica topology is\nsupported only for edge or test-style deployments.\n"
recommendation = "Run production as HighlyAvailable with at least three Ready masters unless this is documented SNO or edge. If topology is undersized for the intended use, plan a supported control-plane migration or rebuild. Do not toggle topology fields in place."
verification = "1. Print the control-plane and infrastructure topology from the Infrastructure object:\n   `oc get infrastructure cluster -o jsonpath='{.status.controlPlaneTopology}{\"\\t\"}{.status.infrastructureTopology}{\"\\n\"}'`\n2. Confirm the control-plane node count matches the topology:\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and infrastructure architecture"
impact_detail = "Moving from non-HA to HA usually requires control-plane or infrastructure machine changes, not a simple in-place toggle, and should be planned as a migration."

