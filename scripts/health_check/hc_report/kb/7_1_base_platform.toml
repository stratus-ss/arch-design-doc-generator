[[checks]]
check_id = "7.1.tsr.1_5_13_gpu"
title = "1.5.13. GPU"
description = "GPU nodes require the NVIDIA GPU Operator or equivalent for device plugin,\ndriver, and container toolkit management. Misconfigured GPU support causes\nworkload scheduling failures and resource waste.\n"
recommendation = "1. Check for a GPU operator subscription:\n   `oc get subscription -A | grep gpu`\n2. Verify GPU nodes expose allocatable resources:\n   `oc get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.status.allocatable.nvidia\\.com/gpu}{\"\\n\"}{end}'`\n3. Review GPU operator pods:\n   `oc get pods -n gpu-operator-resources`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

