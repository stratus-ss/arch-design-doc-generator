[[checks]]
check_id = "7.1.tsr.1_5_5_firewalls"
title = "1.5.5. Firewalls"
description = "OpenShift requires specific ports open between nodes, to external registries,\nand to cloud APIs. Missing firewall rules cause intermittent failures in\nnode communication, image pulls, and operator reconciliation.\n"
recommendation = "1. `network.config` does not list firewall ports. Print the CNI name only:\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}{\"\\n\"}'`\n2. Confirm these are allowed (security groups / ACLs / host firewall):\n   - API 6443/tcp to control-plane\n   - etcd 2379/tcp and 2380/tcp between control-plane nodes\n   - kubelet 10250/tcp to all nodes\n   - OVNKubernetes: Geneve 6081/udp between all nodes\n   - OpenShiftSDN (removed in 4.17): VXLAN 4789/udp — ignore on current releases\n3. Egress to registries and the update graph is 1.5.6 (`proxy` / `noProxy`). curl of `/healthz` is not a firewall matrix.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

