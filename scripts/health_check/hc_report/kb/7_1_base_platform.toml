title = "1.4.1.3. Master Memory"
description = "Control-plane nodes require minimum 16 GiB RAM (32+ recommended for\nproduction). Insufficient memory causes OOM kills of critical components\nlike etcd and the API server. The TSR also warns when kubelet\n`systemReserved.memory` is below its size-based expectation (for example\n3 GiB reserved on a ~32 GiB node), even if capacity already meets 16 GiB.\n"
recommendation = "Resize or replace any control-plane node whose `status.capacity.memory` is below 16 GiB. When TSR flags `systemReserved.memory` below its size-based expectation, set `spec.kubeletConfig.systemReserved.memory` via `KubeletConfig` (`spec.autoSizingReserved: false` if overriding auto-size); do not treat that reserved WARNING as a 16 GiB FAIL."
verification = "1. Check memory capacity (`status.capacity.memory`, in Ki) on each control-plane node. **PASS** is 16 GiB (16777216 Ki) or more:\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers -o custom-columns=NAME:.metadata.name,MEM:.status.capacity.memory | awk '{print ($2+0>=16777216?\"PASS\":\"FAIL\"), $1, $2}'`\n2. Print kubelet `systemReserved.memory` from each control-plane node's `configz`. This step confirms reservation and does not FAIL on the 16 GiB capacity bar. **INFO** if `systemReserved.memory` is missing.\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers -o custom-columns=NAME:.metadata.name | while read -r node; do reserved=$(oc get --raw /api/v1/nodes/${node}/proxy/configz | jq -r '.kubeletconfig.systemReserved.memory // empty'); if [ -z \"$reserved\" ]; then echo \"INFO NODE=${node} systemReserved.memory missing\"; else echo \"INFO NODE=${node} systemReserved.memory=${reserved}\"; fi; done`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

