[[checks]]
check_id = "7.1.infra.topology"
title = "Infrastructure topology"
description = "Highly Available topology requires at least 3 control plane nodes and ensures\nloss of any single node does not cause an outage. SingleReplica topology is\nsupported only for edge or test-style deployments.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Highly Available topology requires at least 3 control plane nodes and ensures loss
# of any single node does not cause an outage.
# The rec remediates THAT story by starting at `oc get infrastructure cluster -o
# jsonpath='{.status.controlPlaneTopology}{"\t"}{.status.infrastructureTopology}{"\n"}'` — the
# live object/command for this check, not a neighboring TSR item.
# Impact `maintenance-window`: Moving from non-HA to HA usually requires control-plane or
# infrastructure machine changes, not a simple in-place toggle, and should be planned as a
# migration.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check the current topology:\n   `oc get infrastructure cluster -o jsonpath='{.status.controlPlaneTopology}{\"\\t\"}{.status.infrastructureTopology}{\"\\n\"}'`\n2. Confirm control plane sizing:\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers`\n3. Keep production clusters on `HighlyAvailable` control plane and infrastructure topology unless this is a supported SNO or edge deployment.\n4. If the topology is undersized for the intended use case, plan a supported control-plane migration or rebuild rather than trying to toggle topology values in place.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and infrastructure architecture"
impact_detail = "Moving from non-HA to HA usually requires control-plane or infrastructure machine changes, not a simple in-place toggle, and should be planned as a migration."

