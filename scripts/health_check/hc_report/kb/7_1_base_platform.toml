[[checks]]
check_id = "7.1.sys.firewall"
title = "Firewall configuration"
description = "OpenShift requires specific network ports open between nodes and to external\nservices. Missing firewall rules cause intermittent cluster instability, failed\nnode joins, broken Prometheus federation, or unreachable API endpoints.\n"
recommendation = "1. Review the cluster network type:\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}'`\n2. Validate node-to-node and API reachability from a debug shell:\n   `oc debug node/<name> -- chroot /host curl -k https://<api-vip>:6443/readyz`\n3. Review the required ports documented in the OCP installation prerequisites and validate that all host firewalls, security groups, and network ACLs allow the required traffic.\n4. Check for common gaps including etcd peer ports (2380), Kubernetes API (6443), NodePort range (30000-32767), and Geneve overlay (UDP 6081).\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "affected nodes and external network controls"
impact_detail = "Security-group or ACL changes can be live, but host-firewall changes may briefly interrupt traffic and can require coordinated node-level rollout."

