check_id = "7.1.tsr.1_5_11_fips"
title = "1.5.11. FIPS"
description = "FIPS 140-2 mode enforces use of validated cryptographic modules. FIPS must\nbe enabled at install time and cannot be toggled post-install. This check\nverifies whether FIPS is active and consistent across nodes.\n"
recommendation = "Treat FIPS as install-time only. If the design required FIPS and `/proc/sys/crypto/fips_enabled` is 0, this is a rebuild. If FIPS is on and not required, leave it — turning it off is also a rebuild."
