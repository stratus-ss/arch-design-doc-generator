# cluster-config-v1 (trust bundles, BMC). Installer / hypervisor / restricted-network
# details are the 1.3.x sub-checks.
recommendation = "1. List the Infrastructure fields this parent section needs. (`status.platformStatus` includes API/ingress IPs and machineNetworks):\n   `oc get infrastructure cluster -o custom-columns=PLATFORM:.status.platform,CP_TOPO:.status.controlPlaneTopology,INFRA_TOPO:.status.infrastructureTopology,TYPE:.status.platformStatus.type`\n2. Use the 1.3.x sub-checks for the rest: 1.3.1 installer (install-config keys only), 1.3.2 platform/hypervisor, 1.3.3 restricted network.\n3. `cluster-config-v1` can contain trust bundles and BMC addresses.\n"
priority_hint = ""
