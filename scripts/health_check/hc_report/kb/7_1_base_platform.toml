[[checks]]
check_id = "7.1.sys.auth"
title = "Authentication configuration"
description = "Cluster authentication determines how users and service accounts authenticate.\nThe default kubeadmin user should be removed after external identity providers\nare configured and validated.\n"
recommendation = "1. Review configured identity providers:\n   `oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}{\"\\t\"}{.spec.identityProviders[*].type}{\"\\n\"}'`\n2. HTPasswd is a supported IdP but is a weak sole production IdP. Configure LDAP, OIDC, or SAML and validate login before removing kubeadmin.\n3. Ensure break-glass emergency access is documented if the identity provider is unavailable.\n"
priority_hint = ""
impact = "non-disruptive"
