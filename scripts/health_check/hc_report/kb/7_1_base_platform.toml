[[checks]]
check_id = "7.1.tsr.openshift_must_gather_data_capture_timestamps"
title = "OpenShift Must Gather Data Capture Timestamps"
description = "Timestamps within must-gather data indicate when diagnostic information was\ncollected. Stale or mismatched timestamps may indicate partial captures or\ntime-skew issues that reduce diagnostic accuracy.\n"
recommendation = "Use a capture window that covers the incident. Re-run must-gather with live access if hours of spread or a capture older than the incident miss the window. If timestamps look impossible, fix node clocks first."
verification = "1. Read the must-gather capture-start file. It is one RFC3339 UTC line named `timestamp` in the image directory that also contains `cluster-scoped-resources/` and `namespaces/`. It is not object `metadata.creationTimestamp`:\n   `cat <must-gather-image-dir>/timestamp`\n2. Compare every `timestamp` file in that tree to assess spread:\n   `find <must-gather-image-dir> -name timestamp -exec grep -H . {} \\;`\n      Minutes of spread is a long collection. Hours of spread or a capture older than the incident means the wrong window or clock skew.\n3. If this engagement used live `hc-collect` instead of a must-gather, check the collect timestamps:\n   `jq -r .timestamp <results-dir>/manifest.json`\n   `find <results-dir> -name '*.meta.json' -exec jq -r .timestamp {} \\; | sort | sed -n '1p;$p'`\n4. If the capture window misses the incident, re-run with live cluster access: `oc adm must-gather`. If you only have the tarball, record the window and stop."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

