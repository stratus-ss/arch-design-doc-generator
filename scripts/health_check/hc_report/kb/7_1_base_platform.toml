[[checks]]
check_id = "7.1.tsr.1_3_3_restricted_network"
title = "1.3.3. Restricted Network"
description = "Disconnected or restricted-network clusters require mirrored registries and\nspecial proxy/trust configurations. Incomplete mirror setup causes image pull\nfailures and operator degradation.\n"
# why-rec
# CORRECTED. `-o json` on Proxy/ICSP/IDMS dumps endpoints, mirror lists, and can include trust
# material. Rec prints proxy URLs/`noProxy` and IDMS/ITMS/ICSP source+mirrors columns only. Do
# not dump `cluster-config-v1`. Investigation only (impact none).
recommendation = "1. Print proxy endpoints only:\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. List mirror maps (IDMS/ITMS current; ICSP deprecated):\n   `oc get imagedigestmirrorset -o custom-columns=NAME:.metadata.name,SOURCE:.spec.imageDigestMirrors[*].source,MIRRORS:.spec.imageDigestMirrors[*].mirrors`\n   `oc get imagetagmirrorset -o custom-columns=NAME:.metadata.name,SOURCE:.spec.imageTagMirrors[*].source,MIRRORS:.spec.imageTagMirrors[*].mirrors`\n   `oc get imagecontentsourcepolicy -o custom-columns=NAME:.metadata.name,SOURCE:.spec.repositoryDigestMirrors[*].source,MIRRORS:.spec.repositoryDigestMirrors[*].mirrors`\n3. Confirm the mirror registry is reachable and the cluster trustedCA bundle covers it. `cluster-config-v1` can contain trust bundles.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

