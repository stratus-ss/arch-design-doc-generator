[[checks]]
check_id = "7.1.tsr.1_4_1_5_master_schedulable"
title = "1.4.1.5. Master Schedulable"
description = "By default masters are schedulable in OCP 4.x, allowing workloads to run\non control-plane nodes. For large clusters or strict separation requirements,\nmastersSchedulable should be set to false.\n"
recommendation = "1. Check scheduler configuration:\n   `oc get scheduler cluster -o jsonpath='{.spec.mastersSchedulable}'`\n2. If workload isolation is required, set `mastersSchedulable` to `false`:\n   `oc patch scheduler cluster --type=merge -p '{\"spec\":{\"mastersSchedulable\":false}}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "control-plane scheduling"
impact_detail = "Changing mastersSchedulable to false prevents new workloads from landing on control-plane nodes but does not evict existing pods or reboot nodes. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

