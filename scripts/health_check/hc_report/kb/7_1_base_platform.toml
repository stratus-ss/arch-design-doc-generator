[[checks]]
check_id = "7.1.tsr.1_5_12_huge_pages"
title = "1.5.12. Huge Pages"
description = "Huge pages provide large memory page allocations (2Mi or 1Gi) for performance-\nsensitive workloads like databases and DPDK applications. Configuration must\nmatch workload requirements without over-allocating node memory.\n"
recommendation = "1. Print huge-page **capacity** with column names. These are `status.capacity.hugepages-2Mi` and `hugepages-1Gi` (Kubernetes quantity; `0` means none allocated):\n   `oc get nodes -o custom-columns=NAME:.metadata.name,HUGE_2MI:.status.capacity.hugepages-2Mi,HUGE_1GI:.status.capacity.hugepages-1Gi`\n2. Read the columns:\n   - both `0`: huge pages are not configured. This check is N/A (not a FAIL) unless the design required DPDK/DB huge pages.\n   - non-zero: pages are reserved on that node; confirm the size matches the workload (2Mi vs 1Gi).\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

