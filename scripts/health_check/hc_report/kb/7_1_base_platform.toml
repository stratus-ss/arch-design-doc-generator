[[checks]]
check_id = "7.1.identity.updates"
title = "Identity available updates"
description = "Red Hat recommends keeping OCP within 2 minor versions of the latest release\non the selected channel. Delaying updates increases exposure to security\nvulnerabilities and reduces supportability.\n"
recommendation = "1. Review the current release and available updates:\n   `oc get clusterversion -o yaml`\n   `oc adm upgrade`\n2. Plan the upgrade using the OCP Upgrade Graph at https://access.redhat.com/labs/ocpupgradegraph/.\n3. After validating the supported path in non-production, apply the chosen release:\n   `oc adm upgrade --to=<target-version>`\n4. Monitor ClusterVersion conditions until the rollout completes.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Minor or z-stream upgrades reconcile cluster operators and can drain, reboot, or roll nodes and workloads over time."

