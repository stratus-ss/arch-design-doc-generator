check_id = "7.1.tsr.1_5_9_swap"
title = "1.5.9. Swap"
description = "Kubernetes does not support swap on nodes by default. Enabled swap can cause\nunpredictable pod memory behavior, OOM kill ordering issues, and is\nunsupported in production OCP deployments.\n"
recommendation = "1. Verify swap is disabled on all nodes:\n   `oc debug node/<name> -- chroot /host swapon --show`\n2. Confirm the output is empty.\n3. If swap is enabled, disable it via MachineConfig so the change persists across reboots.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

