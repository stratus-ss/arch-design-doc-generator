check_id = "7.1.tsr.1_5_17_authentication"
title = "1.5.17. Authentication"
description = "Cluster authentication configuration determines identity providers, token\nlifetimes, and access controls. Production clusters should use enterprise\nidentity providers and remove the default kubeadmin account.\n"
recommendation = "Configure and test an external identity provider, then verify that at least one externally authenticated user has functioning cluster-admin access before removing the kubeadmin secret. Do not remove kubeadmin while it remains the only verified administrative login, because removal is irreversible and can leave the cluster without recoverable administrative access. An HTPasswd provider or retained kubeadmin account may be acceptable for lab, temporary, or documented break-glass use."
verification = "1. List the identity provider names and types on the OAuth object:\n   `oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}{\"\\t\"}{.spec.identityProviders[*].type}{\"\\n\"}'`\n2. Print the access token maximum age if set:\n   `oc get oauth cluster -o jsonpath='{.spec.tokenConfig.accessTokenMaxAgeSeconds}{\"\\n\"}'`\n3. Check whether the kubeadmin secret still exists:\n   `oc get secret kubeadmin -n kube-system --ignore-not-found`\n4. Only after an external identity provider is validated and a cluster-admin can log in through it, remove kubeadmin:\n   `oc delete secret kubeadmin -n kube-system`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "authentication components"
impact_detail = "OAuth configuration changes roll authentication pods but do not reboot nodes or stop running workloads."

