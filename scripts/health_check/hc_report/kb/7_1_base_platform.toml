recommendation = "If a proxy is set, include cluster, service, and machine CIDRs plus `.cluster.local` in noProxy, and name trustedCA if TLS intercept is in play. If operators cannot pull or update, fix noProxy and trustedCA before changing channels. Leave a working proxy in place if the site requires it. Empty proxy is also valid."
verification = "1. Print `httpProxy`, `httpsProxy`, and `noProxy` from the Proxy object:\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. If a proxy is set, `noProxy` must include clusterNetwork, serviceNetwork, machineNetwork, and `.cluster.local`. Empty proxy is also valid.\n3. Print the trustedCA ConfigMap name:\n   `oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}{\"\\n\"}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "cluster-wide egress"
impact_detail = "Proxy configuration changes roll out through Machine Config Operator and may cause node reboots if trustedCA bundle changes."

