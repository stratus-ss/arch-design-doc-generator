check_id = "7.1.tsr.1_5_14_entropy"
title = "1.5.14. Entropy"
description = "Sufficient entropy is required for cryptographic operations, TLS handshakes,\nand certificate generation. Low entropy causes random number generation\nblocking, slow TLS negotiations, and pod startup delays.\n"
recommendation = "1. Check available entropy on nodes:\n   `oc debug node/<name> -- chroot /host cat /proc/sys/kernel/random/entropy_avail`\n2. Investigate values below `200`.\n3. Expect modern kernels with `virtio-rng` or `RDRAND` to report high entropy (`3000+`).\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

