[[checks]]
check_id = "7.1.identity.channel"
title = "Identity update channel"
description = "The update channel selects which OCP releases the Cluster Version Operator offers.\n`fast` and `stable` are both fully supported; the only documented difference is\npromotion delay (typically a week or two for z-stream, often 45-90 days for a\nnew minor). `eus` channels allow skipping minor versions on supported EUS paths.\n`candidate` is unsupported early access.\n"
# why-rec
# CORRECTED. The check is the ClusterVersion update channel, not 'fast is less supported'. Docs:
# fast and stable are both fully supported; delay is ~1–2 weeks z-stream and 45–90 days for a new
# minor. Rec starts at `oc adm upgrade` then patches the named object `version` (a List jsonpath
# on `oc get clusterversion` is empty). Channel change does not roll nodes.
recommendation = "1. List the current channel and available channels:\n   `oc adm upgrade`\n2. Confirm the running release exists in the target `stable-X.Y` or `eus-X.Y` channel before switching.\n3. Patch the named `ClusterVersion` object (`version`) if a channel change is required:\n   `oc patch clusterversion version --type=merge -p '{\"spec\":{\"channel\":\"stable-<minor>\"}}'`\n4. Re-check `availableUpdates` and `conditionalUpdates`.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "cluster update service"
impact_detail = "Changing the update channel does not restart nodes or workloads; it only changes which releases the Cluster Version Operator offers."

[checks.links]
