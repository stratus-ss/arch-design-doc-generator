[[checks]]
check_id = "7.1.tsr.1_5_16_project_self_provisioner_state"
title = "1.5.16. Project Self Provisioner State"
description = "The self-provisioner cluster role binding allows authenticated users to create\nprojects without admin approval. In production, this is often restricted to\nprevent uncontrolled namespace proliferation.\n"
recommendation = "1. Print who is bound as self-provisioner:\n   `oc get clusterrolebinding self-provisioners -o jsonpath='{range .subjects[*]}{.kind}{\"\\t\"}{.name}{\"\\t\"}{.namespace}{\"\\n\"}{end}'`\n2. Empty output means self-provisioning is already disabled.\n3. If project creation should be restricted, clear subjects:\n   `oc patch clusterrolebinding self-provisioners -p '{\"subjects\": null}'`\n4. Manage project requests through a controlled approval process.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "user project creation"
impact_detail = "Modifying the self-provisioners binding immediately changes who can create projects but does not affect existing namespaces or running workloads."

