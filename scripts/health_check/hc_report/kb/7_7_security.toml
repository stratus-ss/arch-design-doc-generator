description = "Checks whether container image vulnerability scanning is configured and\nactive. Without scanning, vulnerable base images and application dependencies\nremain undetected in the cluster.\n"
recommendation = "Without image scanning, CVEs in running containers stay invisible. Confirm a scanner is actually running (internal or external). Mirror/ICSP objects are how disconnected clusters still pull scanned content, not a scanner by themselves."
