[[checks]]
check_id = "7.7.rbac.cluster_admin"
title = "Cluster-admin RBAC"
description = "Extra cluster-admin grants are User or Group subjects that are not system:, leftover must-gather service accounts, and service accounts outside openshift-* and kube-*. Any row is WARNING. Empty is PASS none-user-admin, none-must-gather-admin, or none-tenant-sa-admin.\n"
recommendation = "Extra cluster-admin is User/Group subjects that are not system:, leftover must-gather service accounts, and tenant SAs outside openshift-* / kube-*. Operator SAs in those namespaces are skipped. Any remaining row is extra cluster-admin you must justify or remove.\n\nVerification:\n1. Print User and Group subjects that are not system:. Any listed row needs review. An empty list is healthy (none-user-admin:\n   `oc get clusterrolebinding -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name as $binding_name | .subjects[]? | select((.kind==\"User\" or .kind==\"Group\") and (.name | startswith(\"system:\") | not)) | [$binding_name, .kind, .name] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"BINDING=\"$1, \"KIND=\"$2, \"SUBJECT=\"$3; c++} END{if(!c) print \"PASS none-user-admin\"}'`\n2. Print leftover must-gather service accounts. Any listed row needs review. An empty list is healthy (none-must-gather-admin:\n   `oc get clusterrolebinding -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name as $binding_name | .subjects[]? | select((.namespace // \"\") | test(\"must-gather\")) | [$binding_name, .kind, .name, .namespace] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"BINDING=\"$1, \"KIND=\"$2, \"SUBJECT=\"$3, \"NS=\"$4; c++} END{if(!c) print \"PASS none-must-gather-admin\"}'`\n3. Print service accounts whose namespace is not openshift-* or kube-*. Any listed row needs review. An empty list is healthy (none-tenant-sa-admin:\n   `oc get clusterrolebinding -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name as $binding_name | .subjects[]? | select(.kind==\"ServiceAccount\" and ((.namespace // \"\") | test(\"^(openshift-|kube-)\") | not)) | [$binding_name, .kind, .name, (.namespace // \"-\")] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"BINDING=\"$1, \"KIND=\"$2, \"SUBJECT=\"$3, \"NS=\"$4; c++} END{if(!c) print \"PASS none-tenant-sa-admin\"}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "access control only"
impact_detail = "RBAC binding changes apply immediately without restarting nodes, but they can instantly remove administrative access for the affected principals."

