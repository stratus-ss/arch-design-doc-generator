# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. List all operator states:\n   `oc get co`\n2. For any operator not showing Available=True / Degraded=False, investigate:\n   `oc describe co <operator-name>`\n3. Check the operator's pod logs for errors:\n   `oc logs -n <operator-namespace> <operator-pod>`\n4. Common causes: expired certificates, missing secrets, node resource\n   exhaustion, or a failed rollout stuck in Progressing=True.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

