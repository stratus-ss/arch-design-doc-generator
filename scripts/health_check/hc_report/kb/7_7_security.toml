[[checks]]
check_id = "7.7.tsr.7_1_7_pod_security_admission"
title = "7.1.7. Pod Security Admission"
description = "Evaluates Pod Security Admission (PSA) label enforcement across namespaces.\nPSA replaces PodSecurityPolicy and provides namespace-level enforcement of\npod security standards (privileged, baseline, restricted).\n"
recommendation = "PSA labels on the namespace are what block privileged pods at admit time. Production should enforce at least `baseline`, preferably `restricted`. Relabeling does not evict already-running pods."
verification = "1. Print the Pod Security Admission enforce label for each namespace.\n   `oc get namespaces -o custom-columns=NAME:.metadata.name,ENFORCE:.metadata.labels.pod-security\\.kubernetes\\.io/enforce`\n2. Production namespaces should enforce at least `baseline` or `restricted`.\n3. Apply the enforce label where needed.\n   `oc label ns <ns> pod-security.kubernetes.io/enforce=restricted --overwrite`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "namespace admission enforcement"
impact_detail = "PSA label changes affect admission for new or updated pods but do not restart existing pods or reboot nodes."

