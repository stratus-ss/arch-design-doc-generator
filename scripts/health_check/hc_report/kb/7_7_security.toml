# text is the right response.
recommendation = "1. List all unhealthy pods:\n   `oc get pods -A | grep -E 'CrashLoop|Error|ImagePull'`\n2. For CrashLoopBackOff pods, check why the container is crashing:\n   `oc logs <pod> -n <ns> --previous` — shows the last crash output\n   `oc describe pod <pod> -n <ns>` — look for OOMKilled or exit codes\n3. For ImagePullBackOff pods, verify:\n   - The image name and tag are correct\n   - Registry credentials (pull secrets) are configured\n   - Network connectivity to the image registry is working\n"
