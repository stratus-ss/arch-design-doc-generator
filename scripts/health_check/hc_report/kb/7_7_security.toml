[[checks]]
check_id = "7.7.oauth.idp"
title = "External identity providers"
description = "This check fires when no OAuth identity providers are configured, leaving only\nthe bootstrap `kubeadmin` account. After at least one working IdP exists and a\nnon-kubeadmin cluster-admin can log in, remove the kubeadmin secret.\n"
# why-rec
# CORRECTED. Engine WARNs only when identityProviders is empty (HTPasswd PASSes). Rec must not
# require an 'external' IdP or delete kubeadmin before a non-kubeadmin cluster-admin can log in.
# Lab IdP is HTPasswd; kubeadmin secret still exists.
recommendation = "1. List configured identity providers:\n   `oc get oauth cluster -o jsonpath='{.spec.identityProviders}'`\n2. If none exist, configure an IdP (LDAP, OIDC, GitHub, GitLab, HTPasswd, or another supported type).\n3. Confirm a non-kubeadmin user has `cluster-admin` and can authenticate.\n4. Only then remove the bootstrap account:\n   `oc delete secret kubeadmin -n kube-system`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "authentication components"
impact_detail = "Editing the OAuth configuration rolls authentication pods and can briefly affect user logins, but it does not reboot nodes or stop running workloads."

