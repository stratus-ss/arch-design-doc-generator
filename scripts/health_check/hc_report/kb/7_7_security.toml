[[checks]]
check_id = "7.7.scc.custom"
title = "Custom SCCs"
description = "Custom SCCs may grant elevated privileges beyond what is necessary. Review each\ncustom SCC against the principle of least privilege and prefer built-in SCCs or\nPod Security Admission where possible.\n"
recommendation = "1. Audit custom SCCs and compare each against the built-in `restricted-v2` baseline.\n   `oc get scc -o name`\n2. Identify workloads depending on elevated permissions.\n   `oc adm policy who-can use scc/<name>`\n3. Where possible, migrate workloads to `restricted-v2` or use Pod Security Admission enforce labels.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads currently using custom SCCs"
impact_detail = "Removing elevated SCC access usually requires workload rollout or restart under a less-privileged security context."

