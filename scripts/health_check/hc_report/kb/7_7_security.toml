[[checks]]
check_id = "7.7.ccx_internal.uninstalled_operators_with_leftover_resources"
title = "CCX uninstalled operators with leftover resources"
description = "An operator was previously installed and then removed, but some of its resources (custom resource definitions, namespaces, webhooks) were left behind. These orphaned resources can cause errors, slow down API discovery, and interfere with future operator installations."
recommendation = "1. Identify the orphaned operator from the evidence (e.g. \"advanced-cluster-management\").\n2. Check whether any custom resources still exist for its CRDs.\n   `oc get crd | grep <operator-keyword>`\n   `oc get <crd-name> -A`\n3. Remove orphaned CRDs when the custom resource list is empty.\n   `oc delete crd <crd-name>`\n4. Delete leftover webhooks.\n   `oc delete validatingwebhookconfiguration <name>`\n   `oc delete mutatingwebhookconfiguration <name>`\n5. Clean up the orphaned namespace if it still exists.\n   `oc delete namespace <operator-namespace>`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "API schema and orphaned operator resources"
impact_detail = "Cleaning up orphaned resources updates API discovery and admission objects immediately, but it does not reboot nodes when no active workloads depend on them."

