[[checks]]
check_id = "7.7.rbac.cluster_admin"
title = "Cluster-admin RBAC"
description = "This is a deterministic engine check; it is not a TSR worksheet item. The cluster-admin role grants unrestricted access to every resource in the\ncluster. Review the list of assigned users and groups regularly and keep it as\nsmall as possible.\n"
# why-rec
# CORRECTED. Rec lists ClusterRoleBindings whose ROLE is cluster-admin, with subject names
# as a column. Do not dump CRB JSON.
recommendation = "1. List `cluster-admin` bindings:\n   `oc get clusterrolebinding --no-headers -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECTS:.subjects[*].name | awk '$2==\"cluster-admin\" {print}'`\n2. Remove any service accounts or users that do not require full cluster access.\n3. Prefer scoped roles (`edit`, `admin`) per namespace for daily operations.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "access control only"
impact_detail = "RBAC binding changes apply immediately without restarting nodes, but they can instantly remove administrative access for the affected principals."

