[[checks]]
check_id = "7.7.ccx_external.cve_2026_31431_copy_fail_in_algif_aead"
title = "CCX CVE-2026-31431 kernel algif_aead"
description = "This check determines whether the cluster is running an OpenShift version that includes the kernel fix for CVE-2026-31431 (Copy Fail), a Linux kernel vulnerability in the algif_aead cryptographic interface. The first fixed z-streams are OpenShift 4.16.61, 4.18.40, 4.19.30, 4.20.21, and 4.21.14. A cluster running below the applicable fixed z-stream is reported as **FAIL**; a cluster at or above the fixed release is **PASS**. The remediation is delivered through the updated node kernel included in the applicable OpenShift z-stream.\n"
recommendation = "Upgrade the cluster to a fixed OpenShift z-stream for CVE-2026-31431 (Copy Fail): at minimum 4.18.40 for the current 4.18 release, or a supported later target such as 4.19.30, 4.20.21, or 4.21.14. Versions below the applicable fixed release retain the vulnerable kernel; the upgrade delivers the corrected kernel and requires managed node reboots as part of rollout. Use oc adm upgrade to review eligible targets and select an approved update path, then perform the upgrade during a planned maintenance window."
verification = "1. Compare the ClusterVersion against the first fixed z-stream. Below the fix level needs action; at or above is healthy. If the minor version is unrecognized, the result is informational.\n   `oc get clusterversion version --no-headers -o custom-columns=VERSION:.status.desired.version | awk -F. '{minor=$2+0; zstream=$3+0; result=\"FAIL\"; fixed=\"unknown\"; if(minor==21){fixed=\"4.21.14\"; if(zstream>=14) result=\"PASS\"} else if(minor==20){fixed=\"4.20.21\"; if(zstream>=21) result=\"PASS\"} else if(minor==19){fixed=\"4.19.30\"; if(zstream>=30) result=\"PASS\"} else if(minor==18){fixed=\"4.18.40\"; if(zstream>=40) result=\"PASS\"} else if(minor==16){fixed=\"4.16.61\"; if(zstream>=61) result=\"PASS\"} else if(minor>=22){result=\"PASS\"; fixed=\">=4.22\"} else {result=\"INFO\"; fixed=\"n/a-stream\"}; print result, \"VERSION=\"$0, \"FIXED=\"fixed}'`\n2. On a failing result, review available updates (does not start an upgrade).\n   `oc adm upgrade`"
priority_hint = "P1"
impact = "maintenance-window"
impact_scope = "cluster nodes running the affected kernel"
impact_detail = "Applying the fixed RHCOS/kernel content requires rolling node updates and reboots to bring the patched kernel into service."

