title = "CCX CVE-2026-31431 kernel algif_aead"
description = "A known kernel security vulnerability (CVE-2026-31431) affects this cluster's RHCOS version. The vulnerability is in the kernel's cryptography subsystem and can cause a kernel panic under certain workloads. A patched kernel version is available — the evidence shows the fixed version number."
