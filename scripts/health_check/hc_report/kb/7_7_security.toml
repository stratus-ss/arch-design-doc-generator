[[checks]]
check_id = "7.7.scc.custom"
title = "Custom SCCs"
description = "Custom SCCs are those not owned by ClusterVersion, not marked include.release.openshift.io, and not labeled app.kubernetes.io/managed-by. Any remaining NAME is WARNING. Empty is PASS none-custom. Privileged SCC users are 7.7.scc.privileged_users. PSA labels are 7.7.psa.\n"
recommendation = "Treat remaining custom SCCs as ones you created — payload and operator-managed SCCs are skipped. Any leftover NAME is extra policy you must own. Empty means there are no custom SCCs. Privileged SCC users and PSA labels are separate security rows.\n\nVerification:\n1. Print SCCs with no ClusterVersion owner, no include.release.openshift.io annotation, and no app.kubernetes.io/managed-by. Any listed row needs review. An empty list is healthy (none-custom:\n   `oc get scc -o json | jq -r '.items[] | (.metadata.annotations // {}) as $annotations | (.metadata.labels // {}) as $labels | (.metadata.ownerReferences // []) as $owners | select(([$owners[].kind] | index(\"ClusterVersion\") | not) and (([$annotations | keys[] | select(startswith(\"include.release.openshift.io/\"))] | length) == 0) and (($labels[\"app.kubernetes.io/managed-by\"] // \"\") == \"\")) | .metadata.name' | awk 'NF{print \"WARNING\", \"NAME=\"$0; c++} END{if(!c) print \"PASS none-custom\"}'`\n2. On a WARNING NAME, print PRIV and RUNASUSER:\n   `oc get scc <name>`\n3. Print USERS and GROUPS:\n   `oc get scc <name> -o json | jq -r '[((.users // []) | join(\",\")), ((.groups // []) | join(\",\"))] | @tsv' | awk -F'\\t' '{users=($1==\"\"?\"none\":$1); groups=($2==\"\"?\"none\":$2); print \"INFO\", \"USERS=\"users, \"GROUPS=\"groups}'`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads currently using custom SCCs"
impact_detail = "Removing elevated SCC access usually requires workload rollout or restart under a less-privileged security context."

