recommendation = "Upgrade the cluster to the first fixed z-stream for its supported OpenShift minor release (4.18.41 or later) or move to an eligible later supported target such as 4.19.31, 4.20.22, or 4.21.15. Do not consider the cluster remediated until it is running a release that includes the corrected kernel; a version below the listed fixed release remains vulnerable."
verification = "1. Compare the ClusterVersion against the first fixed z-stream. Below the fix level needs action; at or above is healthy. If the minor version is unrecognized, the result is informational.\n   `oc get clusterversion version --no-headers -o custom-columns=VERSION:.status.desired.version | awk -F. '{minor=$2+0; zstream=$3+0; result=\"FAIL\"; fixed=\"unknown\"; if(minor==21){fixed=\"4.21.15\"; if(zstream>=15) result=\"PASS\"} else if(minor==20){fixed=\"4.20.22\"; if(zstream>=22) result=\"PASS\"} else if(minor==19){fixed=\"4.19.31\"; if(zstream>=31) result=\"PASS\"} else if(minor==18){fixed=\"4.18.41\"; if(zstream>=41) result=\"PASS\"} else if(minor==16){fixed=\"4.16.62\"; if(zstream>=62) result=\"PASS\"} else if(minor==14){fixed=\"4.14.66\"; if(zstream>=66) result=\"PASS\"} else if(minor==12){fixed=\"4.12.90\"; if(zstream>=90) result=\"PASS\"} else if(minor>=22){result=\"PASS\"; fixed=\">=4.22\"} else {result=\"INFO\"; fixed=\"n/a-stream\"}; print result, \"VERSION=\"$0, \"FIXED=\"fixed}'`\n2. On a failing result, review available updates (does not start an upgrade).\n   `oc adm upgrade`"
priority_hint = "P1"
