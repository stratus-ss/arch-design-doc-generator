title = "CCX Node IP Does Not Match Machine Network"
description = "Node InternalIP vs install-config machineNetwork. Inside a MACHINE CIDR is PASS. Outside is FAIL. Missing ConfigMap is INFO n/a-install-config. No CIDRs is INFO n/a-machine-network. No InternalIP is INFO n/a-node-ip. clusterNetwork/serviceNetwork overlap is 7.1.tsr.1_5_4_shared_network.\n"
recommendation = "Each node InternalIP should sit in install-config `machineNetwork`. An address outside that CIDR is a day-0 addressing problem. Missing install-config or CIDRs means you cannot prove the match from this capture. Pod and service CIDR overlap belongs on the shared-network row.\n\nVerification:\n1. Confirm install-config exists. No resources found is informational n/a-install-config:\n   `oc get cm cluster-config-v1 -n kube-system`\n2. Print NAME and INTERNALIP. An empty list means this is not in use (n/a-node-ip):\n   `oc get nodes --no-headers -o custom-columns='NAME:.metadata.name,INTERNALIP:.status.addresses[?(@.type==\"InternalIP\")].address' | awk 'NF{print \"INFO\", \"NAME=\"$1, \"INTERNALIP=\"$2} END{if(NR==0) print \"INFO n/a-node-ip\"}'`\n3. Print machineNetwork CIDRs. An empty list means this is not in use (n/a-machine-network):\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | awk '$1==\"machineNetwork:\"{in_block=1; next} in_block && /cidr:/{print \"INFO\", \"MACHINE=\"$NF; n++; next} in_block && $1 ~ /^[a-zA-Z]/{in_block=0} END{if(!n) print \"INFO n/a-machine-network\"}'`\n4. For each INTERNALIP, check it against a MACHINE CIDR from step 3. Inside is healthy. Outside needs action:\n   `python3 -c 'import ipaddress,sys; ip=sys.argv[1]; cidr=sys.argv[2]; print(\"PASS\" if ipaddress.ip_address(ip) in ipaddress.ip_network(cidr, strict=False) else \"FAIL\")' <INTERNALIP> <MACHINE>`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

