[[checks]]
check_id = "7.7.ccx_internal.tls_handshake_errors"
title = "CCX TLS handshake errors"
description = "Cluster components are failing to establish secure (TLS) connections with each other. The evidence shows which components are affected. Common causes include expired certificates, mismatched TLS versions between components, or network appliances (load balancers, firewalls) interfering with encrypted traffic inside the cluster."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Cluster components are failing to establish secure (TLS) connections with each
# other.
# The rec remediates THAT story by starting at `oc get secret -n <namespace> -o
# jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E 'tls|cert|serving'` — the live
# object/command for this check, not a neighboring TSR item.
# Impact `workload-shift`: Fixing handshake errors can require certificate rotation or TLS
# profile changes that restart the affected operands.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Identify which components are failing from the evidence log entries.\n2. Check certificate validity on the affected endpoints:\n   `oc get secret -n <namespace> -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\\n' | grep -E 'tls|cert|serving'`\n3. Verify the TLS security profile is not too restrictive:\n   `oc get apiserver cluster -o jsonpath='{.spec.tlsSecurityProfile}'`\n4. If a load balancer or proxy sits between cluster nodes, ensure it is\n   configured to pass through (not terminate) internal cluster TLS traffic.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "components failing TLS handshakes"
impact_detail = "Fixing handshake errors can require certificate rotation or TLS profile changes that restart the affected operands."

