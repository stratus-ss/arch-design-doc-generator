[[checks]]
check_id = "7.7.ccx_external.ocp_version_end_of_life"
title = "OCP Version End Of Life"
description = "Insights `OCP4X_EOL_IMMINENT` (or past EOL) compares ClusterVersion to the OpenShift life-cycle calendar. Even-numbered minors are EUS releases; Maintenance end is not the same as “no EUS remaining.”"
recommendation = "Confirm whether the subscription includes Extended Update Support for this even-numbered minor. After Maintenance ends, Full/Maintenance patches stop; EUS Term 1 (when entitled) continues Critical/Important and urgent fixes only. Plan an EUS-to-EUS or supported minor upgrade off the assessed z-stream. A same-minor z-stream after Maintenance end does not restore Full/Maintenance. Do not stay on an unelected Standard-tier minor past Maintenance without an EUS add-on."
verification = """1. Print desired version and channel.
   `oc get clusterversion version -o jsonpath='{.status.desired.version}{\" \"}{.spec.channel}{\"\\n\"}'`
2. Compare the minor to the OpenShift Container Platform life-cycle page in the reference for this check (Maintenance vs EUS dates)."""
priority_hint = ""
impact = "maintenance-window"
impact_scope = "entire cluster"
impact_detail = "Leaving Maintenance without EUS or an upgrade path leaves the cluster without standard errata; the upgrade itself reboots nodes."

