[[checks]]
check_id = "7.7.ccx_internal.certificates_expiring_soon"
title = "CCX certificates expiring soon"
description = "One or more TLS certificates in the cluster are approaching their expiration date. If a certificate expires, the affected endpoint (API server, ingress router, or internal service) will reject connections. OpenShift automatically rotates its own internal certificates, but any certificates you provided manually (custom ingress certs, API server certs) must be renewed by you."
recommendation = "1. Identify which certificates are expiring.\n   `oc get csr`\n   `oc get secret -n openshift-kube-apiserver -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\\n' | grep serving`\n2. For user-provided certificates (ingress, API), renew the certificate with your CA before the expiration date.\n3. Update the corresponding Secret.\n   `oc create secret tls <name> --cert=<new-cert> --key=<new-key> -n <ns> --dry-run=client -o yaml | oc apply -f -`\n4. No action is needed for OCP-managed internal certificates because they auto-rotate.\n5. If `cert-manager` is installed, check managed certificates.\n   `oc get certificates -A`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "affected ingress, API, or authentication endpoints"
impact_detail = "Renewing user-provided certificates rolls the components that mount those secrets and can briefly reset TLS sessions while new certs are loaded."

