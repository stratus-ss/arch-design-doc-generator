[[checks]]
check_id = "7.7.ccx_internal.version_check"
title = "CCX Version Check"
description = "Insights detected the cluster is running an older or unsupported version of\nOpenShift. Running unsupported versions means no security patches, bug fixes,\nor Red Hat support coverage.\n"
recommendation = "1. Check the current cluster version.\n   `oc get clusterversion`\n2. Compare it against supported lifecycle dates.\n   https://access.redhat.com/support/policy/updates/openshift\n3. Plan the upgrade path using the OCP Upgrade Graph.\n   https://access.redhat.com/labs/ocpupgradegraph/\n4. Test the upgrade in non-production before applying it to production clusters.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Addressing version currency requires performing a cluster upgrade, which rolls operators, nodes, and workloads over time."

