[[checks]]
check_id = "7.7.scc.custom"
title = "Custom SCCs"
description = "This is a deterministic engine check; it is not a TSR worksheet item. Custom SCCs may grant elevated privileges beyond what is necessary. Review each\ncustom SCC against the principle of least privilege and prefer built-in SCCs or\nPod Security Admission where possible.\n"
# why-rec
# CORRECTED. `oc adm policy who-can use scc/<name>` warns that the resource type is unknown. The
# engine reads SCC `.users` / `.groups`. Rec uses `oc get scc <name>`.
recommendation = "1. Audit custom SCCs and compare each against the built-in `restricted-v2` baseline.\n   `oc get scc -o name`\n2. Identify users and groups on a custom SCC:\n   `oc get scc <name> -o jsonpath='{.users}{\"\\n\"}{.groups}{\"\\n\"}'`\n3. Where possible, migrate workloads to `restricted-v2` or use Pod Security Admission enforce labels.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads currently using custom SCCs"
impact_detail = "Removing elevated SCC access usually requires workload rollout or restart under a less-privileged security context."

