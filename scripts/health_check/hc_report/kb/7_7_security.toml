[[checks]]
check_id = "7.7.ccx_internal.pods_check"
title = "CCX Pods Check"
description = "Red Hat Insights found pods that are not in a healthy Running or Completed state. This includes pods stuck in Pending, `CrashLoopBackOff`, Error, or other abnormal states. The evidence lists the affected pods and their status."
recommendation = "Treat pods that are not Running or successfully Completed as an active workload-health finding and investigate the underlying cause before deleting or restarting them. Start with pod events, then review current logs to identify the failure reason. Resolve Pending pods by validating scheduling constraints, namespace quotas, PVC binding, image pulls, node capacity and pressure, and required configuration or secrets. Resolve `CrashLoopBackOff` and Error states by correcting the application, configuration, dependency, or resource issue identified in the logs. Delete a pod only after collecting evidence and fixing the root cause, as deletion alone commonly recreates the same failure."
verification = "1. List pods not in Running or Completed state.\n   `oc get pods -A | grep -Ev 'Running|Completed'`\n2. For each problem pod, check events and the previous container log for the failure reason.\n   `oc describe pod <pod> -n <ns>`\n   `oc logs <pod> -n <ns> --previous`\n3. Common causes include OOMKilled (resource limits too low), missing ConfigMaps or Secrets, image pull failures, or node resource exhaustion."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

