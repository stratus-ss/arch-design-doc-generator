[[checks]]
check_id = "7.7.ccx_external.cve_2026_31431_copy_fail_in_algif_aead"
title = "CCX CVE-2026-31431 kernel algif_aead"
description = "A known kernel security vulnerability (CVE-2026-31431) affects this cluster's RHCOS version. The vulnerability is in the kernel's cryptography subsystem and can cause a kernel panic under certain workloads. A patched kernel version is available — the evidence shows the fixed version number."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: A known kernel security vulnerability (CVE-2026-31431) affects this cluster's
# RHCOS version.
# The rec remediates THAT story by starting at `oc get nodes -o
# custom-columns=NAME:.metadata.name,KERNEL:.status.nodeInfo.kernelVersion` — the live
# object/command for this check, not a neighboring TSR item.
# Impact `maintenance-window`: Applying the fixed RHCOS/kernel content requires rolling node
# updates and reboots to bring the patched kernel into service.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check the kernel version running on each node.\n   `oc get nodes -o custom-columns=NAME:.metadata.name,KERNEL:.status.nodeInfo.kernelVersion`\n2. Compare the running version against the fix version in the advisory.\n   https://access.redhat.com/security/cve/CVE-2026-31431\n3. If nodes are running the vulnerable kernel, upgrade the cluster to the fixed OCP version shown in the evidence, or apply RHCOS updates.\n   `oc adm upgrade`\n4. Plan a maintenance window because nodes will need to reboot to pick up the new kernel.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster nodes running the affected kernel"
impact_detail = "Applying the fixed RHCOS/kernel content requires rolling node updates and reboots to bring the patched kernel into service."

