[[checks]]
check_id = "7.7.scc.custom"
title = "Custom SCCs"
description = "This check identifies custom SecurityContextConstraints (SCCs) that do not appear to be managed by the OpenShift payload or an installed Operator. SCCs owned by ClusterVersion, marked with include.release.openshift.io, or labeled as managed by an application are excluded; any remaining SCC is reported as a **WARNING** because it represents a cluster-specific security policy requiring customer ownership and review. An empty result is **PASS**, indicating that no unmanaged custom SCCs were identified. SCCs control security-sensitive pod permissions, including privilege escalation, host access, volume types, capabilities, and user or SELinux settings.\n"
recommendation = "Review each custom SCC to confirm purpose and continued need. Apply least privilege: grant access through RBAC to specific service accounts rather than broad users or groups, avoid unnecessary priority settings, and restrict privileged containers, host namespaces, host-path volumes, capabilities, and arbitrary UID use wherever possible. Document each approved custom SCC. Do not modify OpenShift-provided SCCs. Create or maintain a separate custom SCC when a supported workload requires an exception."
verification = "1. List custom SCCs with no ClusterVersion owner, no include.release.openshift.io annotation, and no app.kubernetes.io/managed-by label. Any printed row needs review; an empty result is healthy.\n   `oc get scc -o json | jq -r '.items[] | (.metadata.annotations // {}) as $annotations | (.metadata.labels // {}) as $labels | (.metadata.ownerReferences // []) as $owners | select(([$owners[].kind] | index(\"ClusterVersion\") | not) and (([$annotations | keys[] | select(startswith(\"include.release.openshift.io/\"))] | length) == 0) and (($labels[\"app.kubernetes.io/managed-by\"] // \"\") == \"\")) | .metadata.name' | awk 'NF{print \"WARNING\", \"NAME=\"$0; c++} END{if(!c) print \"PASS none-custom\"}'`\n2. For each reported SCC, print its privilege and run-as-user settings.\n   `oc get scc <name>`\n3. Print the users and groups bound to the SCC.\n   `oc get scc <name> -o json | jq -r '[((.users // []) | join(\",\")), ((.groups // []) | join(\",\"))] | @tsv' | awk -F'\\t' '{users=($1==\"\"?\"none\":$1); groups=($2==\"\"?\"none\":$2); print \"INFO\", \"USERS=\"users, \"GROUPS=\"groups}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads currently using custom SCCs"
impact_detail = "Removing elevated SCC access usually requires workload rollout or restart under a less-privileged security context."

