[[checks]]
check_id = "7.7.ccx_internal.etcd_low_backend_performance"
title = "CCX etcd low backend performance"
description = "Red Hat Insights detected that etcd is taking too long to write data to disk on one or more control plane nodes. The evidence shows slow fdatasync and backend commit times. When etcd cannot write fast enough, the cluster's API becomes slow or unresponsive — every kubectl/oc command and every controller reconciliation is affected."
recommendation = "Storage is too slow for etcd. Move etcd to dedicated NVMe or enterprise SSD; BareMetal IPI needs high-IOPS disks. Do not retune etcd to hide slow disks. Confirm member health and DB size first; defrag above ~4 GB only after a backup."
verification = "1. Check etcd database size and member health.\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n2. Run fio benchmarks on control-plane disks to verify minimum 50 sequential IOPS and P99 fsync latency under 10 ms.\n3. If disk latency is too high, on bare metal dedicate an NVMe/SSD partition for /var/lib/etcd; on virtualized platforms check for noisy-neighbor I/O contention.\n4. If the database exceeds 4 GB, schedule defragmentation in a maintenance window after taking an etcd backup."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd storage path"
impact_detail = "Remediating etcd backend performance often requires control-plane infrastructure or storage changes that can reduce API capacity during the work."

