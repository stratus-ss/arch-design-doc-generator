title = "CCX pods container health"
description = "One or more pods have containers that are repeatedly crashing (CrashLoopBackOff), cannot pull their image (ImagePullBackOff), or are restarting frequently. The evidence lists the specific pods and their restart counts. These failures may indicate application bugs, missing configuration, or infrastructure problems."
# why-rec
