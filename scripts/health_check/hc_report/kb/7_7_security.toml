check_id = "7.7.ccx_internal.version_info"
title = "CCX Version Info"
description = "Insights version information check providing details about the cluster version,\nupdate channel, and available updates. This informational check helps track\ncluster currency and update availability.\n"
recommendation = "Version, channel, and availableUpdates are currency, not a defect by themselves. Confirm the channel matches the support policy. Lifecycle dates belong on the identification-and-state row.\n\nVerification:\n1. Print version, channel, and recommended updates:\n   `oc get clusterversion version -o jsonpath='{.status.desired.version}{\" \"}{.spec.channel}{\"\\n\"}{range .status.availableUpdates[*]}available={.version}{\"\\n\"}{end}'`\n   `oc adm upgrade`\n2. Confirm the cluster is on a supported channel.\n"
