[[checks]]
check_id = "7.7.ccx_internal.pods_check"
title = "CCX Pods Check"
description = "Red Hat Insights found pods that are not in a healthy Running or Completed state. This includes pods stuck in Pending, CrashLoopBackOff, Error, or other abnormal states. The evidence lists the affected pods and their status."
recommendation = "Pods that are not Running or Completed are the live incident list. Describe Events and previous logs before you delete. Pending is often quota, PVC, or node pressure — not always a crash.\n\nVerification:\n1. List all non-healthy pods:\n   `oc get pods -A | grep -Ev 'Running|Completed'`\n2. For each problem pod, check what went wrong:\n   `oc describe pod <pod> -n <ns>` — look at Events and Status sections\n   `oc logs <pod> -n <ns> --previous` — see the last crash output\n3. Common causes: resource limits too low (OOMKilled), missing ConfigMaps\n      or Secrets, image pull failures, or node resource exhaustion.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

