[[checks]]
check_id = "7.7.oauth.idp"
title = "External identity providers"
description = "This check fires when no OAuth identity providers are configured, leaving only\nthe bootstrap `kubeadmin` account. After at least one working IdP exists and a\nnon-kubeadmin cluster-admin can log in, remove the kubeadmin secret.\n"
recommendation = "No identity provider means the cluster still lives on kubeadmin. HTPasswd counts as an IdP. Configure a working IdP and a non-kubeadmin cluster-admin before you delete the kubeadmin secret."
verification = "1. Print the name and type of each identity provider (OAuth cluster). Any listed row confirms an IdP is configured; an empty result means no IdP exists and needs attention.\n   `oc get oauth cluster -o jsonpath='{range .spec.identityProviders[*]}{.name}{\"\\t\"}{.type}{\"\\n\"}{end}' | awk -F'\\t' 'NF{print \"PASS\", \"NAME=\"$1, \"TYPE=\"$2; c++} END{if(!c) print \"WARNING none-idp\"}'`\n2. If no IdP exists, configure one (LDAP, OIDC, GitHub, GitLab, HTPasswd, or another supported type).\n3. Confirm a non-kubeadmin user holds `cluster-admin` and can authenticate.\n4. Only then delete the bootstrap kubeadmin secret.\n   `oc delete secret kubeadmin -n kube-system`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "authentication components"
impact_detail = "Editing the OAuth configuration rolls authentication pods and can briefly affect user logins, but it does not reboot nodes or stop running workloads."

