[[checks]]
check_id = "7.7.ccx_external.cluster_does_not_support_olm_operators_network_policies"
title = "Cluster Does Not Support OLM Operators Network Policies"
description = "Red Hat Insights reports this OpenShift z-stream cannot let Operator Lifecycle Manager manage `NetworkPolicy` objects for OLM components. The defect is platform OLM support (Insights Fixed Version), not a missing customer NetworkPolicy."
recommendation = "Upgrade the cluster to the Insights **Fixed Version** or a later z-stream on the same minor so OLM can manage its own `NetworkPolicy` objects. Do not create or edit NetworkPolicies for OLM namespaces to clear this finding; those objects are platform-managed after the z-stream. Use `oc adm upgrade` to pick an approved target that is at least the Fixed Version."
verification = """1. Print the current ClusterVersion. Compare it to the Fixed Version in Observation. Below that z-stream needs an upgrade.
   `oc get clusterversion version -o jsonpath='{.status.desired.version}{\"\\n\"}'`
2. List eligible updates. Pick a target at or above the Fixed Version.
   `oc adm upgrade`"""
priority_hint = ""
impact = "rolling-restart"
impact_scope = "control plane and worker nodes in unpaused MachineConfigPools"
impact_detail = "The z-stream upgrade rolls operators and typically reboots nodes through the MCO."

