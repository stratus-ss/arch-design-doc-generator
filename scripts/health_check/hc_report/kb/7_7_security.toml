recommendation = "1. Identify which components are failing from the evidence log entries.\n2. Check certificate validity on the affected endpoints:\n   `oc get secret -n <namespace> -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\\n' | grep -E 'tls|cert|serving'`\n3. Verify the TLS security profile is not too restrictive:\n   `oc get apiserver cluster -o jsonpath='{.spec.tlsSecurityProfile}'`\n4. If a load balancer or proxy sits between cluster nodes, ensure it is\n   configured to pass through (not terminate) internal cluster TLS traffic.\n"
