[[checks]]
check_id = "7.7.rbac.cluster_admin"
title = "Cluster-admin RBAC"
description = "This check identifies cluster-admin assignments that are not clearly required for core platform operation. It reports non-system: users and groups, leftover must-gather service accounts, and service accounts outside OpenShift or Kubernetes system namespaces; platform-managed operator service accounts in openshift-* and kube-* namespaces are excluded. Any remaining assignment is a **WARNING** because cluster-admin grants unrestricted access across the cluster. An empty result is **PASS**, reported as no non-system user admin, no must-gather admin, or no tenant service-account admin grants.\n"
recommendation = "Review every reported cluster-admin binding and confirm whether it is still needed. Remove obsolete must-gather, default-service-account, user, group, and tenant service-account grants and replace them with the smallest namespace-scoped or cluster-scoped role required for the task. Do not assume that every service account is unsafe."
verification = "1. Print User and Group subjects on cluster-admin ClusterRoleBindings, excluding system: principals. Any listed row needs review; an empty result is healthy.\n   `oc get clusterrolebinding -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name as $binding_name | .subjects[]? | select((.kind==\"User\" or .kind==\"Group\") and (.name | startswith(\"system:\") | not)) | [$binding_name, .kind, .name] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"BINDING=\"$1, \"KIND=\"$2, \"SUBJECT=\"$3; c++} END{if(!c) print \"PASS none-user-admin\"}'`\n2. Print leftover must-gather service accounts with cluster-admin. Any listed row needs review; an empty result is healthy.\n   `oc get clusterrolebinding -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name as $binding_name | .subjects[]? | select((.namespace // \"\") | test(\"must-gather\")) | [$binding_name, .kind, .name, .namespace] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"BINDING=\"$1, \"KIND=\"$2, \"SUBJECT=\"$3, \"NS=\"$4; c++} END{if(!c) print \"PASS none-must-gather-admin\"}'`\n3. Print service accounts outside openshift-* and kube-* namespaces that hold cluster-admin. Any listed row needs review; an empty result is healthy.\n   `oc get clusterrolebinding -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name as $binding_name | .subjects[]? | select(.kind==\"ServiceAccount\" and ((.namespace // \"\") | test(\"^(openshift-|kube-)\") | not)) | [$binding_name, .kind, .name, (.namespace // \"-\")] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"BINDING=\"$1, \"KIND=\"$2, \"SUBJECT=\"$3, \"NS=\"$4; c++} END{if(!c) print \"PASS none-tenant-sa-admin\"}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "access control only"
impact_detail = "RBAC binding changes apply immediately without restarting nodes, but they can instantly remove administrative access for the affected principals."

