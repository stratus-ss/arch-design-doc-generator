[[checks]]
check_id = "7.7.ccx_internal.image_registry_storage_comprehensive"
title = "CCX image registry storage"
description = "The internal image registry is using \"emptyDir\" (temporary) storage. This means any container images pushed to the internal registry will be lost when the registry pod restarts. Builds that push images internally and ImageStream imports will fail after a restart. Production clusters should use persistent storage."
recommendation = "1. Check the current registry storage type:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o jsonpath='{.spec.storage}'`\n2. If it shows \"emptyDir\", configure a persistent backend:\n   - Bare metal: use a PVC with a supported StorageClass\n   - Cloud: use native object storage (S3, Azure Blob, GCS)\n3. Verify the registry pods are healthy after the change:\n   `oc get pods -n openshift-image-registry`\n4. Confirm the image pruner is enabled to manage storage growth.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and internal image workflows"
impact_detail = "Changing registry storage or registry rollout settings rolls registry pods and can briefly interrupt builds or internal image pulls/pushes."

