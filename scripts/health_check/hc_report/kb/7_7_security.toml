[[checks]]
check_id = "7.7.ccx_internal.certificates_expiring_soon"
title = "CCX certificates expiring soon"
description = "TLS enddate on ingress, openshift-config, named API certs, and cert-manager. Expires within 30 days is FAIL. Within 90 days is WARNING. Else PASS. No custom ingress default is INFO n/a-custom-ingress-cert. No named API cert is INFO n/a-named-api-cert. No cert-manager CRD is INFO n/a-cert-manager. Pending CSRs are 7.6.csr_pending.\n"
recommendation = "This is TLS `enddate` on ingress, openshift-config, named API certs, and cert-manager — not pending CSRs. Under 30 days replace or renew now; under 90 days schedule the change. Platform serving certs rotate on their own; user-provided certs do not. Pending CSRs belong on the CSR row.\n\nVerification:\n1. Print whether ingress uses a custom default cert. <none> is informational n/a-custom-ingress-cert:\n   `oc get ingresscontroller default -n openshift-ingress-operator --no-headers -o custom-columns=DEFAULTCERT:.spec.defaultCertificate.name | awk '{if($1==\"<none>\" || $1==\"\") print \"INFO n/a-custom-ingress-cert\"; else print \"INFO\", \"DEFAULTCERT=\"$1}'`\n2. Print API named-certificate secret names. An empty list means this is not in use (n/a-named-api-cert):\n   `oc get apiserver cluster -o jsonpath='{range .spec.servingCerts.namedCertificates[*]}{.servingCertificate.name}{\"\\n\"}{end}' | awk 'NF{print \"INFO\", \"NAME=\"$1} END{if(NR==0) print \"INFO n/a-named-api-cert\"}'`\n3. Check kubernetes.io/tls secrets in openshift-ingress and openshift-config. DAYS<30 needs action. DAYS<90 needs review. Otherwise the row is healthy. An empty list means this is not in use (n/a-tls):\n   `for namespace in openshift-ingress openshift-config; do oc get secret -n \"$namespace\" --field-selector type=kubernetes.io/tls -o jsonpath='{range .items[*]}{.metadata.namespace}{\"\\t\"}{.metadata.name}{\"\\t\"}{.data.tls\\.crt}{\"\\n\"}{end}'; done | while IFS=$'\\t' read -r namespace secret_name certificate; do [ -n \"$certificate\" ] || continue; cert_pem=$(printf '%s' \"$certificate\" | base64 -d 2>/dev/null) || continue; enddate=$(printf '%s' \"$cert_pem\" | openssl x509 -noout -enddate 2>/dev/null | sed 's/^notAfter=//'); days=$(( ($(date -d \"$enddate\" +%s) - $(date +%s)) / 86400 )); result=PASS; [ \"$days\" -lt 90 ] && result=WARNING; [ \"$days\" -lt 30 ] && result=FAIL; echo \"$result NS=$namespace NAME=$secret_name DAYS=$days ENDDATE=$enddate\"; done | awk 'NF{print; found=1} END{if(!found) print \"INFO n/a-tls\"}'`\n4. Print cert-manager Certificate READY and NOTAFTER. Missing CRD is informational n/a-cert-manager. None is informational n/a-cert-manager-cert. READY not True needs action:\n   `oc get certificate -A --no-headers -o 'custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type==\"Ready\")].status,NOTAFTER:.status.notAfter' 2>&1 | awk '/No resources found/{print \"INFO n/a-cert-manager-cert\"; seen=1; next} /doesn.t have a resource type|could not find the requested resource/{print \"INFO n/a-cert-manager\"; seen=1; next} seen{next} {r=\"INFO\"; if($3!=\"True\") r=\"FAIL\"; print r, \"NS=\"$1, \"NAME=\"$2, \"READY=\"$3, \"NOTAFTER=\"$4} END{if(!seen && NR==0) print \"INFO n/a-cert-manager-cert\"}'`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "affected ingress, API, or authentication endpoints"
impact_detail = "Renewing user-provided certificates rolls the components that mount those secrets and can briefly reset TLS sessions while new certs are loaded."

