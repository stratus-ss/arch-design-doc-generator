[[checks]]
check_id = "7.7.ccx_internal.master_nodes_are_schedulable"
title = "CCX Master Nodes Are Schedulable"
description = "Insights detected that control plane (master) nodes are configured as\nschedulable for user workloads. This allows application pods to compete with\ncritical control-plane components for resources.\n"
recommendation = "1. Check scheduler configuration.\n   `oc get scheduler cluster -o jsonpath='{.spec.mastersSchedulable}'`\n2. If `mastersSchedulable` is true and that is not intentional (for example on compact 3-node clusters), set it to false.\n   `oc patch scheduler cluster --type=merge -p '{\"spec\":{\"mastersSchedulable\": false}}'`\n3. Verify control plane taints are present.\n   `oc describe nodes -l node-role.kubernetes.io/master=`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "control-plane scheduling"
impact_detail = "Disabling master schedulability prevents new user workloads from landing on control-plane nodes but does not evict existing pods or reboot nodes. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

