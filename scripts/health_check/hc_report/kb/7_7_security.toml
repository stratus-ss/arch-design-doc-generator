[[checks]]
check_id = "7.7.scc.privileged_users"
title = "Privileged SCC usage"
description = "The `privileged` SCC grants unrestricted host access. Only system service\naccounts should normally require it. Audit all non-system principals with this\nassignment and revoke access where it is not strictly required.\n"
recommendation = "Only documented system service accounts should hold the `privileged` SCC. List USERS and GROUPS on the object, then migrate non-system workloads to a tighter SCC before revoking — pods fail to start if access is removed first. Do not delete the privileged SCC itself."
verification = "1. List the principals (users and groups) on the `privileged` SCC. Non-system subjects need review.\n   `oc get scc privileged -o jsonpath='{.users}{\"\\n\"}{.groups}{\"\\n\"}'`\n2. Verify each listed principal has a documented requirement for privileged access.\n3. For subjects that can be moved, migrate to a less-privileged SCC and confirm pod startup before revoking."
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads using the privileged SCC"
impact_detail = "Revoking privileged SCC access often requires pod rollout or manifest changes so workloads can start under a less-privileged policy."

