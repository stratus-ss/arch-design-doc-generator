[[checks]]
check_id = "7.7.compliance"
title = "Compliance Operator"
description = "The Compliance Operator automates security scanning against profiles such as\nCIS, NIST, and STIG, and provides continuous monitoring plus supported\nremediation workflows.\n"
recommendation = "The Compliance Operator is how you scan CIS/NIST/STIG on a cadence. Missing CSV or a suite that never reaches DONE means you have no continuous baseline. Review remediations before apply — some roll nodes.\n\nVerification:\n1. Validate the Compliance Operator:\n   `oc get csv -n openshift-compliance`\n2. Print suite name and phase:\n   `oc get compliancesuite -n openshift-compliance -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,SCHEDULE:.spec.schedule`\n3. If the operator is missing, install or validate it in `openshift-compliance`, select the required benchmark profile (for example CIS or NIST), and run scans on a regular cadence.\n4. Review generated remediations before applying them, because some remediations change node or control-plane configuration.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "compliance operator and scan workloads"
impact_detail = "Deploying the Compliance Operator and running scans adds cluster load and creates scan pods, but it does not reboot nodes by itself."

