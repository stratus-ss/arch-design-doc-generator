[[checks]]
check_id = "7.7.tsr.7_1_4_encrypting_data"
title = "7.1.4. Encrypting data"
description = "Evaluates etcd encryption configuration for secrets and other sensitive\nresources. Without etcd encryption at rest, anyone with access to etcd\nbackups or disk can read secrets in plaintext.\n"
# why-rec
# CORRECTED. Empty spec.encryption means identity (unencrypted). API enum is identity / aescbc /
# aesgcm. Rec prefers aesgcm and watches named `openshiftapiserver cluster`. Enabling encryption
# rolls API servers and migrates secrets.
recommendation = "1. Check encryption status.\n   `oc get apiserver cluster -o jsonpath='{.spec.encryption}'`\n2. Empty `spec.encryption` means identity (unencrypted). Enable datastore encryption with `aesgcm` (preferred) or `aescbc`:\n   `oc patch apiserver cluster --type=merge -p '{\"spec\":{\"encryption\":{\"type\":\"aesgcm\"}}}'`\n3. Monitor encryption migration progress on the named object:\n   `oc get openshiftapiserver cluster -o jsonpath='{.status.conditions}'`\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "API server and etcd encryption migration"
impact_detail = "Enabling etcd encryption triggers API server rollout and a background migration to encrypt all existing secrets, which takes time proportional to secret count."

