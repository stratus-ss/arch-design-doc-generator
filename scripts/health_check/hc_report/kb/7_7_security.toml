title = "CCX operators check"
description = "One or more cluster operators are not fully healthy. A healthy operator shows Available=True, Progressing=False, Degraded=False. Degraded operators can cause missing features, block upgrades, or trigger cascading failures in other components that depend on them."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: One or more cluster operators are not fully healthy.
# The rec remediates THAT story by starting at `oc get co` — the live object/command for this
# check, not a neighboring TSR item.
