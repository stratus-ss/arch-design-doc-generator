[[checks]]
check_id = "7.7.compliance"
title = "Compliance Operator"
description = "The Compliance Operator automates security scanning against profiles such as\nCIS, NIST, and STIG, and provides continuous monitoring plus supported\nremediation workflows.\n"
recommendation = "The Compliance Operator is how you scan CIS/NIST/STIG on a cadence. Missing CSV or a suite that never reaches DONE means you have no continuous baseline. Review remediations before apply — some roll nodes."
verification = "1. Check whether the Compliance Operator CSV is installed.\n   `oc get csv -n openshift-compliance`\n2. Print the ComplianceSuite name, phase, and schedule. A suite not reaching DONE means scanning is not completing.\n   `oc get compliancesuite -n openshift-compliance -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,SCHEDULE:.spec.schedule`\n3. If the operator is missing, install it in `openshift-compliance` and select a benchmark profile such as CIS or NIST.\n4. Review generated remediations before applying; some roll nodes or change control-plane configuration."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "compliance operator and scan workloads"
impact_detail = "Deploying the Compliance Operator and running scans adds cluster load and creates scan pods, but it does not reboot nodes by itself."

