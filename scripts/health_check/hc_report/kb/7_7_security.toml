[[checks]]
check_id = "7.7.ccx_internal.certificates_expiring_soon"
title = "CCX certificates expiring soon"
description = "This check evaluates the expiration dates of TLS certificates used by the OpenShift ingress controller, openshift-config resources, named API server certificates, and cert-manager-managed certificates when cert-manager is installed. Certificates expiring within 30 days are reported as **FAIL**, certificates expiring within 90 days as **WARNING**, and certificates with more than 90 days remaining as **PASS**. The absence of a custom default ingress certificate, named API certificate, or cert-manager CRDs is recorded as **INFO** / N/A for that specific certificate source, not as a failure. This check does not evaluate pending Certificate Signing Requests (CSRs), which are reported separately under the CSR-pending check.\n"
recommendation = "Renew or replace any user-managed TLS certificate that expires within 30 days as an immediate priority, and schedule renewal of certificates expiring within 90 days before they enter the critical window. OpenShift-managed serving certificates normally rotate automatically, while custom ingress, named API server, and externally managed certificates require the responsible team to maintain the renewal process."
verification = "1. Check whether the default IngressController uses a custom certificate. If the value is empty, no custom ingress cert is configured and the platform default is in use.\n   `oc get ingresscontroller default -n openshift-ingress-operator --no-headers -o custom-columns=DEFAULTCERT:.spec.defaultCertificate.name | awk '{if($1==\"<none>\" || $1==\"\") print \"INFO n/a-custom-ingress-cert\"; else print \"INFO\", \"DEFAULTCERT=\"$1}'`\n2. Print API server named-certificate secret names. If the list is empty, no named API certificates are configured.\n   `oc get apiserver cluster -o jsonpath='{range .spec.servingCerts.namedCertificates[*]}{.servingCertificate.name}{\"\\n\"}{end}' | awk 'NF{print \"INFO\", \"NAME=\"$1} END{if(NR==0) print \"INFO n/a-named-api-cert\"}'`\n3. Check kubernetes.io/tls secrets in openshift-ingress and openshift-config. Certificates expiring within 30 days need immediate action; within 90 days need review. If no TLS secrets are found, the result is informational.\n   `for namespace in openshift-ingress openshift-config; do oc get secret -n \"$namespace\" --field-selector type=kubernetes.io/tls -o jsonpath='{range .items[*]}{.metadata.namespace}{\"\\t\"}{.metadata.name}{\"\\t\"}{.data.tls\\.crt}{\"\\n\"}{end}'; done | while IFS=$'\\t' read -r namespace secret_name certificate; do [ -n \"$certificate\" ] || continue; cert_pem=$(printf '%s' \"$certificate\" | base64 -d 2>/dev/null) || continue; enddate=$(printf '%s' \"$cert_pem\" | openssl x509 -noout -enddate 2>/dev/null | sed 's/^notAfter=//'); days=$(( ($(date -d \"$enddate\" +%s) - $(date +%s)) / 86400 )); result=PASS; [ \"$days\" -lt 90 ] && result=WARNING; [ \"$days\" -lt 30 ] && result=FAIL; echo \"$result NS=$namespace NAME=$secret_name DAYS=$days ENDDATE=$enddate\"; done | awk 'NF{print; found=1} END{if(!found) print \"INFO n/a-tls\"}'`\n4. Print cert-manager Certificate readiness and expiry. If the CRD is missing, cert-manager is not installed; if no certificates exist, none are managed. A certificate not showing Ready True needs action.\n   `oc get certificate -A --no-headers -o 'custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type==\"Ready\")].status,NOTAFTER:.status.notAfter' 2>&1 | awk '/No resources found/{print \"INFO n/a-cert-manager-cert\"; seen=1; next} /doesn.t have a resource type|could not find the requested resource/{print \"INFO n/a-cert-manager\"; seen=1; next} seen{next} {r=\"INFO\"; if($3!=\"True\") r=\"FAIL\"; print r, \"NS=\"$1, \"NAME=\"$2, \"READY=\"$3, \"NOTAFTER=\"$4} END{if(!seen && NR==0) print \"INFO n/a-cert-manager-cert\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "affected ingress, API, or authentication endpoints"
impact_detail = "Renewing user-provided certificates rolls the components that mount those secrets and can briefly reset TLS sessions while new certs are loaded."

