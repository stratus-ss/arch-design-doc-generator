title = "CCX Version Info"
description = "Insights version information check providing details about the cluster version,\nupdate channel, and available updates. This informational check helps track\ncluster currency and update availability.\n"
recommendation = "1. Review version details.\n   `oc get clusterversion -o json | jq '{version: .items[0].status.desired.version, channel: .items[0].spec.channel, available: .items[0].status.availableUpdates}'`\n2. Confirm the cluster is on a supported channel.\n3. Ensure available updates are being evaluated for scheduling.\n"
