[[checks]]
check_id = "7.7.ccx_internal.etcd_low_backend_performance"
title = "CCX etcd low backend performance"
description = "Red Hat Insights detected that etcd is taking too long to write data to disk on one or more control plane nodes. The evidence shows slow fdatasync and backend commit times. When etcd cannot write fast enough, the cluster's API becomes slow or unresponsive — every kubectl/oc command and every controller reconciliation is affected."
# why-rec
# ENGINEERING JUDGMENT on the 4 GB defrag trigger (this lab quota is 8.6 GB). 50 sequential IOPS
# and <10ms P99 fsync are documented etcd practices. etcdctl endpoint status verified.
recommendation = "1. Check the current etcd database size and member health:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n2. Run fio benchmarks on control plane disks to verify they meet requirements:\n   - Minimum 50 sequential IOPS\n   - P99 fsync latency under 10ms\n3. If disk latency is too high:\n   - On bare metal: dedicate an NVMe/SSD partition for /var/lib/etcd\n   - On virtualized platforms: check for noisy-neighbor I/O contention\n4. If database size is large (>4 GB), schedule defragmentation in a\n   maintenance window after taking an etcd backup.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd storage path"
impact_detail = "Remediating etcd backend performance often requires control-plane infrastructure or storage changes that can reduce API capacity during the work."

