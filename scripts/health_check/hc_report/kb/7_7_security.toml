[[checks]]
check_id = "7.7.tsr.7_1_6_tls_security_profiles"
title = "7.1.6. TLS Security Profiles"
description = "Evaluates TLS security profile settings across API server, ingress, and kubelet\ncomponents. Weak TLS profiles allow cipher suites vulnerable to known attacks;\noverly strict profiles may break client compatibility.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Evaluates TLS security profile settings across API server, ingress, and kubelet
# components.
# The rec remediates THAT story by starting at `oc get apiserver cluster -o
# jsonpath='{.spec.tlsSecurityProfile}'` — the live object/command for this check, not a
# neighboring TSR item.
# Impact `rolling-restart`: TLS profile changes propagate across multiple components and trigger
# operator-managed rollouts that can briefly reset connections.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check TLS profiles.\n   `oc get apiserver cluster -o jsonpath='{.spec.tlsSecurityProfile}'`\n   `oc get ingresscontroller default -n openshift-ingress-operator -o jsonpath='{.spec.tlsSecurityProfile}'`\n2. Ensure production clusters use at least the `Intermediate` profile.\n3. Verify external clients support the target cipher set before tightening.\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "API server, ingress, and kubelet TLS endpoints"
impact_detail = "TLS profile changes propagate across multiple components and trigger operator-managed rollouts that can briefly reset connections."

