[[checks]]
check_id = "7.7.ccx_internal.high_core_dns_errors_high_alerts"
title = "CCX high CoreDNS error rate"
description = "The cluster's internal DNS service (CoreDNS) is producing a high rate of errors. DNS is fundamental — when it fails, pods cannot discover services, health probes fail, and operators may degrade. The evidence shows specific DNS lookup failures and the domains involved."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: The cluster's internal DNS service (CoreDNS) is producing a high rate of errors.
# The rec remediates THAT story by starting at `oc -n openshift-dns logs -l
# dns.operator.openshift.io/daemonset-dns --tail=100` — the live object/command for this check,
# not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# `oc debug` was not executed this pass (starts a node pod). Treat those steps as command-form.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check CoreDNS pod logs for error patterns.\n   `oc -n openshift-dns logs -l dns.operator.openshift.io/daemonset-dns --tail=100`\n2. Look for SERVFAIL or NXDOMAIN errors for specific domains, because these indicate either missing DNS records or unreachable upstream resolvers.\n3. Verify upstream DNS resolver connectivity from a node.\n   `oc debug node/<node> -- chroot /host nslookup <failing-domain>`\n4. Check that no NetworkPolicies are blocking DNS traffic on port 53.\n   `oc get networkpolicy -A | grep -i dns`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

