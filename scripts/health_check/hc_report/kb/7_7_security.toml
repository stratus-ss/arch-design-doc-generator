check_id = "7.7.ccx_external.cve_2026_31431_copy_fail_in_algif_aead"
title = "CCX CVE-2026-31431 kernel algif_aead"
description = "CVE-2026-31431 (algif_aead Copy Fail). First fixed OCP z-streams are 4.21.14, 4.20.21, 4.19.30, 4.18.40, and 4.16.61. ClusterVersion below that bar is FAIL. At or above is PASS. Unknown minor is INFO n/a-stream. The patched kernel ships in those z-streams.\n"
recommendation = "Patch to the first fixed z-stream for CVE-2026-31431 (algif_aead Copy Fail): OCP 4.21.14, 4.20.21, 4.19.30, 4.18.40, or 4.16.61. Below that bar the kernel is still vulnerable. At or above it, the CVE is addressed. The kernel fix reboots nodes. `oc adm upgrade` lists targets; it does not start the upgrade.\n\nVerification:\n1. Compare ClusterVersion against the first fixed z-stream. Below needs action. At or above is healthy. Unknown minor is informational n/a-stream:\n   `oc get clusterversion version --no-headers -o custom-columns=VERSION:.status.desired.version | awk -F. '{minor=$2+0; zstream=$3+0; result=\"FAIL\"; fixed=\"unknown\"; if(minor==21){fixed=\"4.21.14\"; if(zstream>=14) result=\"PASS\"} else if(minor==20){fixed=\"4.20.21\"; if(zstream>=21) result=\"PASS\"} else if(minor==19){fixed=\"4.19.30\"; if(zstream>=30) result=\"PASS\"} else if(minor==18){fixed=\"4.18.40\"; if(zstream>=40) result=\"PASS\"} else if(minor==16){fixed=\"4.16.61\"; if(zstream>=61) result=\"PASS\"} else if(minor>=22){result=\"PASS\"; fixed=\">=4.22\"} else {result=\"INFO\"; fixed=\"n/a-stream\"}; print result, \"VERSION=\"$0, \"FIXED=\"fixed}'`\n2. On FAIL, review available updates (does not start an upgrade):\n   `oc adm upgrade`\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster nodes running the affected kernel"
impact_detail = "Applying the fixed RHCOS/kernel content requires rolling node updates and reboots to bring the patched kernel into service."

