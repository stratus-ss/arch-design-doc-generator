[[checks]]
check_id = "7.7.scc.privileged_users"
title = "Privileged SCC usage"
description = "The `privileged` SCC grants unrestricted host access. Only system service\naccounts should normally require it. Audit all non-system principals with this\nassignment and revoke access where it is not strictly required.\n"
recommendation = "Only documented system service accounts should hold the `privileged` SCC. List USERS and GROUPS on the object, then migrate non-system workloads to a tighter SCC before revoking — pods fail to start if access is removed first. Do not delete the privileged SCC itself.\n\nVerification:\n1. List principals on the `privileged` SCC object:\n   `oc get scc privileged -o jsonpath='{.users}{\"\\n\"}{.groups}{\"\\n\"}'`\n2. Remove any non-system subjects that do not have a documented requirement.\n3. Migrate those workloads to a less-privileged SCC and validate pod startup before revoking access.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads using the privileged SCC"
impact_detail = "Revoking privileged SCC access often requires pod rollout or manifest changes so workloads can start under a less-privileged policy."

