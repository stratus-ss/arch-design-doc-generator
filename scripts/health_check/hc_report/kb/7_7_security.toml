recommendation = "Treat `CrashLoopBackOff`, ImagePullBackOff, and container Error states as active pod failures and diagnose the cause before deleting or restarting the affected pod. Review the pod events and container logs to identify application failures, invalid configuration, missing secrets or ConfigMaps, image-reference or registry-authentication issues, dependency failures, or resource constraints. Investigate high restart counts separately when the pod is not in `CrashLoopBackOff`, because that represents a restart-frequency issue rather than this specific failure-state finding."
verification = "1. List pods in `CrashLoopBackOff`, Error, or ImagePullBackOff state.\n   `oc get pods -A | grep -E 'CrashLoop|Error|ImagePull'`\n2. For `CrashLoopBackOff` pods, check the previous container log and pod events for the crash reason.\n   `oc logs <pod> -n <ns> --previous`\n   `oc describe pod <pod> -n <ns>`\n3. For ImagePullBackOff pods, verify the image reference is correct, pull secrets are configured, and network connectivity to the registry is working."
