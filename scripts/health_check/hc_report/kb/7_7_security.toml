check_id = "7.7.csr"
title = "Certificate signing requests"
description = "Pending CSRs typically indicate new nodes waiting for certificate approval. In\nmanual approval mode they block node join; in auto-approve mode they often\nindicate a bootstrap or node-health issue.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Pending CSRs typically indicate new nodes waiting for certificate approval.
# The rec remediates THAT story by starting at `oc get csr` — the live object/command for this
# check, not a neighboring TSR item.
# Impact `non-disruptive`: CSR approval allows pending components or nodes to continue operation
# without rebooting existing cluster nodes.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Review pending CSRs.\n   `oc get csr`\n2. Approve only trusted node or service requests after validating the requester identity.\n3. Investigate repeated CSR accumulation as a separate node bootstrap, certificate rotation, or machine health issue.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "pending certificate approvals"
impact_detail = "CSR approval allows pending components or nodes to continue operation without rebooting existing cluster nodes."

