[[checks]]
check_id = "7.7.ccx_internal.node_requirements_internal"
title = "CCX Node Requirements Internal"
description = "Documented node floors: control-plane 4 vCPU and 16 GiB, worker 2 vCPU and 8 GiB. Split findings are 7.1.tsr.1_4_1_2_master_cpus, 7.1.tsr.1_4_1_3_master_memory, 7.1.tsr.1_4_2_2_node_cpus, and 7.1.tsr.1_4_2_3_node_memory. Disk is 1.4.1.4 / 1.4.2.4.\n"
recommendation = "Documented floors: control-plane 4 vCPU / 16 GiB, worker 2 vCPU / 8 GiB. Score each field separately. On compact clusters the worker-role nodes are the masters — use the master floors. Disk size belongs on the control-plane and worker disk rows.\n\nVerification:\n1. Print control-plane CPU. 4+ is healthy. An empty list means this is not in use (n/a-master-cpu):\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers -o custom-columns=NAME:.metadata.name,CPU:.status.capacity.cpu | awk '{print ($2+0>=4?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"CPU=\"$2} END{if(NR==0) print \"INFO n/a-master-cpu\"}'`\n2. Print control-plane MEM. 16 GiB = 16777216 Ki is healthy. An empty list means this is not in use (n/a-master-mem):\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers -o custom-columns=NAME:.metadata.name,MEM:.status.capacity.memory | awk '{print ($2+0>=16777216?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"MEM=\"$2} END{if(NR==0) print \"INFO n/a-master-mem\"}'`\n3. Print worker-role CPU. 2+ is healthy. An empty list means this is not in use (n/a-worker-cpu):\n   `oc get nodes -l node-role.kubernetes.io/worker --no-headers -o custom-columns=NAME:.metadata.name,CPU:.status.capacity.cpu | awk '{print ($2+0>=2?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"CPU=\"$2} END{if(NR==0) print \"INFO n/a-worker-cpu\"}'`\n4. Print worker-role MEM. 8 GiB = 8388608 Ki is healthy. An empty list means this is not in use (n/a-worker-mem):\n   `oc get nodes -l node-role.kubernetes.io/worker --no-headers -o custom-columns=NAME:.metadata.name,MEM:.status.capacity.memory | awk '{print ($2+0>=8388608?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"MEM=\"$2} END{if(NR==0) print \"INFO n/a-worker-mem\"}'`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

