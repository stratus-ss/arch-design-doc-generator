[[checks]]
check_id = "7.7.ccx_internal.webhooks_check"
title = "CCX webhooks health"
description = "Insights detected webhooks that are intercepting too many API resources or have connectivity problems. Webhooks inspect every API request before it completes — if a webhook's backing service is down or slow, it can block all cluster operations including pod creation and configuration changes."
recommendation = "1. List all webhook configurations.\n   `oc get validatingwebhookconfigurations,mutatingwebhookconfigurations`\n2. For each webhook, verify its backing service is running.\n   `oc get endpoints <service> -n <namespace>`\n3. If a webhook belongs to a removed operator, delete it.\n   `oc delete mutatingwebhookconfiguration <name>`\n4. For non-critical webhooks, consider reducing `timeoutSeconds` to `5-10s` or changing `failurePolicy` from `\"Fail\"` to `\"Ignore\"`.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "API admission path"
impact_detail = "Webhook tuning applies live without node restarts, but it can immediately change whether API requests are blocked, mutated, or allowed."

