[[checks]]
check_id = "7.8.etcd.wal*"
pattern = true
title = "etcd WAL fsync latency"
description = "etcd WAL fsync latency directly impacts write throughput and leader elections.\nP99 latency above 10ms indicates slow disk I/O; above 50ms, etcd may begin\nlosing leadership and causing cluster instability.\n"
recommendation = "Move etcd onto NVMe or enterprise SSD when WAL fsync P99 is above 10 ms; above 50 ms leadership starts to slip. Do not retune etcd to hide slow disks. A missing metric means WAL latency was not scraped. Backend commit and peer RTT are correlation only. Leader elections belong on the leader-changes row."
verification = "1. Confirm WAL fsync P99 per member. <=10ms is healthy. >10ms needs review. >50ms needs action. An empty list means this is not in use (n/a-wal):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if($2==\"NaN\"||$2==\"+Inf\"||$2==\"-Inf\"){print \"INFO\", \"POD=\"$1, \"P99=n/a-nan\"; next} ms=$2*1000; r=\"PASS\"; if(ms>50) r=\"FAIL\"; else if(ms>10) r=\"WARNING\"; printf \"%s POD=%s P99=%.1fms\\n\", r, $1, ms} END{if(NR==0) print \"INFO n/a-wal\"}'`\n2. Print backend commit and peer RTT (correlation only; not the finding for this row):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if($2==\"NaN\"||$2==\"+Inf\"||$2==\"-Inf\"){print \"INFO\", \"POD=\"$1, \"BACKEND_P99=n/a-nan\"; next} printf \"POD=%s BACKEND_P99=%.1fms\\n\", $1, $2*1000} END{if(NR==0) print \"INFO n/a-backend\"}'`\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket[2m]))' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if(!seen[$1]++) printf \"POD=%s RTT=%.1fms\\n\", $1, $2*1000} END{if(NR==0) print \"INFO n/a-rtt\"}'`\n3. Verify the affected member status directly from etcd:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n4. Ensure the etcd nodes use NVMe or SSD storage with fsync support and dedicate a partition for `/var/lib/etcd` on bare metal where possible.\n5. If latency remains elevated, validate the storage subsystem with the `quay.io/cloud-bulldozer/etcd-perf` fio image before planning remediation."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

