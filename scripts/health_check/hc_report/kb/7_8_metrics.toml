[[checks]]
check_id = "7.8.apiserver.latency"
title = "API server latency"
description = "This check's verification bar treats API server P99 latency above 500 ms as a warning (timeouts in kubelet, controller-manager, and scheduler) and above 1000 ms as an API incident. Investigate etcd slowness, control plane resource exhaustion, and excessive API churn.\n"
recommendation = "Fix etcd disk or webhook timeouts when API server P99 is over 500 ms; do not change API flags first. The finding is the slowest RESOURCE/VERB pair; WATCH and CONNECT are excluded. Over 500 ms is slow; over 1000 ms is an API incident. Skip the follow-up command when P99 is already healthy."
verification = "1. Slowest API resource/verb pair by P99 latency (`topk(1, … > 0)`). At or below 500 ms is **PASS**, above 500 ms is **WARNING**, above 1000 ms is **FAIL**. An empty result means no resource latency is available:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=topk(1, histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{scope=\"resource\",verb!~\"WATCH|CONNECT\"}[5m])) by (le, resource, verb)) > 0)' | jq -r '.data.result[] | [.metric.resource, .metric.verb, .value[1]] | @tsv' | awk '{ms=$3*1000; r=\"PASS\"; if(ms>1000) r=\"FAIL\"; else if(ms>500) r=\"WARNING\"; print r, \"RESOURCE=\"$1, \"VERB=\"$2, \"P99=\"int(ms+0.5)\"ms\"} END{if(NR==0) print \"INFO n/a-apiserver-latency\"}'`\n2. Only if step 1 printed **WARNING** or **FAIL**, list remaining pairs above 500 ms (`… > 0.5`). An empty result means only the top pair was slow:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{scope=\"resource\",verb!~\"WATCH|CONNECT\"}[5m])) by (le, resource, verb)) > 0.5' | jq -r '.data.result[] | [.metric.resource, .metric.verb, .value[1]] | @tsv' | awk '{ms=$3*1000; r=\"WARNING\"; if(ms>1000) r=\"FAIL\"; print r, \"RESOURCE=\"$1, \"VERB=\"$2, \"P99=\"int(ms+0.5)\"ms\"} END{if(NR==0) print \"PASS none-slow\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "etcd disk or admission webhooks"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated. Webhook timeout or Fail policy is an API-object change and does not reboot nodes."

[checks.links]
default = "https://raw.githubusercontent.com/kubernetes/community/master/sig-scalability/slos/api_call_latency.md"

[[checks]]
check_id = "7.8.pvc.util.critical"
title = "PVC utilization critical"
description = "PVCs above 90% utilization are at immediate risk of filling completely, which\ncauses application errors, data loss, or pod eviction. Expand or migrate\nimmediately before the volume reaches 100%.\n"
recommendation = "Expand or migrate PVCs over 90% used before ENOSPC. Expand in place only if the StorageClass allows it; otherwise migrate. Online resize can still restart the pod. Any such claim needs action now."
verification = "1. PVCs over 90% utilization (kubelet_volume_stats_used_bytes / capacity). Any listed row is **FAIL**. An empty result means no claim exceeds 90%:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=round(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100, 1) > 90' | jq -r '.data.result[] | [.metric.namespace, .metric.persistentvolumeclaim, .value[1]] | @tsv' | awk -F'\\t' '{print \"FAIL\", \"NS=\"$1, \"PVC=\"$2, \"USED=\"int($3)\"%\"} END{if(NR==0) print \"PASS none-critical\"}'`\n2. For each listed PVC, print phase, capacity, request size, and StorageClass:\n   `oc get pvc <name> -n <ns> -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase,CAPACITY:.status.capacity.storage,REQUEST:.spec.resources.requests.storage,SC:.spec.storageClassName`\n3. Pods mounting the affected PVC. These workloads will hit ENOSPC if the volume fills:\n   `oc get pod -n <ns> --no-headers -o custom-columns=POD:.metadata.name,PVC:.spec.volumes[*].persistentVolumeClaim.claimName | awk -v claim='<name>' '$0 ~ claim {print \"POD=\"$1, \"PVC=\"$2}'`\n4. StorageClass volume expansion support. `EXPAND=true` can grow in place; `EXPAND=false` requires migration:\n   `oc get sc -o custom-columns=NAME:.metadata.name,EXPAND:.allowVolumeExpansion --no-headers | awk '{print \"NAME=\"$1, \"EXPAND=\"$2}'`\n5. Firing KubePersistentVolumeFillingUp alert. Any listed row needs action. An empty result means the alert is not firing:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | select(.labels.alertname==\"KubePersistentVolumeFillingUp\") | [.state, .labels.namespace, .labels.persistentvolumeclaim, .labels.severity] | @tsv' | awk -F'\\t' '{print \"FAIL\", \"STATE=\"$1, \"NS=\"$2, \"PVC=\"$3, \"SEVERITY=\"$4} END{if(NR==0) print \"INFO n/a-fillingup-alert\"}'`\n6. If expansion is supported, patch the PVC size (resize starts after patch). Otherwise migrate to a larger volume:\n   `oc patch pvc <name> -n <ns> -p '{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"<new-size>\"}}}}'`\n7. After patching, confirm FileSystemResizePending clears and capacity matches the request:\n   `oc get pvc <name> -n <ns> -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads mounted to the affected PVC"
impact_detail = "Online expansion may be transparent, but storage migration or cutover can require pod restart, rescheduling, or temporary workload movement."

