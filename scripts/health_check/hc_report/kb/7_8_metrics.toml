[[checks]]
check_id = "7.8.apiserver.latency"
title = "API server latency"
description = "API server P99 latency above expected thresholds can cause timeouts in\nkubelet, controller-manager, and scheduler operations. Investigate etcd\nslowness, control plane resource exhaustion, and excessive API churn.\n"
recommendation = "Fix etcd disk or webhook timeouts when API server P99 is over 500 ms; do not change API flags first. The finding is the slowest RESOURCE/VERB pair; WATCH and CONNECT are excluded. Over 500 ms is slow; over 1000 ms is an API incident. Skip the follow-up command when P99 is already healthy."
verification = "1. Confirm the slowest pair (`topk(1, … > 0)`). That single line is the finding. <=500ms is healthy. >500ms needs review. >1000ms needs action. An empty list means this is not in use (n/a-apiserver-latency):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=topk(1, histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{scope=\"resource\",verb!~\"WATCH|CONNECT\"}[5m])) by (le, resource, verb)) > 0)' | jq -r '.data.result[] | [.metric.resource, .metric.verb, .value[1]] | @tsv' | awk '{ms=$3*1000; r=\"PASS\"; if(ms>1000) r=\"FAIL\"; else if(ms>500) r=\"WARNING\"; print r, \"RESOURCE=\"$1, \"VERB=\"$2, \"P99=\"int(ms+0.5)\"ms\"} END{if(NR==0) print \"INFO n/a-apiserver-latency\"}'`\n2. Only if step 1 is WARNING or FAIL: list every other pair still over 500ms (`… > 0.5`). Empty here means the max was the only slow one (PASS none-slow):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{scope=\"resource\",verb!~\"WATCH|CONNECT\"}[5m])) by (le, resource, verb)) > 0.5' | jq -r '.data.result[] | [.metric.resource, .metric.verb, .value[1]] | @tsv' | awk '{ms=$3*1000; r=\"WARNING\"; if(ms>1000) r=\"FAIL\"; print r, \"RESOURCE=\"$1, \"VERB=\"$2, \"P99=\"int(ms+0.5)\"ms\"} END{if(NR==0) print \"PASS none-slow\"}'`"
priority_hint = ""
