[[checks]]
check_id = "7.8.etcd.leader_changes"
title = "etcd leader changes"
description = "Frequent etcd leader elections indicate instability, often caused by disk\nlatency, network timeouts, or control plane resource contention. Excessive\nleader churn affects write availability and overall control plane stability.\n"
recommendation = "Fix the disk or network causing etcd leader elections; do not restart etcd. Zero in the last hour is healthy. One to three is worth a look; more than three is unstable leadership. Check WAL fsync first."
verification = "1. Leader change count (etcd_server_leader_changes_seen_total) summed over one hour. Zero is **PASS**, 1-3 is **INFO**, above 3 is **WARNING**. An empty result means the metric is not scraped:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=sum(increase(etcd_server_leader_changes_seen_total[1h]))' | jq -r 'if (.data.result|length)==0 then \"n/a\" else .data.result[0].value[1] end' | awk '{if($1==\"n/a\") print \"INFO n/a-leader-changes\"; else {c=$1+0; r=\"PASS\"; if(c>3) r=\"WARNING\"; else if(c>0) r=\"INFO\"; printf \"%s CHANGES=%.0f\\n\", r, c}}'`\n2. Per-member leader changes showing which pod saw the election:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=increase(etcd_server_leader_changes_seen_total[1h])' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{printf \"POD=%s CHANGES=%.0f\\n\", $1, $2+0} END{if(NR==0) print \"INFO n/a-leader-changes\"}'`\n3. If step 1 printed **INFO** or **WARNING**, check etcd member logs for election entries:\n   `oc -n openshift-etcd logs etcd-<member> -c etcd --since=1h | grep 'elected leader'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane nodes and etcd storage path"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated."

