[[checks]]
check_id = "7.8.pvc.util.warning"
title = "PVC utilization warning"
description = "PVCs between 75% and 90% used may fill during peak load. Plan expansion or migration before the claim reaches the 90% critical band (7.8.pvc.util.critical).\n"
recommendation = "Plan expansion or migration for PVCs in the 75–90% band before they hit 90%. Any row in this band needs a dated plan. Over 90% is the critical-usage row. Confirm StorageClass expansion before USED crosses 90%. Pending versus Bound belongs on the PVC status row."
verification = "1. List every PVC in the 75-90% band. Any listed row needs review. An empty list is healthy (none-warning:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=(round(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100, 1) > 75) unless (round(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100, 1) > 90)' | jq -r '.data.result[] | [.metric.namespace, .metric.persistentvolumeclaim, .value[1]] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"NS=\"$1, \"PVC=\"$2, \"USED=\"int($3)\"%\"} END{if(NR==0) print \"PASS none-warning\"}'`\n2. For each WARNING row, print STATUS, CAPACITY, REQUEST, and SC:\n   `oc get pvc <name> -n <ns> -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase,CAPACITY:.status.capacity.storage,REQUEST:.spec.resources.requests.storage,SC:.spec.storageClassName`\n3. Print which pods mount that PVC:\n   `oc get pod -n <ns> --no-headers -o custom-columns=POD:.metadata.name,PVC:.spec.volumes[*].persistentVolumeClaim.claimName | awk -v claim='<name>' '$0 ~ claim {print \"POD=\"$1, \"PVC=\"$2}'`\n4. Print StorageClass EXPAND. true can grow in place. false needs a larger volume:\n   `oc get sc -o custom-columns=NAME:.metadata.name,EXPAND:.allowVolumeExpansion --no-headers | awk '{print \"NAME=\"$1, \"EXPAND=\"$2}'`\n5. Print firing KubePersistentVolumeFillingUp. A firing row usually means the claim has already crossed 90% — go to 7.8.pvc.util.critical. An empty list means this is not in use (n/a-fillingup-alert):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | select(.labels.alertname==\"KubePersistentVolumeFillingUp\") | [.state, .labels.namespace, .labels.persistentvolumeclaim, .labels.severity] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"STATE=\"$1, \"NS=\"$2, \"PVC=\"$3, \"SEVERITY=\"$4} END{if(NR==0) print \"INFO n/a-fillingup-alert\"}'`\n6. Schedule expansion during a window. If EXPAND=true, grow the claim. If EXPAND=false, plan a larger PVC before USED crosses 90%:\n   `oc patch pvc <name> -n <ns> -p '{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"<new-size>\"}}}}'`\n7. After patch, wait until FileSystemResizePending is gone and CAPACITY matches REQUEST:\n   `oc get pvc <name> -n <ns> -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "affected PVC-backed workloads"
impact_detail = "Proactive expansion is often online when the StorageClass supports it; only backend migrations or unsupported expansion paths require workload movement."

