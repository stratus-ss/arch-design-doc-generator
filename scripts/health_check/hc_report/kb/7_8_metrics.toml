[[checks]]
check_id = "7.8.etcd.wal*"
pattern = true
title = "etcd WAL fsync latency"
description = "etcd WAL fsync latency directly impacts write throughput and leader elections.\nP99 latency above 10ms indicates slow disk I/O; above 50ms, etcd may begin\nlosing leadership and causing cluster instability.\n"
recommendation = "1. Confirm which etcd member is reporting high WAL fsync latency from Prometheus:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))'`\n2. Correlate the WAL signal with backend commit and peer network latency:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))'`\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket[2m]))'`\n3. Verify the affected member status directly from etcd:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n4. Ensure the etcd nodes use NVMe or SSD storage with fsync support and dedicate a partition for `/var/lib/etcd` on bare metal where possible.\n5. If latency remains elevated, validate the storage subsystem with the `quay.io/cloud-bulldozer/etcd-perf` fio image before planning remediation.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

