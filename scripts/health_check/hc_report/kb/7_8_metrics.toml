[[checks]]
check_id = "7.8.apiserver.latency"
title = "API server latency"
description = "API server P99 latency above expected thresholds can cause timeouts in\nkubelet, controller-manager, and scheduler operations. Investigate etcd\nslowness, control plane resource exhaustion, and excessive API churn.\n"
recommendation = "1. Measure API responsiveness:\n   `oc get --raw /readyz`\n2. Inspect `apiserver_request_duration_seconds` trends in Prometheus.\n3. Correlate latency with webhook timeouts, etcd slowness, or overloaded control-plane nodes before changing configuration.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

