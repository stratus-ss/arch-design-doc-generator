[[checks]]
check_id = "7.8.etcd.wal*"
pattern = true
title = "etcd WAL fsync latency"
description = "etcd WAL fsync latency directly impacts write throughput and leader elections.\nP99 latency above 10 ms is a documented FAIL. Use NVMe or enterprise SSD for etcd.\n"
recommendation = "Move etcd onto NVMe or enterprise SSD when WAL fsync P99 is above 10 ms. Do not retune etcd to hide slow disks. A missing metric means WAL latency was not scraped. Backend commit and peer RTT are correlation only."
verification = "1. WAL fsync P99 latency per etcd member (etcd_disk_wal_fsync_duration_seconds). At or below 10 ms is **PASS**, above 10 ms is **FAIL**. An empty result means the metric is not scraped:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if($2==\"NaN\"||$2==\"+Inf\"||$2==\"-Inf\"){print \"INFO\", \"POD=\"$1, \"P99=n/a-nan\"; next} ms=$2*1000; r=\"PASS\"; if(ms>10) r=\"FAIL\"; printf \"%s POD=%s P99=%.1fms\\n\", r, $1, ms} END{if(NR==0) print \"INFO n/a-wal\"}'`\n2. Backend commit latency and peer round-trip time for correlation only:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if($2==\"NaN\"||$2==\"+Inf\"||$2==\"-Inf\"){print \"INFO\", \"POD=\"$1, \"BACKEND_P99=n/a-nan\"; next} printf \"POD=%s BACKEND_P99=%.1fms\\n\", $1, $2*1000} END{if(NR==0) print \"INFO n/a-backend\"}'`\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket[2m]))' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if(!seen[$1]++) printf \"POD=%s RTT=%.1fms\\n\", $1, $2*1000} END{if(NR==0) print \"INFO n/a-rtt\"}'`\n3. Etcd member endpoint status across the cluster:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n4. Ensure etcd nodes use NVMe or enterprise SSD and dedicate a partition for `/var/lib/etcd` on bare metal.\n5. If latency stays elevated, validate the storage subsystem with `quay.io/cloud-bulldozer/etcd-perf` before planning remediation."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

