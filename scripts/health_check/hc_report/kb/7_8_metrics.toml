[[checks]]
check_id = "7.8.etcd.defrag"
title = "etcd fragmentation"
description = "This check compares etcd database size to in-use bytes on each member. High unused bytes mean the backend is fragmented and is a defrag candidate. Size bars on 7.8.etcd.db.* stay separate.\n"
recommendation = "Defrag in a maintenance window when any member fragment ratio is 0.50 or higher. Take a backup first; the cluster command locks members. Do not treat this as a DB size quota check. Missing both Prometheus files is skipped, not a pass."
verification = "1. Prometheus database size (`etcd_mvcc_db_total_size_in_bytes`) and in-use (`etcd_mvcc_db_total_size_in_use_in_bytes`) per etcd pod give fragment ratio (size minus in-use) divided by size. Any member at or above 0.70 is FAIL; at or above 0.50 with none at 0.70 is WARNING; all below 0.50 is PASS. Empty samples are INFO and missing both files is SKIPPED:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=etcd_mvcc_db_total_size_in_bytes' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv'`\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=etcd_mvcc_db_total_size_in_use_in_bytes' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv'`\n2. Compare DB SIZE and IN USE columns on the etcdctl status table:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl endpoint status --cluster -w table`"
priority_hint = "P1"
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Defragmentation briefly locks each etcd member and can cause transient API latency; schedule during a maintenance window."

