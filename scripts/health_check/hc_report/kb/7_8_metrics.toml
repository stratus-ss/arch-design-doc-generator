[[checks]]
check_id = "7.8.pvc.util.critical"
title = "PVC utilization critical"
description = "PVCs above 90% utilization are at immediate risk of filling completely, which\ncauses application errors, data loss, or pod eviction. Expand or migrate\nimmediately before the volume reaches 100%.\n"
recommendation = "1. Expand the PVC immediately if the StorageClass supports volume expansion:\n   `oc patch pvc <name> -n <ns> -p '{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"<new-size>\"}}}}'`\n2. If expansion is not supported, migrate data to a larger PVC.\n3. Add alerting on high utilization.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads mounted to the affected PVC"
impact_detail = "Online expansion may be transparent, but storage migration or cutover can require pod restart, rescheduling, or temporary workload movement."

