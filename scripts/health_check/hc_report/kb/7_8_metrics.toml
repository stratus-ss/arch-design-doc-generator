check_id = "7.8.pvc.util.ok"
title = "PVC utilization normal"
description = "This check's verification bar is PVC capacity under 75% used. Continue monitoring for sustained growth trends and confirm expansion procedures are documented.\n"
recommendation = "Keep PVCs under 75% and confirm StorageClass expansion now so you are not inventing a process at 90%. This is the healthy band, not a skip on capacity planning."
verification = "1. All PVCs listed by namespace. This is informational while usage stays under 75%:\n   `oc get pvc -A`\n2. StorageClass volume expansion support. Confirm `EXPAND=true` before you need it:\n   `oc get sc -o custom-columns=NAME:.metadata.name,EXPAND:.allowVolumeExpansion`\n3. Review growth trends so expansion can be planned before any PVC reaches the 75% warning band."
