[[checks]]
check_id = "7.8.etcd.proposals"
title = "etcd failed proposals"
description = "Failed raft proposals indicate that some write requests could not be committed.\nThis usually points to a slow or failed cluster member, or disk/network\nlatency affecting quorum progress.\n"
recommendation = "1. Review etcd health:\n   `oc -n openshift-etcd exec etcd-<member> -c etcd -- etcdctl endpoint status --cluster -w table`\n2. Confirm that proposal latency is not being blocked by slow disks or overloaded control-plane nodes.\n3. Correlate spikes with related alerts such as `etcdHighNumberOfLeaderChanges` or `etcdGRPCRequestsSlow`.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

