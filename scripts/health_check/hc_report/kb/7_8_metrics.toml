[[checks]]
check_id = "7.8.etcd.compaction"
title = "etcd compaction duration"
description = "This check measures how long etcd takes to compact its MVCC database on each control plane node. The 95th percentile is the bar. KCS guidance is about 200 ms on a small cluster and no more than 800–900 ms on a large cluster. That is not an OpenShift HTML SLA. Values above that usually mean slow disks, a large database, or heavy API traffic.\n"
recommendation = "Keep compaction p95 at or below 200 ms on a small cluster. Above 200 ms through 900 ms is a warning band. Above 900 ms is FAIL. Do not run etcdctl compact from this health-check collect. Missing PromQL is INFO, not FAIL. Persistent latency is control-plane disk contention, database growth, or high API traffic."
verification = "1. Compaction p95 per etcd member (`etcd_debugging_mvcc_db_compaction_total_duration_milliseconds`, 1h rate, divide by 1000). At or below 200 ms is PASS. Above 200 ms and at most 900 ms is WARNING. Above 900 ms is FAIL. An empty or NaN result is INFO:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.95, sum(rate(etcd_debugging_mvcc_db_compaction_total_duration_milliseconds_bucket[1h])) by (le, pod)) / 1000' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{if($2==\"NaN\"||$2==\"+Inf\"||$2==\"-Inf\"){print \"INFO\", \"POD=\"$1, \"P95=n/a-nan\"; next} ms=$2*1000; r=\"PASS\"; if(ms>900) r=\"FAIL\"; else if(ms>200) r=\"WARNING\"; printf \"%s POD=%s P95=%.1fms\\n\", r, $1, ms} END{if(NR==0) print \"INFO n/a-compaction\"}'`\n2. Print auto-compaction flags from the etcd pod spec (read-only):\n   `oc -n openshift-etcd get pod -l app=etcd -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.spec.containers[0].args}{\"\\n\"}{end}'`\n3. Current etcd database size on every member:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`"
priority_hint = "P1"
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "High compaction latency is usually disk or database growth. Do not compact from collect scripts."

