[[checks]]
check_id = "7.8.etcd.proposals"
title = "etcd failed proposals"
description = "Failed raft proposals indicate that some write requests could not be committed.\nThis usually points to a slow or failed cluster member, or disk/network\nlatency affecting quorum progress.\n"
recommendation = "Fix the slow member or disk causing failed raft proposals; do not restart etcd. Zero is healthy. Any failed proposal is a write-path problem. Check WAL fsync before treating a member as dead."
verification = "1. Failed proposal count (etcd_server_proposals_failed_total) summed over one hour. Zero is **PASS**, above zero is **WARNING**. An empty result means the metric is not scraped:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=sum(increase(etcd_server_proposals_failed_total[1h]))' | jq -r 'if (.data.result|length)==0 then \"n/a\" else .data.result[0].value[1] end' | awk '{if($1==\"n/a\") print \"INFO n/a-proposals\"; else {c=$1+0; r=\"PASS\"; if(c>0) r=\"WARNING\"; printf \"%s FAILED=%.0f\\n\", r, c}}'`\n2. Per-member failed proposals showing which pod dropped writes:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=increase(etcd_server_proposals_failed_total[1h])' | jq -r '.data.result[] | [.metric.pod // \"-\", .value[1]] | @tsv' | awk '{printf \"POD=%s FAILED=%.0f\\n\", $1, $2+0} END{if(NR==0) print \"INFO n/a-proposals\"}'`\n3. If step 1 printed **WARNING**, list firing etcd leader-change and gRPC-slow alerts. An empty result means no relevant alerts are active:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=ALERTS{alertname=~\"etcdHighNumberOfLeaderChanges|etcdGRPCRequestsSlow\"}' | jq -r '.data.result[] | [.metric.alertname // \"-\", .metric.pod // \"-\", .metric.alertstate // \"-\"] | @tsv' | awk '{print \"WARNING\", \"ALERT=\"$1, \"POD=\"$2, \"STATE=\"$3} END{if(NR==0) print \"PASS none-firing\"}'`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

