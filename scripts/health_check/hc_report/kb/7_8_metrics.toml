[[checks]]
check_id = "7.8.etcd.log_errors"
title = "etcd log phrase errors"
description = "This check counts three etcd log phrases over the last six hours on each member: failed to send out heartbeat on time, request timed out, and rafthttp: failed to read. Any count above zero is FAIL. Unreadable logs are INFO.\n"
recommendation = "Heartbeat failures usually mean overloaded CPU or slow WAL writes. request timed out commonly means peer-network latency. rafthttp: failed to read needs peer connectivity, certificates, DNS, and time sync. Check WAL fsync before treating a member as dead."
verification = "1. Count the three phrases in the last six hours on each etcd member. Zero for all three is PASS. Any count above zero is FAIL:\n   `for member in $(oc -n openshift-etcd get pods -l app=etcd -o jsonpath='{.items[*].metadata.name}'); do printf '%s ' \"$member\"; oc -n openshift-etcd logs \"$member\" -c etcd --since=6h | awk '/failed to send out heartbeat on time/{h++} /request timed out/{t++} /rafthttp: failed to read/{r++} END{print (h+t+r==0?\"PASS\":\"FAIL\"), \"heartbeat=\"(h+0), \"timed_out=\"(t+0), \"rafthttp=\"(r+0)}'; done`\n2. If the previous command failed, print the matching lines on that member:\n   `oc -n openshift-etcd logs etcd-<member> -c etcd --since=6h | grep -E 'failed to send out heartbeat on time|request timed out|rafthttp: failed to read'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane storage, network, or CPU"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated."

