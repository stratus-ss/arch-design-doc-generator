[[checks]]
check_id = "7.8.etcd.leader_changes"
title = "etcd leader changes"
description = "Frequent etcd leader elections indicate instability, often caused by disk\nlatency, network timeouts, or control plane resource contention. Excessive\nleader churn affects write availability and overall control plane stability.\n"
recommendation = "1. Check the current leader and member status:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n2. Inspect recent member logs:\n   `oc -n openshift-etcd logs etcd-<member> -c etcd --since=1h`\n3. Review recent etcd pod reschedules, control-plane node drains, and disruptive maintenance events before treating elevated leader changes as a failure signal.\n4. If leader churn persists, investigate control-plane resource pressure and node latency to identify the underlying instability.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

