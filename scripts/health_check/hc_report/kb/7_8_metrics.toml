[[checks]]
check_id = "7.8.pvc.util.warning"
title = "PVC utilization warning"
description = "PVCs above 80% utilization may fill unexpectedly during peak workload periods.\nPlan expansion or migration proactively before capacity becomes critical.\n"
recommendation = "1. Monitor PVC growth and plan expansion before capacity becomes critical.\n2. Confirm whether the StorageClass allows expansion:\n   `oc get sc -o custom-columns=NAME:.metadata.name,EXPAND:.allowVolumeExpansion`\n3. If the StorageClass does not allow expansion, schedule a migration to a larger volume before utilization exceeds safe thresholds.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "affected PVC-backed workloads"
impact_detail = "Proactive expansion is often online when the StorageClass supports it; only backend migrations or unsupported expansion paths require workload movement."

