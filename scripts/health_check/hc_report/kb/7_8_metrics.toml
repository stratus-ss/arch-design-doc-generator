[[checks]]
check_id = "7.8.apiserver.latency"
title = "API server latency"
description = "This check's verification bar treats API server P99 latency above 500 ms as a warning (timeouts in kubelet, controller-manager, and scheduler) and above 1000 ms as an API incident. Investigate etcd slowness, control plane resource exhaustion, and excessive API churn.\n"
recommendation = "Fix etcd disk or webhook timeouts when API server P99 is over 500 ms; do not change API flags first. The finding is the slowest RESOURCE/VERB pair; WATCH and CONNECT are excluded. Over 500 ms is slow; over 1000 ms is an API incident. Skip the follow-up command when P99 is already healthy."
verification = "1. Slowest API resource/verb pair by P99 latency (`topk(1, … > 0)`). At or below 500 ms is **PASS**, above 500 ms is **WARNING**, above 1000 ms is **FAIL**. An empty result means no resource latency is available:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=topk(1, histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{scope=\"resource\",verb!~\"WATCH|CONNECT\"}[5m])) by (le, resource, verb)) > 0)' | jq -r '.data.result[] | [.metric.resource, .metric.verb, .value[1]] | @tsv' | awk '{ms=$3*1000; r=\"PASS\"; if(ms>1000) r=\"FAIL\"; else if(ms>500) r=\"WARNING\"; print r, \"RESOURCE=\"$1, \"VERB=\"$2, \"P99=\"int(ms+0.5)\"ms\"} END{if(NR==0) print \"INFO n/a-apiserver-latency\"}'`\n2. Only if step 1 printed **WARNING** or **FAIL**, list remaining pairs above 500 ms (`… > 0.5`). An empty result means only the top pair was slow:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{scope=\"resource\",verb!~\"WATCH|CONNECT\"}[5m])) by (le, resource, verb)) > 0.5' | jq -r '.data.result[] | [.metric.resource, .metric.verb, .value[1]] | @tsv' | awk '{ms=$3*1000; r=\"WARNING\"; if(ms>1000) r=\"FAIL\"; print r, \"RESOURCE=\"$1, \"VERB=\"$2, \"P99=\"int(ms+0.5)\"ms\"} END{if(NR==0) print \"PASS none-slow\"}'`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

