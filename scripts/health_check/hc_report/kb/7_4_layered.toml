[[checks]]
check_id = "7.4.tsr.4_12_1_1_2_operator_subscription_posture"
title = "TSR MTV operator subscription posture"
description = "This check validates the Migration Toolkit for Virtualization (MTV) Operator subscription in the `openshift-mtv` namespace. A healthy subscription has `STATE=AtLatestKnown`, matching `INSTALLEDCSV` and `CURRENTCSV` values, a **Succeeded** `ClusterServiceVersion` (CSV), and no pending, failed, or manually unapproved `InstallPlan`. An `UpgradePending` state means a newer MTV Operator version is available but has not been installed. The cluster remains on its current CSV until the `InstallPlan` is approved and completes successfully. This check evaluates Operator Lifecycle Manager subscription and upgrade state only. `ForkliftController` readiness and MTV operand health are assessed separately.\n"
recommendation = "Review the pending `mtv-operator` `InstallPlan` and approve it only after confirming compatibility with the cluster, current MTV migration activity, and the approved maintenance window. Complete or pause active migrations before upgrading where required by the change plan. After approval, verify that the subscription returns to `AtLatestKnown`, `INSTALLEDCSV` matches `CURRENTCSV`, the installed MTV CSV reaches **Succeeded**, and no `InstallPlan` remains pending or failed. If the upgrade does not complete, investigate the `InstallPlan`, CSV conditions, operator pod logs, catalog availability, and namespace resource constraints before retrying."
verification = "1. Print the mtv-operator subscription. Healthy when STATE is `AtLatestKnown` and INSTALLED equals CURRENT. If the namespace does not exist, MTV is not installed.\n   `oc get subscription -n openshift-mtv -o custom-columns=NAME:.metadata.name,PACKAGE:.spec.name,CHANNEL:.spec.channel,STATE:.status.state,INSTALLED:.status.installedCSV,CURRENT:.status.currentCSV 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-subscription\"; n=1; next} NR==1{next} {r=\"FAIL\"; if($4==\"AtLatestKnown\" && $5==$6) r=\"PASS\"; print r, \"NAME=\"$1, \"PACKAGE=\"$2, \"CHANNEL=\"$3, \"STATE=\"$4, \"INSTALLED=\"$5, \"CURRENT=\"$6} END{if(n) exit; if(NR<=1) print \"INFO n/a-mtv-subscription\"}'`\n2. Print the MTV CSV PHASE. Succeeded is healthy; any other phase is a failure.\n   `oc get csv -n openshift-mtv -o custom-columns=NAME:.metadata.name,PHASE:.status.phase 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-csv\"; n=1; next} NR==1{next} $1 ~ /^mtv-operator/ {print ($2==\"Succeeded\"?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"PHASE=\"$2; found=1} END{if(n) exit; if(!found) print \"INFO n/a-mtv-csv\"}'`\n3. List `InstallPlan`s that are not Complete or not approved. All Complete and approved is healthy. If the namespace does not exist, MTV is not installed.\n   `oc get installplan -n openshift-mtv -o custom-columns=NAME:.metadata.name,CSV:.spec.clusterServiceVersionNames,APPROVED:.spec.approved,PHASE:.status.phase 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-installplan\"; n=1; next} NR==1{next} {r=\"PASS\"; if($4!=\"Complete\" || tolower($3)!=\"true\") r=\"FAIL\"; print r, \"NAME=\"$1, \"APPROVED=\"$3, \"PHASE=\"$4} END{if(n) exit; if(NR<=1) print \"INFO n/a-mtv-installplan\"}'`"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "openshift-mtv OLM resources"
impact_detail = "Approving an `InstallPlan` rolls the MTV operator; it does not reboot nodes."

