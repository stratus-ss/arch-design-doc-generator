[[checks]]
check_id = "7.4.cnv.live_migratable"
title = "VM live-migratable status (engine)"
description = "This finding reads VirtualMachineInstance LiveMigratable conditions and VirtualMachine `evictionStrategy`. Live-migration network configuration is a separate finding."
recommendation = "Ensure every VMI reports `LiveMigratable=True` so nodes can drain during maintenance without VM outage. False means a PDB, local disk, or selector constraint is blocking migration — read the reason before changing `evictionStrategy`. Do not add a migration NAD to fix this; it is a workload constraint."
verification = "1. Print each VMI LiveMigratable condition with reason and message. An empty list means no VMIs exist. False needs review — the reason and message explain the constraint.\n   `oc get vmi -A -o json | jq -r '[\"RESULT\",\"NS\",\"NAME\",\"PHASE\",\"LIVEMIG\",\"REASON\",\"MESSAGE\"], (if (.items|length)==0 then [\"INFO\",\"-\",\"-\",\"-\",\"-\",\"-\",\"n/a-vmi\"] else .items[] | ([.status.conditions[]? | select(.type==\"LiveMigratable\")][0] // {}) as $c | [(if $c.status==\"True\" then \"PASS\" elif $c.status==\"False\" then \"WARNING\" else \"INFO\" end), .metadata.namespace, .metadata.name, (.status.phase // \"-\"), ($c.status // \"-\"), ($c.reason // \"-\"), ($c.message // \"-\")] end) | @tsv' | column -t -s $'\\t'`\n2. Print each VM `evictionStrategy`. LiveMigrate is the expected production value; other strategies are informational.\n   `oc get vm -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,EVICTION:.spec.template.spec.evictionStrategy | awk 'NR==1{print \"RESULT\",$0; next} {e=$3; r=\"INFO\"; if(e==\"LiveMigrate\") r=\"PASS\"; print r,$0} END{if(NR==1) print \"INFO n/a-vm\"}'`"
impact = "workload-shift"
impact_scope = "affected VMs"
impact_detail = "Making a VM live-migratable may require storage, networking, or eviction-policy changes and can require a VM reboot."

[[checks]]
check_id = "7.4.tsr.4_8_1_5_1_1_cnv_operators_node_placement"
title = "TSR CNV operators node placement"
description = "This check validates where OpenShift Virtualization infrastructure and VM workloads can run. It compares the HyperConverged resource's `spec.infra.nodePlacement` and `spec.workloads.nodePlacement` settings with the `virt-handler` DaemonSet placement and readiness, then verifies that intended VM nodes are eligible for virtualization. `virt-handler` is a node-level DaemonSet, so its Ready count should equal its Desired count on all nodes selected to host virtualization components; `virt-launcher` is instead created per running VM. Node-placement rules use exact label matching, and empty `nodePlacement` uses the platform default scheduling behavior.\n"
recommendation = "Align HyperConverged node-placement rules, node labels, taints/tolerations, and the `virt-handler` DaemonSet before changing node eligibility. Ensure every node intended to host VMs has `kubevirt.io/schedulable=true`, exposes the required hardware-virtualization CPU capability (`vmx` for Intel or `svm` for AMD), and has a running `virt-handler` pod. For a **WARNING** where `virt-handler` Ready does not equal Desired, identify the affected nodes and resolve the scheduling or runtime cause—such as a nonmatching selector, missing toleration, unsatisfied affinity rule, incompatible CPU virtualization support, resource pressure, or an unhealthy pod—rather than simply relabeling nodes. If placement is intentionally restricted, ensure the HyperConverged workload placement and `virt-handler` selector target the same node set."
verification = "1. Confirm virt-handler DaemonSet READY equals DESIRED. If the DS does not exist, Virtualization is not installed.\n   `oc get ds virt-handler -n openshift-cnv 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; next} NR==1{next} {print ($4==$2?\"PASS\":\"FAIL\"), \"READY=\"$4, \"DESIRED=\"$2, $1}'`\n2. Print HyperConverged infra and workloads nodeSelector. A value of <none> means default placement on all nodes.\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o custom-columns=NAME:.metadata.name,INFRA_SEL:.spec.infra.nodePlacement.nodeSelector,WORKLOADS_SEL:.spec.workloads.nodePlacement.nodeSelector`\n3. Print kubevirt.io/schedulable and CPU-feature labels (vmx for Intel, svm for AMD). Healthy when schedulable is true and at least one hardware-virt flag is present.\n   `oc get nodes -L kubevirt.io/schedulable -L cpu-feature.node.kubevirt.io/svm -L cpu-feature.node.kubevirt.io/vmx | awk 'NR==1{print \"RESULT\",$0; next} {r=\"FAIL\"; if($6==\"true\" && ($7==\"true\" || $8==\"true\")) r=\"PASS\"; print r,$0}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "CNV infrastructure pods and VM-capable worker nodes"
impact_detail = "Changing schedulable labels or node placement reschedules CNV components and can require VM migration before draining or repurposing nodes."

