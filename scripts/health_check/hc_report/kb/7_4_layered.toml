[[checks]]
check_id = "7.4.tsr.4_8_3_2_3_linux_bridge_network"
title = "TSR Linux bridge network"
description = "This check is Linux-bridge VM networks: NAD type cnv-bridge (or bridge) with a BRIDGE name and optional VLAN. Host bridge enactment is NNCE. macvlan and the OVN overlay NAD are not this object. Extra-network inventory is 3.17.3."
recommendation = "Provide a cnv-bridge (or bridge) NAD plus a Successful host-bridge NNCE for Linux-bridge VM networks. Other NAD types are not Linux-bridge attachments. Fix host-bridge enactment before attaching VMs if the NAD or NNCE is missing."
verification = "1. Print NNCE. Missing CRD / empty is informational n/a-nnce (host bridges not enacted here):\n   `oc get nnce 2>&1 | awk '/have a resource type|No resources found/{print \"INFO n/a-nnce\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-nnce\"}'`\n2. Print NAD TYPE, BRIDGE, and VLAN. jq only unwraps spec.config (JSON string). cnv-bridge or bridge is healthy. Other types is informational. An empty list means this is not in use (n/a-nad):\n   `oc get net-attach-def -A -o json | jq -r '.items[] | (.spec.config|fromjson) as $c | [.metadata.namespace, .metadata.name, $c.type, ($c.bridge // \"-\"), ($c.vlan // \"-\")] | @tsv' | awk 'BEGIN{print \"RESULT\",\"NS\",\"NAME\",\"TYPE\",\"BRIDGE\",\"VLAN\"} {r=\"INFO\"; if($3==\"cnv-bridge\"||$3==\"bridge\") r=\"PASS\"; print r,$0} END{if(NR==0) print \"INFO n/a-nad\"}' | column -t`\nExtra-network inventory is 3.17.3."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "targeted worker nodes and bridge-attached VM interfaces"
impact_detail = "Linux bridge changes are host-network reconfiguration events and can temporarily drop connectivity for affected nodes or VMs during application."

