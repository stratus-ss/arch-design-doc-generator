[[checks]]
check_id = "7.4.tsr.4_8_1_1_1_identification_and_state"
title = "TSR CNV identification and state"
description = "This check is OpenShift Virtualization identity and HyperConverged state: kubevirt-hyperconverged-operator CSV VERSION, and Available/Progressing/Degraded. Compare VERSION to the operator life-cycle policy (doc link). AtLatestKnown / channel currency is 4.8.1.1.2. It is not a running-VM failure."
recommendation = "1. Print kubevirt-hyperconverged-operator CSV VERSION and PHASE. Succeeded = PASS. Missing = INFO n/a-cnv:\n   `oc get csv -n openshift-cnv -o custom-columns=NAME:.metadata.name,VERSION:.spec.version,PHASE:.status.phase 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{next} $1 ~ /^kubevirt-hyperconverged-operator/ {print ($3==\"Succeeded\"?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"VERSION=\"$2, \"PHASE=\"$3; found=1} END{if(!n && !found) print \"INFO n/a-cnv\"}'`\n2. PASS/FAIL HyperConverged Available=True Progressing=False Degraded=False. Missing = INFO n/a-cnv:\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}' 2>&1 | awk -F= '/not found|have a resource type/{print \"INFO n/a-cnv\"; n=1; next} $1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{if(n) exit; if(a==\"\"&&p==\"\"&&d==\"\") print \"INFO n/a-cnv\"; else print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator"
impact_detail = "Recording support state is informational; updating the virt operator rolls operator pods."

