[[checks]]
check_id = "7.4.tsr.4_8_5_2_1_active_alerts"
title = "TSR CNV active alerts"
description = "This check reports firing OpenShift Virtualization alerts such as VMCannotBeEvicted. Those alerts usually mean a VM cannot live-migrate because of a PodDisruptionBudget, node selector, or similar constraint. Related checks that may also report VMCannotBeEvicted: 7.4.tsr.4_8_5_2_3_cnv_vmi_readiness_prometheus (VMI readiness metrics) and 7.6.tsr.6_3_1_active_alerts (cluster-wide Alertmanager). Those are separate TSR questions, not duplicates of this check."
recommendation = "Resolve firing KubeVirt/VMCannot alerts; empty Prometheus output is healthy. For VMCannotBeEvicted, make the VM migratable or relax the PDB. Do not treat this row as the VMI-phase metric."
verification = "1. Print kubevirt / VMCannot alerts only (`state`, `alertname`, `severity`):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.alertname | test(\"KubeVirt|kubevirt|VMCannot\"; \"i\")) | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n      Empty output means none of those alerts are firing.\n2. For `VMCannotBeEvicted`, inspect the VMI and its PDB:\n   `oc get pdb -A`\nVMI readiness metrics are 7.4.tsr.4_8_5_2_3_cnv_vmi_readiness_prometheus. Cluster-wide Alertmanager is 7.6.tsr.6_3_1_active_alerts."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "virtual machines named in firing alerts"
impact_detail = "Investigating alerts does not restart nodes; making a VM migratable may migrate that VM."

