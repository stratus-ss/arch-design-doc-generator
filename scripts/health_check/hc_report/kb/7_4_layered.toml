[[checks]]
check_id = "7.4.tsr.4_8_5_2_1_active_alerts"
title = "TSR CNV active alerts"
description = "This check reports firing OpenShift Virtualization alerts from Prometheus, including alerts such as `VMCannotBeEvicted`. These alerts identify current operational conditions that can affect VM availability, node maintenance, live migration, or the health of virtualization components. `VMCannotBeEvicted` fires when a VM is configured with `evictionStrategy: LiveMigrate` but its active VMI is not migratable. Common causes include non-migratable storage, restrictive placement or affinity rules, insufficient target-node capacity, or disruption constraints such as a PodDisruptionBudget.\n"
recommendation = "Investigate and resolve every firing OpenShift Virtualization alert according to its alert name, labels, and runbook. An empty Prometheus result is healthy: it means no matching alert is currently firing. For VMs that must remain available during node drains, upgrades, or maintenance, retain `evictionStrategy: LiveMigrate` and correct the condition preventing migration. Confirm that the VM uses migratable storage (typically shared RWX storage), has an eligible target node, and is not constrained. If a VM is intentionally non-migratable, set an eviction behavior consistent with its approved maintenance and recovery plan, such as shutdown, rather than leaving it configured for live migration that cannot occur."
verification = "1. Query Prometheus for KubeVirt and VMCannot alerts (prints `state`, `alertname`, `severity`). Empty output means none are firing.\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.alertname | test(\"KubeVirt|kubevirt|VMCannot\"; \"i\")) | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n2. If `VMCannotBeEvicted` is firing, inspect PodDisruptionBudgets for the affected VMI.\n   `oc get pdb -A`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "virtual machines named in firing alerts"
impact_detail = "Investigating alerts does not restart nodes; making a VM migratable may migrate that VM."

