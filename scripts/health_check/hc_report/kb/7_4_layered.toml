[[checks]]
check_id = "7.4.cnv.live_migratable"
title = "VM live-migratable status (engine)"
description = "This finding reads VirtualMachineInstance LiveMigratable conditions and VirtualMachine evictionStrategy. Live-migration network configuration is a separate finding."
recommendation = "Ensure every VMI reports LiveMigratable=True so nodes can drain during maintenance without VM outage. False means a PDB, local disk, or selector constraint is blocking migration — read the reason before changing evictionStrategy. Do not add a migration NAD to fix this; it is a workload constraint."
verification = "1. Print each VMI LiveMigratable status, reason, and message. An empty list means this is not in use (n/a-vmi. False needs review (reason/message is the cause). True is healthy:\n   `oc get vmi -A -o json | jq -r '[\"RESULT\",\"NS\",\"NAME\",\"PHASE\",\"LIVEMIG\",\"REASON\",\"MESSAGE\"], (if (.items|length)==0 then [\"INFO\",\"-\",\"-\",\"-\",\"-\",\"-\",\"n/a-vmi\"] else .items[] | ([.status.conditions[]? | select(.type==\"LiveMigratable\")][0] // {}) as $c | [(if $c.status==\"True\" then \"PASS\" elif $c.status==\"False\" then \"WARNING\" else \"INFO\" end), .metadata.namespace, .metadata.name, (.status.phase // \"-\"), ($c.status // \"-\"), ($c.reason // \"-\"), ($c.message // \"-\")] end) | @tsv' | column -t -s $'\\t'`\n2. Print each VM evictionStrategy. LiveMigrate is healthy. <none> / None / LiveMigrateIfPossible is informational (engine lists those). Dedicated migration network is 4.8.2.1.1.3:\n   `oc get vm -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,EVICTION:.spec.template.spec.evictionStrategy | awk 'NR==1{print \"RESULT\",$0; next} {e=$3; r=\"INFO\"; if(e==\"LiveMigrate\") r=\"PASS\"; print r,$0} END{if(NR==1) print \"INFO n/a-vm\"}'`\nDedicated migration network is 4.8.2.1.1.3."
impact = "workload-shift"
impact_scope = "affected VMs"
impact_detail = "Making a VM live-migratable may require storage, networking, or eviction-policy changes and can require a VM reboot."

[[checks]]
check_id = "7.4.tsr.4_8_1_5_1_1_cnv_operators_node_placement"
title = "TSR CNV operators node placement"
description = "This check is where virt-handler and VM pods may run. HyperConverged spec.infra and spec.workloads nodePlacement pin them (empty = default). On the virt-handler DaemonSet, READY must equal DESIRED and NODE SELECTOR must match that pin. Nodes that should run VMs need kubevirt.io/schedulable=true and a vmx or svm CPU-feature label. virt-launcher is a per-VM pod, not a cluster DaemonSet."
recommendation = "Keep virt-handler Ready equal to Desired on every node that should run VMs, with kubevirt.io/schedulable=true and a vmx or svm CPU-feature label. Empty HyperConverged nodePlacement is the default; a pin must match the DaemonSet selector. Do not relabel nodes until the pin and the DS agree."
verification = "1. Confirm virt-handler when READY equals DESIRED. Missing DS is informational n/a-cnv:\n   `oc get ds virt-handler -n openshift-cnv 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; next} NR==1{next} {print ($4==$2?\"PASS\":\"FAIL\"), \"READY=\"$4, \"DESIRED=\"$2, $1}'`\n2. Print HyperConverged infra and workloads nodeSelector. <none> = default (all nodes matching virt-handler). A map dump is a pin; virt-handler should land on that same selector:\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o custom-columns=NAME:.metadata.name,INFRA_SEL:.spec.infra.nodePlacement.nodeSelector,WORKLOADS_SEL:.spec.workloads.nodePlacement.nodeSelector`\n3. Print kubevirt.io/schedulable and hardware-virt CPU-feature labels (vmx=Intel, svm=AMD). PASS = SCHEDULABLE=true and SVM or VMX is true:\n   `oc get nodes -L kubevirt.io/schedulable -L cpu-feature.node.kubevirt.io/svm -L cpu-feature.node.kubevirt.io/vmx | awk 'NR==1{print \"RESULT\",$0; next} {r=\"FAIL\"; if($6==\"true\" && ($7==\"true\" || $8==\"true\")) r=\"PASS\"; print r,$0}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "CNV infrastructure pods and VM-capable worker nodes"
impact_detail = "Changing schedulable labels or node placement reschedules CNV components and can require VM migration before draining or repurposing nodes."

