# why-rec
# CORRECTED. `oc debug -- mount` is the debug container. Rec uses `chroot /host mount`.
# nconnect/hard are StorageClass mount options when the NFS server supports them.
recommendation = "1. Inspect NFS mounts on workers.\n   `oc debug node/<name> -- chroot /host mount | grep nfs`\n2. If options are default or `nconnect` is missing, set `nconnect` (and `hard`) in the StorageClass mount options when the NFS server supports it.\n3. Remount is a planned change for NFS-backed workloads.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes and workloads using NFS-backed VM storage"
impact_detail = "Correcting NFS mount posture can require remounting or restarting NFS-backed workloads and is safest during a planned window."

