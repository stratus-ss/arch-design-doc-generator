[[checks]]
check_id = "7.4.tsr.4_8_5_2_3_cnv_vmi_readiness_prometheus"
title = "TSR CNV VMI readiness metrics"
description = "This check is Prometheus VMI phase: kubevirt_vmi_phase_count by phase, and kubevirt_vmi_info per VMI. It is not an inventory of running VMs. The finding is COUNT>0 in Pending, Scheduling, Failed, or Unknown. Empty series = no VMI. VMCannotBeEvicted alerts are 4.8.5.2.1. LiveMigratable is 7.4.cnv.live_migratable."
recommendation = "1. Print kubevirt_vmi_phase_count. Pending / Scheduling / Failed / Unknown with COUNT>0 = WARNING. Running (and other phases) = INFO. Empty = INFO n/a-vmi:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=kubevirt_vmi_phase_count' | jq -r '.data.result[] | [.metric.phase, .value[1]] | @tsv' | awk '{r=\"INFO\"; if($1 ~ /Pending|Scheduling|Failed|Unknown/ && $2+0>0) r=\"WARNING\"; print r, \"PHASE=\"$1, \"COUNT=\"$2} END{if(NR==0) print \"INFO n/a-vmi\"}'`\n2. Print each VMI phase from kubevirt_vmi_info. Same WARNING phases. Empty = INFO n/a-vmi:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=kubevirt_vmi_info' | jq -r '.data.result[] | [.metric.namespace, .metric.name, .metric.phase] | @tsv' | awk '{r=\"INFO\"; if($3 ~ /Pending|Scheduling|Failed|Unknown/) r=\"WARNING\"; print r, \"NS=\"$1, \"NAME=\"$2, \"PHASE=\"$3} END{if(NR==0) print \"INFO n/a-vmi\"}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "virtual machines that are not ready"
impact_detail = "Investigating VMI readiness does not reboot nodes; fixing eviction or provisioning issues can migrate or restart individual VMs."

