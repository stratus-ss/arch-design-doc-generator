[[checks]]
check_id = "7.4.quay.pods"
title = "Internal Quay application pods"
description = "This finding is whether each QuayRegistry namespace has a Running application pod whose name contains quay-app or registry-quay-app. QuayRegistry Available and operator pods are a different finding. Supported-configuration lifecycle is not scored here."
recommendation = "Confirm at least one Running quay-app (or registry-quay-app) pod in every namespace that hosts a QuayRegistry, including spec.targetNamespace when set. Restore the registry deployment if only operator pods remain. Missing QuayRegistry is not a failure."
verification = "1. List QuayRegistry objects and their namespaces. If none exist, the command is informational — Quay is not installed.\n   `oc get quayregistry -A`\n2. List pods whose name contains quay-app in registry namespaces. Healthy is PASS when phase is Running and containers are Ready. Zero matching Running pods in an installed registry namespace is a failure.\n   `oc get pods -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase --no-headers 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-quay\"; n=1; next} $2 ~ /quay-app/ {r=\"FAIL\"; if($3==\"Running\") r=\"PASS\"; print r,$0} END{if(!n && NR==0) print \"INFO n/a-quay\"}'`"
priority_hint = "P1"
impact = "non-disruptive"
impact_scope = "QuayRegistry application namespaces"
impact_detail = "Restoring quay-app pods restarts registry traffic in that namespace. It does not reboot cluster nodes."
finding_group = "quay-pods"
finding_group_title = "Internal Quay application pods"

