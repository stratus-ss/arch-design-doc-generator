[[checks]]
check_id = "7.4.tsr.4_8_4_3_windows_hyper_v_enlightenments"
title = "TSR Windows Hyper-V enlightenments"
description = "Hyper-V enlightenments improve Windows guest timekeeping, spinlocks, and I/O on KVM. Windows VMIs without those features run, but with higher overhead and weaker guest integration."
recommendation = "Enable Hyper-V enlightenments on Windows templates, then restart or live-migrate the VMI. An empty HYPERV column means they are off — the VM still runs, just heavier. Do not leave this as a per-VM one-off."
verification = "1. Print each VMI Hyper-V feature flags. An empty list means no VMIs exist. A <none> or empty HYPERV column on a Windows VMI is a warning.\n   `oc get vmi -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,HYPERV:.spec.domain.features.hyperv`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "Windows virtual machines"
impact_detail = "Applying enlightenments typically requires a VM reboot or live migration, not a cluster-node reboot."

