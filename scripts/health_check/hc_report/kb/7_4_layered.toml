[[checks]]
check_id = "7.4.tsr.4_8_4_6_nfs_client_mount_posture"
title = "TSR NFS client mount posture"
description = "This check reviews effective NFS client mount options on OpenShift nodes for NFS storage that backs VM disks. It identifies mounts using default or non-optimized settings, with particular attention to the `nconnect` option. `nconnect` allows a Linux NFS client to establish multiple TCP connections to the same NFS endpoint rather than the traditional single connection, which can increase I/O concurrency and throughput for a single client. The absence of `nconnect` is a performance optimization finding, not proof that the NFS export, StorageClass, CSI driver, or VM disk is unhealthy.\n"
recommendation = "For NFS StorageClasses used for performance-sensitive VM disks, validate `nconnect` with the storage vendor and benchmark a representative workload before adopting it. Where supported and beneficial, configure a consistent tested value (commonly `nconnect=4`, `8`, or `16`) through the supported CSI driver, NFS provisioner, or node configuration mechanism rather than by manually changing live mounts. Start with a conservative value and measure latency, throughput, IOPS, NFS retransmissions, and storage-controller load before scaling it out. The first mount from a node to a given NFS server endpoint establishes the `nconnect` value that subsequent mounts to that endpoint use. Inconsistent mount options can therefore produce unexpected results. Do not remount NFS volumes used by running VM disks simply to add `nconnect`, and do not treat a missing option as an outage. Retain the existing configuration if testing shows no improvement, introduces server contention, or is unsupported by the CSI driver or storage vendor."
verification = "1. Print live NFS mounts on a node in the host mount namespace. Mounts with nconnect in OPTIONS are healthy; those without need review. An empty list means no NFS mounts exist on this node.\n   `oc debug node/<name> --quiet -- nsenter -t 1 -m -- findmnt -t nfs,nfs4 -o SOURCE,TARGET,OPTIONS | awk 'NR==1{print \"RESULT\",$0; next} {r=\"WARNING\"; if($0 ~ /nconnect/) r=\"PASS\"; print r,$0} END{if(NR<=1) print \"INFO n/a-nfs\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes and workloads using NFS-backed VM storage"
impact_detail = "Correcting NFS mount posture can require remounting or restarting NFS-backed workloads and is safest during a planned window."

