recommendation = "1. Check current sysctl values on nodes.\n   `oc debug node/<name> -- sysctl sunrpc.tcp_max_slot_table_entries`\n2. Apply tuning via a `MachineConfig` or the Node Tuning Operator (`Tuned` profile) to set appropriate values for the NFS workload characteristics.\n3. Set the recommended value: `sunrpc.tcp_max_slot_table_entries=128`.\n"
