[[checks]]
check_id = "7.4.tsr.4_1_8_logging_security_context_constraints"
title = "TSR logging security context constraints"
description = "This check compares logging-related Security Context Constraints with the platform defaults, including the SCC used by node-exporter. An edited default SCC can weaken isolation or break logging/monitoring pods."
# why-rec
# CORRECTED. Dumping node-exporter pod YAML is noise. Rec prints the SCC annotation as a
# column.
recommendation = "1. Identify the SCC used by node-exporter pods:\n   `oc get pod -n openshift-monitoring -l app.kubernetes.io/name=node-exporter -o custom-columns=NAME:.metadata.name,SCC:.metadata.annotations.openshift\\.io/scc`\n2. Compare that SCC to the default for the component:\n   `oc get scc -o custom-columns=NAME:.metadata.name,PRIV:.allowPrivilegedContainer`\n3. If the change is undocumented, restore the default SCC.\n4. If the change is required, document the exception and the pods that depend on it.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "pods bound to the altered SCC"
impact_detail = "Restoring or changing an SCC can bounce pods that use it; it does not reboot nodes."

