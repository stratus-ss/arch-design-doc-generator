[[checks]]
check_id = "7.4.tsr.4_8_1_1_2_related_subscriptions"
title = "TSR CNV related subscriptions"
description = "OpenShift Virtualization depends on related operator subscriptions in the virt namespace and in sibling namespaces (for example workload-availability). Missing or degraded subscriptions block CNV features and upgrades."
recommendation = "Keep kubevirt-hyperconverged AtLatestKnown with INSTALLED equal to CURRENT. Missing workload-availability, nmstate, and sriov namespaces are optional add-ons, not a CNV defect. If a required subscription is stuck, complete or approve the InstallPlan before retrying the CSV."
verification = "1. Required: subscription kubevirt-hyperconverged in openshift-cnv (package kubevirt-hyperconverged). PASS = STATE AtLatestKnown and INSTALLED equals CURRENT. Missing namespace is informational n/a-cnv:\n   `oc get subscription -n openshift-cnv -o custom-columns=NAME:.metadata.name,PACKAGE:.spec.name,CHANNEL:.spec.channel,STATE:.status.state,INSTALLED:.status.installedCSV,CURRENT:.status.currentCSV 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{print \"RESULT\",$0; next} {r=\"FAIL\"; if($1==\"kubevirt-hyperconverged\" && $4==\"AtLatestKnown\" && $5==$6) r=\"PASS\"; print r,$0} END{if(!n && NR==1) print \"FAIL missing-kubevirt-hyperconverged\"}'`\n2. Required: CSV kubevirt-hyperconverged-operator.* PHASE=Succeeded:\n   `oc get csv -n openshift-cnv 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{print \"RESULT\",$0; next} $1 ~ /^kubevirt-hyperconverged-operator/ {r=($NF==\"Succeeded\"?\"PASS\":\"FAIL\"); print r,$0; found=1} END{if(!n && !found) print \"FAIL missing-kubevirt-hyperconverged-operator\"}'`\n3. Optional related (INFO if the namespace is missing or empty; if present, score the same AtLatestKnown / Succeeded rules). Expected packages: node-healthcheck-operator, self-node-remediation, fence-agents-remediation, node-maintenance-operator; kubernetes-nmstate-operator; sriov-network-operator:\n   `oc get subscription,csv -n openshift-workload-availability 2>&1 | awk '/No resources found|not found|have a resource type/{print \"INFO n/a-workload-availability\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-workload-availability\"}' && \\\n   oc get subscription,csv -n openshift-nmstate 2>&1 | awk '/No resources found|not found|have a resource type/{print \"INFO n/a-nmstate\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-nmstate\"}' && \\\n   oc get subscription,csv -n openshift-sriov-network-operator 2>&1 | awk '/No resources found|not found|have a resource type/{print \"INFO n/a-sriov\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-sriov\"}'`\n4. If a required row is FAIL, print InstallPlans that are not Complete:\n   `oc get installplan -n openshift-cnv -o custom-columns=NAME:.metadata.name,CSV:.spec.clusterServiceVersionNames,APPROVED:.spec.approved,PHASE:.status.phase | awk 'NR==1{print; next} $4!=\"Complete\"{print; n++} END{if(n+0==0) print \"PASS no-stuck-installplans\"}'`\nHyperConverged Available/Degraded is 7.4.cnv.state. Version/lifecycle is 4.8.1.1.1."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator namespace"
impact_detail = "Approving InstallPlans or reconciling CNV subscriptions rolls operator-managed pods but does not reboot cluster nodes."

