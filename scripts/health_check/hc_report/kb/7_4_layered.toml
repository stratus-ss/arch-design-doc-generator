[[checks]]
check_id = "7.4.tsr.4_8_5_3_5_cdi_image_upload_posture"
title = "TSR CDI image upload posture"
description = "CDI (Containerized Data Importer) manages VM disk image imports and uploads.\nIssues with CDI configuration prevent DataVolume provisioning, blocking new VM\ncreation and disk cloning operations.\n"
recommendation = "1. Check CDI status.\n   `oc get cdi -n openshift-cnv -o yaml`\n2. Review upload proxy health.\n   `oc get pods -n openshift-cnv -l app=cdi-uploadproxy`\n3. Verify the `uploadproxy` route is accessible and TLS certificates are valid.\n4. For slow imports, check network bandwidth between CDI importer pods and the source registry or HTTP endpoint.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "CDI importer and upload components"
impact_detail = "CDI remediation rolls import or upload control pods and affects new image imports or uploads, but not already running VMs."

