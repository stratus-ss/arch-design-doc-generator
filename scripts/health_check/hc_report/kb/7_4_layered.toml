[[checks]]
check_id = "7.4.tsr.4_8_1_5_1_5_vm_run_strategy_and_availability"
title = "TSR VM run strategy and availability"
description = "VM RunStrategy controls how VMs behave during node failures and maintenance.\n`Always` ensures automatic restart on healthy nodes; `Manual` requires operator\nintervention. Production VMs should use `Always` with live migration enabled.\n"
recommendation = "1. Review VM run strategies.\n   `oc get vm -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,STRATEGY:.spec.runStrategy`\n2. For production VMs using `Manual` or `RerunOnFailure`, evaluate whether `Always` with eviction strategy `LiveMigrate` is more appropriate for uptime SLAs.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "virtual machine policy"
impact_detail = "Updating runStrategy or eviction policy changes future failover and maintenance behavior immediately, but it does not reboot nodes or stop running VMs by itself."

