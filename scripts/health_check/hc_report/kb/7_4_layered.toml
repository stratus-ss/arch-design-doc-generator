[[checks]]
check_id = "7.4.tsr.4_8_5_3_1_oadp_operator"
title = "TSR OADP operator"
description = "OADP (OpenShift API for Data Protection) provides backup and restore for VMs and applications. This check verifies that the OADP operator is installed, its CSV (ClusterServiceVersion) is healthy, and the backup infrastructure is properly configured. Failures here mean disaster recovery is not functional."
recommendation = "1. Verify the OADP operator is installed and healthy:\n   `oc get csv -n openshift-adp`\n   The phase should show \"Succeeded\".\n2. Check the DataProtectionApplication CR status:\n   `oc get dpa -n openshift-adp -o yaml`\n3. Ensure a BackupStorageLocation is configured and shows \"Available\":\n   `oc get backupstoragelocation -n openshift-adp`\n4. Test with a trial backup to confirm the pipeline works:\n   `velero backup create test-backup --include-namespaces <test-ns> -n openshift-adp`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-adp backup and restore components"
impact_detail = "Deploying or correcting OADP rolls backup components and adds backup I/O, but it does not reboot nodes or stop running VMs."

