[[checks]]
check_id = "7.4.tsr.4_8_2_2_1_2_network_configuration"
title = "TSR network configuration"
description = "This check verifies that the node network configuration required for virtual machine connectivity is properly set up. It looks for NodeNetworkConfigurationPolicy (NNCP) and NodeNetworkConnectionEnactment (NNCE) resources. Missing or failed network policies mean VMs may not be able to connect to external networks or other VMs."
recommendation = "Validate that the host networking required by VM bridges, VLANs, and secondary networks is present and healthy on every node eligible to run those VMs. Where the configuration is managed through the Kubernetes NMState Operator, confirm that the applicable NodeNetworkConfigurationPolicy resources and their per-node NodeNetworkConfigurationEnactment results are in the SuccessfullyConfigured state; investigate and remediate any failed enactments before scheduling or attaching additional VMs to the affected network. The absence of NNCPs or NNCEs is not, by itself, a finding: the required host networking may have been configured during installation in install-config.yaml, provisioned by another supported mechanism, or may not be required when VMs use only the default overlay network."
verification = "1. List NodeNetworkConfigurationPolicy and NodeNetworkConfigurationEnactment resources.\n   `oc get nncp` and `oc get nnce`\n2. If NNCPs exist but show errors, inspect detailed enactment status.\n   `oc get nnce -o wide`\n3. List all NetworkAttachmentDefinitions for VM network connectivity.\n   `oc get net-attach-def -A`\nIf no NNCP or NNCE exists and the cluster uses only the overlay network, the absence is expected. A failed enactment needs investigation."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "targeted worker-node networking and attached VM interfaces"
impact_detail = "Bridge, SR-IOV, or other host-network changes can interrupt node and VM connectivity while the node networking is reconfigured."
summary_patterns = [
  { contains = "no NNCE found", text = "No NodeNetworkConfigurationEnactment was found for VM node networking." },
]

