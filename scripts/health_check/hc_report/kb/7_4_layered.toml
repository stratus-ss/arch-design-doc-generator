[[checks]]
check_id = "7.4.tsr.4_8_1_3_4_node_disk"
title = "4.8.1.3.4 Default virtualization StorageClass"
description = "This finding is whether a default StorageClass for virtualization workloads exists (annotation storageclass.kubevirt.io/is-default-virt-class), not node root-disk fullness or kubelet DiskPressure. A cluster-wide default StorageClass is a different setting."
recommendation = "Mark exactly one StorageClass with the virt-default annotation for VM disks, and keep a VolumeSnapshotClass whose DRIVER matches that provisioner. Annotate only after you confirm the provisioner. Empty snapshot classes mean snapshots are not in use. Missing virt-default is a problem when VMs need a default disk class."
verification = "1. List StorageClass provisioner and virt-default annotation:\n   `oc get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner,VIRTDEFAULT:.metadata.annotations.storageclass\\.kubevirt\\.io/is-default-virt-class`\n2. Mark the class that should back VM disks:\n   `oc annotate storageclass <name> storageclass.kubevirt.io/is-default-virt-class=true`\n3. Print VolumeSnapshotClass DRIVER. empty or missing CRD means this is not metal (n/a-volumesnapshotclass. Association is DRIVER equals the virt-default PROVISIONER from step 1:\n   `oc get volumesnapshotclass 2>&1 | awk '/No resources found|have a resource type/{print \"INFO n/a-volumesnapshotclass\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-volumesnapshotclass\"}'`\nFAIL is no virt-default class when VMs need one. Empty snapshot classes stay INFO."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "StorageClass annotations for VM disks"
impact_detail = "Setting `storageclass.kubevirt.io/is-default-virt-class` changes which class new VM disks pick. It does not drain nodes or move existing PVCs."

