[[checks]]
check_id = "7.4.tsr.4_8_2_1_1_3_live_migration_network_readiness"
title = "TSR live migration network readiness"
description = "Live migration transfers VM memory over the network. Without a dedicated\nmigration network, large VMs can saturate the cluster network and cause\ntimeouts, migration failures, or collateral impact on other workloads.\n"
recommendation = "1. Verify migration configuration.\n   `oc get kubevirt -n openshift-cnv -o jsonpath='{.items[0].spec.configuration.migrations}'`\n2. For production environments, configure a dedicated migration network using a `NetworkAttachmentDefinition` and set it in the HyperConverged CR.\n3. Ensure bandwidth limits are set to prevent saturation.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "live-migration traffic path and virt-handler pods"
impact_detail = "Adding a dedicated migration network updates HyperConverged migration settings and restarts virt-handler pods; migration traffic then shifts off the primary cluster network."

