check_id = "7.4.tsr.4_8_4_6_nfs_client_mount_posture"
title = "TSR NFS client mount posture"
description = "This check reviews NFS client mount options on nodes. Typical findings are default options or missing nconnect, which limits parallel NFS I/O for VM disks."
recommendation = "Add nconnect on NFS mounts that back VM disks, during a maintenance window. Missing nconnect is a throughput warning, not a broken share. Do not remount a live VM disk without a window."
verification = "1. Print live NFS mounts on a node (host mount namespace). OPTIONS without nconnect needs review. nconnect present is healthy. An empty list means this is not in use (n/a-nfs):\n   `oc debug node/<name> --quiet -- nsenter -t 1 -m -- findmnt -t nfs,nfs4 -o SOURCE,TARGET,OPTIONS | awk 'NR==1{print \"RESULT\",$0; next} {r=\"WARNING\"; if($0 ~ /nconnect/) r=\"PASS\"; print r,$0} END{if(NR<=1) print \"INFO n/a-nfs\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes and workloads using NFS-backed VM storage"
impact_detail = "Correcting NFS mount posture can require remounting or restarting NFS-backed workloads and is safest during a planned window."

