[[checks]]
check_id = "7.4.tsr.4_8_1_5_3_2_storage_checkup"
title = "TSR CNV storage checkup"
description = "This check reviews the result of the Kiagnose kubevirt-storage checkup, which validates that OpenShift Virtualization can provision and bind a test PersistentVolumeClaim (PVC) through the selected storage class. A successful checkup records `status.succeeded=true` and confirms that the test PVC was bound (`status.result.pvcBound`). The checkup result is stored in its ConfigMap; if the ConfigMap is absent, the storage checkup has not been run and the result is informational rather than evidence of a storage outage. Cluster-wide PVC health, the default StorageClass, and StorageProfile configuration are assessed separately.\n"
recommendation = "Treat `status.succeeded=true` with a bound test PVC as confirmation that the tested storage path is functioning for OpenShift Virtualization. If the checkup reports failure or the PVC does not bind, review `status.failureReason`. If no Kiagnose checkup ConfigMap exists, run the OpenShift Virtualization storage checkup when validation is required—especially after storage changes, CSI-driver updates, or an OpenShift upgrade. Do not classify a missing ConfigMap as a storage failure; it only indicates that this specific validation has not yet been performed."
verification = "1. Print the kubevirt-storage checkup ConfigMap results: SUCCEEDED, PVCBBOUND, and FAILURE. A value of true for SUCCEEDED is healthy; false needs action. If the ConfigMap does not exist, the checkup has never been run.\n   `oc get cm -A -l kiagnose/checkup-type=kubevirt-storage -o json | jq -r '.items[] | [.metadata.namespace, .metadata.name, (.data[\"status.succeeded\"] // \"-\"), (.data[\"status.result.pvcBound\"] // \"-\"), (if (.data[\"status.failureReason\"] // \"\") == \"\" then \"-\" else .data[\"status.failureReason\"] end)] | @tsv' | awk -F'\\t' '{r=\"INFO\"; if($3==\"true\") r=\"PASS\"; else if($3==\"false\") r=\"FAIL\"; print r, \"NS=\"$1, \"NAME=\"$2, \"SUCCEEDED=\"$3, \"PVCBBOUND=\"$4, \"FAILURE=\"$5} END{if(NR==0) print \"INFO n/a-storage-checkup\"}'`\n2. If this validation is required and the ConfigMap is missing, run the OpenShift Virtualization storage checkup using the procedure in the reference for this check."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "PVCs created by the storage checkup"
impact_detail = "Reading checkup results does not reboot nodes; re-running the checkup creates short-lived test VMs and PVCs."

