[[checks]]
check_id = "7.4.tsr.4_8_1_1_1_identification_and_state"
title = "TSR CNV identification and state"
description = "This check verifies the OpenShift Virtualization control plane by reviewing the kubevirt-hyperconverged-operator CSV version and phase, along with the HyperConverged resource conditions. The expected healthy state is a Succeeded CSV with `Available=True`, `Progressing=False`, and `Degraded=False`. The absence of the openshift-cnv namespace indicates that OpenShift Virtualization is not installed and is recorded as N/A, not a VM failure.\n"
recommendation = "Ensure the kubevirt-hyperconverged-operator CSV is Succeeded and the HyperConverged resource reports `Available=True`, `Progressing=False`, and `Degraded=False`. Review the HyperConverged condition messages, related CSV/Subscription status, component pods, events, and logs to resolve failures."
verification = "1. Print kubevirt-hyperconverged-operator CSV VERSION and PHASE. Succeeded is healthy. If the namespace does not exist, Virtualization is not installed.\n   `oc get csv -n openshift-cnv -o custom-columns=NAME:.metadata.name,VERSION:.spec.version,PHASE:.status.phase 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{next} $1 ~ /^kubevirt-hyperconverged-operator/ {print ($3==\"Succeeded\"?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"VERSION=\"$2, \"PHASE=\"$3; found=1} END{if(!n && !found) print \"INFO n/a-cnv\"}'`\n2. Confirm HyperConverged conditions: `Available=True`, `Progressing=False`, `Degraded=False`. If the resource does not exist, Virtualization is not installed.\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}' 2>&1 | awk -F= '/not found|have a resource type/{print \"INFO n/a-cnv\"; n=1; next} $1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{if(n) exit; if(a==\"\"&&p==\"\"&&d==\"\") print \"INFO n/a-cnv\"; else print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator"
impact_detail = "Recording support state is informational; updating the virt operator rolls operator pods."

