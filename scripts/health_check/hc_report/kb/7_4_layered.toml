[[checks]]
check_id = "7.4.cnv.migration_network"
title = "Live migration network"
description = "This check evaluates which network the HyperConverged resource uses for live-migration traffic. An empty value uses the default pod network. A named network must exist as a NetworkAttachmentDefinition in openshift-cnv. Guest LiveMigratable False is a separate finding."
recommendation = "Set HyperConverged live-migration network to a NAD that exists in openshift-cnv, or leave it empty to use the default pod network. Create the NAD or clear the pin if the named network is missing."
verification = "1. Print the HyperConverged live-migration network name. A value of <none> means the default pod network is in use. If the HyperConverged resource does not exist, Virtualization is not installed.\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o custom-columns=NAME:.metadata.name,NETWORK:.spec.liveMigrationConfig.network 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; next} NR==1{next} {n=$2; if(n==\"<none>\"||n==\"\") print \"INFO NETWORK=<none>\", $1; else print \"NETWORK=\"n, $1}'`\n2. List NADs in openshift-cnv. If step 1 named a network, that name must appear here; a missing NAD needs action.\n   `oc get net-attach-def -n openshift-cnv`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "live-migration traffic path and virt-handler pods"
impact_detail = "Adding a dedicated migration network updates HyperConverged migration settings and restarts virt-handler pods; migration traffic then shifts off the primary cluster network."
