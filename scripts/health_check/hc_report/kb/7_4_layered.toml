verification = "1. Confirm CDI conditions: `Available=True`, `Progressing=False`, `Degraded=False`. If the CDI resource does not exist, it is informational.\n   `oc get cdi -n openshift-cnv -o jsonpath='{range .items[*]}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}{end}' 2>&1 | awk -F= '/not found|No resources found|have a resource type/{print \"INFO n/a-cdi\"; n=1; next} $1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{if(n) exit; if(a==\"\"&&p==\"\"&&d==\"\") print \"INFO n/a-cdi\"; else print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`\n2. Confirm cdi-uploadproxy pods are Ready.\n   `oc get pods -n openshift-cnv -l app=cdi-uploadproxy`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "CDI importer and upload components"
impact_detail = "CDI remediation rolls import or upload control pods and affects new image imports or uploads, but not already running VMs."

