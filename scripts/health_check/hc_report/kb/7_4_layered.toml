[[checks]]
check_id = "7.4.tsr.4_8_4_5_host_kernel_bsod_indicators"
title = "TSR host kernel crash indicators"
description = "Kernel panics or BSOD-equivalent events on nodes indicate hardware failures,\ndriver issues, or critical kernel bugs. Affected nodes are unreliable and may\ncause VM disruption without warning.\n"
recommendation = "Immediately cordon any VM host showing kernel panics, oopses, or `BUG` events to prevent new workload placement, then safely migrate or recover affected VMs as appropriate. Review BMC/iDRAC/iLO hardware logs, node journals, and `NodeNotReady` or reboot events before applying kernel, driver, or firmware remediation. Keep the node out of VM scheduling until the root cause is resolved and the host remains stable through validation. A clean journal with no related reboot or `NodeNotReady` events indicates no current evidence of this condition."
verification = "1. Search node journals for kernel panic, oops, or BUG messages. Empty output is healthy.\n   `oc adm node-logs <node> --path=journal | grep -iE 'panic|oops|BUG:'`\n2. List `NodeNotReady` events that may indicate unexpected reboots. Correlate any results with hits from step 1.\n   `oc get events -A --field-selector reason=NodeNotReady`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "affected VM-hosting nodes"
impact_detail = "Kernel or hardware remediation commonly requires cordon, drain, reboot, or replacement of the node, forcing VM migration or downtime if migration is unavailable."

