[[checks]]
check_id = "7.4.tsr.4_8_2_1_1_3_live_migration_network_readiness"
title = "TSR live migration network readiness"
description = "This check is HyperConverged spec.liveMigrationConfig.network: the NAD in openshift-cnv used for live-migration traffic. Empty = default pod network. A named network must exist as a NAD. VM LiveMigratable (PDB, disk, node selector) is 7.4.cnv.live_migratable. Capacity headroom is 4.8.2.1.1.6."
recommendation = "1. Print HyperConverged live-migration NAD. <none> = INFO (default pod network). Missing HCO = INFO n/a-cnv, stop:\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o custom-columns=NAME:.metadata.name,NETWORK:.spec.liveMigrationConfig.network 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; next} NR==1{next} {n=$2; if(n==\"<none>\"||n==\"\") print \"INFO NETWORK=<none>\", $1; else print \"NETWORK=\"n, $1}'`\n2. Print NADs in openshift-cnv. If step 1 named a network, PASS when that NAME is here; missing NAD = FAIL:\n   `oc get net-attach-def -n openshift-cnv`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "live-migration traffic path and virt-handler pods"
impact_detail = "Adding a dedicated migration network updates HyperConverged migration settings and restarts virt-handler pods; migration traffic then shifts off the primary cluster network."

