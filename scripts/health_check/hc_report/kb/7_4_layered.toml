[[checks]]
check_id = "7.4.tsr.4_8_4_9_smbios_baseboard_serial_posture"
title = "4.8.4.9. SMBIOS Baseboard Serial Posture"
description = "KubeVirt does not copy the worker node's SMBIOS baseboard serial into the guest by default. Some Windows activation and ISV license tools read firmware serial and UUID. Missing `spec.template.spec.domain.firmware.serial` and `uuid` on a VirtualMachine is a guest-identity gap only when those tools require it."
recommendation = "Set `spec.template.spec.domain.firmware.serial` and `spec.template.spec.domain.firmware.uuid` on a Windows VirtualMachine only when licensing or activation needs a stable firmware identity. Do not mass-edit every VM to clear the check. Do not expect the hypervisor host baseboard serial to appear in the guest (KCS 7144584). If no Windows VMs exist, this check is informational."
verification = """1. List VirtualMachines and firmware serial and uuid. Empty VM list is INFO.
   `oc get vm -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,SERIAL:.spec.template.spec.domain.firmware.serial,UUID:.spec.template.spec.domain.firmware.uuid`
2. If a licensing tool still fails after serial/uuid are set, check the guest SMBIOS from inside the VM; host `dmidecode` on the worker is not the guest identity."""
priority_hint = ""
finding_on_info = false
impact = "non-disruptive"
impact_scope = "selected VirtualMachine firmware fields"
impact_detail = "Changing firmware serial or uuid can require a VM reboot for the guest to see the new identity."

