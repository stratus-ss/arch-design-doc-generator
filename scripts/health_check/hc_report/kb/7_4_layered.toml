[[checks]]
check_id = "7.4.tsr.4_8_3_1_1_storage_profiles"
title = "TSR storage profiles"
description = "This check is CDI StorageProfile defaults per StorageClass: cloneStrategy (copy, csi-clone, or snapshot) and claimPropertySets (accessModes, volumeMode). copy is host-assisted clone. Empty spec means CDI inferred the status values. VolumeSnapshotClass DRIVER vs provisioner is 4.8.1.3.4."
recommendation = "Set StorageProfile cloneStrategy to snapshot or csi-clone when the backend supports it; leave copy only as accepted slow host-assisted clone. Override empty spec only when CDI inferred the wrong strategy."
verification = "1. Print StorageProfile provisioner, effective clone strategy, spec override, and snapshotClass. copy needs review (host-assisted). snapshot or csi-clone is healthy. empty or missing CRD means this is not metal (n/a-storageprofile, stop:\n   `oc get storageprofile -o custom-columns=NAME:.metadata.name,PROVISIONER:.status.provisioner,CLONE:.status.cloneStrategy,SPEC_CLONE:.spec.cloneStrategy,SNAPCLASS:.spec.snapshotClass 2>&1 | awk '/have a resource type|No resources found/{print \"INFO n/a-storageprofile\"; n=1; next} NR==1{print \"RESULT\",$0; next} {c=$3; r=\"INFO\"; if(c==\"copy\") r=\"WARNING\"; else if(c==\"csi-clone\"||c==\"snapshot\") r=\"PASS\"; print r,$0} END{if(!n && NR==0) print \"INFO n/a-storageprofile\"}'`\n2. Print claimPropertySets accessModes and volumeMode (named fields, not a map dump):\n   `oc get storageprofile -o json | jq -r '[\"NAME\",\"ACCESS\",\"VOLMODE\"], (.items[] as $sp | ($sp.status.claimPropertySets // [{}])[] as $claim | [$sp.metadata.name, (($claim.accessModes // []) | join(\",\") | if .==\"\" then \"-\" else . end), ($claim.volumeMode // \"-\")]) | @tsv' | column -t -s $'\\t'`\nVolumeSnapshotClass DRIVER vs provisioner is 4.8.1.3.4."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "new DataVolumes and VM disk defaults"
impact_detail = "StorageProfile changes affect future imports, clones, and PVC defaults; existing volumes and running VMs continue unchanged."

