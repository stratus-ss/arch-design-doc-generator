[[checks]]
check_id = "7.4.tsr.4_1_5_2_loki_health"
title = "TSR Loki health"
description = "Loki health cannot be verified until a LokiStack instance exists. A FAIL for no instance configuration is a configuration gap, not a degraded running store."
recommendation = "1. Check for a LokiStack.\n   `oc get lokistack -A`\n2. Configure logging and LokiStack storage before treating Loki health as a runtime failure.\n3. After an instance exists, re-run health by inspecting LokiStack conditions.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "LokiStack operands"
impact_detail = "Configuring LokiStack deploys store components and can briefly interrupt log query until they become ready."
summary_patterns = [
  { contains = "no instance configuration", text = "Loki health cannot be verified because no LokiStack is configured." },
]
finding_group = "logging-not-configured"
finding_group_title = "Cluster logging is not configured (no LokiStack)"

