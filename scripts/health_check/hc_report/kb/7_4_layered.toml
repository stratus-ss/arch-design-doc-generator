[[checks]]
check_id = "7.4.tsr.4_8_3_2_3_linux_bridge_network"
title = "TSR Linux bridge network"
description = "This check inventories Linux-bridge VM network attachments. A Linux-bridge attachment is represented by a NetworkAttachmentDefinition (NAD) using the `cnv-bridge` or `bridge` CNI type, with a bridge name and, optionally, VLAN configuration. The referenced host bridge must exist on every node that may run a VM using that NAD. An NMState NodeNetworkConfigurationPolicy (NNCP) and its NodeNetworkConfigurationEnactment (NNCE) provide evidence that the bridge was configured and successfully applied through NMState. However, they are not required when the bridge was created during cluster installation or is otherwise managed outside NMState.\n"
recommendation = "For every required Linux-bridge VM network, ensure the `cnv-bridge` or `bridge` NAD references a host bridge that exists and is operational on all eligible VM nodes. Confirm that its bridge name, physical uplink or bond, VLAN design, node placement, and VM scheduling constraints are consistent. Use an NNCP as the preferred, declarative day-2 method to create or maintain the bridge, and require a successful NNCE when NMState manages it. If the bridge was configured through `install-config.yaml` during installation or another approved host-configuration method, treat the absence of an NNCP as informational and not a failure."
verification = "1. List NNCE resources. If the CRD is missing or empty, host bridges are not enacted here.\n   `oc get nnce 2>&1 | awk '/have a resource type|No resources found/{print \"INFO n/a-nnce\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-nnce\"}'`\n2. Print each NAD TYPE, BRIDGE, and VLAN. A type of cnv-bridge or bridge is healthy; other types are informational. An empty list means no NADs exist.\n   `oc get net-attach-def -A -o json | jq -r '.items[] | (.spec.config|fromjson) as $c | [.metadata.namespace, .metadata.name, $c.type, ($c.bridge // \"-\"), ($c.vlan // \"-\")] | @tsv' | awk 'BEGIN{print \"RESULT\",\"NS\",\"NAME\",\"TYPE\",\"BRIDGE\",\"VLAN\"} {r=\"INFO\"; if($3==\"cnv-bridge\"||$3==\"bridge\") r=\"PASS\"; print r,$0} END{if(NR==0) print \"INFO n/a-nad\"}' | column -t`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "targeted worker nodes and bridge-attached VM interfaces"
impact_detail = "Linux bridge changes are host-network reconfiguration events and can temporarily drop connectivity for affected nodes or VMs during application."

