[[checks]]
check_id = "7.4.tsr.4_8_1_3_4_node_disk"
title = "TSR node disk health"
description = "This check monitors disk space on nodes that host virtual machines. When a node's disk usage is high, Kubernetes may start evicting pods and VMs to free space. VM disk images, container images, and ephemeral storage all compete for the same node filesystem."
recommendation = "1. Check which nodes are under disk pressure:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,DISK_PRESSURE:.status.conditions[?(@.type==\"DiskPressure\")].status`\n2. On affected nodes, identify the largest disk consumers:\n   `oc debug node/<node> -- chroot /host df -h`\n3. Common remediation options:\n   - Move VM disks to a dedicated StorageClass (e.g. Ceph, NFS, or local-path)\n   - Clean up unused container images: `oc adm node-logs <node> -u kubelet | grep -i garbage`\n   - Expand the node's root filesystem if the underlying infrastructure allows it\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "VM-hosting worker nodes and attached VMs"
impact_detail = "Freeing node capacity often requires evacuating VMs, moving disks, or rescheduling workloads away from pressured nodes."

