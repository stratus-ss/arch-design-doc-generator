[[checks]]
check_id = "7.4.tsr.4_8_5_1_1_quota_and_resources"
title = "TSR CNV quota and resources"
description = "ResourceQuotas and LimitRanges in namespaces running VMs must account for\nvirt-launcher pod overhead. Insufficient quotas prevent VM starts and live\nmigrations.\n"
recommendation = "1. Review quotas in VM namespaces.\n   `oc get resourcequota -n <ns>`\n2. Confirm quotas account for `virt-launcher` pod requests, typically 1 CPU per vCPU plus overhead memory.\n3. For live migration, ensure quotas allow at least 2x the resources of the largest VM to accommodate the migration target pod.\n"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "VM namespaces and admission control"
impact_detail = "Quota changes take effect immediately for new VM starts or migrations, but they do not restart nodes or stop already running VMs."

