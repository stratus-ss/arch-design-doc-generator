[[checks]]
check_id = "7.4.tsr.4_8_3_2_2_sr_iov_operator"
title = "TSR SR-IOV operator"
description = "This check verifies whether the SR-IOV Network Operator is installed and available. The operator manages SR-IOV-capable NICs by configuring Physical Functions (PFs), creating Virtual Functions (VFs), and applying `SriovNetworkNodePolicy` resources to selected nodes. If the `openshift-sriov-network-operator` namespace or its `ClusterServiceVersion` (CSV) is missing, SR-IOV is not installed; this is an absence of an optional capability, not necessarily a configuration failure.\n"
recommendation = "Treat a missing SR-IOV namespace or CSV as not applicable unless the cluster design requires VFs for workloads, low-latency networking, or VM passthrough. If SR-IOV is required, install the SR-IOV Network Operator through OperatorHub or a supported Subscription, confirm its CSV reaches **Succeeded**, and create `SriovNetworkNodePolicy` resources that match the target nodes and supported NIC PFs. Do not use SR-IOV-related resources found in unrelated namespaces as evidence that the operator is installed. Validate installation from the operator namespace, then verify the policy status, discovered interfaces, allocated VFs, and the NetworkAttachmentDefinitions consumed by the intended pods or virtual machines."
verification = "1. Search for an SR-IOV namespace and CSV. If none is found, SR-IOV is not installed — treat as informational unless the design requires it.\n   `oc get csv,ns | grep -i sriov`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "SR-IOV-capable worker nodes and attached VMs/pods"
impact_detail = "Updating SR-IOV policies reprovisions virtual functions on the NIC and can interrupt workloads attached to those interfaces until reconciliation completes."

