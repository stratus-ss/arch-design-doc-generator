[[checks]]
check_id = "7.4.tsr.4_8_1_1_2_related_subscriptions"
title = "TSR CNV related subscriptions"
description = "OpenShift Virtualization depends on related operator subscriptions in the virt namespace and in sibling namespaces (for example workload-availability). Missing or degraded subscriptions block CNV features and upgrades."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: OpenShift Virtualization depends on related operator subscriptions in the virt
# namespace and in sibling namespaces (for example workload-availability).
# The rec remediates THAT story by starting at `oc get csv,subscription -A` — the live
# object/command for this check, not a neighboring TSR item.
# Impact `non-disruptive`: Approving InstallPlans or reconciling CNV subscriptions rolls
# operator-managed pods but does not reboot cluster nodes.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. List CSVs and subscriptions in `openshift-cnv` and related operator namespaces named in the evidence.\n   `oc get csv,subscription -A`\n2. Confirm HyperConverged conditions are healthy.\n3. Resolve failed InstallPlans before upgrading.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator namespace"
impact_detail = "Approving InstallPlans or reconciling CNV subscriptions rolls operator-managed pods but does not reboot cluster nodes."

