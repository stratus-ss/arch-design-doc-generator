[[checks]]
check_id = "7.4.cnv.live_migratable"
title = "VM live-migratable status (engine)"
description = "This finding reads VirtualMachineInstance LiveMigratable conditions and VirtualMachine `evictionStrategy`. Live-migration network configuration is a separate finding."
recommendation = "Ensure every VMI reports `LiveMigratable=True` so nodes can drain during maintenance without VM outage. False means a PDB, local disk, or selector constraint is blocking migration — read the reason before changing `evictionStrategy`. Do not add a migration NAD to fix this; it is a workload constraint."
verification = "1. Print each VMI LiveMigratable condition with reason and message. An empty list means no VMIs exist. False needs review — the reason and message explain the constraint.\n   `oc get vmi -A -o json | jq -r '[\"RESULT\",\"NS\",\"NAME\",\"PHASE\",\"LIVEMIG\",\"REASON\",\"MESSAGE\"], (if (.items|length)==0 then [\"INFO\",\"-\",\"-\",\"-\",\"-\",\"-\",\"n/a-vmi\"] else .items[] | ([.status.conditions[]? | select(.type==\"LiveMigratable\")][0] // {}) as $c | [(if $c.status==\"True\" then \"PASS\" elif $c.status==\"False\" then \"WARNING\" else \"INFO\" end), .metadata.namespace, .metadata.name, (.status.phase // \"-\"), ($c.status // \"-\"), ($c.reason // \"-\"), ($c.message // \"-\")] end) | @tsv' | column -t -s $'\\t'`\n2. Print each VM `evictionStrategy`. LiveMigrate is the expected production value; other strategies are informational.\n   `oc get vm -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,EVICTION:.spec.template.spec.evictionStrategy | awk 'NR==1{print \"RESULT\",$0; next} {e=$3; r=\"INFO\"; if(e==\"LiveMigrate\") r=\"PASS\"; print r,$0} END{if(NR==1) print \"INFO n/a-vm\"}'`"
impact = "workload-shift"
impact_scope = "affected VMs"
impact_detail = "Making a VM live-migratable may require storage, networking, or eviction-policy changes and can require a VM reboot."

[[checks]]
check_id = "7.4.cnv.node_placement"
title = "CNV operators node placement"
description = "This check compares virt-handler DaemonSet readiness with worker node `kubevirt.io/schedulable` labels. Empty HyperConverged nodePlacement uses platform default scheduling and is not a failure. CPU virtualization flags are not scored here."
recommendation = "Align virt-handler DaemonSet readiness with nodes intended to host VMs. Ensure every non-control-plane node that should run VMs has `kubevirt.io/schedulable=true`. For READY not equal to DESIRED, identify the affected nodes and resolve the scheduling or runtime cause. Control-plane-only compact clusters do not fail for missing worker schedulable labels."
verification = "1. Confirm virt-handler DaemonSet READY equals DESIRED. If the DS does not exist, Virtualization is not installed.\n   `oc get ds virt-handler -n openshift-cnv 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; next} NR==1{next} {print ($4==$2?\"PASS\":\"FAIL\"), \"READY=\"$4, \"DESIRED=\"$2, $1}'`\n2. Print kubevirt.io/schedulable on nodes. Worker nodes intended for VMs should show true.\n   `oc get nodes -L kubevirt.io/schedulable`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "CNV infrastructure pods and VM-capable worker nodes"
impact_detail = "Changing schedulable labels or node placement reschedules CNV components and can require VM migration before draining or repurposing nodes."
finding_group = "cnv-node-placement"
finding_group_title = "CNV operators node placement"

