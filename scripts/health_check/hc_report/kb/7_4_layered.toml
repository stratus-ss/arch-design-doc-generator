verification = "1. Print `ForkliftController` conditions. Missing CR or namespace is informational. `Ready=False` or degraded conditions is a failure.\n   `oc get forkliftcontroller -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}{end}'`\n2. Inspect MTV operand pods. Non-Running pods are a failure.\n   `oc get pods -n openshift-mtv`"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "MTV controller pods"
impact_detail = "Fixing `ForkliftController` rolls MTV control-plane pods, not cluster nodes or guest VMs."

