title = "TSR OADP operator"
description = "This check evaluates OADP / backup operator posture. Evidence may show a healthy OLM CSV in `openshift-adp`, or no CSV, OperatorGroup, or Subscription because the stack was installed outside OLM (Helm or manual)."
recommendation = "Verify that the cluster's intended backup solution is deployed, healthy, and capable of protecting the workloads it is responsible for. If OADP is the selected platform, confirm its health using the installation method in use: an OLM-managed deployment should have a Succeeded OADP CSV, while Helm- or manually deployed Velero/OADP should have an available DataProtectionApplication and functional BackupStorageLocation in the namespace where it is installed, which might not be openshift-adp. Do not treat missing OADP CSV, Subscription, or OperatorGroup resources as a failure when OADP is not used, is installed outside OLM, or another supported backup product fulfills the cluster backup requirement."
verification = "1. Search for OADP or Velero OLM resources (CSV, Subscription, OperatorGroup). If none are found, record the result as informational unless the documented backup design requires OADP.\n   `oc get csv,subscription,operatorgroup -A | grep -i -E 'oadp|velero|adp'`\nFor an OLM-managed deployment, the OADP CSV must be Succeeded; any other phase is a failure. A DataProtectionApplication or BackupStorageLocation that is not Available is also a failure when OADP is the designated backup platform."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-adp backup and restore components"
impact_detail = "Deploying or correcting OADP rolls backup components and adds backup I/O, but it does not reboot nodes or stop running VMs."
