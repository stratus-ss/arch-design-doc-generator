[[checks]]
check_id = "7.4.tsr.4_8_4_7_nfs_client_sysctl_posture"
title = "TSR NFS client sysctl posture"
description = "This check evaluates NFS client concurrency limits on OpenShift nodes that mount NFS-backed storage. It reviews the RPC slot-table and NFSv4 session-slot parameters (primarily `sunrpc.tcp_max_slot_table_entries` and `nfs.max_session_slots`) which limit the number of in-flight NFS operations a node can issue. Low effective limits can constrain throughput and increase queueing for high-IOPS VM disks, even when the network and NFS server have available capacity.\n"
recommendation = "First capture the live values, NFS protocol versions, mount options, and workload behavior on representative VM worker nodes. For an NFSv3 workload, tune the applicable `sunrpc` TCP slot-table settings only to the storage vendor's documented per-connection limit. For NFSv4.1, use `nfs.max_session_slots` no higher than the NFS server supports. Apply approved sysctl tuning through the Node Tuning Operator and a targeted Tuned profile where possible, so the setting is declarative and limited to the worker nodes mounting the relevant NFS storage. Because these limits may affect only mounts established after the setting is applied, schedule changes with a maintenance window, controlled VM migration, or restart/remount plan."
verification = "1. Read the sunrpc.tcp_max_slot_table_entries sysctl on a node. Command failure or no NFS nodes is informational. A value below 128 (or the vendor recommendation) is a warning.\n   `oc debug node/<name> -- chroot /host sysctl sunrpc.tcp_max_slot_table_entries`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes using NFS-backed virtualization workloads"
impact_detail = "Tuned profiles can apply live, but MachineConfig-based sysctl changes drain and reboot nodes; treat this as planned node-by-node remediation."

