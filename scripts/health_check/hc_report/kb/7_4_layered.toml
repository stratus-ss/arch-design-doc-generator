[[checks]]
check_id = "7.4.cnv.storageprofile"
title = "CDI storage profiles"
description = "This check scores CDI StorageProfile `status.cloneStrategy` for each StorageClass. Host-assisted `copy` is a warning. `snapshot` and `csi-clone` are healthy. An empty list is informational. A missing StorageProfile API is not applicable. `spec.cloneStrategy` and snapshotClass are evidence only. Virt-default StorageClass annotation is a separate finding."
recommendation = "Prefer `snapshot` or `csi-clone` for StorageClasses that support the corresponding CSI capability and are used for VM disks, templates, or frequent DataVolume clones. These methods avoid host-assisted data transfer and generally reduce clone time and cluster network or node-resource consumption. Keep `copy` only where the CSI driver does not support snapshots or CSI cloning, or where the required VolumeSnapshotClass is unavailable or does not match the StorageClass provisioner. Do not force a clone strategy solely to clear this warning: an unsupported `snapshot` or `csi-clone` configuration can cause DataVolume imports and VM cloning operations to fail."
verification = "1. Print StorageProfile provisioner, effective clone strategy, and snapshotClass. A strategy of snapshot or csi-clone is healthy; copy means host-assisted cloning. If the CRD is missing or empty, the command prints **INFO**.\n   `oc get storageprofile -o custom-columns=NAME:.metadata.name,PROVISIONER:.status.provisioner,CLONE:.status.cloneStrategy,SPEC_CLONE:.spec.cloneStrategy,SNAPCLASS:.spec.snapshotClass 2>&1 | awk '/have a resource type|No resources found/{print \"INFO n/a-storageprofile\"; n=1; next} NR==1{print \"RESULT\",$0; next} {c=$3; r=\"INFO\"; if(c==\"copy\") r=\"WARNING\"; else if(c==\"csi-clone\"||c==\"snapshot\") r=\"PASS\"; print r,$0} END{if(!n && NR==0) print \"INFO n/a-storageprofile\"}'`\n2. Print claimPropertySets accessModes and volumeMode per StorageProfile.\n   `oc get storageprofile -o json | jq -r '[\"NAME\",\"ACCESS\",\"VOLMODE\"], (.items[] as $sp | ($sp.status.claimPropertySets // [{}])[] as $claim | [$sp.metadata.name, (($claim.accessModes // []) | join(\",\") | if .==\"\" then \"-\" else . end), ($claim.volumeMode // \"-\")]) | @tsv' | column -t -s $'\\t'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "new DataVolumes and VM disk defaults"
impact_detail = "StorageProfile changes affect future imports, clones, and PVC defaults; existing volumes and running VMs continue unchanged."
finding_group = "cnv-storageprofile"
finding_group_title = "CDI storage profiles"

