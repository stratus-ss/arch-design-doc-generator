[[checks]]
check_id = "7.4.tsr.4_8_1_1_2_related_subscriptions"
title = "TSR CNV related subscriptions"
description = "OpenShift Virtualization depends on related operator subscriptions in the virt namespace and in sibling namespaces (for example workload-availability). Missing or degraded subscriptions block CNV features and upgrades."
recommendation = "Keep the kubevirt-hyperconverged Subscription at `AtLatestKnown` with installedCSV matching currentCSV. Treat absent workload-availability, NMState, or SR-IOV namespaces as optional integration components unless the virtualization design requires them. For a stalled required subscription, review and complete or approve its `InstallPlan`, then confirm the CSV reaches Succeeded."
verification = "1. List the Virtualization operator subscription in openshift-cnv. Healthy when STATE is `AtLatestKnown` and INSTALLED matches CURRENT. If that namespace does not exist, the command prints **INFO** — Virtualization is not installed.\n   `oc get subscription -n openshift-cnv -o custom-columns=NAME:.metadata.name,PACKAGE:.spec.name,CHANNEL:.spec.channel,STATE:.status.state,INSTALLED:.status.installedCSV,CURRENT:.status.currentCSV 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{print \"RESULT\",$0; next} {r=\"FAIL\"; if($1==\"kubevirt-hyperconverged\" && $4==\"AtLatestKnown\" && $5==$6) r=\"PASS\"; print r,$0} END{if(!n && NR==1) print \"FAIL missing-kubevirt-hyperconverged\"}'`\n2. Print the kubevirt-hyperconverged-operator CSV. Succeeded PHASE is healthy; any other phase is a failure.\n   `oc get csv -n openshift-cnv 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{print \"RESULT\",$0; next} $1 ~ /^kubevirt-hyperconverged-operator/ {r=($NF==\"Succeeded\"?\"PASS\":\"FAIL\"); print r,$0; found=1} END{if(!n && !found) print \"FAIL missing-kubevirt-hyperconverged-operator\"}'`\n3. List optional related subscriptions in workload-availability, nmstate, and sriov namespaces. If a namespace does not exist, the command prints **INFO** and moves on.\n   `oc get subscription,csv -n openshift-workload-availability 2>&1 | awk '/No resources found|not found|have a resource type/{print \"INFO n/a-workload-availability\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-workload-availability\"}' && \\\n   oc get subscription,csv -n openshift-nmstate 2>&1 | awk '/No resources found|not found|have a resource type/{print \"**INFO** n/a-nmstate\"; `n=1`; next} {print} END{if(!n && NR==0) print \"**INFO** n/a-nmstate\"}' && \\\n   oc get subscription,csv -n openshift-sriov-network-operator 2>&1 | awk '/No resources found|not found|have a resource type/{print \"**INFO** n/a-sriov\"; `n=1`; next} {print} END{if(!n && NR==0) print \"**INFO** n/a-sriov\"}'`\n4. If a required subscription failed, list `InstallPlan`s that are not Complete.\n   `oc get installplan -n openshift-cnv -o custom-columns=NAME:.metadata.name,CSV:.spec.clusterServiceVersionNames,APPROVED:.spec.approved,PHASE:.status.phase | awk 'NR==1{print; next} $4!=\"Complete\"{print; n++} END{if(n+0==0) print \"PASS no-stuck-installplans\"}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator namespace"
impact_detail = "Approving `InstallPlan`s or reconciling CNV subscriptions rolls operator-managed pods but does not reboot cluster nodes."

