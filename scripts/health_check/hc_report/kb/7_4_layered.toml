title = "TSR MTV installation and state"
description = "`ForkliftController` and related MTV operands must report Ready. A not-Ready controller means migrations cannot be reconciled even if the CSV is installed."
recommendation = "Do not start or resume migration plans until every `ForkliftController` reports `Ready=True`. If the controller is not ready, review its status conditions and restore the Migration Toolkit for Virtualization operand pods to **Running** and **Ready**; resolve configuration, dependency, image-pull, or resource issues before retrying. A **Succeeded** Operator CSV only confirms installation. The `ForkliftController` and its operands must also be healthy before new migrations can be reconciled."
verification = "1. Print `ForkliftController` conditions. Missing CR or namespace is informational. `Ready=False` or degraded conditions is a failure.\n   `oc get forkliftcontroller -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}{end}'`\n2. Inspect MTV operand pods. Non-Running pods are a failure.\n   `oc get pods -n openshift-mtv`"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "MTV controller pods"
impact_detail = "Fixing `ForkliftController` rolls MTV control-plane pods, not cluster nodes or guest VMs."

