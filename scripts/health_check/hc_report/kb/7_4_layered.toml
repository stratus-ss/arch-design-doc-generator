[[checks]]
check_id = "7.4.tsr.4_8_1_1_2_related_subscriptions"
title = "TSR CNV related subscriptions"
description = "OpenShift Virtualization depends on several operator subscriptions being\nhealthy and at compatible versions. Missing or degraded subscriptions prevent\nproper CNV functionality and block upgrades.\n"
recommendation = "1. Verify all CNV-related subscriptions are installed and healthy.\n   `oc get csv -n openshift-cnv`\n2. Confirm HyperConverged CR status.\n   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o jsonpath='{.status.conditions}'`\n3. Resolve any InstallPlan failures before proceeding with upgrades.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator namespace"
impact_detail = "Approving InstallPlans or reconciling CNV subscriptions rolls operator-managed pods but does not reboot cluster nodes."

