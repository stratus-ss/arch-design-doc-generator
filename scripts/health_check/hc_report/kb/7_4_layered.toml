[[checks]]
check_id = "7.4.tsr.4_8_4_7_nfs_client_sysctl_posture"
title = "TSR NFS client sysctl posture"
description = "NFS performance and reliability on OCP nodes depend on proper kernel parameters\n(sunrpc.tcp_max_slot_table_entries, nfs.max_session_slots). Default values may\nbe insufficient for high-IOPS VM workloads.\n"
recommendation = "Raise sunrpc.tcp_max_slot_table_entries to at least 128, or the NFS vendor's documented slot-table size, via Tuned when possible. Read the live sysctl first. Use MachineConfig only when you accept a node drain."
verification = "1. Check current sysctl values on nodes.\n   `oc debug node/<name> -- chroot /host sysctl sunrpc.tcp_max_slot_table_entries`\nCommand failure or no NFS nodes is INFO n/a. Live value below the intended slot table is WARNING."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes using NFS-backed virtualization workloads"
impact_detail = "Tuned profiles can apply live, but MachineConfig-based sysctl changes drain and reboot nodes; treat this as planned node-by-node remediation."

