verification = "1. Print LokiStack store type and storageClassName. If the CRD is missing or empty, the command prints **INFO**. A row with both STORE and STORAGECLASS set is healthy; both showing <none> needs review.\n   `oc get lokistack -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,STORE:.spec.storage.secret.type,STORAGECLASS:.spec.storageClassName 2>&1 | awk '/have a resource type|No resources found/{print \"INFO n/a-lokistack\"; n=1; next} NR==1{print \"RESULT\",$0; next} {r=\"PASS\"; if($3==\"<none>\" && $4==\"<none>\") r=\"WARNING\"; print r,$0} END{if(!n && NR==0) print \"INFO n/a-lokistack\"}'`"
priority_hint = ""
impact = "workload-shift"
