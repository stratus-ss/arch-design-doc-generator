[[checks]]
check_id = "7.4.tsr.4_8_5_3_5_cdi_image_upload_posture"
title = "TSR CDI image upload posture"
description = "CDI (Containerized Data Importer) manages VM disk image imports and uploads.\nIssues with CDI configuration prevent DataVolume provisioning, blocking new VM\ncreation and disk cloning operations.\n"
recommendation = "1. PASS/FAIL CDI Available=True Progressing=False Degraded=False. Missing = INFO n/a-cdi:\n   `oc get cdi -n openshift-cnv -o jsonpath='{range .items[*]}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}{end}' 2>&1 | awk -F= '/not found|No resources found|have a resource type/{print \"INFO n/a-cdi\"; n=1; next} $1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{if(n) exit; if(a==\"\"&&p==\"\"&&d==\"\") print \"INFO n/a-cdi\"; else print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`\n2. Review upload proxy health:\n   `oc get pods -n openshift-cnv -l app=cdi-uploadproxy`\n3. Verify the uploadproxy route is accessible and TLS certificates are valid.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "CDI importer and upload components"
impact_detail = "CDI remediation rolls import or upload control pods and affects new image imports or uploads, but not already running VMs."

