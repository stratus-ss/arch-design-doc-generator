check_id = "7.4.tsr.4_12_1_1_1_mtv_installation_and_state"
title = "TSR MTV installation and state"
description = "ForkliftController and related MTV operands must report Ready. A not-Ready controller means migrations cannot be reconciled even if the CSV is installed."
recommendation = "1. Print ForkliftController conditions:\n   `oc get forkliftcontroller -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}{end}'`\n2. Inspect MTV operand pods:\n   `oc get pods -n openshift-mtv`\n3. Resolve degraded conditions before starting new migrations.\n"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "MTV controller pods"
impact_detail = "Fixing ForkliftController rolls MTV control-plane pods, not cluster nodes or guest VMs."

