check_id = "7.4.tsr.4_1_4_logging_pod_status"
title = "TSR logging pod status"
description = "This check confirms expected logging and Loki pods are running. Missing compactor, distributor, gateway, index-gateway, ingester, querier, or query-frontend pods usually mean logging is not configured yet, not that those images failed independently."
recommendation = "1. Check whether a LokiStack is configured.\n   `oc get lokistack -A`\n2. If none exists, configure logging storage first (see logging storage type).\n3. After a LokiStack exists, re-check pod status.\n   `oc get pods -n openshift-logging`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "openshift-logging and Loki pods"
impact_detail = "Bringing the logging stack up starts new pods; it does not reboot nodes."
summary_patterns = [
  { contains = "no pod found", text = "Expected logging/Loki pods are not running." },
]
finding_group = "logging-not-configured"
finding_group_title = "Cluster logging is not configured (no LokiStack)"

