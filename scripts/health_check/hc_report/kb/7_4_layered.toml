[[checks]]
check_id = "7.4.tsr.4_8_5_2_3_cnv_vmi_readiness_prometheus"
title = "TSR CNV VMI readiness metrics"
description = "VMI readiness metrics in Prometheus indicate whether virtual machines are\nsuccessfully reaching a running and accessible state. Low readiness rates\nsuggest scheduling, networking, or storage provisioning issues.\n"
recommendation = "1. Query VMI readiness.\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s 'http://localhost:9090/api/v1/query?query=kubevirt_vmi_phase_count'`\n2. Alternatively, review the metric in the OCP console under `Observe -> Metrics`.\n3. Investigate VMIs stuck in `Scheduling` or `Pending` phase.\n4. Check events on the VMI and its `DataVolumes` for provisioning errors.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

