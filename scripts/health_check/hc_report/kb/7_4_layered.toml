[[checks]]
check_id = "7.4.tsr.4_8_2_1_1_3_live_migration_network_readiness"
title = "TSR live migration network readiness"
description = "This check evaluates live-migration readiness. Failures include VMs that cannot live-migrate (PDB, disk, or node-selector constraints) and missing dedicated migration network capacity. The evidence lists the class; truncated VM-reason tables are chapter 7."
# why-rec
# CORRECTED. Dumping KubeVirt YAML is the wrong object for the dedicated migration
# network. Rec prints HyperConverged liveMigrationConfig.network only.
recommendation = "1. Read which constraint class the evidence reports (not migratable vs network).\n2. For VMs that cannot live-migrate, inspect PDB, volumes, and node selectors.\n3. Print the dedicated live-migration network on HyperConverged:\n   `oc get hyperconverged -n openshift-cnv -o jsonpath='{range .items[*]}{.metadata.name} network={.spec.liveMigrationConfig.network}{\"\\n\"}{end}'`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "live-migration traffic path and virt-handler pods"
impact_detail = "Adding a dedicated migration network updates HyperConverged migration settings and restarts virt-handler pods; migration traffic then shifts off the primary cluster network."

