[[checks]]
check_id = "7.4.tsr.4_8_1_5_3_2_storage_checkup"
title = "TSR CNV storage checkup"
description = "This check is the kiagnose kubevirt-storage checkup ConfigMap: SUCCEEDED and PVCBBOUND. Missing ConfigMap = INFO n/a-storage-checkup (never run). Cluster PVC inventory, virt-default StorageClass, and StorageProfile are other TSR items."
recommendation = "1. Print kubevirt-storage checkup SUCCEEDED, PVCBBOUND, and FAILURE. true = PASS. false = FAIL. Missing = INFO n/a-storage-checkup:\n   `oc get cm -A -l kiagnose/checkup-type=kubevirt-storage -o json | jq -r '.items[] | [.metadata.namespace, .metadata.name, (.data[\"status.succeeded\"] // \"-\"), (.data[\"status.result.pvcBound\"] // \"-\"), (if (.data[\"status.failureReason\"] // \"\") == \"\" then \"-\" else .data[\"status.failureReason\"] end)] | @tsv' | awk -F'\\t' '{r=\"INFO\"; if($3==\"true\") r=\"PASS\"; else if($3==\"false\") r=\"FAIL\"; print r, \"NS=\"$1, \"NAME=\"$2, \"SUCCEEDED=\"$3, \"PVCBBOUND=\"$4, \"FAILURE=\"$5} END{if(NR==0) print \"INFO n/a-storage-checkup\"}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "PVCs created by the storage checkup"
impact_detail = "Reading checkup results does not reboot nodes; re-running the checkup creates short-lived test VMs and PVCs."

