[[checks]]
check_id = "7.4.tsr.4_1_6_cluster_log_forwarders"
title = "TSR cluster log forwarders"
description = "Multiple ClusterLogForwarder objects require the Vector collector. Fluentd does not support multi-forwarder. This check fails when more than one forwarder is configured without Vector."
recommendation = "Switch the collector to Vector if more than one ClusterLogForwarder exists. Fluentd with multiple forwarders is unsupported and drops logs. One forwarder, or Vector with many, is the healthy state. Switching rolls collector pods — plan for brief log gaps."
verification = "1. List forwarders:\n   `oc get clusterlogforwarder -A`\n2. Print collector type only:\n   `oc get clusterlogging -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.collection.type`\n0–1 forwarders is PASS. More than one with TYPE not vector is FAIL."
priority_hint = ""
impact = "workload-shift"
impact_scope = "log collector pods"
impact_detail = "Changing collector type or forwarder count rolls collector pods and can drop logs until they reschedule."
summary_patterns = [
  { contains = "multi log forwarder", text = "Multiple log forwarders are configured; that requires the Vector collector." },
]

