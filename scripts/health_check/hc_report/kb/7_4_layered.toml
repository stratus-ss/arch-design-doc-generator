[[checks]]
check_id = "7.4.cnv.live_migratable"
title = "VM live-migratable status (engine)"
description = "This engine check reads VirtualMachineInstance LiveMigratable conditions and VirtualMachine evictionStrategy. It is not TSR worksheet 4.8.2.1.1.3 (migration network)."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: This engine check reads VirtualMachineInstance LiveMigratable conditions and
# VirtualMachine evictionStrategy.
# The rec remediates THAT story by starting at `oc get vmi -A` — the live object/command for this
# check, not a neighboring TSR item.
# Impact `workload-shift`: Making a VM live-migratable may require storage, networking, or
# eviction-policy changes and can require a VM reboot.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Inspect non-migratable VMIs:\n   `oc get vmi -A` / `omc get vmi -A`\n   `oc describe vmi <name> -n <ns>`\n2. Typical causes: RWO disks, GPU/passthrough, evictionStrategy None, node selector/affinity, host-model CPU, PodDisruptionBudget on virt-launcher, insufficient spare memory for drain.\n3. Confirm a dedicated live-migration network if large VMs saturate the primary NIC (TSR 4.8.2.1.1.3).\n"
impact = "workload-shift"
impact_scope = "affected VMs"
impact_detail = "Making a VM live-migratable may require storage, networking, or eviction-policy changes and can require a VM reboot."

[[checks]]
check_id = "7.4.tsr.4_8_1_5_1_1_cnv_operators_node_placement"
title = "TSR CNV operators node placement"
description = "CNV infrastructure components (virt-handler, virt-launcher) must run on nodes\nwith the appropriate hardware capabilities. Incorrect node placement leads to\nVM scheduling failures and live migration issues.\n"
# why-rec
# CORRECTED. `oc debug node -- cat /proc/cpuinfo` reads the debug container. Need `chroot /host`.
# virt-handler DaemonSet and node.kubevirt.io/schedulable are the CNV placement objects. Debug
# not executed.
recommendation = "1. Verify the `virt-handler` DaemonSet is running on all compute or worker nodes.\n   `oc get ds virt-handler -n openshift-cnv`\n2. Check node selectors and tolerations on the HyperConverged CR.\n3. Confirm that nodes intended for VMs have the `node.kubevirt.io/schedulable` label.\n4. Confirm hardware virtualization is enabled on target nodes.\n   `oc debug node/<name> -- chroot /host grep -E 'vmx|svm' /proc/cpuinfo`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "CNV infrastructure pods and VM-capable worker nodes"
impact_detail = "Changing schedulable labels or node placement reschedules CNV components and can require VM migration before draining or repurposing nodes."

