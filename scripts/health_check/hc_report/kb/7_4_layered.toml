[[checks]]
check_id = "7.4.tsr.4_8_4_2_windows_bsod_risk_posture"
title = "TSR Windows BSOD risk posture"
description = "Windows VMIs should expose a hypervisor watchdog or equivalent liveness so a guest hang or BSOD can be detected and recovered. Missing watchdog or liveness configuration leaves failed Windows guests undetected."
recommendation = "1. List Windows VMIs.\n   `oc get vmi -A`\n2. Check watchdog and guest-agent configuration on those VMIs.\n3. Enable a supported watchdog or liveness probe on Windows VM templates.\n4. Confirm the VMI restart policy matches the desired recovery behavior.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "Windows virtual machines"
impact_detail = "Enabling a watchdog or changing restart policy can restart individual Windows VMs; it does not reboot hypervisor nodes."

