[[checks]]
check_id = "7.4.cnv.subscription"
title = "CNV related subscriptions"
description = "OpenShift Virtualization requires the kubevirt-hyperconverged Subscription in openshift-cnv. Sibling operators such as NMState and SR-IOV are scored separately when those namespaces have CSVs."
recommendation = "Keep the kubevirt-hyperconverged Subscription at `AtLatestKnown` with installedCSV matching currentCSV. For a stalled required subscription, review and complete or approve its `InstallPlan`, then confirm the CSV reaches Succeeded."
verification = "1. List the Virtualization operator subscription in openshift-cnv. Healthy when STATE is `AtLatestKnown` and INSTALLED matches CURRENT. If that namespace does not exist, the command prints **INFO** — Virtualization is not installed.\n   `oc get subscription -n openshift-cnv -o custom-columns=NAME:.metadata.name,PACKAGE:.spec.name,CHANNEL:.spec.channel,STATE:.status.state,INSTALLED:.status.installedCSV,CURRENT:.status.currentCSV 2>&1 | awk '/not found/{print \"INFO n/a-cnv\"; n=1; next} NR==1{print \"RESULT\",$0; next} {r=\"FAIL\"; if($1==\"kubevirt-hyperconverged\" && $4==\"AtLatestKnown\" && $5==$6) r=\"PASS\"; print r,$0} END{if(!n && NR==1) print \"FAIL missing-kubevirt-hyperconverged\"}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cnv operator namespace"
impact_detail = "Approving `InstallPlan`s or reconciling CNV subscriptions rolls operator-managed pods but does not reboot cluster nodes."
finding_group = "cnv-subscription"
finding_group_title = "CNV related subscriptions"

