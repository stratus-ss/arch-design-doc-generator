[[checks]]
check_id = "7.4.tsr.4_8_4_7_nfs_client_sysctl_posture"
title = "TSR NFS client sysctl posture"
description = "NFS performance and reliability on OCP nodes depend on proper kernel parameters\n(sunrpc.tcp_max_slot_table_entries, nfs.max_session_slots). Default values may\nbe insufficient for high-IOPS VM workloads.\n"
# why-rec
# CORRECTED. Same chroot rule for sysctl. 128 slot-table entries is a starting value, not a
# vendor mandate. Apply via MachineConfig or Tuned, not a one-shot debug.
recommendation = "1. Check current sysctl values on nodes.\n   `oc debug node/<name> -- chroot /host sysctl sunrpc.tcp_max_slot_table_entries`\n2. Apply tuning via a `MachineConfig` or the Node Tuning Operator (`Tuned` profile) to set appropriate values for the NFS workload characteristics.\n3. Set a starting value such as `sunrpc.tcp_max_slot_table_entries=128` unless the NFS server vendor documents a different slot-table size.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes using NFS-backed virtualization workloads"
impact_detail = "Tuned profiles can apply live, but MachineConfig-based sysctl changes drain and reboot nodes; treat this as planned node-by-node remediation."

