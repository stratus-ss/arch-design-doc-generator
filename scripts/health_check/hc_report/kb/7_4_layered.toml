[[checks]]
check_id = "7.4.tsr.4_8_4_2_windows_bsod_risk_posture"
title = "TSR Windows BSOD risk posture"
description = "Windows VMIs should expose a hypervisor watchdog or equivalent liveness so a guest hang or BSOD can be detected and recovered. Missing watchdog or liveness configuration leaves failed Windows guests undetected."
recommendation = "Enable a hypervisor watchdog or guest-agent liveness on every Windows VMI, with a restart policy that matches the recovery SLA. Put it on templates so new VMs inherit it. Do not chase individual guests first."
verification = "1. Print desired watchdog and liveness on each VirtualMachine spec. `WINDOWS=yes` when the VM name, labels, or annotations mention windows. A Windows row with both WATCHDOG and LIVENESS unset needs review. An empty list means no VMs exist:\n   `oc get vm -A -o json | jq -r '.items[] | [.metadata.namespace, .metadata.name, (if (((.metadata.name // \"\") + \" \" + ((.metadata.labels // {})|tostring) + \" \" + ((.metadata.annotations // {})|tostring) + \" \" + ((.spec.template.metadata.labels // {})|tostring) + \" \" + ((.spec.template.metadata.annotations // {})|tostring)) | test(\"windows\"; \"i\")) then \"yes\" else \"no\" end), ((.spec.template.spec.domain.devices.watchdog // {}) | if length==0 then \"-\" else (keys[0] // \"set\") end), (if .spec.template.spec.livenessProbe then \"set\" else \"-\" end)] | @tsv' | awk -F'\\t' 'BEGIN{print \"RESULT\",\"NS\",\"NAME\",\"WINDOWS\",\"WATCHDOG\",\"LIVENESS\"} {r=\"INFO\"; if($3==\"yes\"){r=\"PASS\"; if($4==\"-\" && $5==\"-\") r=\"WARNING\"} print r,$0} END{if(NR==0) print \"INFO n/a-vm\"}'`\n2. Print the same fields on running VirtualMachineInstances, including guest OS when reported. `WINDOWS=yes` when the VMI name, labels, annotations, or guestOSInfo mention windows. A Windows row with both WATCHDOG and LIVENESS unset needs review. An empty list means no VMIs exist:\n   `oc get vmi -A -o json | jq -r '.items[] | [.metadata.namespace, .metadata.name, (if (((.metadata.name // \"\") + \" \" + ((.metadata.labels // {})|tostring) + \" \" + ((.metadata.annotations // {})|tostring) + \" \" + ((.status.guestOSInfo.name // \"\"))) | test(\"windows\"; \"i\")) then \"yes\" else \"no\" end), ((.spec.domain.devices.watchdog // {}) | if length==0 then \"-\" else (keys[0] // \"set\") end), (if .spec.livenessProbe then \"set\" else \"-\" end), (.status.guestOSInfo.name // \"-\")] | @tsv' | awk -F'\\t' 'BEGIN{print \"RESULT\",\"NS\",\"NAME\",\"WINDOWS\",\"WATCHDOG\",\"LIVENESS\",\"GUESTOS\"} {r=\"INFO\"; if($3==\"yes\"){r=\"PASS\"; if($4==\"-\" && $5==\"-\") r=\"WARNING\"} print r,$0} END{if(NR==0) print \"INFO n/a-vmi\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "Windows virtual machines"
impact_detail = "Enabling a watchdog or changing restart policy can restart individual Windows VMs; it does not reboot hypervisor nodes."

