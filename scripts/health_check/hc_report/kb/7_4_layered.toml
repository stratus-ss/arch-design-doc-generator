[[checks]]
check_id = "7.4.tsr.4_12_1_2_mtv_supported_configuration"
title = "TSR MTV supported configuration"
description = "This check validates the installed Migration Toolkit for Virtualization (MTV) Operator CSV version against the Red Hat OpenShift Operator lifecycle policy. It determines whether the specific installed MTV z-stream remains within its supported **Full Support** or **Maintenance Support** window. An expired maintenance window is a supportability failure for that operator version, even if the Operator remains installed and functional.\n"
recommendation = "Keep the installed MTV CSV on a version that remains within its applicable OpenShift Operator lifecycle window. If the current z-stream has left **Maintenance Support**, plan and execute an upgrade through a supported MTV subscription channel and upgrade path during an approved maintenance window."
verification = "1. Print the mtv-operator CSV VERSION. If the namespace does not exist, MTV is not installed. Compare VERSION to the operator life-cycle policy.\n   `oc get csv -n openshift-mtv -o custom-columns=NAME:.metadata.name,VERSION:.spec.version,PHASE:.status.phase 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-version\"; n=1; next} NR==1{next} $1 ~ /^mtv-operator/ {print \"INFO\", \"NAME=\"$1, \"VERSION=\"$2, \"PHASE=\"$3; found=1} END{if(n) exit; if(!found) print \"INFO n/a-mtv-version\"}'`\nIn-support VERSION is healthy; expired maintenance is a failure."
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "openshift-mtv operator and ForkliftController"
impact_detail = "Upgrading MTV rolls operator pods; running VMs are not stopped by the operator upgrade itself."
summary_patterns = [
  { contains = "no longer supported", text = "Migration Toolkit for Virtualization 2.8 is past maintenance support." },
]

