check_id = "7.4.tsr.4_8_1_4_1_cpu_physical_resource_overhead_requirements"
title = "4.8.1.4.1. CPU Physical Resource Overhead Requirements"
description = "This check collects node CPU overhead versus allocatable CPU, HyperConverged `vmiCPUAllocationRatio`, optional dedicated CPU placement, and Node Tuning Operator health. A WARNING on CSV not fully healthy is an operator-health finding. Missing PerformanceProfile is informational. Nodes that already report overhead are not the defect by themselves."
recommendation = "If node CPU overhead collection passed, do not change `vmiCPUAllocationRatio` or add a PerformanceProfile only to clear this check. Investigate the Node Tuning Operator CSV that is not Succeeded (or not fully healthy): CSV phase, operator pod, and InstallPlan. Dedicated CPU and PerformanceProfile stay optional unless the design requires low-latency VMs."
verification = """1. Print Node Tuning Operator CSVs. Succeeded is healthy.
   `oc get csv -n openshift-cluster-node-tuning-operator`
2. Print HyperConverged `vmiCPUAllocationRatio`. A set ratio is expected when Virtualization is installed.
   `oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv -o jsonpath='{.spec.vmiCPUAllocationRatio}{"\\n"}'`
3. If Virtualization is not installed, the hyperconverged command prints not found — INFO, skip."""
priority_hint = ""
impact = "non-disruptive"
impact_scope = "openshift-cluster-node-tuning-operator"
impact_detail = "Repairing the CSV rolls NTO operator pods; it does not by itself apply a PerformanceProfile."

