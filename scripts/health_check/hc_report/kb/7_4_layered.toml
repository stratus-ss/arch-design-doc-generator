# Check story: StorageProfiles set default volume and access modes per StorageClass for CDI.
# The rec remediates THAT story by starting at `oc get storageprofile` — the live object/command
# for this check, not a neighboring TSR item.
# Impact `non-disruptive`: StorageProfile changes affect future imports, clones, and PVC
# defaults; existing volumes and running VMs continue unchanged.
