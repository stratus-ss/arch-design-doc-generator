[[checks]]
check_id = "7.4.tsr.4_8_4_5_host_kernel_bsod_indicators"
title = "TSR host kernel crash indicators"
description = "Kernel panics or BSOD-equivalent events on nodes indicate hardware failures,\ndriver issues, or critical kernel bugs. Affected nodes are unreliable and may\ncause VM disruption without warning.\n"
recommendation = "Cordon a VM host that shows kernel panic, oops, or BUG, then check BMC/iDRAC/iLO before kernel or firmware work. Clean journals and no NodeNotReady reboot events is healthy. Do not debug firmware on an uncordoned panicking node."
verification = "1. Check node journals for kernel panics.\n   `oc adm node-logs <node> --path=journal | grep -iE 'panic|oops|BUG:'`\n2. Review node readiness events for unexpected reboots.\n   `oc get events -A --field-selector reason=NodeNotReady`\nAny panic/oops/BUG hit is FAIL. Empty grep is PASS. Correlate NodeNotReady events with those hits."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "affected VM-hosting nodes"
impact_detail = "Kernel or hardware remediation commonly requires cordon, drain, reboot, or replacement of the node, forcing VM migration or downtime if migration is unavailable."

