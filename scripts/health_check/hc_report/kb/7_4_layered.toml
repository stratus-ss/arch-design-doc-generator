[[checks]]
check_id = "7.4.tsr.4_8_1_3_4_node_disk"
title = "4.8.1.3.4 Default virtualization StorageClass"
description = "This TSR worksheet item is about whether a default StorageClass for virtualization workloads exists (annotation storageclass.kubevirt.io/is-default-virt-class), not about node root-disk fullness or kubelet DiskPressure. A cluster-wide default StorageClass is a different setting."
# why-rec
# CORRECTED. `-o yaml` dumps every StorageClass. Rec prints provisioner and virt-default
# annotation as columns. Keep the annotate command for the virt default class.
recommendation = "1. List StorageClass provisioner and virt-default annotation:\n   `oc get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner,VIRTDEFAULT:.metadata.annotations.storageclass\\.kubevirt\\.io/is-default-virt-class`\n2. Mark the class that should back VM disks:\n   `oc annotate storageclass <name> storageclass.kubevirt.io/is-default-virt-class=true`\n3. If the provisioner supports snapshots, associate a VolumeSnapshotClass with that default class.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "StorageClass annotations for VM disks"
impact_detail = "Setting `storageclass.kubevirt.io/is-default-virt-class` changes which class new VM disks pick. It does not drain nodes or move existing PVCs."

