[[checks]]
check_id = "7.4.tsr.4_8_1_5_1_1_cnv_operators_node_placement"
title = "TSR CNV operators node placement"
description = "CNV infrastructure components (virt-handler, virt-launcher) must run on nodes\nwith the appropriate hardware capabilities. Incorrect node placement leads to\nVM scheduling failures and live migration issues.\n"
recommendation = "1. Verify the `virt-handler` DaemonSet is running on all compute or worker nodes.\n   `oc get ds virt-handler -n openshift-cnv`\n2. Check node selectors and tolerations on the HyperConverged CR.\n3. Confirm that nodes intended for VMs have the `node.kubevirt.io/schedulable` label.\n4. Confirm hardware virtualization is enabled on target nodes.\n   `oc debug node/<name> -- cat /proc/cpuinfo | grep -E 'vmx|svm'`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "CNV infrastructure pods and VM-capable worker nodes"
impact_detail = "Changing schedulable labels or node placement reschedules CNV components and can require VM migration before draining or repurposing nodes."

