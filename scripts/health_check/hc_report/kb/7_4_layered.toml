[[checks]]
check_id = "7.4.tsr.4_8_3_1_1_storage_profiles"
title = "TSR storage profiles"
description = "StorageProfiles define default volume modes and access modes per StorageClass\nfor CDI operations. Missing or misconfigured profiles cause DataVolume import\nfailures or suboptimal disk performance (filesystem mode instead of block).\n"
recommendation = "1. Review storage profiles.\n   `oc get storageprofile`\n2. Confirm each profile has a `claimPropertySets` entry.\n3. For virtualization workloads, prefer Block mode with `ReadWriteMany` access.\n4. Update profiles to set appropriate defaults matching your storage backend capabilities.\n   `oc edit storageprofile <name>`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "new DataVolumes and VM disk defaults"
impact_detail = "StorageProfile changes affect future imports, clones, and PVC defaults; existing volumes and running VMs continue unchanged."

