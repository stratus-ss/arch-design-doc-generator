[[checks]]
check_id = "7.4.tsr.4_8_2_2_1_2_network_configuration"
title = "TSR network configuration"
description = "This check verifies that the node network configuration required for virtual machine connectivity is properly set up. It looks for NodeNetworkConfigurationPolicy (NNCP) and NodeNetworkConnectionEnactment (NNCE) resources. Missing or failed network policies mean VMs may not be able to connect to external networks or other VMs."
recommendation = "Keep NodeNetworkConfigurationPolicy and NNCE in Successful state for every bridge and VLAN the VMs need. When the cluster uses only the overlay network and has no host-network policies, missing NNCP is expected and not a problem. If an enactment has failed, investigate and fix the policy before attaching more VMs to that network."
verification = "1. Check if node network policies exist and are applied:\n   `oc get nncp` and `oc get nnce`\n2. If NNCPs exist but show errors, inspect the enactment status:\n   `oc get nnce -o wide`\n3. Verify VM network attachments are correctly defined:\n   `oc get net-attach-def -A`\nIf no NNCP or NNCE exists and the cluster uses only the overlay network, the absence is expected. A failed enactment needs investigation before proceeding."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "targeted worker-node networking and attached VM interfaces"
impact_detail = "Bridge, SR-IOV, or other host-network changes can interrupt node and VM connectivity while the node networking is reconfigured."
summary_patterns = [
  { contains = "no NNCE found", text = "No NodeNetworkConfigurationEnactment was found for VM node networking." },
]

