[[checks]]
check_id = "7.4.tsr.4_12_1_1_2_operator_subscription_posture"
title = "TSR MTV operator subscription posture"
description = "This check is the mtv-operator subscription in openshift-mtv: STATE must be AtLatestKnown with INSTALLED equal to CURRENT, CSV PHASE Succeeded, and no unapproved or incomplete InstallPlan. UpgradePending leaves MTV on a stale CSV. ForkliftController is 4.12.1.1.1. CSV version/lifecycle is 4.12.1.2."
recommendation = "Keep mtv-operator AtLatestKnown with INSTALLED equal to CURRENT, CSV Succeeded, and no unapproved InstallPlan. Approve or complete a stuck InstallPlan before retrying the CSV. Missing namespace is n/a."
verification = "1. Print mtv-operator subscription. PASS = STATE AtLatestKnown and INSTALLED equals CURRENT. Missing namespace / empty is informational n/a-mtv-subscription:\n   `oc get subscription -n openshift-mtv -o custom-columns=NAME:.metadata.name,PACKAGE:.spec.name,CHANNEL:.spec.channel,STATE:.status.state,INSTALLED:.status.installedCSV,CURRENT:.status.currentCSV 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-subscription\"; n=1; next} NR==1{next} {r=\"FAIL\"; if($4==\"AtLatestKnown\" && $5==$6) r=\"PASS\"; print r, \"NAME=\"$1, \"PACKAGE=\"$2, \"CHANNEL=\"$3, \"STATE=\"$4, \"INSTALLED=\"$5, \"CURRENT=\"$6} END{if(n) exit; if(NR<=1) print \"INFO n/a-mtv-subscription\"}'`\n2. Print MTV CSV PHASE. Succeeded is healthy. An empty list means this is not in use (n/a-mtv-csv):\n   `oc get csv -n openshift-mtv -o custom-columns=NAME:.metadata.name,PHASE:.status.phase 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-csv\"; n=1; next} NR==1{next} $1 ~ /^mtv-operator/ {print ($2==\"Succeeded\"?\"PASS\":\"FAIL\"), \"NAME=\"$1, \"PHASE=\"$2; found=1} END{if(n) exit; if(!found) print \"INFO n/a-mtv-csv\"}'`\n3. Print InstallPlans that are not Complete or not approved. Empty complete set is healthy no-stuck-installplans. Missing ns is informational n/a-mtv-installplan:\n   `oc get installplan -n openshift-mtv -o custom-columns=NAME:.metadata.name,CSV:.spec.clusterServiceVersionNames,APPROVED:.spec.approved,PHASE:.status.phase 2>&1 | awk '/not found|No resources found/{print \"INFO n/a-mtv-installplan\"; n=1; next} NR==1{next} {r=\"PASS\"; if($4!=\"Complete\" || tolower($3)!=\"true\") r=\"FAIL\"; print r, \"NAME=\"$1, \"APPROVED=\"$3, \"PHASE=\"$4} END{if(n) exit; if(NR<=1) print \"INFO n/a-mtv-installplan\"}'`\nForkliftController is 4.12.1.1.1. CSV version/lifecycle is 4.12.1.2."
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "openshift-mtv OLM resources"
impact_detail = "Approving an InstallPlan rolls the MTV operator; it does not reboot nodes."

