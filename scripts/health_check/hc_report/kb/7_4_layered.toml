[[checks]]
check_id = "7.4.tsr.4_1_2_logging_storage_type"
title = "TSR logging storage type"
description = "This check is LokiStack log-store type: spec.storage.secret.type and spec.storageClassName. An operator CSV without a LokiStack still means logs are not persisted. CSV install is 4.1.1. Size is 4.1.3. Pods are 4.1.4. Loki conditions are 4.1.5.2."
recommendation = "Set LokiStack store type and storageClassName so logs persist. Both <none> is a CR with no store — set them before treating Loki as unhealthy. An operator CSV without a LokiStack still means logs are not persisted."
verification = "1. Print LokiStack store type and storageClassName. Missing CRD / empty is informational n/a-lokistack. A row with STORE or STORAGECLASS set is healthy. Both <none> needs review:\n   `oc get lokistack -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,STORE:.spec.storage.secret.type,STORAGECLASS:.spec.storageClassName 2>&1 | awk '/have a resource type|No resources found/{print \"INFO n/a-lokistack\"; n=1; next} NR==1{print \"RESULT\",$0; next} {r=\"PASS\"; if($3==\"<none>\" && $4==\"<none>\") r=\"WARNING\"; print r,$0} END{if(!n && NR==0) print \"INFO n/a-lokistack\"}'`\nCSV install is 4.1.1. Size is 4.1.3. Pods are 4.1.4. Loki conditions are 4.1.5.2."
priority_hint = ""
impact = "workload-shift"
impact_scope = "openshift-logging collector and log-store pods"
impact_detail = "Creating or changing a LokiStack rolls logging pods and can briefly interrupt log collection until the store is ready."
summary_patterns = [
  { contains = "no instance configuration", text = "The Loki operator is installed, but no LokiStack is configured." },
]
finding_group = "logging-not-configured"
finding_group_title = "Cluster logging is not configured (no LokiStack)"

