title = "3.9.4. Storage PV Status"
description = "This check reviews PersistentVolume and PersistentVolumeClaim bind state. Evidence may show an unbound PV, an unbound PVC, or Released/Failed PVs that still consume capacity."
recommendation = "Bind every PVC and clear Released or Failed PVs. Leftover PVs should be only Available or Bound. Empty exception output is the healthy end state.\n\nVerification:\n1. Print PVs whose STATUS is not Bound or Available (Released still holds capacity; Failed is FAIL). An empty list means none:\n   `oc get pv -o custom-columns=NAME:.metadata.name,STATUS:.status.phase --no-headers | awk '$2!=\"Bound\" && $2!=\"Available\" {print}'`\n2. Print PVCs whose PHASE is not Bound. An empty list means none:\n   `oc get pvc -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase,SC:.spec.storageClassName | awk '$3 != \"Bound\"'`\n      Events for remaining rows are 7.3.storage.pvcs. Provisioner classify is 3.9.3.\n3. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/storage/index#understanding-persistent-storage"
