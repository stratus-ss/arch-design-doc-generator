[[checks]]
check_id = "7.3.version"
title = "Cluster version health"
description = "ClusterVersion conditions indicate whether the cluster is in a healthy upgrade\nstate. Progressing, Failing, or `RetrievedUpdates=False` conditions indicate\nupgrade-path issues that require investigation before planning the next update.\n"
recommendation = "Stop the next update until ClusterVersion conditions are quiet and the unhealthy-operator grep is header-only. A stuck or failing condition is a stop. Read conditions first, then CVO logs, then plan the window."
verification = "1. Print ClusterVersion conditions only:\n   `oc get clusterversion version -o jsonpath='{range .status.conditions[*]}{.type}={.status} reason={.reason}{\"\\n\"}{end}'`\n2. If Progressing is stuck or Failing is True, review the cluster-version-operator logs:\n   `oc -n openshift-cluster-version logs deployment/cluster-version-operator`\n3. List only unhealthy ClusterOperators:\n   `oc get co | grep -v 'True.*False.*False'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster upgrade and CVO recovery"
impact_detail = "A stuck or failing ClusterVersion is a stop. Unblocking it usually means a planned update or CVO recovery window, which rolls operators, nodes, and workloads over time."

