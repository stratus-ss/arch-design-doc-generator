[[checks]]
check_id = "7.3.tsr.3_3_custom_resource_definitions"
title = "TSR custom resource definitions"
description = "This check is CRDs whose OLM owner label has no Succeeded CSV. Those owners are leftover after uninstall. High CRD count is 7.3.crds. Webhook health is 7.3.webhooks.validatingwebhooks. Unused namespaces are 7.6.namespaces."
# why-rec
# CORRECTED. Dropped the operators.coreos.com/<package>.<namespace> label glob
# and per-CRD wc -l. Rec prints OLM OWNER counts, then stock oc get csv -A.
# OWNER with no Succeeded CSV is leftover. Lab: INFO OWNER rows and Succeeded
# CSVs. Did not delete CRDs.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "Remove CRDs left behind after an operator uninstall. If an OWNER has no Succeeded CSV, count instances; when the instance list is empty, backup then delete the CRD. A high live CRD count is an API-discovery load problem, not a reason to delete in-use CRDs.\n\nVerification:\n1. Print OLM owner labels on CRDs. An empty list means this is not in use (n/a-olm-owner):\n   `oc get crd -o json | jq -r '.items[] | (.metadata.labels // {}) | keys[]' | awk '/^operators.coreos.com\\//{count[$1]++} END{if(length(count)==0) print \"INFO n/a-olm-owner\"; else for (owner in count) print \"INFO\", \"COUNT=\"count[owner], \"OWNER=\"owner}'`\n2. Print live CSVs. PHASE is on the stock table. An empty list means this is not in use (n/a-csv):\n   `oc get csv -A 2>&1 | awk '/No resources found/{print \"INFO n/a-csv\"; seen=1} seen{next} {print}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "API schema and orphaned operator resources"
impact_detail = "Removing truly orphaned CRDs updates API discovery immediately but does not reboot nodes; verify no live custom resources depend on them before deletion."

