[[checks]]
check_id = "7.3.tsr.3_6_2_registry_storage_type"
title = "TSR registry storage type"
description = "The internal image registry is using \"emptyDir\" (temporary) storage. This means all container images stored in the registry are lost when the registry pod restarts. Production clusters must use persistent storage (such as a PVC or object storage) so that pushed images are retained reliably."
# why-rec
# CORRECTED. oc jsonpath cannot range map keys (`$key,$value` comma is invalid). Rec
# jq-prints `.spec.storage` key names only (not values/credentials). Lab: FAIL backends=emptyDir.
# Image pruner is schedule/suspend columns, not YAML.
recommendation = "1. PASS/FAIL registry storage backend names only (not credentials). `managementState` is ownership, not a backend. `emptyDir` is ephemeral:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o json | jq -r '(.spec.storage | keys - [\"managementState\"]) as $backends | (if $backends == [\"emptyDir\"] then \"FAIL\" else \"PASS\" end) + \" backends=\" + ($backends | join(\",\"))'`\n2. If FAIL, set a persistent backend: PVC on bare metal, or the platform object store (S3, Azure Blob, GCS) on cloud.\n3. Check registry pods:\n   `oc get pods -n openshift-image-registry`\n4. Confirm the image pruner is not suspended:\n   `oc get imagepruner cluster -o custom-columns=NAME:.metadata.name,SUSPEND:.spec.suspend,SCHEDULE:.spec.schedule`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and backing storage"
impact_detail = "Changing registry storage backends rolls registry pods and can briefly interrupt image pushes, pulls, and build flows during cutover."
summary_patterns = [
  { contains = "emptyDir", text = "The image registry is using emptyDir; images are lost on registry pod restart." },
]

