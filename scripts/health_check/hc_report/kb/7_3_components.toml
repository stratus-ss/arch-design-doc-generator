description = "Mutating admission webhooks rewrite API objects before they are persisted\n(defaults, sidecars, labels, security context). A `failurePolicy=Fail` hook or a\nslow/down backend can block those mutations and stall admission. Unexpected\nmutations also change cluster security posture. This check is the live scan of\n`MutatingWebhookConfiguration` timeout and failurePolicy. It is not the\nvalidating (admit/deny) scan. TSR worksheet 3.13 covers both kinds as one row\nand is chapter 7 only. Insights `7.7.ccx_internal.webhooks_check` is a separate\ndataset and is also chapter 7 only.\n"
