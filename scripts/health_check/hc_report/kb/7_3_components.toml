[[checks]]
check_id = "7.3.tsr.3_22_2_performance_profile_match_mcp"
title = "3.22.2. Performance Profile Match MCP"
description = "Validates that PerformanceProfile node selectors correctly target the intended\nMachineConfigPool. Mismatched selectors can leave nodes without performance\ntuning or apply tuning to unintended nodes.\n"
recommendation = "Make each PerformanceProfile NODESELECTOR match exactly one MCP. No CRD or profile means PerformanceProfiles are not in use. None means MachineConfigs will not apply; two or more can tune the wrong nodes.\n\nVerification:\n1. List PerformanceProfiles. Empty / no CRD prints INFO n/a-performanceprofile (this check is done; status is 3.22.3, CPU sets are 3.22.4):\n   `oc get performanceprofile -A 2>&1 | awk '/No resources found|have a resource type/{print \"INFO n/a-performanceprofile\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-performanceprofile\"}'`\n2. Print each profile's nodeSelector as key=value (that is the node label the profile applies to):\n   `oc get performanceprofile -A -o json | jq -r '[\"PROFILE\",\"NODESELECTOR\"], (.items[] | [.metadata.name, ((.spec.nodeSelector // {})|to_entries|map(.key+\"=\"+(.value|tostring))|sort|join(\",\"))]) | @tsv' | column -t`\n3. Print each MCP's nodeSelector matchLabels as key=value (that is the node label the pool owns):\n   `oc get mcp -o json | jq -r '[\"MCP\",\"NODESELECTOR\"], (.items[] | [.metadata.name, ((.spec.nodeSelector.matchLabels // {})|to_entries|map(.key+\"=\"+(.value|tostring))|sort|join(\",\"))]) | @tsv' | column -t`\n4. Compare the NODESELECTOR strings. PASS = the profile equals exactly one MCP. FAIL none = those nodes are not in a pool, so the profile's MachineConfigs will not roll. FAIL two or more = the selector is too broad and can tune the wrong nodes."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

