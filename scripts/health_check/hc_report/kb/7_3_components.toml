[[checks]]
check_id = "7.3.monitoring.config"
title = "Monitoring configuration"
description = "The cluster monitoring stack (Prometheus and Alertmanager) is currently using temporary storage. This means all collected metrics, alert history, and dashboard data are lost whenever a monitoring pod restarts. For production clusters, persistent storage must be configured so metrics survive restarts."
recommendation = "Add a volumeClaimTemplate PVC on an available StorageClass for Prometheus and Alertmanager, apply, and confirm Bound. Without it, metrics vanish on every restart.\n\nVerification:\n1. Print whether `prometheusK8s` has a `volumeClaimTemplate`:\n   `oc -n openshift-monitoring get configmap cluster-monitoring-config -o jsonpath='{.data.config\\.yaml}' | grep -E 'prometheusK8s:|volumeClaimTemplate:|retention:'`\n2. If `volumeClaimTemplate` is missing, add one that references an available StorageClass and apply:\n   `oc apply -f <cluster-monitoring-config.yaml> -n openshift-monitoring`\n3. Verify Prometheus PVCs are Bound:\n   `oc get pvc -n openshift-monitoring`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "Prometheus, Alertmanager, and related monitoring pods"
impact_detail = "Updating cluster-monitoring-config redeploys affected monitoring components and can create temporary gaps in metrics collection, alert evaluation, or dashboards."
summary_patterns = [
  { contains = "volumeClaimTemplate", text = "cluster-monitoring-config has no volumeClaimTemplate; Prometheus storage is ephemeral." },
]

