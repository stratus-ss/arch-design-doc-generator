[[checks]]
check_id = "7.3.co.*"
pattern = true
title = "Cluster Operator"
description = "ClusterOperators provide core cluster functionality. When a cluster operator is\ndegraded or unavailable, one of its managed components is not functioning as\nintended and cluster stability or supportability may be impaired.\n"
recommendation = "Bring every ClusterOperator to `Available=True`, `Progressing=False`, `Degraded=False`. Name the failing condition, then inspect that operator namespace. Fix the dependency (certificates, DNS, storage, quota) before you restart the operand."
verification = "1. Describe the affected cluster operator to identify the failing conditions:\n   `oc describe clusteroperator <name>`\n2. Review the operator deployment and pods in the affected namespace:\n   `oc get pods -n <operator-ns>`\n3. Inspect the relevant operator pod logs for the root cause:\n   `oc logs -n <operator-ns> <pod>`\n4. Review recent namespace events to correlate certificate, dependency, networking, or resource issues:\n   `oc get events -n <operator-ns> --sort-by=.lastTimestamp`\n5. Resolve the underlying dependency or infrastructure issue before restarting operator-managed components."
priority_hint = ""
impact = "workload-shift"
impact_scope = "the degraded operator's operands"
impact_detail = "Fixing the named dependency then reconciling the operator rolls its pods. It does not reboot nodes by itself; Machine Config, etcd, and network children can require a heavier window."

