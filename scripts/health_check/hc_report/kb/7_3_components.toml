[[checks]]
check_id = "7.3.tsr.3_20_linux_cgroups_version"
title = "3.20. Linux Cgroups Version"
description = "Identifies whether the cluster nodes use cgroups v1 or v2. OCP 4.14+ defaults\nto cgroups v2 which provides better resource isolation but may break workloads\nthat depend on cgroups v1 filesystem paths.\n"
# why-rec
# CORRECTED. containerRuntimeVersion is cri-o, not cgroup. Rec leads with `stat -fc %T
# /sys/fs/cgroup` via debug chroot (tmpfs=v2). Debug not executed.
recommendation = "1. Determine cgroup version on each node (not from `containerRuntimeVersion`):\n   `oc debug node/<node> -- chroot /host stat -fc %T /sys/fs/cgroup`\n2. `tmpfs` indicates cgroup v2; `cgroup` indicates v1.\n3. Optionally list the container runtime version for context:\n   `oc get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.status.nodeInfo.containerRuntimeVersion}{\"\\n\"}{end}'`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

