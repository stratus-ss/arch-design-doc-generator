[[checks]]
check_id = "7.3.tsr.3_14_1_platform_load_balancer"
title = "3.14.1. Platform Load Balancer"
description = "Validates the platform-provided load balancer configuration for API and ingress\nVIPs. Misconfigured or unhealthy platform LBs cause API unreachability or\ningress traffic failures.\n"
recommendation = "Keep the platform LB (or UserManaged appliance) reaching the API and apps VIPs: `readyz=ok` and console 80/443 returning 200 or 302."
verification = "1. Print platform type, loadBalancer.type, and API/ingress VIP counts:\n   `oc get infrastructure cluster -o json | jq -r '.status.platformStatus as $ps | ([($ps|to_entries[]) | select(.key != \"type\" and (.value|type==\"object\"))][0].value // {}) as $d | ([\"TYPE\",\"LB\",\"API_VIPS\",\"INGRESS_VIPS\"], [$ps.type, ($d.loadBalancer.type // \"-\"), ((($d.apiServerInternalIPs // (if $d.apiServerInternalIP then [$d.apiServerInternalIP] else [] end)) | length) | tostring), ((($d.ingressIPs // (if $d.ingressIP then [$d.ingressIP] else [] end)) | length) | tostring)]) | @tsv' | column -t -s $'\\t'`\n2. Probe the API through the kubeconfig path (the API VIP/LB). Expect ok:\n   `oc get --raw=/readyz | awk '{print} END{print ($0==\"ok\"?\"PASS\":\"FAIL\"), \"api-readyz\"}'`\n3. Probe ingress 443 and 80 via the console route (apps VIP). Expect 200 or 302:\n   `host=$(oc get route -n openshift-console console -o jsonpath='{.spec.host}'); c443=$(curl -sk -o /dev/null -w '%{http_code}' --connect-timeout 10 \"https://$host\"); c80=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 \"http://$host\"); printf '443 %s\\n80 %s\\n' \"$c443\" \"$c80\" | awk '$2==200 || $2==302 {ok++} END{print ((ok==2)?\"PASS\":\"FAIL\"), \"ingress-80-443\"}'`\n5. User-managed LB probe intervals cannot be read from the cluster. The documented API check is GET /readyz every 5-10s, remove from pool within 30s of failure. Confirm that on the external appliance when LB is UserManaged."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "API and apps VIP / platform load balancer"
impact_detail = "Repairing the platform or UserManaged load balancer can interrupt API 6443 and ingress until readyz and the console return healthy."

