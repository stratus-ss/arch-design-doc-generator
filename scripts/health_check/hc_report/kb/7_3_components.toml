[[checks]]
check_id = "7.3.tsr.3_9_2_storage_local_persistent_volumes"
title = "3.9.2. Storage Local Persistent Volumes"
description = "Checks for local persistent volumes and their binding status. Local PVs tie\nworkloads to specific nodes, which complicates scheduling, failover, and\nmaintenance operations.\n"
recommendation = "Plan drains and disk failure around local-path PVs, or do not use them. A local-path PV pins the workload to that node. Empty list is healthy."
verification = "1. List PVs that have a local path:\n   `oc get pv -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,LOCAL:.spec.local.path --no-headers | awk '$3!=\"<none>\" {print}'`\n2. Verify bound PVCs and assess node-affinity constraints for maintenance planning."
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads pinned to local-path PVs"
impact_detail = "A local-path volume pins the pod to that node. Disk failure or a drain moves or stops that workload; nodes are not rebooted unless you also replace the disk."

