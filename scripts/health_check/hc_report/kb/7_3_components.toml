[[checks]]
check_id = "7.3.dns.operator"
title = "DNS Operator"
description = "The DNS Operator manages CoreDNS and is critical for service discovery. A\ndegraded DNS Operator can cause intermittent name-resolution failures across\nthe cluster.\n"
recommendation = "Bring `dns.operator default` to healthy conditions. If it is degraded, read conditions, then openshift-dns pods. Do not scale CoreDNS until you know whether the Operator or the daemonset is degraded."
verification = "1. Confirm `dns.operator default` (`Available=True`, `Progressing=False`, `Degraded=False`):\n   `oc get dns.operator default -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}' | awk -F= '$1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`\n2. If the operator is not healthy, print conditions:\n   `oc get dns.operator default -o jsonpath='{range .status.conditions[*]}{.type}={.status} reason={.reason}{\"\\n\"}{end}'`\n3. Check DNS pods:\n   `oc get pods -n openshift-dns`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "openshift-dns pods"
impact_detail = "Restoring dns.operator default rolls CoreDNS and can briefly break name resolution. It does not reboot nodes."
finding_group = "dns-operator-health"
finding_group_title = "DNS Operator / CoreDNS health"

