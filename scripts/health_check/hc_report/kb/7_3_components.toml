[[checks]]
check_id = "7.3.tsr.3_22_4_performance_profile_configuration"
title = "3.22.4. Performance Profile Configuration"
description = "Reviews PerformanceProfile configuration details including CPU isolation,\nhugepages, NUMA topology, and real-time kernel settings. Incorrect\nconfiguration can degrade workload performance or waste resources.\n"
recommendation = "Match reserved versus isolated CPU, hugepages, NUMA policy, and the real-time kernel to the platform CPU layout. A patch here generates MachineConfig and reboots the targeted pool. Empty or missing profiles belong on the MCP-match row.\n\nVerification:\n1. Print CPU sets, hugepages, NUMA policy, and realTimeKernel:\n   `oc get performanceprofile -A -o custom-columns=NAME:.metadata.name,RESERVED:.spec.cpu.reserved,ISOLATED:.spec.cpu.isolated,HUGEPAGES:.spec.hugepages,NUMA:.spec.numa.topologyPolicy,RT:.spec.realTimeKernel.enabled`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in targeted MachineConfigPool"
impact_detail = "PerformanceProfile changes generate new MachineConfig and TunedProfile resources that trigger a rolling node reboot in the targeted pool."

