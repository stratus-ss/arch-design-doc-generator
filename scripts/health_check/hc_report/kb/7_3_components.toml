[[checks]]
check_id = "7.3.tsr.3_5_5_etcd_compaction"
title = "TSR etcd compaction"
description = "This check measures how long etcd takes to compact (clean up) its internal database on each control plane node. The reported percentile value (e.g. \"95% quantile: 816ms\") means that 95 out of 100 compaction operations completed within that time. High values indicate the etcd database is under stress — usually from slow disks, a large database, or heavy API traffic — and the cluster's API responsiveness may be degraded."
recommendation = "Defrag if DB SIZE is bloated (typically over 8 GB). Leftover high latency is a disk problem, not a compact-again loop.\n\nVerification:\n1. Check the current etcd database size on every member:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n      Look at the DB SIZE column — healthy clusters are typically under 8 GB.\n2. If the database is large, schedule a defragmentation during a maintenance window:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl defrag --cluster`\n3. After defragmentation, verify that DB SIZE dropped and compaction latency improved.\n4. If compaction latency remains high, investigate disk I/O on the control plane nodes — slow storage is the most common root cause."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Manual etcd defragmentation or backend recovery work affects the control plane and should be done in a planned window with etcd backup protection."
summary_patterns = [
  { contains = "95% quantile", text = "etcd compaction latency is above the expected range." },
]

