[[checks]]
check_id = "7.3.tsr.3_3_custom_resource_definitions"
title = "TSR custom resource definitions"
description = "Orphaned CRDs from uninstalled operators bloat the API schema, slow discovery,\nand can cause conversion webhook errors. CRDs should be cleaned up when the\nowning operator is fully removed.\n"
# why-rec
# CORRECTED. `grep -v '.openshift.io'` is not orphans: lab 161 of 270 CRDs (k8s.io, metal3,
# monitoring.coreos.com, kubevirt, …). Rec groups CRDs by OLM label
# `operators.coreos.com/<package>.<namespace>` then compares to CSVs. Instance check is only for
# owners with no matching CSV.
recommendation = "1. Group CRDs by OLM owner label:\n   `oc get crd -o json | jq -r '[.items[] | .metadata.labels // {} | keys[] | select(startswith(\"operators.coreos.com/\"))] | group_by(.)[] | \"\\(length)\\t\\(.[0])\"'`\n2. List live CSVs:\n   `oc get csv -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase`\n   Owner key is `operators.coreos.com/<package>.<namespace>`. A Succeeded CSV in that namespace whose name starts with `<package>` still owns those CRDs.\n3. For an owner with no matching CSV, list its CRDs:\n   `oc get crd -l operators.coreos.com/<package>.<namespace> -o custom-columns=NAME:.metadata.name`\n4. For each of those names, count instances. Empty means the CRD is unused:\n   `oc get <crd-name> -A --no-headers | wc -l`\n   If the operator is gone and the count is 0, back up then `oc delete crd <crd-name>`.\n5. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/operators/index#crd-managing-resources-from-crds\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "API schema and orphaned operator resources"
impact_detail = "Removing truly orphaned CRDs updates API discovery immediately but does not reboot nodes; verify no live custom resources depend on them before deletion."

