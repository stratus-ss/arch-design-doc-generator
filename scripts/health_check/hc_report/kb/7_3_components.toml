[[checks]]
check_id = "7.3.tsr.3_7_2_monitoring_storage_type"
title = "TSR monitoring storage type"
description = "Platform monitoring stores Prometheus and Alertmanager data on a chosen backend. Typical problems are ephemeral emptyDir (metrics lost on restart) and RWX or file access modes (Red Hat recommends block storage)."
recommendation = "Put Prometheus and Alertmanager on persistent RWO block storage so metrics survive a pod restart. An empty `STORAGECLASS` of `<none>` means they are on emptyDir; that is not acceptable in production. `ReadWriteMany` file backends will attach, but Prometheus wants block. Configuring the volume claim template is a separate change from choosing the class.\n\nVerification:\n1. Confirm Prometheus and Alertmanager have a StorageClass and RWO access. An empty `STORAGECLASS` of `<none>` means emptyDir; `ReadWriteMany` means file storage:\n   `oc get prometheus,alertmanager -n openshift-monitoring -o custom-columns=KIND:.kind,NAME:.metadata.name,STORAGECLASS:.spec.storage.volumeClaimTemplate.spec.storageClassName,ACCESS:.spec.storage.volumeClaimTemplate.spec.accessModes[*] | awk '{print} NR>1 && $3==\"<none>\"{e=1} NR>1 && $4 ~ /ReadWriteMany/{r=1} END{if(e) print \"FAIL emptyDir\"; else if(r) print \"WARNING RWX\"; else print \"PASS\"}'`\n2. List monitoring PVCs and note `PHASE`, `SC`, and `MODE` (empty list means no PVCs):\n   `oc get pvc -n openshift-monitoring -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,SC:.spec.storageClassName,MODE:.spec.accessModes[*]`\n3. Print StorageClass provisioners (match the `SC` from step 2, or the candidates if emptyDir):\n   `oc get sc -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner`\n   `nfs`, `efs`, `azurefile`, or `cephfs` in `PROVISIONER` is file storage (WARNING). Prefer `ReadWriteOnce` on a block provisioner.\n4. `volumeClaimTemplate` in `cluster-monitoring-config` is `7.3.monitoring.config`."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""
summary_patterns = [
  { contains = "emptyDir", text = "Monitoring storage is emptyDir; metrics are lost on pod restart." },
  { contains = "RWX", text = "Monitoring uses RWX/file storage; block storage is recommended." },
  { contains = "file storage", text = "Monitoring uses RWX/file storage; block storage is recommended." },
]

