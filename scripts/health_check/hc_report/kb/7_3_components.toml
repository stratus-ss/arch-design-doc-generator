title = "TSR monitoring storage type"
description = "The monitoring stack storage is configured as \"emptyDir\" (temporary). Prometheus metrics, Alertmanager state, and alert history will be lost whenever monitoring pods restart. This is the storage-type counterpart to the monitoring configuration check above."
recommendation = "1. Check if monitoring PVCs exist:\n   `oc get pvc -n openshift-monitoring`\n2. If no PVCs are bound, update the `cluster-monitoring-config` ConfigMap to\n   include `volumeClaimTemplate` entries for both Prometheus and Alertmanager.\n3. Choose a StorageClass that supports ReadWriteOnce access mode and set\n   retention to match your metrics history requirements (default: 15d).\n4. After applying, confirm pods restart with bound storage:\n   `oc get pods -n openshift-monitoring -w`\n5. Review monitoring scalability guidance:\n   https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/scalability_and_performance/recommended-performance-and-scalability-practices-2#scaling-cluster-monitoring-operator_recommended-infrastructure-practices\n"
