[[checks]]
check_id = "7.3.registry.state"
title = "Internal registry state"
description = "The internal image registry is required for builds and ImageStream-based\ndeployments unless the cluster uses only an external registry. `Removed` means\nthe Operator tore the instance down. `Managed` means the Operator reconciles\nthe registry. `Unmanaged` means the Operator ignores config; a user-managed\nregistry with user-provided storage is valid. `spec.storage.managementState`\nis a separate field: `Unmanaged` storage is user-provided backend, not Operator\nstate.\n"
recommendation = "Confirm whether the cluster is intended to use the OpenShift integrated image registry or an external registry service. If the integrated registry is required for image builds, ImageStreams, internal image distribution, or application workflows, set the Image Registry Operator managementState to Managed and configure a supported, persistent storage backend appropriate for the platform. Keep managementState: Removed only when the internal registry is deliberately disabled and all dependent workflows use an external registry; Unmanaged should be used only when the organization intentionally assumes responsibility for the registry configuration and lifecycle."
verification = "1. Print Operator state and storage ownership:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o custom-columns=STATE:.spec.managementState,STORAGE_MGMT:.spec.storage.managementState,EMPTYDIR:.spec.storage.emptyDir,PVC:.spec.storage.pvc.claim`\n2. Read `STATE` (Image Registry Operator):\n      - `Removed`: no Operator-managed registry. Valid if this cluster uses only an external registry.\n      - `Managed`: Operator reconciles the registry.\n      - `Unmanaged`: Operator ignores config changes. A user-managed registry with user-provided storage is valid.\n3. Read `STORAGE_MGMT` (`spec.storage.managementState`, not `STATE`):\n      - `Managed`: Operator applies default storage settings.\n      - `Unmanaged`: you brought the bucket or PVC. Valid with `STATE=Managed` or `STATE=Unmanaged`.\n4. If this cluster needs an Operator-reconciled registry and `STATE` is `Removed`:\n   `oc patch configs.imageregistry.operator.openshift.io cluster --type=merge -p '{\"spec\":{\"managementState\":\"Managed\"}}'`\n     "
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and dependent build/image workflows"
impact_detail = "Changing registry state or storage rolls registry pods and can briefly interrupt internal image pushes, pulls, and build flows while the new backend comes online."
finding_group = "registry-management-state"
finding_group_title = "Internal registry state"

