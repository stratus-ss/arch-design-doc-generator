[[checks]]
check_id = "7.3.tsr.3_9_5_csi_drivers"
title = "3.9.5. CSI Drivers"
description = "This check lists Container Storage Interface drivers installed on the cluster and whether the Cluster CSI Driver operator manages them. A driver outside that Red Hat operator set is a third-party storage dependency, not proof the driver is broken.\n"
recommendation = "Treat any CSI driver that is not Red Hat-managed as a third-party storage dependency. Confirm that the storage vendor provides active support for the deployed CSI driver and that the driver version, Operator, storage platform or array firmware, and OpenShift release are listed as compatible in the vendor's current support matrix. A driver outside the Red Hat-supported CSI set is a support-boundary finding, not necessarily a health failure. Do not replace or remove it solely because it is vendor-managed; remediate when it is unhealthy, unsupported for the installed or target OpenShift version, lacks an active support path, or is no longer required by any `StorageClass`, `PersistentVolume`, `VolumeSnapshotClass`, or workload."
verification = "1. Classify each CSIDriver against the ClusterCSIDriver CRD allow-list (CSO-managed OpenShift CSI operators). `RH_CSO=no` is not Red Hat-provided via that operator. ODF/LVMS are Red Hat products outside this list — use the doc URL for those names:\n   `oc get csidriver -o json | jq -r --argjson enum \"$(oc get crd clustercsidrivers.operator.openshift.io -o json | jq '[.spec.versions[] | select(.storage==true) | .. | objects | select(has(\"enum\") and any(.enum[]; .==\"ebs.csi.aws.com\")) | .enum[]] | unique')\" 'def in_enum($n): ($enum | index($n)) != null; ([\"DRIVER\",\"RH_CSO\"], (.items[] | [.metadata.name, (if in_enum(.metadata.name) then \"yes\" else \"no\" end)])) | @tsv' | column -t -s $'\\t'`\n2. Print VolumeSnapshotClass drivers (snapshot CSI names can appear here with no StorageClass). An empty list means none:\n   `oc get volumesnapshotclass -o json | jq -r '([\"NAME\",\"DRIVER\"], (.items[]? | [.metadata.name, (.driver // \"-\")])) | @tsv' | column -t -s $'\\t' | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"INFO\":\"PASS\"), n+0, \"volumesnapshotclasses\"}'`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

