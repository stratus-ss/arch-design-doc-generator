[[checks]]
check_id = "7.3.tsr.3_17_5_network_config_consistent"
title = "3.17.5. Network Config Consistent"
description = "Validates that node network configurations are consistent across nodes in the\nsame role. Inconsistent network config can cause routing asymmetry, DNS\nfailures, and unpredictable connectivity issues.\n"
recommendation = "Where NNCP exists, bring it to Available. Progressing is a rollout; Degraded is a failed enactment. Missing CRDs means host NICs are not NNCP-managed."
verification = "1. List kubernetes-nmstate CRDs. If neither CRD exists, host NICs are not managed by nmstate and this check does not apply:\n   `oc get crd nodenetworkconfigurationpolicies.nmstate.io nodenetworkconfigurationenactments.nmstate.io -o name --ignore-not-found | awk '{print; n++} END{print (n==2?\"PASS nmstate-crds\":\"INFO n/a-nmstate\")}'`\n2. Confirm each NodeNetworkConfigurationPolicy from the stock table (`STATUS=Available` is **PASS**, Progressing is **WARNING**, Degraded is **FAIL**):\n   `oc get nncp | awk 'NR==1{print \"RESULT\",$0; next} {n++; r=\"FAIL\"; if ($2==\"Available\") r=\"PASS\"; else if ($2==\"Progressing\") r=\"WARNING\"; print r, $0} END{if (n==0) print \"INFO 0 nncp\"}'`\n3. Confirm each NodeNetworkConfigurationEnactment the same way.\n   `oc get nnce | awk 'NR==1{print \"RESULT\",$0; next} {n++; r=\"FAIL\"; if ($2==\"Available\") r=\"PASS\"; else if ($2==\"Progressing\") r=\"WARNING\"; print r, $0} END{if (n==0) print \"INFO 0 nnce\"}'`\n4. Review the Kubernetes NMState Operator using the link in the reference."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes targeted by NNCP"
impact_detail = "Applying or correcting NNCPs can briefly disrupt host networking; use controlled rollout settings such as `maxUnavailable` and validate rollback behavior."

