[[checks]]
check_id = "7.3.tsr.3_8_3_ingress_sharding"
title = "3.8.3. Ingress Sharding"
description = "Checks whether ingress sharding is configured to distribute routes across\nmultiple ingress controllers. Sharding enables traffic isolation, separate\nscaling, and domain-based routing policies.\n"
# why-rec
# CORRECTED. `custom-columns` of `.spec.routeSelector` prints a Go map dump
# (`map[matchExpressions:[map[...]]]`); empty NS is `<none>` with no meaning.
# One controller is not sharding. Lab `default` has a platform
# `hypershift.openshift.io/hosted-control-plane:DoesNotExist` routeSelector —
# that is not a user shard. Rec extracts matchLabels/matchExpressions as
# `key=value` / `key:Operator[:values]`, scores 1 vs many controllers the same
# way as the engine, then counts routes by `status.ingress[].routerName` and
# lists dual-admitted routes (documented overlap: unrestricted default still
# admits shard routes). Lab: INFO n=1; 13 routes on default; OVERLAP 0.
# HAProxy status is 3.8.1. Tuning is 3.8.2.
recommendation = "1. Print NAME, DOMAIN, REPLICAS, and selector matchLabels/matchExpressions (`-` = none; an empty selector admits all routes). `hypershift.openshift.io/hosted-control-plane:DoesNotExist` on `default` is the platform filter, not a user shard:\n   `oc get ingresscontroller -n openshift-ingress-operator -o json | jq -r 'def selector_text: [((.matchLabels // {}) | to_entries | map(.key+\"=\"+(.value|tostring))), ((.matchExpressions // []) | map(.key+\":\"+.operator + (if ((.values // [])|length)>0 then \":\"+((.values)|join(\"|\")) else \"\" end)))] | flatten | join(\",\") | if .==\"\" then \"-\" else . end; ([\"NAME\",\"DOMAIN\",\"REPLICAS\",\"ROUTE_SEL\",\"NS_SEL\"], (.items[] | [.metadata.name, (.status.domain // .spec.domain // \"-\"), (.spec.replicas|tostring), ((.spec.routeSelector // {}) | selector_text), ((.spec.namespaceSelector // {}) | selector_text)])) | @tsv' | column -t`\n2. Score controller count (1 = sharding not applicable; extra controllers with `-`/`-` also admit all routes):\n   `oc get ingresscontroller -n openshift-ingress-operator -o json | jq -r 'def nonempty_selector: ((.matchLabels // {})|length)>0 or ((.matchExpressions // [])|length)>0; def has_sel: ((.spec.routeSelector // {}) | nonempty_selector) or ((.spec.namespaceSelector // {}) | nonempty_selector); .items as $items | ($items|length) as $n | ([$items[] | select(has_sel)]|length) as $sharded | if $n==1 then \"INFO n=1 sharding not applicable\" elif $sharded==0 then \"WARNING n=\"+($n|tostring)+\" controllers none sharded\" else \"PASS n=\"+($n|tostring)+\" sharded=\"+($sharded|tostring) end'`\n3. Count routes by admitted router (`status.ingress[].routerName`). OVERLAP is routes admitted by more than one controller (unrestricted `default` still admits shard routes):\n   `oc get route -A -o json | jq -r '.items as $routes | ([\"ROUTER\",\"ADMITTED\"], ([$routes[] | (([.status.ingress[]?.routerName] | unique) | if length==0 then [\"none\"] else . end)[]] | group_by(.)[] | [.[0], (length|tostring)]), [\"OVERLAP\", ([$routes[] | select(([.status.ingress[]?.routerName] | unique | length)>1)] | length | tostring)]) | @tsv' | column -t`\n4. Print overlapping routes (empty = none):\n   `oc get route -A -o json | jq -r '([\"NS\",\"NAME\",\"ROUTERS\"], (.items[] | select(([.status.ingress[]?.routerName] | unique | length)>1) | [.metadata.namespace, .metadata.name, ([.status.ingress[]?.routerName]|unique|join(\",\"))])) | @tsv' | column -t | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"PASS\":\"WARNING\"), n+0, \"overlap\"}'`\n5. HAProxy status is 3.8.1. Tuning is 3.8.2.\n6. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/networking_overview/index#nw-ingress-sharding_configuring-ingress\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

