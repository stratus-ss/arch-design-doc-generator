[[checks]]
check_id = "7.3.co.kube-apiserver"
title = "Cluster Operator: kube-apiserver"
description = "The kube-apiserver operator manages the Kubernetes API server on all control\nplane nodes. When degraded, API availability is impaired — affecting all\ncluster operations including workload scheduling and oc/kubectl commands.\n"
recommendation = "Bring kube-apiserver to `Available=True`, `Progressing=False`, `Degraded=False`. Treat a degraded API as an incident: read conditions, then logs and events. Do not delete the static pod until you know why it degraded."
verification = "1. Confirm kube-apiserver (`Available=True`, `Progressing=False`, `Degraded=False`):\n   `oc get co kube-apiserver --no-headers | awk '{print ($3==\"True\" && $4==\"False\" && $5==\"False\"?\"PASS\":\"FAIL\"), $0}'`\n2. If the operator is not healthy, print conditions:\n   `oc get co kube-apiserver -o jsonpath='{range .status.conditions[*]}{.type}={.status} reason={.reason}{\"\\n\"}{end}'`\n3. Inspect API server logs:\n   `oc -n openshift-kube-apiserver logs kube-apiserver-<node> -c kube-apiserver`\n4. Check events:\n   `oc get events -n openshift-kube-apiserver --sort-by=.lastTimestamp`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane API"
impact_detail = "Restoring a degraded kube-apiserver can restart control-plane static pods and may reduce API availability until the operator is healthy."

