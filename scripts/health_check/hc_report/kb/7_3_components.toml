[[checks]]
check_id = "7.3.tsr.3_5_6_etcd_defragmentation"
title = "3.5.6. ETCD Defragmentation"
description = "Checks whether etcd defragmentation is needed or has been recently performed.\nFragmented backends consume more disk space than necessary and increase\nfsync latency.\n"
recommendation = "Defrag in a maintenance window when fragmentation (DB SIZE minus in-use) is high. Take a backup first; the cluster command locks members.\n\nVerification:\n1. Compare DB SIZE vs IN USE columns from:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl endpoint status --cluster -w table`\n2. If fragmentation is high, schedule defragmentation during maintenance:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl defrag --cluster`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Defragmentation briefly locks each etcd member and can cause transient API latency; schedule during a maintenance window."

