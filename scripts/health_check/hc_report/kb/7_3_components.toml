[[checks]]
check_id = "7.3.tsr.3_9_5_csi_drivers"
title = "3.9.5. CSI Drivers"
description = "Validates installed CSI drivers, their health status, and compatibility with\ncluster storage classes. CSI is the standard interface for storage operations\nand replaces legacy in-tree provisioners.\nThis lists StorageClass provisioners and flags those that are not in the supported CSI set. Snapshot-related provisioners can appear in that list. CSI driver inventory is a separate finding.\n"
recommendation = "Treat RH_CSO=yes as Red Hat-provided via the Cluster CSI Operator; ODF and LVMS are Red Hat products outside that enum. Snapshot classes can list a driver with no StorageClass — that is expected, not a missing provisioner.\n\nVerification:\n1. Classify each CSIDriver against the ClusterCSIDriver CRD allow-list (CSO-managed OpenShift CSI operators). RH_CSO=no is not Red Hat-provided via that operator (nfs.csi.k8s.io is the usual lab case). ODF/LVMS are Red Hat products outside this list — use the doc URL for those names:\n   `oc get csidriver -o json | jq -r --argjson enum \"$(oc get crd clustercsidrivers.operator.openshift.io -o json | jq '[.spec.versions[] | select(.storage==true) | .. | objects | select(has(\"enum\") and any(.enum[]; .==\"ebs.csi.aws.com\")) | .enum[]] | unique')\" 'def in_enum($n): ($enum | index($n)) != null; ([\"DRIVER\",\"RH_CSO\"], (.items[] | [.metadata.name, (if in_enum(.metadata.name) then \"yes\" else \"no\" end)])) | @tsv' | column -t -s $'\\t'`\n2. Print VolumeSnapshotClass drivers (snapshot CSI names can appear here with no StorageClass). An empty list means none:\n   `oc get volumesnapshotclass -o json | jq -r '([\"NAME\",\"DRIVER\"], (.items[]? | [.metadata.name, (.driver // \"-\")])) | @tsv' | column -t -s $'\\t' | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"INFO\":\"PASS\"), n+0, \"volumesnapshotclasses\"}'`\n3. StorageClass provisioner vs CSIDriver presence is 3.9.3. The engine .csi. substring row is 7.3.storage.csi.\n4. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/storage/index#persistent-storage-csi-drivers-supported_persistent-storage-csi"
