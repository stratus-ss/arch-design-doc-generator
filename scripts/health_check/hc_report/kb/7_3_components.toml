[[checks]]
check_id = "7.3.tsr.3_7_2_monitoring_storage_type"
title = "TSR monitoring storage type"
description = "This check evaluates how platform monitoring stores Prometheus and Alertmanager data. Evidence may come from TSR or from deterministic config. Typical failure classes are ephemeral emptyDir (metrics lost on restart) and RWX or file access modes (Red Hat recommends block storage)."
# why-rec
# CORRECTED. Rec said "read TSR evidence". Live fields are Prometheus/Alertmanager
# STORAGECLASS and ACCESS (`<none>` = emptyDir), then PVC MODE, then SC PROVISIONER.
# Drop `--no-headers` so KIND/NAME/STORAGECLASS/ACCESS print. awk skips the header row.
# Lab: FAIL emptyDir, no PVCs, only nfs-csi (file). volumeClaimTemplate is 7.3.monitoring.config.
recommendation = "1. PASS/FAIL Prometheus and Alertmanager storage (`STORAGECLASS` `<none>` is emptyDir; `ReadWriteMany` is file/RWX):\n   `oc get prometheus,alertmanager -n openshift-monitoring -o custom-columns=KIND:.kind,NAME:.metadata.name,STORAGECLASS:.spec.storage.volumeClaimTemplate.spec.storageClassName,ACCESS:.spec.storage.volumeClaimTemplate.spec.accessModes[*] | awk '{print} NR>1 && $3==\"<none>\"{e=1} NR>1 && $4 ~ /ReadWriteMany/{r=1} END{if(e) print \"FAIL emptyDir\"; else if(r) print \"WARNING RWX\"; else print \"PASS\"}'`\n2. Print monitoring PVC `PHASE`, `SC`, and `MODE` (empty = no PVCs):\n   `oc get pvc -n openshift-monitoring -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,SC:.spec.storageClassName,MODE:.spec.accessModes[*]`\n3. Print StorageClass provisioners (match the `SC` from step 2, or the candidates if emptyDir):\n   `oc get sc -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner`\n   `nfs`, `efs`, `azurefile`, or `cephfs` in `PROVISIONER` is file storage (WARNING). Prefer `ReadWriteOnce` on a block provisioner.\n4. `volumeClaimTemplate` in `cluster-monitoring-config` is `7.3.monitoring.config`.\n5. https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/latest/html-single/configuring_core_platform_monitoring/index#configuring-a-persistent-volume-claim_storing-and-recording-data\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""
summary_patterns = [
  { contains = "emptyDir", text = "Monitoring storage is emptyDir; metrics are lost on pod restart." },
  { contains = "RWX", text = "Monitoring uses RWX/file storage; block storage is recommended." },
  { contains = "file storage", text = "Monitoring uses RWX/file storage; block storage is recommended." },
]

