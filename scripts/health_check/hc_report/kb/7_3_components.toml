[[checks]]
check_id = "7.3.tsr.3_5_4_etcd_database_size"
title = "3.5.4. ETCD Database Size"
description = "Monitors the etcd database size to ensure it remains within safe limits.\nA database approaching the space quota (default 8GB) triggers alarms that\nprevent further writes and can freeze the control plane.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Monitors the etcd database size to ensure it remains within safe limits.
# The rec remediates THAT story by starting at `oc -n openshift-etcd exec -c etcd etcd-<node> --
# etcdctl endpoint status --cluster -w table` — the live object/command for this check, not a
# neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# etcdctl endpoint health/status via `oc -n openshift-etcd exec -c etcd` was verified on this lab.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check database size and review the DB SIZE column:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl endpoint status --cluster -w table`\n2. If DB SIZE is approaching quota, review fragmentation in Prometheus and check etcd latency:\n   `(etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes)/1024/1024`\n   `histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))`\n   `histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))`\n3. If fragmentation remains high and DB SIZE greatly exceeds the in-use portion, schedule defragmentation.\n"
recommendation_supported_versions = [
    "4.18",
    "4.19",
    "4.20",
    "4.21",
    "4.22",
]
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

