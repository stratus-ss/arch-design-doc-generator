[[checks]]
check_id = "7.3.tsr.3_17_7_network_vlan_configuration"
title = "3.17.7. Network VLAN Configuration"
description = "Reviews VLAN interface configurations on cluster nodes. VLANs provide network\nsegmentation for storage, management, and workload traffic isolation.\n"
recommendation = "Give VLAN interfaces an ID and a base NIC. A missing either is a dead subinterface. Score day-0 install-config first, then day-2 NNCP. One NAME with two ID/BASE pairs is drift."
verification = "1. Confirm the install-config ConfigMap exists. If it is missing, day-0 VLAN data cannot be read:\n   `oc get cm cluster-config-v1 -n kube-system`\n2. Print day-0 VLAN NAME, ID, and BASE for each host. A missing ID or BASE is a failure:\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | python3 -c 'import sys,yaml,json; json.dump(yaml.safe_load(sys.stdin) or {}, sys.stdout)' | jq -r '.platform | to_entries[] | select(.value|type==\"object\") | (.value.hosts // [])[] | (.networkConfig.interfaces // [])[] | select(.type==\"vlan\") | [.name // \"-\", ((.vlan.id // \"-\")|tostring), (.vlan[\"base-iface\"] // .vlan.baseIface // \"-\")] | @tsv' | awk 'BEGIN{print \"RESULT\\tNAME\\tID\\tBASE\"} {r=\"PASS\"; if ($2==\"-\" || $3==\"-\") r=\"FAIL\"; print r\"\\t\"$0} END{if(NR==0) print \"INFO\\t-\\t-\\t-\"}' | column -t`\n3. Count unique NAME/ID/BASE fingerprints. One NAME with two ID/BASE pairs means drift across hosts. One line means every host matches:\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | python3 -c 'import sys,yaml,json; json.dump(yaml.safe_load(sys.stdin) or {}, sys.stdout)' | jq -r '.platform | to_entries[] | select(.value|type==\"object\") | (.value.hosts // [])[] | (.networkConfig.interfaces // [])[] | select(.type==\"vlan\") | [.name // \"-\", ((.vlan.id // \"-\")|tostring), (.vlan[\"base-iface\"] // .vlan.baseIface // \"-\")] | @tsv' | sort | uniq -c | column -t`\n4. Day-2 NNCP VLANs. If the CRD or resources do not exist, NNCP is not in use:\n   `oc get nncp -o json | jq -r '[\"NNCP\",\"NAME\",\"ID\",\"BASE\"], (.items[] | .metadata.name as $p | .spec.desiredState.interfaces[]? | select(.type==\"vlan\") | [$p, .name, ((.vlan.id // \"-\")|tostring), (.vlan[\"base-iface\"] // .vlan.baseIface // \"-\")]) | @tsv' | column -t`\n5. If both sources are empty, VLANs are not in use."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "VLAN subinterfaces"
impact_detail = "Fixing a missing VLAN ID or base NIC can drop the subinterface until NNCP or day-0 config is corrected and should be performed in a planned window."

