[[checks]]
check_id = "7.3.tsr.3_8_2_ingress_controller_tuning"
title = "3.8.2. Ingress Controller Tuning"
description = "Reviews ingress controller tuning parameters such as thread count, connection\ntimeouts, and resource limits. Suboptimal tuning can cause connection drops\nunder load or excessive resource consumption.\n"
recommendation = "Leave Operator default tuningOptions unless you have a measured reason to change them. Treat health-check intervals below 5s as excess probe load. Scale to traffic; do not print the CR as the recommendation."
verification = "1. Print named `tuningOptions` fields (`<none>` or `0s` = Operator default):\n   `oc get ingresscontroller default -n openshift-ingress-operator -o custom-columns=NAME:.metadata.name,THREADS:.spec.tuningOptions.threadCount,MAXCONN:.spec.tuningOptions.maxConnections,CLIENT:.spec.tuningOptions.clientTimeout,SERVER:.spec.tuningOptions.serverTimeout,TUNNEL:.spec.tuningOptions.tunnelTimeout,HEALTH:.spec.tuningOptions.healthCheckInterval,RELOAD:.spec.tuningOptions.reloadInterval | column -t`\n2. Treat empty/`0s` as defaults (engine is **INFO** either way):\n   `oc get ingresscontroller default -n openshift-ingress-operator -o json | jq -r '(.spec.tuningOptions // {}) as $t | [$t | to_entries[] | select(.value != null and .value != \"\" and .value != 0 and .value != \"0s\")] as $custom | if ($custom|length)==0 then \"PASS defaults\" else \"INFO custom \"+($custom | map(.key+\"=\"+(.value|tostring)) | join(\" \")) end'`\n3. Documented defaults when `<none>` or `0s` (IngressController CRD): `threadCount` 4 (max 64), `maxConnections` 50000, `clientTimeout`/`serverTimeout` 30s, `clientFinTimeout`/`serverFinTimeout` 1s, `tunnelTimeout` 1h, `healthCheckInterval` 5s, `reloadInterval` 5s, `tlsInspectDelay` 5s. `healthCheckInterval` below 5s causes excess backend probes. Leave defaults unless you have a measured need.\n4. Print router container requests/limits:\n   `oc get deploy -n openshift-ingress -o custom-columns=NAME:.metadata.name,CPU_REQ:.spec.template.spec.containers[0].resources.requests.cpu,MEM_REQ:.spec.template.spec.containers[0].resources.requests.memory,CPU_LIM:.spec.template.spec.containers[0].resources.limits.cpu,MEM_LIM:.spec.template.spec.containers[0].resources.limits.memory | column -t`\n      Empty `CPU_LIM`/`MEM_LIM` is the Operator default.\n5. Compare IngressController tuning parameters to the documented defaults using the link in the reference."
priority_hint = ""
impact = "workload-shift"
impact_scope = "IngressController pods"
impact_detail = "Changing tuningOptions rolls router pods and can briefly interrupt ingress. Leave Operator defaults unless you have a measured reason."

