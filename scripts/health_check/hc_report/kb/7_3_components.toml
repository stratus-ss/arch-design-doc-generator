[[checks]]
check_id = "7.3.tsr.3_9_3_dynamic_storage_provisioner_plugins"
title = "3.9.3. Dynamic Storage Provisioner Plugins"
description = "This check evaluates dynamic provisioner plugins. Failures include a provisioner that cannot bind volumes and a CSI (or in-tree) provisioner that Red Hat does not support for this platform."
recommendation = "Classify the StorageClass before troubleshooting unbound PVCs: migrate in-tree provisioners to a supported CSI driver, investigate kubernetes.io/no-provisioner classes as static/local-storage designs, and remediate CSI provisioners that lack a matching healthy CSIDriver. For supported CSI classes, use PVC events and provisioner logs to resolve binding failures such as invalid parameters, insufficient backend capacity, topology, access-mode, or credential issues."
verification = "1. Print platform type:\n   `oc get infrastructure cluster -o custom-columns=TYPE:.status.platformStatus.type`\n2. List installed CSIDriver names:\n   `oc get csidriver -o custom-columns=DRIVER:.metadata.name | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"INFO\":\"PASS\"), n+0, \"csidrivers\"}'`\n3. Print each StorageClass provisioner (empty needs action no-storageclasses):\n   `oc get sc -o custom-columns=SC:.metadata.name,PROVISIONER:.provisioner | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"FAIL\":\"INFO\"), n+0, \"storageclasses\"}'`\n4. Classify each StorageClass provisioner as static (kubernetes.io/no-provisioner), in-tree (other kubernetes.io/* names), csi (provisioner matches an installed CSIDriver), or missing-driver (needs action):\n   `oc get sc -o json | jq -r --argjson drivers \"$(oc get csidriver -o json | jq -c '[.items[].metadata.name]')\" '[\"SC\",\"PROVISIONER\",\"KIND\"], (.items[] | .provisioner as $p | [.metadata.name, $p, (if $p==\"kubernetes.io/no-provisioner\" then \"static\" elif ($p|startswith(\"kubernetes.io/\")) then \"in-tree\" elif ($drivers|index($p)) then \"csi\" else \"missing-driver\" end)]) | @tsv' | column -t | awk 'NR==1{print; next} {print; n++; if($3==\"missing-driver\") miss=1; else if($3==\"in-tree\") tree=1; else if($3==\"static\") stat++} END{if(n==0) print \"FAIL no-storageclasses\"; else if(miss) print \"FAIL missing-driver\"; else if(tree) print \"WARNING in-tree\"; else if(stat==n) print \"INFO no-dynamic-provisioners\"; else print \"PASS plugins-present\"}'`\n5. Print not-Bound PVCs (empty = none):\n   `oc get pvc -A -o json | jq -r '([\"NS\",\"PVC\",\"PHASE\",\"SC\"], (.items[] | select(.status.phase != \"Bound\") | [.metadata.namespace, .metadata.name, .status.phase, (.spec.storageClassName // \"<none>\")])) | @tsv' | column -t -s $'\\t' | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"PASS\":\"FAIL\"), n+0, \"unbound\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "storage platform and workloads using the affected StorageClasses"
impact_detail = "Consult the storage vendor for the impact of any CSI operator install or legacy-to-CSI migration. Red Hat does not define a single impact profile for third-party storage migrations; cutover can range from adding CSI pods with no node reboot to a planned backend migration that affects volume provisioning and attached workloads."

