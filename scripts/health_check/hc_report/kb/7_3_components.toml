[[checks]]
check_id = "7.3.tsr.3_15_machine_config_pool"
title = "3.15. Machine Config Pool"
description = "Validates `MachineConfigPool` status including update progress, degraded nodes,\nand configuration drift. Degraded or paused MCPs indicate nodes that are not\napplying the desired machine configuration.\n"
recommendation = "Ensure every `MachineConfigPool` is in a stable state: `UPDATED=True`, `UPDATING=False`, `DEGRADED=False`, `spec.paused=false`, and machine counts that match the pool's expected membership. Investigate any paused pool before a cluster upgrade, because it prevents the Machine Config Operator from applying configuration updates."
verification = "1. Confirm each pool from the stock table (`UPDATED=True`, `UPDATING=False`, `DEGRADED=False`, `MACHINECOUNT=READYMACHINECOUNT`=UPDATEDMACHINECOUNT, `DEGRADEDMACHINECOUNT=0`). `UPDATING=True` is **WARNING**:\n   `oc get mcp | awk 'NR==1{print \"RESULT\",$0; next} {r=\"FAIL\"; if ($5==\"True\" || $9+0>0 || $3!=\"True\" || $6!=$7 || $6!=$8) r=\"FAIL\"; else if ($4==\"True\") r=\"WARNING\"; else r=\"PASS\"; print r, $0}'`\n2. Confirm paused (true needs action):\n   `oc get mcp -o custom-columns=NAME:.metadata.name,PAUSED:.spec.paused | awk 'NR==1{print \"RESULT\",$0; next} {print ($2==\"true\"?\"FAIL\":\"PASS\"), $0}'`\n3. Membership: master MACHINES should equal master-labeled nodes; worker MACHINES should equal worker-only nodes (compact: `worker=0` because masters also have the worker role):\n   `oc get mcp -o custom-columns=NAME:.metadata.name,MACHINES:.status.machineCount && \\\n   oc get nodes -l node-role.kubernetes.io/master --no-headers | awk 'END{print NR+0, \"master-labeled\"}' && \\\n   oc get nodes -l 'node-role.kubernetes.io/worker,!node-role.kubernetes.io/master' --no-headers 2>/dev/null | awk 'END{print NR+0, \"worker-only\"}'`\n4. If `DEGRADED=True`, print reason/message (empty = none):\n   `oc get mcp -o json | jq -r '.items[] | .metadata.name as $n | .status.conditions[]? | select(.type==\"Degraded\" and .status==\"True\") | [$n, (.reason // \"-\"), (.message // \"-\")] | @tsv'`\n5. Confirm unique nodeSelector per pool:\n   `oc get mcp -o json | jq -r '[.items[] | .spec.nodeSelector|tostring] | group_by(.) | map(select(length>1)) | if length==0 then \"PASS unique-nodeSelectors\" else \"FAIL duplicate-nodeSelectors\" end'`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the paused, degraded, or updating pool"
impact_detail = "Resolving MCP degradation may require the MCO to drain and reboot stuck nodes to complete configuration rollout."
include_in_findings = false

