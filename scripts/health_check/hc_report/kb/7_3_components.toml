[[checks]]
check_id = "7.3.tsr.3_13_webhooks"
title = "TSR admission webhooks"
description = "Webhooks intercept every API request (e.g. creating pods, updating configs) and can approve, reject, or modify them. If a webhook's backing service is down or slow, it can block all API operations cluster-wide. This check flags webhooks that monitor critical resources or are configured to hard-fail (failurePolicy=Fail) when their service is unavailable."
recommendation = "1. List all webhook configurations and their target services:\n   `oc get validatingwebhookconfigurations,mutatingwebhookconfigurations`\n2. For each webhook, check if its backing service is running:\n   `oc get endpoints <service-name> -n <namespace>`\n3. For non-critical webhooks, consider changing `failurePolicy` from \"Fail\"\n   to \"Ignore\" so the webhook cannot block cluster operations when its\n   service is unavailable.\n4. Reduce `timeoutSeconds` to 5-10s for webhooks that are not performance-critical.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "API admission path"
impact_detail = "Webhook tuning applies live without node restarts, but it can immediately change whether API requests are blocked, mutated, or allowed."

