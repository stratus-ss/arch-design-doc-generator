check_id = "7.3.deprecated_apis"
title = "Deprecated APIs"
description = "Clusters cannot upgrade past the version where a deprecated API is removed if\nactive usage still exists. Use `oc get apirequestcounts` to identify callers\nand update clients before the next minor upgrade.\n"
recommendation = "Change clients — manifests, Helm charts, and Operators — off any API the next minor will remove. Identify callers from APIRequestCount. Do not try to keep the old API on the apiserver."
verification = "1. Identify which clients are using deprecated APIs:\n   `oc get apirequestcounts`\n2. Update manifests, Helm charts, and Operators to use current API versions."
