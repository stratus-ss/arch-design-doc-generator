[[checks]]
check_id = "7.3.tsr.3_8_3_ingress_sharding"
title = "3.8.3. Ingress Sharding"
description = "Checks whether ingress sharding is configured to distribute routes across\nmultiple ingress controllers. Sharding enables traffic isolation, separate\nscaling, and domain-based routing policies.\n"
recommendation = "If you run more than one IngressController, keep selectors from overlapping unless that overlap is intentional. A single controller with empty selectors means sharding is not in use and is normal."
verification = "1. List controllers (1 row = sharding not applicable):\n   `oc get ingresscontroller -n openshift-ingress-operator`\n2. Print routeSelector and namespaceSelector per controller ({} / empty admits all routes). hypershift.openshift.io/hosted-control-plane:DoesNotExist on default is the platform filter, not a user shard:\n   `oc get ingresscontroller -n openshift-ingress-operator -o json | jq -r '.items[] | [.metadata.name, ((.spec.routeSelector // {})|tostring), ((.spec.namespaceSelector // {})|tostring)] | @tsv'`\n3. Count routes by admitted router. OVERLAP is routes admitted by more than one controller (unrestricted default still admits shard routes):\n   `oc get route -A -o json | jq -r '.items as $routes | ([\"ROUTER\",\"ADMITTED\"], ([$routes[] | (([.status.ingress[]?.routerName] | unique) | if length==0 then [\"none\"] else . end)[]] | group_by(.)[] | [.[0], (length|tostring)]), [\"OVERLAP\", ([$routes[] | select(([.status.ingress[]?.routerName] | unique | length)>1)] | length | tostring)]) | @tsv' | column -t`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "IngressControllers whose selectors overlap"
impact_detail = "Fixing overlapping selectors reschedules routes and router pods and can briefly interrupt ingress for the moved routes."

