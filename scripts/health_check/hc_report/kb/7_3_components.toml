[[checks]]
check_id = "7.3.webhooks.validatingwebhooks"
title = "Validating admission webhooks"
description = "Validating admission webhooks admit or deny API requests without changing the\nobject. A `failurePolicy=Fail` hook or a slow/down backend can reject creates\nand updates cluster-wide (pods, configs, CRDs). This check is the live scan of\n`ValidatingWebhookConfiguration` timeout and failurePolicy. It is not the\nmutating (object-rewrite) scan. TSR worksheet 3.13 covers both kinds as one\nrow and is chapter 7 only. Insights `7.7.ccx_internal.webhooks_check` is a\nseparate dataset and is also chapter 7 only.\n"
# why-rec
# CORRECTED. Story is admit/deny on ValidatingWebhookConfiguration, not mutating.
# Default `oc get` lacks timeout/failurePolicy. Split into three short jq
# commands (fail_policy count, timeout>10 table, Fail+critical-ns). Tables print headers
# and go through `column -t`. Lab: WARNING 43, WARNING 9 timeout>10, PASS 0 fail_tier.
# Keep this rec distinct from 7.3.webhooks.mutatingwebhooks (C-05).
recommendation = "1. This is the validating (admit/deny) scan. Count `failurePolicy=Fail` hooks (WARNING if >0; shipped operators commonly use Fail with an empty selector):\n   `oc get validatingwebhookconfigurations -o json | jq '[.items[].webhooks[]? | select(.failurePolicy==\"Fail\")] | length' | awk '{print ($1==0?\"PASS\":\"WARNING\"), \"fail_policy=\"$1}'`\n2. Print `CONFIG`, `HOOK`, `TIMEOUT`, `POLICY`, `SERVICE` for `timeoutSeconds>10` (WARNING if any rows):\n   `oc get validatingwebhookconfigurations -o json | jq -r '\"CONFIG\\tHOOK\\tTIMEOUT\\tPOLICY\\tSERVICE\", (.items[] as $config | $config.webhooks[]? | select((.timeoutSeconds // 10) > 10) | [$config.metadata.name, .name, (.timeoutSeconds // 10 | tostring), (.failurePolicy // \"Ignore\"), ((.clientConfig.service.namespace // \"-\")+\"/\"+(.clientConfig.service.name // \"-\"))] | @tsv)' | column -t | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"PASS\":\"WARNING\"), n+0, \"timeout>10\"}'`\n   Empty: no timeout WARNING.\n3. Print Fail hooks whose selector values name `openshift-*`, `kube-system`, `kube-public`, or `default` (FAIL if any rows):\n   `oc get validatingwebhookconfigurations -o json | jq -r '\"CONFIG\\tHOOK\\tNS_VALUES\", (.items[] as $config | $config.webhooks[]? | select(.failurePolicy==\"Fail\") | [((.namespaceSelector.matchLabels // {})[]), (.namespaceSelector.matchExpressions[]?.values[]?)] as $ns | select(any($ns[]; type==\"string\" and (startswith(\"openshift-\") or .==\"kube-system\" or .==\"kube-public\" or .==\"default\"))) | [$config.metadata.name, .name, ($ns|join(\",\"))] | @tsv)' | column -t | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"PASS\":\"FAIL\"), n+0, \"fail_tier\"}'`\n   Empty: no FAIL from this check. PASS on 1–3: this check is done.\n4. For each remaining SERVICE, print ready/notReady:\n   `oc get endpointslice -n <ns> -l kubernetes.io/service-name=<svc> -o json | jq '{ready: ([.items[].endpoints[]? | select(.conditions.ready==true)] | length), notReady: ([.items[].endpoints[]? | select(.conditions.ready!=true)] | length)}'`\n   `ready=0` means the webhook backend is down.\n5. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/architecture/index#configuring-dynamic-admission_admission-plug-ins\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

