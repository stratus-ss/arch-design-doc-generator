[[checks]]
check_id = "7.3.tsr.3_17_6_network_bond_configuration"
title = "3.17.6. Network Bond Configuration"
description = "This check reviews host bond configuration. A typical warning is active-backup (or equivalent) where only one slave carries traffic, so the bond does not share load."
recommendation = "Use 802.3ad (LACP) or balance-xor with at least two links when the design requires both redundancy and load sharing; these supported kernel bond modes require corresponding switch-side aggregation configuration. Use active-backup when simple failover is the objective, as it provides redundancy but sends traffic through only one active link. For OVS-based bonding, balance-slb is also supported for source load balancing on suitable bridge designs."
verification = "1. Confirm the install-config ConfigMap exists. If it is missing, day-0 bond data cannot be read:\n   `oc get cm cluster-config-v1 -n kube-system`\n2. List day-0 bond name, mode, and port count from install-config. Active-backup or fewer than two ports is a warning; a load-sharing mode with at least two ports is healthy:\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | python3 -c 'import sys,yaml,json; json.dump(yaml.safe_load(sys.stdin) or {}, sys.stdout)' | jq -r '.platform | to_entries[] | select(.value|type==\"object\") | (.value.hosts // [])[] | (.networkConfig.interfaces // [])[] | select(.type==\"bond\") | [.name // \"-\", (.[\"link-aggregation\"].mode // \"-\"), ((.[\"link-aggregation\"].port // .[\"link-aggregation\"].ports // [])|length)] | @tsv' | awk 'BEGIN{print \"RESULT\\tNAME\\tMODE\\tPORTS\"} {r=\"WARNING\"; if ($2!=\"active-backup\" && $2!=\"active_backup\" && $2!=\"-\" && $3+0>=2) r=\"PASS\"; print r\"\\t\"$0} END{if(NR==0) print \"INFO\\t-\\t-\\t0\"}' | column -t`\n3. Count unique NAME/MODE/PORTS fingerprints. The count shows how many hosts share that bond layout:\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | python3 -c 'import sys,yaml,json; json.dump(yaml.safe_load(sys.stdin) or {}, sys.stdout)' | jq -r '.platform | to_entries[] | select(.value|type==\"object\") | (.value.hosts // [])[] | (.networkConfig.interfaces // [])[] | select(.type==\"bond\") | [.name // \"-\", (.[\"link-aggregation\"].mode // \"-\"), ((.[\"link-aggregation\"].port // .[\"link-aggregation\"].ports // [])|length)] | @tsv' | sort | uniq -c | column -t`\n4. Day-2 NNCP bonds. If the CRD or resources do not exist, NNCP is not in use:\n   `oc get nncp -o json | jq -r '[\"NNCP\",\"NAME\",\"MODE\",\"PORTS\"], (.items[] | .metadata.name as $p | .spec.desiredState.interfaces[]? | select(.type==\"bond\") | [$p, .name, (.[\"link-aggregation\"].mode // \"-\"), ((.[\"link-aggregation\"].port // .[\"link-aggregation\"].ports // [])|length)]) | @tsv' | column -t`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "bonded host interfaces and attached workloads"
impact_detail = "Changing bond mode or switch aggregation can drop that node's connectivity until LACP or failover is correct and should be performed in a planned window."

