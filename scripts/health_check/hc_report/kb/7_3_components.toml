[[checks]]
check_id = "7.3.tsr.3_5_5_etcd_compaction"
title = "TSR etcd compaction"
description = "This check measures how long etcd takes to compact (clean up) its internal database on each control plane node. The reported percentile value (e.g. \"95% quantile: 816ms\") means that 95 out of 100 compaction operations completed within that time. The TSR NOTE (KCS 6271341) is about 200 ms on a small cluster and no more than 800–900 ms on a large cluster (20+ workers); that is not an OCP HTML SLA. Values above that usually mean slow disks, a large database, or heavy API traffic, and API responsiveness may be degraded."
recommendation = "Keep 95th-percentile compaction under about 200 ms on a small cluster, or under 800–900 ms on a large cluster (20+ workers). If history is not compacting, compact to the current revision in a maintenance window. Compaction truncates MVCC history; it does not shrink DB SIZE on disk. Persistent latency after compact is control-plane disk contention, database growth, or high API traffic."
verification = "1. Check the current etcd database size on every member:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n      Look at the DB SIZE column — healthy clusters are typically under 8 GB.\n2. Print the current revision from JSON status:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --write-out json`\n3. If history needs compaction, compact to that revision during a maintenance window:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl --command-timeout=600s compact <revision>`\n4. After compact, **PASS** when compaction latency improved. DB SIZE on disk does not drop until defragmentation. If compaction latency remains high, investigate disk I/O on the control plane nodes — slow storage is the most common root cause."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Manual etcd compact is a control-plane operation and should be done in a planned window with etcd backup protection."
summary_patterns = [
  { contains = "95% quantile", text = "etcd compaction p95 exceeds ~200 ms (small cluster) or 800–900 ms (20+ workers)." },
]

