title = "3.9.1. Storage Provisioner Plugins"
description = "Validates installed storage provisioners and their associated StorageClasses.\nMissing or misconfigured provisioners prevent dynamic volume creation and\ncan block workload deployments.\n"
recommendation = "Keep at least one StorageClass and exactly one default. New PVCs that omit a class stay Pending without that. Local-path PVs, unsupported drivers, and bind health are separate storage rows.\n\nVerification:\n1. Print StorageClass PROVISIONER, reclaim policy, binding mode, expansion, and age ((default) marks the default class):\n   `oc get storageclass | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"FAIL\":\"PASS\"), n+0, \"storageclasses\"}'`\n      Empty: no provisioners.\n2. Confirm the default class name. Zero defaults is WARNING (PVCs that omit storageClassName stay Pending). Patch is 7.3.storage.default_sc:\n   `oc get storageclass -o json | jq -r '[.items[] | select(.metadata.annotations[\"storageclass.kubernetes.io/is-default-class\"]==\"true\") | .metadata.name] | if length==0 then \"WARNING no-default\" elif length>1 then \"WARNING multiple-default=\"+join(\",\") else \"PASS default=\"+.[0] end'`\n3. Count PVCs per StorageClass (usage; bind health is 3.9.4 / 7.3.storage.pvcs):\n   `oc get pvc -A -o json | jq -r '([\"SC\",\"PVCS\"], ([.items[] | .spec.storageClassName // \"<none>\"] | group_by(.)[] | [.[0], (length|tostring)])) | @tsv' | column -t`\n4. Local path PVs are 3.9.2. Unsupported drivers are 3.9.3. CSIDriver objects are 3.9.5. FlexVolume is 3.9.6."
priority_hint = ""
impact = "none"
