[[checks]]
check_id = "7.3.tsr.3_5_7_etcd_log_errors"
title = "TSR etcd log errors"
description = "This check counts error messages in the etcd logs on each control plane node. The evidence shows how many errors were found and over what time window (e.g. \"Found 8 messages within 16 minutes\"). Any recurring errors — such as missed heartbeats, slow disk warnings, or peer communication failures — signal that etcd is struggling and the cluster's API layer may become unreliable if the root cause is not resolved."
recommendation = "Heartbeat failures usually indicate overloaded CPU or slow WAL/backend disk writes, `request timed out` commonly indicates peer-network latency or packet loss, and `rafthttp: failed to read` requires validating etcd peer connectivity, certificates/TLS, DNS resolution, and time synchronization. Check WAL fsync and backend-commit latency, CPU throttling/pressure, and storage contention on each control-plane node; test RTT, loss, and MTU consistency between every etcd peer, with special attention to the member producing the most errors."
verification = "1. Confirm each etcd member for the three phrases (`0` = none in the last hour):\n   `for member in $(oc -n openshift-etcd get pods -l app=etcd -o jsonpath='{.items[*].metadata.name}'); do printf '%s ' \"$member\"; oc -n openshift-etcd logs \"$member\" -c etcd --since=1h | awk '/failed to send out heartbeat on time/{h++} /request timed out/{t++} /rafthttp: failed to read/{r++} END{print (h+t+r==0?\"PASS\":\"FAIL\"), \"heartbeat=\"(h+0), \"timed_out=\"(t+0), \"rafthttp=\"(r+0)}'; done`\n   `heartbeat`: slow disks or CPU starvation. `timed_out`: control-plane network. `rafthttp`: peer connectivity or TLS.\n2. If the previous command failed, print the matching lines on that member:\n   `oc -n openshift-etcd logs etcd-<member> -c etcd --since=1h | grep -E 'failed to send out heartbeat on time|request timed out|rafthttp: failed to read'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane storage, network, or CPU"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated."
summary_patterns = [
  { contains = "there should be no messages", text = "etcd logs contain error messages that should not appear on a healthy control plane." },
]

