[[checks]]
check_id = "7.3.tsr.3_5_7_etcd_log_errors"
title = "TSR etcd log errors"
description = "This check counts error messages in the etcd logs on each control plane node. The evidence shows how many errors were found and over what time window (e.g. \"Found 8 messages within 16 minutes\"). Any recurring errors — such as missed heartbeats, slow disk warnings, or peer communication failures — signal that etcd is struggling and the cluster's API layer may become unreliable if the root cause is not resolved."
recommendation = "1. Review recent etcd logs on the affected member:\n   `oc -n openshift-etcd logs etcd-<member> -c etcd --since=1h`\n2. Look for repeated patterns such as:\n   - \"failed to send out heartbeat on time\" — indicates slow disks or CPU starvation\n   - \"request timed out\" — suggests network issues between control plane nodes\n   - \"rafthttp: failed to read\" — points to peer connectivity or TLS problems\n3. Correlate errors across all three etcd members to determine if the issue\n   is isolated to one node or cluster-wide.\n4. Address the underlying cause (disk latency, network, or resource pressure)\n   before the errors escalate into quorum loss.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

