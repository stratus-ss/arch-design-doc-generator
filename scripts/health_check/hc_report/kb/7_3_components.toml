[[checks]]
check_id = "7.3.tsr.3_5_6_etcd_defragmentation"
title = "3.5.6. ETCD Defragmentation"
description = "Checks whether etcd defragmentation is needed or has been recently performed.\nFragmented backends consume more disk space than necessary and increase\nfsync latency.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Checks whether etcd defragmentation is needed or has been recently performed.
# The rec remediates THAT story by starting at `oc -n openshift-etcd exec -c etcd etcd-<node> --
# etcdctl endpoint status --cluster -w table` — the live object/command for this check, not a
# neighboring TSR item.
# Impact `maintenance-window`: Defragmentation briefly locks each etcd member and can cause
# transient API latency; schedule during a maintenance window.
# etcdctl endpoint health/status via `oc -n openshift-etcd exec -c etcd` was verified on this lab.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Compare DB SIZE vs IN USE columns from:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl endpoint status --cluster -w table`\n2. If fragmentation is high, schedule defragmentation during maintenance:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl defrag --cluster`\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Defragmentation briefly locks each etcd member and can cause transient API latency; schedule during a maintenance window."

