check_id = "7.3.tsr.3_8_1_haproxy_status"
title = "3.8.1. HAProxy Status"
description = "Validates that the default HAProxy-based ingress router pods are running and\nhealthy across scheduled nodes. Degraded routers cause external traffic\nblackouts for affected routes.\n"
# why-rec
# CORRECTED. Engine is IngressController Available, not a log dump. `oc get
# ingresscontroller` is NAME/AGE only. `-o wide` prints IPs. `--tail=50` is
# parseIPList / router-reloaded noise. Rec PASS/FAIL Available/Progressing/Degraded
# plus Canary, then READY/STATUS pods, then grep klog E/F and reload/TLS failures.
# Lab: PASS Canary=True; --since=1h grep empty.
recommendation = "1. PASS/FAIL `ingresscontroller default` (`Available=True`, `Progressing=False`, `Degraded=False`):\n   `oc get ingresscontroller default -n openshift-ingress-operator -o json | jq -r '.status.conditions as $c | (first($c[] | select(.type==\"Available\") | .status) // \"-\") as $a | (first($c[] | select(.type==\"Progressing\") | .status) // \"-\") as $p | (first($c[] | select(.type==\"Degraded\") | .status) // \"-\") as $d | (first($c[] | select(.type==\"CanaryChecksSucceeding\") | .status) // \"-\") as $canary | (if $a==\"True\" and $p==\"False\" and $d==\"False\" then \"PASS\" else \"FAIL\" end) + \" Available=\"+$a+\" Progressing=\"+$p+\" Degraded=\"+$d+\" Canary=\"+$canary'`\n2. Print router pod `READY` and `STATUS`:\n   `oc get pods -n openshift-ingress -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[0].ready,STATUS:.status.phase,RESTARTS:.status.containerStatuses[0].restartCount,NODE:.spec.nodeName | awk '{print} NR>1 && ($2!=\"true\" || $3!=\"Running\"){bad=1} END{print (bad?\"FAIL\":\"PASS\"), \"router pods\"}'`\n3. Grep klog errors and reload/TLS failures for the last hour (empty = none). Healthy lines are `parseIPList` and `router reloaded`:\n   `oc logs -n openshift-ingress -l ingresscontroller.operator.openshift.io/deployment-ingresscontroller=default --since=1h | grep -E '^E|^F|reload failed|error reloading|x509'`\n4. Replica count is 3.8 / `7.2.topo.haproxy_ha`. Tuning is 3.8.2.\n"
