check_id = "7.3.storage.default_sc"
title = "Default storage class"
description = "A default StorageClass is required for dynamic PVC provisioning. Without one,\nPVCs without an explicit `storageClassName` remain Pending. Only one\nStorageClass should be marked as default.\n"
# why-rec
