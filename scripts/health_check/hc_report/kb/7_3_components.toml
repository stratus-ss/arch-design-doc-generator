check_id = "7.3.storage.csi"
title = "CSI driver availability"
description = "CSI drivers provide the standard interface for dynamic volume provisioning,\nsnapshots, and resize. Storage classes backed by legacy in-tree or\nvendor-specific provisioners without a CSI driver miss newer storage features\nand may not be supported on future OCP releases.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: CSI drivers provide the standard interface for dynamic volume provisioning,
# snapshots, and resize.
# The rec remediates THAT story by starting at `oc get csidrivers` — the live object/command for
# this check, not a neighboring TSR item.
# Impact `non-disruptive`: Installing a CSI driver deploys controller and node pods but does not
# reboot cluster nodes; new storage provisioning begins using the new driver after rollout.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. List installed CSI drivers and compare against the provisioners referenced by existing StorageClasses:\n   `oc get csidrivers`\n   `oc get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner`\n2. If a provisioner has no matching CSIDriver, install the vendor's CSI Operator (for example the Portworx or vendor-specific Operator from OperatorHub) so provisioning goes through the supported CSI path.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "storage operator namespace and CSI controller/node pods"
impact_detail = "Installing a CSI driver deploys controller and node pods but does not reboot cluster nodes; new storage provisioning begins using the new driver after rollout."

