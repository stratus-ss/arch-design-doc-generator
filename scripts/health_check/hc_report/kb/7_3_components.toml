[[checks]]
check_id = "7.3.tsr.3_17_5_network_config_consistent"
title = "3.17.5. Network Config Consistent"
description = "Validates that node network configurations are consistent across nodes in the\nsame role. Inconsistent network config can cause routing asymmetry, DNS\nfailures, and unpredictable connectivity issues.\n"
recommendation = "Where NNCP exists, bring it to Available. Progressing is a rollout; Degraded is a failed enactment. Missing CRDs means host NICs are not NNCP-managed. Bond and VLAN contents are separate network rows.\n\nVerification:\n1. List kubernetes-nmstate CRDs. Empty = host NICs are not NNCP-managed; stop (INFO n/a-nmstate):\n   `oc get crd nodenetworkconfigurationpolicies.nmstate.io nodenetworkconfigurationenactments.nmstate.io -o name --ignore-not-found | awk '{print; n++} END{print (n==2?\"PASS nmstate-crds\":\"INFO n/a-nmstate\")}'`\n2. Confirm each NodeNetworkConfigurationPolicy from the stock table (STATUS=Available is PASS, Progressing is WARNING, Degraded is FAIL):\n   `oc get nncp | awk 'NR==1{print \"RESULT\",$0; next} {n++; r=\"FAIL\"; if ($2==\"Available\") r=\"PASS\"; else if ($2==\"Progressing\") r=\"WARNING\"; print r, $0} END{if (n==0) print \"INFO 0 nncp\"}'`\n3. Confirm each NodeNetworkConfigurationEnactment the same way. Bond/VLAN details are 3.17.6/3.17.7:\n   `oc get nnce | awk 'NR==1{print \"RESULT\",$0; next} {n++; r=\"FAIL\"; if ($2==\"Available\") r=\"PASS\"; else if ($2==\"Progressing\") r=\"WARNING\"; print r, $0} END{if (n==0) print \"INFO 0 nnce\"}'`\n4. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/networking_overview/index#k8s-nmstate-about-the-kubernetes-nmstate-operator"
priority_hint = ""
impact = "none"
