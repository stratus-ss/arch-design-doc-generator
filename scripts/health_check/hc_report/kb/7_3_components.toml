check_id = "7.3.tsr.3_9_4_storage_pv_status"
title = "3.9.4. Storage PV Status"
description = "This check reviews PersistentVolume and PersistentVolumeClaim bind state. Evidence may show an unbound PV, an unbound PVC, or Released/Failed PVs that still consume capacity."
recommendation = "Bind every PVC and clear Released or Failed PVs. Leftover PVs should be only Available or Bound. Empty exception output is the healthy end state."
verification = "1. Print PVs whose STATUS is not Bound or Available (Released still holds capacity; Failed is **FAIL**). An empty list means none:\n   `oc get pv -o custom-columns=NAME:.metadata.name,STATUS:.status.phase --no-headers | awk '$2!=\"Bound\" && $2!=\"Available\" {print}'`\n2. Print PVCs whose PHASE is not Bound. An empty list means none:\n   `oc get pvc -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase,SC:.spec.storageClassName | awk '$3 != \"Bound\"'`\n\n3. Compare PV and PVC phases to documented persistent-storage behavior using the link in the reference."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "Released or Failed PVs"
impact_detail = "Reclaiming leftover PVs does not reboot nodes. Bound workloads and existing volumes are untouched."

