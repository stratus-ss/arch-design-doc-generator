[[checks]]
check_id = "7.3.tsr.3_9_3_dynamic_storage_provisioner_plugins"
title = "3.9.3. Dynamic Storage Provisioner Plugins"
description = "This check evaluates dynamic provisioner plugins. Failures include a provisioner that cannot bind volumes and a CSI (or in-tree) provisioner that Red Hat does not support for this platform."
# why-rec
# CORRECTED. "Identify the provisioner in the evidence" has no command.
# `oc get pvc -A` dumps every claim. We cannot catalog every vendor plugin;
# we can classify kubernetes.io/no-provisioner (static), other kubernetes.io/*
# (in-tree), CSIDriver present (csi), or missing-driver. RH-supported CSI
# table is 3.9.5 (TSR PASSed nfs.csi.k8s.io here and WARNED it on 3.9.5).
# Rec prints platform type, the classify table, and not-Bound PVCs joined to
# provisioner. Lab: BareMetal; nfs-csi KIND=csi CSIDRIVER=yes;
# SCORE PASS plugins-present; PASS 0 unbound.
recommendation = "1. Print platform type (use it with the supported-CSI table; whether a CSI driver is Red Hat-supported is 3.9.5):\n   `oc get infrastructure cluster -o jsonpath='{.status.platformStatus.type}{\"\\n\"}'`\n2. Classify each StorageClass provisioner. This does not enumerate vendors. `static` = `kubernetes.io/no-provisioner` (3.9.2). `in-tree` = other `kubernetes.io/*`. `csi` = a CSIDriver object exists. `missing-driver` = the class names a plugin that is not installed:\n   `oc get sc,csidriver -o json | jq -r 'def plugin_kind($drivers): if .==\"kubernetes.io/no-provisioner\" then \"static\" elif startswith(\"kubernetes.io/\") then \"in-tree\" elif (($drivers|index(.))!=null) then \"csi\" else \"missing-driver\" end; [.items[] | select(.kind==\"CSIDriver\") | .metadata.name] as $drivers | [.items[] | select(.kind==\"StorageClass\")] as $classes | [$classes[] | .provisioner | plugin_kind($drivers)] as $kinds | (if ($classes|length)==0 then \"FAIL no-storageclasses\" elif any($kinds[]; .==\"missing-driver\") then \"FAIL missing-driver\" elif any($kinds[]; .==\"in-tree\") then \"WARNING in-tree\" elif (($kinds|length)>0 and all($kinds[]; .==\"static\")) then \"INFO no-dynamic-provisioners\" else \"PASS plugins-present\" end) as $score | ([\"SC\",\"PROVISIONER\",\"KIND\",\"CSIDRIVER\"], ($classes[] | .provisioner as $p | [.metadata.name, $p, ($p|plugin_kind($drivers)), (if ($drivers|index($p))!=null then \"yes\" else \"no\" end)]), [\"SCORE\",$score,\"-\",\"-\",\"-\"]) | @tsv' | column -t -s $'\\t'`\n3. Print not-Bound PVCs with their provisioner (empty = none). PV/PVC field mismatch is 3.9.4:\n   `oc get pvc,sc -A -o json | jq -r '[.items[] | select(.kind==\"StorageClass\") | {name:.metadata.name, provisioner}] as $classes | ([\"NS\",\"PVC\",\"PHASE\",\"SC\",\"PROVISIONER\"], (.items[] | select(.kind==\"PersistentVolumeClaim\" and .status.phase != \"Bound\") | .spec.storageClassName as $sc | [.metadata.namespace, .metadata.name, .status.phase, ($sc // \"<none>\"), (([$classes[] | select(.name==$sc) | .provisioner][0]) // \"-\")])) | @tsv' | column -t -s $'\\t' | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"PASS\":\"FAIL\"), n+0, \"unbound\"}'`\n4. StorageClass inventory is 3.9.1. FlexVolume is 3.9.6.\n5. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/storage/index#persistent-storage-csi-drivers-supported_persistent-storage-csi\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

