[[checks]]
check_id = "7.3.tsr.3_17_6_network_bond_configuration"
title = "3.17.6. Network Bond Configuration"
description = "This check reviews host bond configuration. A typical warning is active-backup (or equivalent) where only one slave carries traffic, so the bond does not share load."
recommendation = "Give bonds a load-sharing mode and at least two ports. active-backup is HA-only and does not share load. Score day-0 install-config first, then day-2 NNCP. Empty both sources means no bond is in the design.\n\nVerification:\n1. Confirm install-config exists (empty / No resources found is informational n/a-install-config):\n   `oc get cm cluster-config-v1 -n kube-system`\n2. Print day-0 bond NAME, MODE, and PORTS, with RESULT on each host row. YAML in the ConfigMap is converted to JSON, then jq/awk. WARNING = active-backup (HA only) or PORTS<2. PASS = a load-sharing mode with at least two ports. INFO = no bonds:\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | python3 -c 'import sys,yaml,json; json.dump(yaml.safe_load(sys.stdin) or {}, sys.stdout)' | jq -r '.platform | to_entries[] | select(.value|type==\"object\") | (.value.hosts // [])[] | (.networkConfig.interfaces // [])[] | select(.type==\"bond\") | [.name // \"-\", (.[\"link-aggregation\"].mode // \"-\"), ((.[\"link-aggregation\"].port // .[\"link-aggregation\"].ports // [])|length)] | @tsv' | awk 'BEGIN{print \"RESULT\\tNAME\\tMODE\\tPORTS\"} {r=\"WARNING\"; if ($2!=\"active-backup\" && $2!=\"active_backup\" && $2!=\"-\" && $3+0>=2) r=\"PASS\"; print r\"\\t\"$0} END{if(NR==0) print \"INFO\\t-\\t-\\t0\"}' | column -t`\n3. Count unique NAME/MODE/PORTS fingerprints (the number is how many hosts share that bond):\n   `oc get cm cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | python3 -c 'import sys,yaml,json; json.dump(yaml.safe_load(sys.stdin) or {}, sys.stdout)' | jq -r '.platform | to_entries[] | select(.value|type==\"object\") | (.value.hosts // [])[] | (.networkConfig.interfaces // [])[] | select(.type==\"bond\") | [.name // \"-\", (.[\"link-aggregation\"].mode // \"-\"), ((.[\"link-aggregation\"].port // .[\"link-aggregation\"].ports // [])|length)] | @tsv' | sort | uniq -c | column -t`\n4. Day-2 NNCP bonds (missing CRD / No resources found is informational n/a-nncp):\n   `oc get nncp -o json | jq -r '[\"NNCP\",\"NAME\",\"MODE\",\"PORTS\"], (.items[] | .metadata.name as $p | .spec.desiredState.interfaces[]? | select(.type==\"bond\") | [$p, .name, (.[\"link-aggregation\"].mode // \"-\"), ((.[\"link-aggregation\"].port // .[\"link-aggregation\"].ports // [])|length)]) | @tsv' | column -t`\n5. INFO if both sources are empty. Repeat the same WARNING/PASS rules on NNCP rows. VLAN is 3.17.7."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

