check_id = "7.3.tsr.3_5_4_etcd_database_size"
title = "3.5.4. ETCD Database Size"
description = "Monitors the etcd database size to ensure it remains within safe limits.\nA database approaching the space quota (default 8GB) triggers alarms that\nprevent further writes and can freeze the control plane.\n"
recommendation = "Keep DB SIZE off the 8 GB quota so NOSPACE cannot freeze writes. Schedule defrag only when size greatly exceeds in-use."
verification = "1. Check database size and review the DB SIZE column:\n   `oc -n openshift-etcd exec -c etcd etcd-<node> -- etcdctl endpoint status --cluster -w table`\n2. If DB SIZE is approaching quota, review fragmentation in Prometheus and check etcd latency:\n   `(etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes)/1024/1024`\n   `histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))`\n   `histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))`\n3. If fragmentation remains high and DB SIZE greatly exceeds the in-use portion, schedule defragmentation."
recommendation_supported_versions = [
    "4.18",
    "4.19",
    "4.20",
    "4.21",
    "4.22",
]
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Defragmentation briefly locks each etcd member and can cause transient API latency; schedule during a maintenance window."

