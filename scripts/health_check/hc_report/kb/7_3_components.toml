[[checks]]
check_id = "7.3.tsr.3_20_linux_cgroups_version"
title = "3.20. Linux Cgroups Version"
description = "Identifies whether the cluster nodes use cgroups v1 or v2. OCP 4.14+ defaults\nto cgroups v2 which provides better resource isolation but may break workloads\nthat depend on cgroups v1 filesystem paths.\n"
recommendation = "1. Check cgroups version and verify:\n   `oc get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.status.nodeInfo.containerRuntimeVersion}{\"\\n\"}{end}'`\n   `oc debug node/<node> -- chroot /host stat -fc %T /sys/fs/cgroup`\n2. A tmpfs indicates v2; a cgroup indicates v1.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

