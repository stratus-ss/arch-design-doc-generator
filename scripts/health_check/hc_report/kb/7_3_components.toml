[[checks]]
check_id = "7.3.tsr.3_20_linux_cgroups_version"
title = "3.20. Linux Cgroups Version"
description = "Identifies whether the cluster nodes use cgroups v1 or v2. OCP 4.14+ defaults\nto cgroups v2 which provides better resource isolation but may break workloads\nthat depend on cgroups v1 filesystem paths.\n"
recommendation = "Treat cgroup v1 as a documented exception, not an automatic fix. Switching v1 to v2 (or back) reboots every node. Empty or v2 is the 4.14+ default."
verification = "1. Print cluster cgroupMode (empty or v2 is the 4.14+ default; v1 is legacy):\n   `oc get nodes.config cluster -o custom-columns=NAME:.metadata.name,CGROUP:.spec.cgroupMode | awk 'NR==1{print; next} {print; m=$2} END{if (m==\"<none>\" || m==\"v2\") print \"PASS cgroup-v2\"; else if (m==\"v1\") print \"WARNING cgroup-v1\"; else print \"FAIL unknown-cgroupMode\"}'`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "every node"
impact_detail = "Switching cgroup versions is applied through Machine Config and drains and reboots affected nodes one at a time. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

