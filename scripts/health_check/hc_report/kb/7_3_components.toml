[[checks]]
check_id = "7.3.tsr.3_22_2_performance_profile_match_mcp"
title = "3.22.2. Performance Profile Match MCP"
description = "Validates that PerformanceProfile node selectors correctly target the intended\n`MachineConfigPool`. Mismatched selectors can leave nodes without performance\ntuning or apply tuning to unintended nodes.\n"
recommendation = "Make each PerformanceProfile NODESELECTOR match exactly one MCP. No CRD or profile means PerformanceProfiles are not in use. None means MachineConfigs will not apply; two or more can tune the wrong nodes."
verification = "1. List PerformanceProfiles. If no CRD or profiles exist, PerformanceProfiles are not in use and this check is done.\n   `oc get performanceprofile -A 2>&1 | awk '/No resources found|have a resource type/{print \"INFO n/a-performanceprofile\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-performanceprofile\"}'`\n2. Print each profile's nodeSelector as `key=value`. That is the node label the profile applies to:\n   `oc get performanceprofile -A -o json | jq -r '[\"PROFILE\",\"NODESELECTOR\"], (.items[] | [.metadata.name, ((.spec.nodeSelector // {})|to_entries|map(.key+\"=\"+(.value|tostring))|sort|join(\",\"))]) | @tsv' | column -t`\n3. Print each MCP's nodeSelector matchLabels as `key=value`. That is the node label the pool owns:\n   `oc get mcp -o json | jq -r '[\"MCP\",\"NODESELECTOR\"], (.items[] | [.metadata.name, ((.spec.nodeSelector.matchLabels // {})|to_entries|map(.key+\"=\"+(.value|tostring))|sort|join(\",\"))]) | @tsv' | column -t`\n4. Compare the NODESELECTOR strings. The profile should match exactly one MCP. If it matches none, MachineConfigs will not roll to those nodes. If it matches two or more, the selector is too broad and can tune the wrong nodes."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "MCP selected by the PerformanceProfile"
impact_detail = "A selector that matches none or two pools can tune the wrong nodes. Correcting it applies MachineConfig and drains and reboots the intended pool."

