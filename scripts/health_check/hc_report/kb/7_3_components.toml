[[checks]]
check_id = "7.3.storage.pvcs"
title = "Persistent volume claims"
description = "Unbound PVCs indicate that requested storage could not be provisioned, often\nbecause the StorageClass is missing, capacity is unavailable, or the requested\naccess mode does not match the backend.\n"
recommendation = "Investigate and resolve each PVC that is not in the Bound phase before the dependent workload is deployed or restarted. Begin with the PVC's events to identify the immediate provisioning or binding failure, then validate the referenced StorageClass, CSI driver/provisioner health and logs, backend capacity, topology constraints, access-mode compatibility, requested size, and any required credentials or secrets. Workloads that omit storageClassName cannot dynamically provision storage until a valid default class is defined or a StorageClass is specified explicitly."
verification = "1. List PVCs that are not Bound:\n   `oc get pvc -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase,SC:.spec.storageClassName | awk '$3 != \"Bound\"'`\n      Empty output: all Bound. This check is done.\n2. For each remaining row, read Events:\n   `oc describe pvc <name> -n <ns>`\n      Typical Events: StorageClass not found, no PVs, access mode mismatch, insufficient capacity.\n3. Provisioner logs are in the CSI/driver namespace for that SC's provisioner."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "unbound PVCs and their provisioner path"
impact_detail = "Fixing StorageClass, CSI, or backend capacity lets the claim bind. Dependent pods stay down until Bound; nodes are not rebooted."

