[[checks]]
check_id = "7.3.storage.default_sc"
title = "Default storage class"
description = "A default StorageClass is required for dynamic PVC provisioning. Without one,\nPVCs without an explicit `storageClassName` remain Pending. Only one\nStorageClass should be marked as default.\n"
recommendation = "Annotate exactly one StorageClass as default. Zero leaves omitted-class PVCs Pending; more than one makes the provisioner pick arbitrarily. Existing volumes do not move."
verification = "1. Confirm the default StorageClass annotation (exactly one true). Zero is **WARNING**; more than one true is **WARNING**:\n   `oc get storageclass -o json | jq -r '([\"NAME\",\"PROVISIONER\",\"DEFAULT\"], (.items[] | [.metadata.name, .provisioner, (.metadata.annotations[\"storageclass.kubernetes.io/is-default-class\"] // \"false\")])) | @tsv' | column -t -s $'\\t' | awk 'NR==1{print; next} {print; n++; if ($3==\"true\") d++} END{if (d==1) print \"PASS 1 default-sc\"; else if (d+0==0) print \"WARNING no-default\"; else print \"WARNING\", d+0, \"multiple-default\"}'`\n2. If **WARNING** no-default, annotate the class that should back unbound PVCs:\n   `oc patch storageclass <name> -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"true\"}}}'`\n3. If **WARNING** multiple-default, leave one true and set the others to false:\n   `oc patch storageclass <name> -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"false\"}}}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "new PVC provisioning behavior"
impact_detail = "Changing the default StorageClass affects only future PVCs that omit storageClassName; existing volumes and nodes are untouched."

