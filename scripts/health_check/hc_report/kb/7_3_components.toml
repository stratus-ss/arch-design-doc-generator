[[checks]]
check_id = "7.3.storage.csi"
title = "CSI driver availability"
description = "CSI drivers provide the standard interface for dynamic volume provisioning,\nsnapshots, and resize. Storage classes backed by legacy in-tree or\nvendor-specific provisioners without a CSI driver miss newer storage features\nand may not be supported on future OCP releases.\n"
recommendation = "Validate the storage platform design with the storage vendor before treating the absence of a CSIDriver object as a defect. Portworx uses pxd.portworx.com for CSI-backed StorageClasses, so a missing CSIDriver resource may indicate an incomplete or legacy installation rather than proof that the StorageClass is unsupported. If the platform is running a legacy or non-CSI storage integration, plan a vendor-supported migration to the current CSI deployment before future OpenShift upgrades. Do not create a new in-tree StorageClass or install a generic operator solely to make the check pass; install or upgrade the vendor-supported CSI operator only after confirming the supported migration and compatibility path."
verification = "1. List installed CSI drivers and compare against the provisioners referenced by existing StorageClasses:\n   `oc get csidrivers`\n   `oc get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner`\n2. If a provisioner has no matching CSIDriver, install the vendor's CSI Operator (for example the Portworx or vendor-specific Operator from OperatorHub) so provisioning goes through the supported CSI path."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "storage platform and workloads using the affected StorageClasses"
impact_detail = "Consult the storage vendor for the impact of any CSI operator install or legacy-to-CSI migration. Red Hat does not define a single impact profile for third-party storage migrations; cutover can range from adding CSI pods with no node reboot to a planned backend migration that affects volume provisioning and attached workloads."

