[[checks]]
check_id = "7.3.tsr.3_17_3_multiple_networks"
title = "3.17.3. Multiple Networks"
description = "Validates additional network attachment definitions for secondary pod networks.\nMultiple networks enable traffic isolation, dedicated storage networks, or\ntelco-specific data plane separation.\n"
recommendation = "Print CNO additional names, then NAD type/IPAM, when extra networks are in the design. Empty additionalNetworks means extra networks are not in use, not a failure. A cnv-bridge NAD needs the linux-bridge CNI DaemonSet."
verification = "1. Print CNO additional network names/types. Empty is **INFO**, not **FAIL**:\n   `oc get network.operator cluster -o jsonpath='{range .spec.additionalNetworks[*]}{.name}{\"\\t\"}{.namespace}{\"\\t\"}{.type}{\"\\n\"}{end}'`\n2. Print NAD CNI type and IPAM (INVALID = config is not JSON). openshift-ovn-kubernetes/default type ovn-k8s-cni-overlay is the primary CNI, not an extra network.\n   `oc get net-attach-def -A -o json | jq -r '.items[] | .spec.config as $raw | (try ($raw|fromjson) catch null) as $c | [.metadata.namespace, .metadata.name, (if $c==null then \"INVALID\" else ($c.type // ([$c.plugins[]?.type]|join(\",\")) // \"-\") end), (if $c==null then \"-\" else ($c.ipam.type // $c.plugins[0].ipam.type // \"-\") end)] | @tsv'`\n3. Multus enabled (`disableMultiNetwork=true` means Multus is off). DaemonSet `READY=DESIRED` from the stock table:\n   `oc get network.operator cluster -o jsonpath='{.spec.disableMultiNetwork}{\"\\n\"}' && \\\n   oc get ds -n openshift-multus`\n4. If step 2 listed type cnv-bridge, same for linux-bridge CNI (empty needs action when those NADs exist):\n   `oc get ds -n openshift-cnv`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "additional NAD and linux-bridge CNI pods"
impact_detail = "Standing up an extra network or the linux-bridge DaemonSet rolls those pods. Empty additionalNetworks is not a failure."

