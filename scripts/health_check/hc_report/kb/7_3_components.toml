[[checks]]
check_id = "7.3.tsr.3_9_1_storage_provisioner_plugins"
title = "3.9.1. Storage Provisioner Plugins"
description = "Validates installed storage provisioners and their associated StorageClasses.\nMissing or misconfigured provisioners prevent dynamic volume creation and\ncan block workload deployments.\n"
recommendation = "Keep at least one StorageClass and exactly one default. New PVCs that omit a class stay Pending without that."
verification = "1. Print StorageClass PROVISIONER, reclaim policy, binding mode, expansion, and age ((default) marks the default class):\n   `oc get storageclass | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"FAIL\":\"PASS\"), n+0, \"storageclasses\"}'`\n      Empty: no provisioners.\n2. Confirm the default class name. Zero defaults is **WARNING** (PVCs that omit storageClassName stay Pending).\n   `oc get storageclass -o json | jq -r '[.items[] | select(.metadata.annotations[\"storageclass.kubernetes.io/is-default-class\"]==\"true\") | .metadata.name] | if length==0 then \"WARNING no-default\" elif length>1 then \"WARNING multiple-default=\"+join(\",\") else \"PASS default=\"+.[0] end'`\n3. Count PVCs per StorageClass:\n   `oc get pvc -A -o json | jq -r '([\"SC\",\"PVCS\"], ([.items[] | .spec.storageClassName // \"<none>\"] | group_by(.)[] | [.[0], (length|tostring)])) | @tsv' | column -t`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "default StorageClass for new PVCs"
impact_detail = "Changing the default StorageClass affects only future PVCs that omit storageClassName; existing volumes and nodes are untouched."

