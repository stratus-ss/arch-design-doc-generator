# Patch true only when every DEFAULT is `<none>`. If more than one `true`, set extras to false.
recommendation = "1. Print which StorageClass is default:\n   `oc get storageclass -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner,DEFAULT:.metadata.annotations.storageclass\\.kubernetes\\.io/is-default-class`\n2. Read `DEFAULT`:\n   - exactly one `true`: this check is done.\n   - all `<none>`: annotate the class that should back unbound PVCs:\n     `oc patch storageclass <name> -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"true\"}}}'`\n   - more than one `true`: leave one, set the others to `false`:\n     `oc patch storageclass <name> -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"false\"}}}'`\n3. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/storage/index#change-default-storage-class_dynamic-provisioning\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "new PVC provisioning behavior"
impact_detail = "Changing the default StorageClass affects only future PVCs that omit storageClassName; existing volumes and nodes are untouched."

