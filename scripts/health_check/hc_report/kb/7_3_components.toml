check_id = "7.3.tsr.3_3_custom_resource_definitions"
title = "TSR custom resource definitions"
description = "Orphaned CRDs from uninstalled operators bloat the API schema, slow discovery,\nand can cause conversion webhook errors. CRDs should be cleaned up when the\nowning operator is fully removed.\n"
recommendation = "1. List non-Red Hat CRDs and cross-reference with installed operators:\n   `oc get crd -o name | grep -v '.openshift.io'`\n2. For CRDs with no owning operator, verify no custom resources exist before removing the CRD. Back up any remaining CRs before deletion:\n   `oc get <crd-kind> -A`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "API schema and orphaned operator resources"
impact_detail = "Removing truly orphaned CRDs updates API discovery immediately but does not reboot nodes; verify no live custom resources depend on them before deletion."

