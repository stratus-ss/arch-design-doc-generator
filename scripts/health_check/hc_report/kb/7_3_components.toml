recommendation = "1. Check cluster capabilities:\n   `oc get clusterversion version -o jsonpath='{.status.capabilities}'`\n2. Review which capabilities are enabled vs available and validate that disabled capabilities are intentional for the cluster's use case.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

