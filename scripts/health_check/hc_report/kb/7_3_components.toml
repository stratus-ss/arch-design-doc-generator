[[checks]]
check_id = "7.3.registry.state"
title = "Internal registry state"
description = "The internal image registry is required for builds and ImageStream-based\ndeployments. If set to `Removed`, registry-dependent workloads fail. On\nclusters without RWX storage, `Managed` state requires `emptyDir` or an\nobject-storage backend.\n"
recommendation = "1. Confirm whether the internal registry is actually required for this cluster's workloads before changing its state \u2014 some clusters intentionally set it to `Removed` when using an external registry exclusively.\n2. If it is required, set it to `Managed` and configure a supported storage backend (`spec.storage`) before enabling it:\n   `oc patch configs.imageregistry.operator.openshift.io cluster --type=merge -p '{\"spec\":{\"managementState\":\"Managed\"}}'`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and dependent build/image workflows"
impact_detail = "Changing registry state or storage rolls registry pods and can briefly interrupt internal image pushes, pulls, and build flows while the new backend comes online."

