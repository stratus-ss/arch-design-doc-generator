[[checks]]
check_id = "7.3.monitoring.config"
title = "Monitoring configuration"
description = "The cluster monitoring stack (Prometheus and Alertmanager) is currently using temporary storage. This means all collected metrics, alert history, and dashboard data are lost whenever a monitoring pod restarts. For production clusters, persistent storage must be configured so metrics survive restarts."
recommendation = "1. Check whether persistent storage is already configured:\n   `oc get configmap cluster-monitoring-config -n openshift-monitoring -o yaml`\n   Look for a `volumeClaimTemplate` section under `prometheusK8s`.\n2. If missing, create or update the `cluster-monitoring-config` ConfigMap to\n   include a `volumeClaimTemplate` that references an available StorageClass.\n3. Apply the updated ConfigMap:\n   `oc apply -f <cluster-monitoring-config.yaml> -n openshift-monitoring`\n4. Verify the Prometheus pods restart with bound PVCs:\n   `oc get pvc -n openshift-monitoring`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "Prometheus, Alertmanager, and related monitoring pods"
impact_detail = "Updating cluster-monitoring-config redeploys affected monitoring components and can create temporary gaps in metrics collection, alert evaluation, or dashboards."

