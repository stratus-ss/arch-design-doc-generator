description = "Measures network round-trip latency between etcd members. High inter-member\nlatency causes heartbeat timeouts, leader elections, and request failures\nthat propagate to the API server.\n"
recommendation = "Keep peer RTT under 50 ms. High latency causes heartbeat timeouts and elections. Fix control-plane network placement; do not chase an etcd flag.\n\nVerification:\n1. Test network latency between control plane nodes hosting etcd.\n2. Review etcd logs for peer connectivity warnings:\n   `oc -n openshift-etcd logs etcd-<node> -c etcd | grep -i 'overloaded network\\|dial timeout\\|peer'`\n3. Ensure control plane nodes are on a low-latency network segment."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

