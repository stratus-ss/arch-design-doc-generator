[[checks]]
check_id = "7.3.tsr.3_5_8_1_etcd_disk_performance"
title = "TSR etcd disk performance"
description = "This check measures how quickly the control plane disks can write data durably. The reported value (e.g. \"99% quantile: 31ms\") means that 99 out of 100 operations completed within that time. Red Hat requires WAL fsync p99 below 10 ms. The TSR also requires backend commit p99 below 25 ms. When disks are too slow, etcd cannot keep up with cluster changes, causing API timeouts, leader elections, and potential cluster instability."
recommendation = "Move etcd onto dedicated NVMe or enterprise SSD when WAL fsync p99 exceeds 10 ms or backend commit p99 exceeds 25 ms. BareMetal IPI needs high-IOPS storage for the control plane. Do not tune etcd to hide slow disks."
verification = "1. Validate control plane storage with fio on each etcd node:\n   `sudo podman run --volume /var/lib/etcd:/var/lib/etcd:Z quay.io/cloud-bulldozer/etcd-perf`\n2. Check if control plane nodes are under CPU or memory pressure:\n   `oc adm top nodes -l node-role.kubernetes.io/master=`\n3. Review etcd latency metrics in Prometheus:\n      - `histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))`\n      - `histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))`\n      - `histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket[2m]))`\n4. If disk latency exceeds 10ms at the 99th percentile:\n      - On bare metal: move /var/lib/etcd to a dedicated NVMe or SSD partition\n      - On virtualized platforms: check for noisy-neighbor conditions, ensure storage is not shared with high-I/O workloads, and verify the backing datastore meets latency requirements\n5. Keep the 99th percentile WAL fsync under 10ms and peer RTT under 50ms."
recommendation_supported_versions = [
    "4.18",
    "4.19",
    "4.20",
    "4.21",
    "4.22",
]
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane nodes and etcd storage path"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated."
summary_patterns = [
  { contains = "less than 10ms", text = "etcd WAL fsync p99 exceeds the 10 ms Red Hat threshold." },
  { contains = "less than 25ms", text = "etcd backend commit p99 exceeds the 25 ms TSR threshold." },
]
finding_group = "etcd-disk-latency"
finding_group_title = "TSR etcd disk performance"

