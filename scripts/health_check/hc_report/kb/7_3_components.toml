[[checks]]
check_id = "7.3.tsr.3_5_8_1_etcd_disk_performance"
title = "TSR etcd disk performance"
description = "This check measures how quickly the control plane disks can write data durably (called \"fsync\"). The reported value (e.g. \"99% quantile: 31ms\") means that 99 out of 100 write operations completed within that time. Red Hat requires the 99th percentile WAL fsync to stay below 10ms. When disks are too slow, etcd cannot keep up with cluster changes, causing API timeouts, leader elections, and potential cluster instability."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: This check measures how quickly the control plane disks can write data durably
# (called "fsync").
# The rec remediates THAT story by starting at `oc adm top nodes -l
# node-role.kubernetes.io/master=` — the live object/command for this check, not a neighboring
# TSR item.
# Impact `maintenance-window`: Fixing etcd disk-performance problems usually requires
# control-plane infrastructure or storage changes that can reduce API capacity while nodes are
# remediated.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Validate control plane storage with fio on each etcd node:\n   `sudo podman run --volume /var/lib/etcd:/var/lib/etcd:Z quay.io/cloud-bulldozer/etcd-perf`\n2. Check if control plane nodes are under CPU or memory pressure:\n   `oc adm top nodes -l node-role.kubernetes.io/master=`\n3. Review etcd latency metrics in Prometheus:\n   - `histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))`\n   - `histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))`\n   - `histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket[2m]))`\n4. If disk latency exceeds 10ms at the 99th percentile:\n   - On bare metal: move /var/lib/etcd to a dedicated NVMe or SSD partition\n   - On virtualized platforms: check for noisy-neighbor conditions, ensure\n     storage is not shared with high-I/O workloads, and verify the backing\n     datastore meets latency requirements\n5. Keep the 99th percentile WAL fsync under 10ms and peer RTT under 50ms.\n"
recommendation_supported_versions = [
    "4.18",
    "4.19",
    "4.20",
    "4.21",
    "4.22",
]
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane nodes and etcd storage path"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated."
summary_patterns = [
  { contains = "less than 10ms", text = "etcd WAL fsync latency exceeds the 10ms Red Hat threshold." },
]

