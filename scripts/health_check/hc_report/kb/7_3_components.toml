[[checks]]
check_id = "7.3.tsr.3_6_2_registry_storage_type"
title = "TSR registry storage type"
description = "The internal image registry is using \"emptyDir\" (temporary) storage. This means all container images stored in the registry are lost when the registry pod restarts. Production clusters must use persistent storage (such as a PVC or object storage) so that pushed images are retained reliably."
recommendation = "1. Check the current registry storage configuration:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o jsonpath='{.spec.storage}'`\n2. If storage shows \"emptyDir\", configure a persistent backend:\n   - For bare metal: use a PVC with a supported StorageClass\n   - For cloud: use the platform's native object storage (S3, Azure Blob, GCS)\n3. Verify registry pods restart with healthy storage:\n   `oc get pods -n openshift-image-registry`\n4. Confirm the image pruner is enabled to manage storage growth:\n   `oc get imagepruner cluster -o yaml`\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and backing storage"
impact_detail = "Changing registry storage backends rolls registry pods and can briefly interrupt image pushes, pulls, and build flows during cutover."

