[[checks]]
check_id = "7.3.crds"
title = "Custom resource definitions"
description = "High CRD count can impact API server start time and list/watch performance.\nA count above 500 is treated as a warning (internal heuristic, not a vendor maximum).\nOrphaned CRDs from uninstalled operators are a separate finding.\n"
recommendation = "If CRD count is over 500, clean orphan CRDs rather than deleting live CRDs. CRD count is an API-discovery load signal, not a vendor maximum."
verification = "1. Count CRDs:\n   `oc get crd --no-headers | wc -l`\n2. Engine **WARNING** is greater than 500 (internal heuristic, not a published cluster maximum)."
priority_hint = ""
impact = "workload-shift"
impact_scope = "orphaned CRDs and leftover custom objects"
impact_detail = "Deleting a CRD that still has dependents can cause unpredictable results. At minimum it is a workload shift: the CRD API is removed and all custom objects of that type are deleted. Confirm the owning Operator is gone and that no instances or dependents remain before deletion."

