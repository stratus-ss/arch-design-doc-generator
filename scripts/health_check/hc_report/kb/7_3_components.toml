title = "3.22. Workload Partitioning"
description = "Parent section covering workload partitioning configuration that pins platform\nworkloads to specific CPUs, freeing remaining cores for application use.\nCritical for telco and real-time workloads.\n"
recommendation = "This section is a section index. None or empty means partitioning is off; AllNodes means it is on. Use enabled, MCP match, status, and configuration children for scored recommendations.\n\nVerification:\n1. Print cpuPartitioning. None or empty means workload partitioning is off (not CPU pinning). AllNodes means it is on; details are 3.22.1:\n   `oc get infrastructure cluster -o custom-columns=NAME:.metadata.name,CPU_PARTITIONING:.status.cpuPartitioning | awk 'NR==1{print; next} {print; p=$2} END{if (p==\"AllNodes\") print \"INFO partitioning-on\"; else print \"INFO partitioning-off\"}'`\n2. PerformanceProfile reserved/isolated CPUs are 3.22.4. MCP match is 3.22.2. Profile status is 3.22.3."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

