[[checks]]
check_id = "7.3.tsr.3_9_1_storage_provisioner_plugins"
title = "3.9.1. Storage Provisioner Plugins"
description = "Validates installed storage provisioners and their associated StorageClasses.\nMissing or misconfigured provisioners prevent dynamic volume creation and\ncan block workload deployments.\n"
# why-rec
# CORRECTED. DEFAULT annotation columns steal `7.3.storage.default_sc`.
# "Verify controller pods" has no object, label, or PASS line.
# TSR 3.9.1 is the StorageClass inventory: provisioner, reclaim, binding,
# expansion, age, which class is default, and PVC count per class.
# Rec is `oc get storageclass` (those columns), default name, then PVC counts.
# Lab: PASS 1 storageclasses; INFO default=nfs-csi; nfs-csi 22 PVCs.
# Local PVs 3.9.2. Unsupported 3.9.3. CSIDrivers 3.9.5. Flex 3.9.6.
recommendation = "1. Print StorageClass `PROVISIONER`, reclaim policy, binding mode, expansion, and age (`(default)` marks the default class):\n   `oc get storageclass | awk 'NR==1{print; next} {print; n++} END{print (n==0?\"FAIL\":\"PASS\"), n+0, \"storageclasses\"}'`\n   Empty: no provisioners.\n2. Print the default class name (`INFO no default` is `7.3.storage.default_sc`):\n   `oc get storageclass -o json | jq -r '[.items[] | select(.metadata.annotations[\"storageclass.kubernetes.io/is-default-class\"]==\"true\") | .metadata.name] | if length==0 then \"INFO no default\" else \"INFO default=\"+join(\",\") end'`\n3. Count PVCs per StorageClass (usage; bind health is 3.9.4 / `7.3.storage.pvcs`):\n   `oc get pvc -A -o json | jq -r '([\"SC\",\"PVCS\"], ([.items[] | .spec.storageClassName // \"<none>\"] | group_by(.)[] | [.[0], (length|tostring)])) | @tsv' | column -t`\n4. Local path PVs are 3.9.2. Unsupported drivers are 3.9.3. CSIDriver objects are 3.9.5. FlexVolume is 3.9.6.\n5. https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/storage/index#dynamic-provisioning\n"
