[[checks]]
check_id = "7.2.node.*.sysreserved"
pattern = true
title = "Node systemReserved memory"
description = "Nodes with large amounts of RAM (64 GiB or more) need a proportionally larger\nsystemReserved memory allocation in KubeletConfig. Without it, the kubelet and\ncontainer runtime compete with workloads for memory and can themselves be\nOOM-killed under pressure, taking the node out of service.\n"
recommendation = "If node RAM is large and applied systemReserved is still the default, pin a larger reservation with a KubeletConfig. An empty `oc get kubeletconfig` is the default — OpenShift does not ship a CR — and does **not** mean reservation is unset. Applying a CR rolls the MCP.\n\nVerification:\n1. List KubeletConfig CRs:\n   `oc get kubeletconfig`\n   `No resources found` is expected. On 4.21+ the kubelet auto-sizes systemReserved unless a CR sets `spec.autoSizingReserved: false`.\n2. Print the **applied** reservation only:\n   `oc get --raw /api/v1/nodes/<node>/proxy/configz | jq '{systemReserved: .kubeletconfig.systemReserved}'`\n      Documented defaults are `cpu=500m` and `memory=1Gi`. Compare `memory` to node RAM.\n3. Create or update a KubeletConfig **only** if you need to pin a larger reservation. Match `machineConfigPoolSelector` to the pool, set `spec.autoSizingReserved: false`, and set `spec.kubeletConfig.systemReserved.memory`. This is a KubeletConfig CR, not a hand-written MachineConfig.\n4. Size reserved memory for the node RAM. `1-2 GiB` for >=64 GiB is operational guidance, not a vendor-mandated value; scale higher for larger nodes."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the targeted MachineConfigPool"
impact_detail = "KubeletConfig changes are applied through the Machine Config Operator, which drains and reboots affected nodes one at a time and shifts workloads per MCP rollout settings. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."
finding_group = "node-system-reserved"
finding_group_title = "Kubelet systemReserved missing on one or more nodes"

