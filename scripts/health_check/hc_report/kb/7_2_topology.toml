[[checks]]
check_id = "7.2.tsr.2_3_3_routing_scaling"
title = "2.3.3. Routing Scaling"
description = "Ingress router capacity must scale with the number of Routes and traffic\nvolume. Undersized router deployments cause connection queuing, increased\nlatency, and dropped connections under load.\n"
recommendation = "Scale IngressController replicas to Route count and traffic. Undersized replicas queue connections and drop under load. Scaling adds or removes router pods; it does not drain nodes.\n\nVerification:\n1. Print router replica counts:\n   `oc get ingresscontroller default -n openshift-ingress-operator -o custom-columns=NAME:.metadata.name,SPEC:.spec.replicas,AVAILABLE:.status.availableReplicas`\n2. Review router pod placement:\n   `oc get pods -n openshift-ingress -o wide`\n3. Count total routes:\n   `oc get routes -A --no-headers | wc -l`\n4. Scale routers if the replica count is too small for that Route load:\n   `oc patch ingresscontroller default -n openshift-ingress-operator --type merge -p '{\"spec\":{\"replicas\":<N>}}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "ingress router pods"
impact_detail = "Scaling the IngressController replica count adds or removes router pods without disrupting existing connections."

