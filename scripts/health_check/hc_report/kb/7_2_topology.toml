[[checks]]
check_id = "7.2.topo.master_az"
title = "Control plane availability zone distribution"
description = "Control plane nodes should be distributed across separate failure domains\n(availability zones, racks, or hosts) to survive zone-level failures. All\ncontrol plane nodes in the same AZ creates a single point of failure for etcd\nquorum and API availability.\n"
recommendation = "Spread control-plane nodes across failure domains. A single zone, rack, or host puts etcd quorum and the API behind one domain. Moving masters is a planned migration; labeling is not.\n\nVerification:\n1. Verify control plane node placement:\n   `oc get nodes -l node-role.kubernetes.io/master -o custom-columns=NAME:.metadata.name,ZONE:.metadata.labels.topology\\.kubernetes\\.io/zone`\n2. If all masters share one zone, plan a control-plane migration across the failure domains you actually have.\n3. Add zone labels and anti-affinity only after the machines (or hosts) will land in different domains. Labels without a move do not improve availability."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane machines and failure-domain placement"
impact_detail = "Redistributing control-plane nodes across failure domains typically replaces or migrates masters sequentially and should be performed in a planned window."

