[[checks]]
check_id = "7.2.etcd.members"
title = "etcd member health"
description = "etcd requires a quorum of (n/2)+1 members to operate. A 3-member etcd cluster\ntolerates the loss of 1 member. Degraded etcd members must be investigated\nimmediately because data loss or control plane instability can follow.\n"
recommendation = "1. Check member placement:\n   `oc get pods -n openshift-etcd -o wide`\n2. Verify cluster health:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint health --cluster -w table`\n3. Recover a degraded etcd member immediately to prevent quorum loss.\n4. Take an etcd backup before any recovery operation and follow the documented etcd recovery procedure.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Member recovery can require backup, replacement, or restore work on control-plane nodes and may reduce API availability while the cluster is stabilized."

