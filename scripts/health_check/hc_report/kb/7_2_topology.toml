[[checks]]
check_id = "7.2.topo.master_az"
title = "Control plane availability zone distribution"
description = "Control plane nodes should be distributed across separate failure domains\n(availability zones, racks, or hosts) to survive zone-level failures. All\ncontrol plane nodes in the same AZ creates a single point of failure for etcd\nquorum and API availability.\n"
recommendation = "Validate the actual placement of all control-plane nodes across physical or logical failure domains—such as availability zones, racks, hypervisor hosts, or data-center fault domains—and distribute them so that the loss of any single domain does not remove etcd quorum or API availability. The absence of topology.kubernetes.io/zone labels means zone distribution cannot be verified from Kubernetes metadata. Do not add or modify topology labels merely to satisfy this check, because labels do not move nodes or improve resilience."
verification = "1. List control-plane nodes with their zone label (topology.kubernetes.io/zone):\n   `oc get nodes -l node-role.kubernetes.io/master -o custom-columns=NAME:.metadata.name,ZONE:.metadata.labels.topology\\.kubernetes\\.io/zone`\n2. If all masters show the same zone or no zone, plan redistribution across actual failure domains.\n3. Do not add labels without relocating machines; labels alone do not improve availability."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane machines and failure-domain placement"
impact_detail = "Redistributing control-plane nodes across failure domains typically replaces or migrates masters sequentially and should be performed in a planned window."
finding_group = "control-plane-az"
finding_group_title = "Control plane availability zone distribution"

