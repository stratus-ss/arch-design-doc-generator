[[checks]]
check_id = "7.2.etcd.quorum"
title = "etcd quorum"
description = "Quorum loss in etcd is a critical failure mode requiring manual recovery.\nAlways maintain an odd number of etcd members, typically 3 or 5. Never scale\netcd to 2 or 4 members.\n"
# why-rec
# CORRECTED. `{range .status.conditions[*]}` dumps every etcd operator controller (~30 rows).
# Rec jq-filters to EtcdMembersAvailable (reason EtcdQuorate) and EtcdMembersProgressing.
# Lab: Available=True reason=EtcdQuorate, Progressing=False. Member list stays for odd 3/5.
# Member health tables stay on 7.2.etcd.members. Do not dump yaml/json of the CR.
recommendation = "1. Print quorum conditions only (`type`, `status`, `reason`):\n   `oc get etcd cluster -o json | jq -c '.status.conditions[] | select(.type==\"EtcdMembersAvailable\" or .type==\"EtcdMembersProgressing\") | {type,status,reason}'`\n2. Read:\n   - `EtcdMembersAvailable` `True` with `reason=EtcdQuorate`: quorum is held (PASS).\n   - `EtcdMembersAvailable` `False`: quorum is not available.\n   - `EtcdMembersProgressing` `True`: membership change in flight (engine WARNING). `False` is expected when stable.\n3. Confirm the member set is odd (3 or 5):\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl member list -w table`\n   Member set must be 3 or 5. Endpoint health tables are `7.2.etcd.members`.\n4. If Available is False, follow documented disaster recovery to restore a majority.\n5. Clustering: https://etcd.io/docs/latest/op-guide/clustering/\n   Restore: https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/backup_and_restore/index#dr-restoring-cluster-state\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd quorum"
impact_detail = "Quorum recovery is manual control-plane recovery work and can temporarily remove or reduce API availability until a majority of members is healthy."

