title = "2.2.3. HAProxy HA"
description = "The API and ingress load balancers (commonly HAProxy) must be highly available.\nA single load balancer is a single point of failure for all cluster traffic.\nHA is typically achieved via keepalived/VRRP or external load balancer\nredundancy.\n"
recommendation = "Run more than one healthy load-balancer hop for API and ingress. If SPEC looks like SingleReplica on Bare-metal IPI, check keepalived/haproxy in that namespace — VIPs live there, not in this CR.\n\nVerification:\n1. Print spec vs available replicas with column names:\n   `oc get ingresscontroller default -n openshift-ingress-operator -o custom-columns=NAME:.metadata.name,SPEC:.spec.replicas,AVAILABLE:.status.availableReplicas`\n2. Read: both columns >= 2 is HA (PASS). `1` is SingleReplica. `<none>` in AVAILABLE means the operator has not reported status. Empty jsonpath is a missed field path, not replica count 0.\n3. Router pods:\n   `oc get pods -n openshift-ingress`\n4. Bare-metal IPI API/Ingress VIP HA is keepalived+haproxy in `openshift-kni-infra` (not this CR). vSphere IPI: `openshift-vsphere-infra`. External LB: confirm that pair instead.\n   `oc get pods -n openshift-kni-infra`"
