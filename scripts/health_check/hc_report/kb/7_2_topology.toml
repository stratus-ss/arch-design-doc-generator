[[checks]]
check_id = "7.2.tsr.2_2_3_haproxy_ha"
title = "2.2.3. HAProxy HA"
description = "The API and ingress load balancers (commonly HAProxy) must be highly available.\nA single load balancer is a single point of failure for all cluster traffic.\nHA is typically achieved via keepalived/VRRP or external load balancer\nredundancy.\n"
recommendation = "Ensure the API and ingress entry points have a tested high-availability design with no single load-balancer host or appliance that can interrupt cluster access. For externally managed load balancers, verify redundant instances for API traffic on 6443 and ingress traffic on 80/443. For bare-metal IPI and similar on-premises IPI deployments, do not infer a single point of failure from a SingleReplica value alone: OpenShift commonly provides API and ingress VIP failover through keepalived/VRRP, with HAProxy serving traffic on the current VIP owner. Validate the actual keepalived and HAProxy static-pod health."
verification = "1. Print IngressController replica counts:\n   `oc get ingresscontroller default -n openshift-ingress-operator -o custom-columns=NAME:.metadata.name,SPEC:.spec.replicas,AVAILABLE:.status.availableReplicas`\n2. Both columns at 2 or above means HA. `1` is SingleReplica. `<none>` in AVAILABLE means the operator has not reported status yet.\n3. List router pods:\n   `oc get pods -n openshift-ingress`\n4. Check the platform load-balancer implementation: bare-metal IPI uses keepalived/HAProxy in openshift-kni-infra; vSphere IPI uses openshift-vsphere-infra; external LBs need out-of-cluster validation.\n   `oc get pods -n openshift-kni-infra`\n   `oc get pods -n openshift-vsphere-infra`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "API and ingress load-balancer infrastructure"
impact_detail = "Adding redundant load balancers or VIPs can interrupt 6443, 80, and 443 until failover is proven."

