check_id = "7.2.tsr.2_3_2_sdn_number_of_pods"
title = "2.3.2. SDN Number of Pods"
description = "Each node has a maximum pod capacity (default 250) and the cluster has overall\npod density limits tied to the SDN plugin. Exceeding pod limits causes\nscheduling failures and degrades network performance due to iptables/OVS flow\ntable pressure.\n"
recommendation = "Keep bound-pod counts at or below each node's allocatable PODS column (kubelet default 250). Scheduling past it fails; running near it stresses OVS flow tables. Compare per node, not to a cluster-wide total."
verification = "1. Show allocatable pods per node:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,PODS:.status.allocatable.pods`\n2. Count running pods per node:\n   `oc get pods -A --no-headers -o custom-columns=NODE:.spec.nodeName | awk '$1 != \"\" && $1 != \"<none>\"' | sort | uniq -c | sort -rn`\n   Rows showing `<none>` are Pending or unschedulable pods.\n3. Check `maxPods` in `KubeletConfig`. `No resources found` means the default of 250 applies:\n   `oc get kubeletconfig -o custom-columns=NAME:.metadata.name,MAXPODS:.spec.kubeletConfig.maxPods`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "pods on nodes near allocatable PODS"
impact_detail = "Reducing density or spreading pods reschedules those workloads. Adding nodes is a maintenance window."

