[[checks]]
check_id = "7.2.etcd.members"
title = "etcd member health"
description = "etcd requires a quorum of (n/2)+1 members to operate. A 3-member etcd cluster\ntolerates the loss of 1 member. Degraded etcd members must be investigated\nimmediately because data loss or control plane instability can follow.\n"
recommendation = "Restore or replace an unhealthy etcd member only after a backup. A 3-member cluster can lose one; a second failure is an outage. Do not start replacement without a backup."
verification = "1. List etcd pods and confirm each is Running on a distinct control-plane node:\n   `oc get pods -n openshift-etcd -o wide`\n2. Check endpoint health from any member:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint health --cluster -w table`\n3. If a member is unhealthy, take an etcd backup before replacing it."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd members"
impact_detail = "Member recovery can require backup, replacement, or restore work on control-plane nodes and may reduce API availability while the cluster is stabilized."

