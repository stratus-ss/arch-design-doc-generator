[[checks]]
check_id = "7.2.tsr.2_1_1_consistent_ocp_release"
title = "2.1.1. Consistent OCP Release"
description = "All nodes should report the same OpenShift release version. Version skew across\nnodes indicates an incomplete or stalled upgrade and can cause workload\nscheduling failures, operator degradation, and API incompatibilities.\n"
recommendation = "Bring every kubelet to one VERSION cluster-wide. If they differ, inspect paused or degraded MCPs before unpausing — unpausing drains remaining nodes.\n\nVerification:\n1. Compare node kubelet versions:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,VERSION:.status.nodeInfo.kubeletVersion`\n2. If versions differ, check MachineConfigPool rollout status:\n   `oc get machineconfigpool`\n3. Resume a stalled upgrade only after you confirm the pause was not intentional:\n   `oc patch machineconfigpool/<pool> --type merge -p '{\"spec\":{\"paused\":false}}'`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the unpaused MachineConfigPool"
impact_detail = "Unpausing an MCP lets a pending MachineConfig or upgrade drain and reboot remaining nodes. Discovery commands alone do not change the cluster."

