[[checks]]
check_id = "7.2.node.*.sysreserved"
pattern = true
title = "Node systemReserved memory"
description = "Nodes with large amounts of RAM (64 GiB or more) need a proportionally larger\nsystemReserved memory allocation in KubeletConfig. Without it, the kubelet and\ncontainer runtime compete with workloads for memory and can themselves be\nOOM-killed under pressure, taking the node out of service.\n"
# why-rec
# CORRECTED. Empty `oc get kubeletconfig` (`No resources found`) is the default — OCP does not
# ship a KubeletConfig CR. Rec states that first; live reservation is configz
# `.kubeletconfig.systemReserved` (lab: cpu 500m / memory 1Gi, the documented defaults), not a
# full JSON dump. Create a CR only to pin a larger value (`autoSizingReserved: false`). 1–2 GiB
# for >=64 GiB is operational sizing. Doc link is in the rec because findings do not print
# [checks.links]. Applying a CR rolls the MCP (impact rolling-restart).
recommendation = "1. List KubeletConfig CRs:\n   `oc get kubeletconfig`\n   `No resources found` (empty list) is the default. OpenShift does not ship a KubeletConfig. It does **not** mean systemReserved is unset. On 4.21+, the kubelet auto-sizes systemReserved unless a CR sets `spec.autoSizingReserved: false`.\n2. Print the **applied** reservation only:\n   `oc get --raw /api/v1/nodes/<node>/proxy/configz | jq '{systemReserved: .kubeletconfig.systemReserved}'`\n   Documented defaults are `cpu=500m` and `memory=1Gi`. Compare `memory` to node RAM.\n3. Create or update a KubeletConfig **only** if you need to pin a larger reservation. Match `machineConfigPoolSelector` to the pool, set `spec.autoSizingReserved: false`, and set `spec.kubeletConfig.systemReserved.memory`. This is a KubeletConfig CR, not a hand-written MachineConfig. Applying it rolls the MCP.\n4. Size reserved memory for the node RAM. `1-2 GiB` for >=64 GiB is operational guidance, not a vendor-mandated value; scale higher for larger nodes.\n5. Procedure: https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/nodes/index#nodes-nodes-resources-configuring-setting_nodes-nodes-resources-configuring\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the targeted MachineConfigPool"
impact_detail = "KubeletConfig changes are applied through the Machine Config Operator, which drains and reboots affected nodes one at a time and shifts workloads per MCP rollout settings. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."
finding_group = "node-system-reserved"
finding_group_title = "Kubelet systemReserved missing on one or more nodes"

