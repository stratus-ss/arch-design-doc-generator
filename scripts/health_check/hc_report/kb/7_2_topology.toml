[[checks]]
check_id = "7.2.tsr.2_1_2_consistent_os_release"
title = "2.1.2. Consistent OS Release"
description = "All nodes should run the same RHCOS (or RHEL) version. OS-level skew can\nintroduce kernel, cgroup, or container-runtime inconsistencies that affect\nworkload stability and complicate troubleshooting.\n"
recommendation = "Bring every node to one OS-image column. Mixed RHCOS/RHEL workers or mixed kernels complicate cgroup and runtime troubleshooting; treat OS skew as a stalled MCP rollout."
verification = "1. List OS image and kernel per node:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,OS:.status.nodeInfo.osImage,KERNEL:.status.nodeInfo.kernelVersion`\n2. If OS versions differ, check `MachineConfigPool` rollout state:\n   `oc get machineconfigpool -o wide`\n3. A paused or degraded pool blocks the OS update."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the drifted MachineConfigPool"
impact_detail = "Completing a stalled kubelet or machine-config rollout drains and reboots lagging nodes one at a time. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

