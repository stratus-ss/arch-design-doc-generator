check_id = "7.2.tsr.2_3_3_routing_scaling"
title = "2.3.3. Routing Scaling"
description = "Ingress router capacity must scale with the number of Routes and traffic\nvolume. Undersized router deployments cause connection queuing, increased\nlatency, and dropped connections under load.\n"
recommendation = "1. Check current router replicas and IngressController status:\n   `oc get ingresscontroller default -n openshift-ingress-operator -o json | jq '{replicas: .spec.replicas, status: .status}'`\n2. Review router pod placement and resource usage:\n   `oc get pods -n openshift-ingress -o wide`\n3. Count total routes:\n   `oc get routes -A --no-headers | wc -l`\n4. Scale routers if needed:\n   `oc patch ingresscontroller default -n openshift-ingress-operator --type merge -p '{\"spec\":{\"replicas\":<N>}}'`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "ingress router pods"
impact_detail = "Scaling the IngressController replica count adds or removes router pods without disrupting existing connections."

