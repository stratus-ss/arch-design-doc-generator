[[checks]]
check_id = "7.2.topo.master_az"
title = "Control plane availability zone distribution"
description = "Control plane nodes should be distributed across separate failure domains\n(availability zones, racks, or hosts) to survive zone-level failures. All\ncontrol plane nodes in the same AZ creates a single point of failure for etcd\nquorum and API availability.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Control plane nodes should be distributed across separate failure domains
# (availability zones, racks, or hosts) to survive zone-level failures.
# The rec remediates THAT story by starting at `oc get nodes -l node-role.kubernetes.io/master -o
# custom-columns=NAME:.metadata.name,ZONE:.metadata.labels.topology\.kubernetes\.io/zone` — the
# live object/command for this check, not a neighboring TSR item.
# Impact `maintenance-window`: Redistributing control-plane nodes across failure domains
# typically replaces or migrates masters sequentially and should be performed in a planned window.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Verify control plane node placement:\n   `oc get nodes -l node-role.kubernetes.io/master -o custom-columns=NAME:.metadata.name,ZONE:.metadata.labels.topology\\.kubernetes\\.io/zone`\n2. If all masters are in one zone, plan a control plane migration.\n3. Add zone labels and anti-affinity rules as needed to redistribute control-plane nodes across available failure domains.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane machines and failure-domain placement"
impact_detail = "Redistributing control-plane nodes across failure domains typically replaces or migrates masters sequentially and should be performed in a planned window."

