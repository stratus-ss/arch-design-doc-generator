[[checks]]
check_id = "7.2.tsr.2_3_2_sdn_number_of_pods"
title = "2.3.2. SDN Number of Pods"
description = "Each node has a maximum pod capacity (default 250) and the cluster has overall\npod density limits tied to the SDN plugin. Exceeding pod limits causes\nscheduling failures and degrades network performance due to iptables/OVS flow\ntable pressure.\n"
# why-rec
# CORRECTED. `-o wide` + awk $8 is not NODE. RESTARTS like `1 (2d18h ago)` splits fields so AGE
# (2d18h, 151d) lands in $8. Rec uses `.spec.nodeName`. `<none>`/blank is unschedulable, not a
# node. Empty kubeletconfig list is default maxPods 250.
recommendation = "1. Print allocatable pods per node:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,PODS:.status.allocatable.pods`\n2. Count pods bound to each node:\n   `oc get pods -A --no-headers -o custom-columns=NODE:.spec.nodeName | awk '$1 != \"\" && $1 != \"<none>\"' | sort | uniq -c | sort -rn`\n   Blank/`<none>` is Pending/unschedulable. Compare each count to that node's PODS column (default 250).\n3. Print `maxPods` from KubeletConfig. `No resources found` means the kubelet default (250):\n   `oc get kubeletconfig -o custom-columns=NAME:.metadata.name,MAXPODS:.spec.kubeletConfig.maxPods`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

