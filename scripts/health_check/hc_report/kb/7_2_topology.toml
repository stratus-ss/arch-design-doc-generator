[[checks]]
check_id = "7.2.tsr.2_3_2_sdn_number_of_pods"
title = "2.3.2. SDN Number of Pods"
description = "Each node has a maximum pod capacity (default 250) and the cluster has overall\npod density limits tied to the SDN plugin. Exceeding pod limits causes\nscheduling failures and degrades network performance due to iptables/OVS flow\ntable pressure.\n"
recommendation = "Keep bound-pod counts at or below each node's allocatable PODS column (kubelet default 250). Scheduling past it fails; running near it stresses OVS flow tables. Compare per node, not to a cluster-wide total.\n\nVerification:\n1. Print allocatable pods per node:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,PODS:.status.allocatable.pods`\n2. Count pods bound to each node:\n   `oc get pods -A --no-headers -o custom-columns=NODE:.spec.nodeName | awk '$1 != \"\" && $1 != \"<none>\"' | sort | uniq -c | sort -rn`\n      Blank/`<none>` is Pending/unschedulable.\n3. Print `maxPods` from KubeletConfig. `No resources found` means the kubelet default (250):\n   `oc get kubeletconfig -o custom-columns=NAME:.metadata.name,MAXPODS:.spec.kubeletConfig.maxPods`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

