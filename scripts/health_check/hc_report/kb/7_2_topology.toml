[[checks]]
check_id = "7.2.tsr.2_3_1_sdn_number_of_nodes"
title = "2.3.1. SDN Number of Nodes"
description = "The software-defined network plugin has tested scalability limits on the number\nof nodes it can manage. Exceeding these limits can cause increased API server\nload, flow table exhaustion, and network programming delays.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: The software-defined network plugin has tested scalability limits on the number of
# nodes it can manage.
# The rec remediates THAT story by starting at `oc get nodes --no-headers | wc -l` — the live
# object/command for this check, not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Count cluster nodes:\n   `oc get nodes --no-headers | wc -l`\n2. Identify the active network plugin:\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}'`\n3. Compare the node count against Red Hat's published limits for the active SDN plugin.\n4. Treat 2,000 nodes as the tested OVN-Kubernetes cluster maximum, and note that OpenShift SDN was removed in OCP 4.17 and does not apply to current releases.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

