title = "2.3.1. SDN Number of Nodes"
description = "The software-defined network plugin has tested scalability limits on the number\nof nodes it can manage. Exceeding these limits can cause increased API server\nload, flow table exhaustion, and network programming delays.\n"
recommendation = "Stay at or below the OVN-Kubernetes tested limit of 2,000 nodes. Crossing that is API load, flow-table pressure, and network-programming delay. OpenShift SDN was removed in 4.17 and does not apply to current releases.\n\nVerification:\n1. Count cluster nodes:\n   `oc get nodes --no-headers | wc -l`\n2. Identify the active network plugin:\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}'`\n3. Compare the node count against Red Hat's published object maximums for that plugin. If you are approaching the tested limit, plan scale-out (more clusters) rather than hoping the SDN will absorb it."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

