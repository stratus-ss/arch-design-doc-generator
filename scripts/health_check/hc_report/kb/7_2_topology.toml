[[checks]]
check_id = "7.2.etcd.quorum"
title = "etcd quorum"
description = "Quorum loss in etcd is a critical failure mode requiring manual recovery.\nAlways maintain an odd number of etcd members, typically 3 or 5. Never scale\netcd to 2 or 4 members.\n"
recommendation = "Keep an odd etcd member count (3 or 5). An even count (2 or 4) is a split-brain risk. If Available is False, restore a majority from backup; do not add even-numbered members. Member health tables belong on the etcd members row (`7.2.etcd.members`).\n\nVerification:\n1. Print quorum conditions only (`type`, `status`, `reason`):\n   `oc get etcd cluster -o json | jq -c '.status.conditions[] | select(.type==\"EtcdMembersAvailable\" or .type==\"EtcdMembersProgressing\") | {type,status,reason}'`\n2. Read:\n      - `EtcdMembersAvailable` `True` with `reason=EtcdQuorate`: quorum is held (PASS).\n      - `EtcdMembersAvailable` `False`: quorum is not available.\n      - `EtcdMembersProgressing` `True`: membership change in flight (engine WARNING). `False` is expected when stable.\n3. Confirm the member set is odd (3 or 5):\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl member list -w table`\n4. If Available is False, this is control-plane disaster recovery: restore a majority from backup. Do not add even-numbered members to \"fix\" it.\n      Clustering: https://etcd.io/docs/latest/op-guide/clustering/\n      Restore: https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html-single/backup_and_restore/index#dr-restoring-cluster-state"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd quorum"
impact_detail = "Quorum recovery is manual control-plane recovery work and can temporarily remove or reduce API availability until a majority of members is healthy."

