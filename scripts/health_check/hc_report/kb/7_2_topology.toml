[[checks]]
check_id = "7.2.node.*.sysreserved"
pattern = true
title = "Node systemReserved memory"
description = "This check identifies high-memory nodes where the effective kubelet `systemReserved` memory allocation may be insufficient for the operating system and critical node services. `systemReserved` protects resources for system components such as CRI-O and the kubelet, reducing the risk that workload scheduling exhausts memory needed to keep the node functional. An empty oc get kubeletconfig result means no custom `KubeletConfig` CR has been created. It does not mean that system reservation is unset.\n"
recommendation = "For high-memory node pools, verify the effective `systemReserved` allocation and compare it with observed memory consumption by the operating system, kubelet, CRI-O, networking, monitoring, and other host-level services. If the effective reservation is inadequate, apply a targeted `KubeletConfig` to increase `systemReserved` memory or enable `autoSizingReserved`: true where supported. Do not create a custom reservation solely because no `KubeletConfig` CR exists. Make the change only after validating that the effective default reservation is insufficient for the node profile."
verification = "1. List `KubeletConfig` CRs:\n   `oc get kubeletconfig`\n   `No resources found` is normal and does not mean systemReserved is unset. Without a KubeletConfig the kubelet uses defaults (`cpu=500m`, `memory=1Gi`) unless `systemReserved` or `autoSizingReserved: true` is set. Auto-sizing is a 4.21+ new-cluster feature; upgraded clusters keep the prior behavior.\n2. Print the applied reservation:\n   `oc get --raw /api/v1/nodes/<node>/proxy/configz | jq '{systemReserved: .kubeletconfig.systemReserved}'`\n   Defaults are `cpu=500m` and `memory=1Gi`. Compare `memory` to total node RAM.\n3. Create or update a `KubeletConfig` only if the reservation is insufficient. Set `machineConfigPoolSelector` for the pool and either enable `spec.autoSizingReserved: true` or pin `spec.kubeletConfig.systemReserved.memory`.\n4. Size reserved memory to the node RAM. `1-2 GiB` for nodes with 64 GiB or more is guidance, not a mandated value; scale higher for larger nodes."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the targeted MachineConfigPool"
impact_detail = "`KubeletConfig` changes are applied through the Machine Config Operator, which drains and reboots affected nodes one at a time and shifts workloads per MCP rollout settings. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."
finding_group = "node-system-reserved"
finding_group_title = "Kubelet systemReserved missing on one or more nodes"

