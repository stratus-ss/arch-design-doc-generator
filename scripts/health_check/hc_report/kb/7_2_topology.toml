[[checks]]
check_id = "7.2.tsr.2_3_1_sdn_number_of_nodes"
title = "2.3.1. SDN Number of Nodes"
description = "The software-defined network plugin has tested scalability limits on the number\nof nodes it can manage. Exceeding these limits can cause increased API server\nload, flow table exhaustion, and network programming delays.\n"
recommendation = "Stay at or below the OVN-Kubernetes tested limit of 2,000 nodes. Crossing that is API load, flow-table pressure, and network-programming delay. OpenShift SDN was removed in 4.17 and does not apply to current releases."
verification = "1. Count cluster nodes:\n   `oc get nodes --no-headers | wc -l`\n2. Identify the active network plugin:\n   `oc get network.config cluster -o jsonpath='{.spec.networkType}'`\n3. Compare the node count to published scalability limits for that plugin. If approaching the limit, plan scale-out rather than adding more nodes."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster scale or split"
impact_detail = "Staying at or below 2,000 OVN nodes may mean not adding more, or splitting the estate. That is capacity planning, not a kubelet tweak."

