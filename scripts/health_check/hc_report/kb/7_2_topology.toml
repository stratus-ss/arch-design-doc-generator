[[checks]]
check_id = "7.2.etcd.quorum"
title = "etcd quorum"
description = "Quorum loss in etcd is a critical failure mode requiring manual recovery.\nAlways maintain an odd number of etcd members, typically 3 or 5. Never scale\netcd to 2 or 4 members.\n"
recommendation = "1. Review the cluster state:\n   `oc get etcd cluster -o yaml`\n2. Confirm the member set:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl member list -w table`\n3. Restore and preserve an odd-member etcd quorum before attempting other remediation.\n4. If quorum is already lost, follow the documented disaster recovery procedure to recover enough members to re-establish a majority.\n5. Validate ClusterVersion and ClusterOperator health before resuming normal operations.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane and etcd quorum"
impact_detail = "Quorum recovery is manual control-plane recovery work and can temporarily remove or reduce API availability until a majority of members is healthy."

