[[checks]]
check_id = "7.2.tsr.2_2_1_number_of_master_nodes"
title = "2.2.1. Number of Master Nodes"
description = "A production OpenShift cluster requires 3 control plane nodes to maintain etcd\nquorum and tolerate a single node failure. Bare-metal clusters may use up to 5\ncontrol plane nodes. Fewer than 3 masters risks quorum loss.\n"
recommendation = "Run production HA with three control-plane nodes (five is the documented bare-metal maximum). Document SNO and compact if that topology was chosen on purpose rather than treating a count of 1, or a 3-node compact cluster, as a defect."
verification = "1. Count master nodes:\n   `oc get nodes -l node-role.kubernetes.io/master --no-headers | wc -l`\n2. If the count is not 3 (or 5 on bare metal), confirm the intended topology before flagging it.\n3. Verify etcd member placement matches the master count:\n   `oc get pods -n openshift-etcd -o wide`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control-plane membership"
impact_detail = "Growing to three or five masters is planned control-plane work. Documented SNO or compact stays none and is not treated as a defect."

