[[checks]]
check_id = "7.5.tsr.5_10_volume_mount_durations"
title = "5.10. Volume Mount Durations"
description = "This check identifies slow or failed PVC attach and mount operations that delay pod startup. A pod cannot start until Kubernetes and the CSI driver attach, stage, and mount its volumes on the target node. Repeated `FailedAttachVolume`, `FailedMount`, or stuck `VolumeAttachment` conditions can delay application recovery, VM startup, node drains, and rollouts. This is an availability risk, not just a performance metric. Isolated delays can be transient, but recurring failures can materially extend recovery time—especially for VM disks, which must be available before the VM can boot.\n"
recommendation = "Treat recurring attach or mount failures as a storage availability issue. Review the affected pod events, PVC/PV, and `VolumeAttachment`, then check CSI controller and node-plugin health, storage-backend status, node-to-storage connectivity, access-mode compatibility, and whether the volume is still attached to a prior node. Do not delete `VolumeAttachment` objects, restart CSI components, resize volumes, or migrate workloads as a default fix. Force-detach only after confirming the previous node no longer uses the volume and the action is safe for the workload. After remediation, confirm the pod starts and the volume attaches and mounts within the required recovery time."
verification = "1. List `FailedMount` and `FailedAttachVolume` events that indicate slow or stuck volume operations:\n   `oc get events -A --field-selector reason=FailedMount`\n   `oc get events -A --field-selector reason=FailedAttachVolume`\n2. Verify CSI driver pods are running in the storage namespace and that the storage backend is responsive.\n3. Check for `VolumeAttachment` objects stuck in an attaching state:\n   `oc get volumeattachment`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "pods stuck on attach or mount"
impact_detail = "Online expansion may be transparent, but storage migration or cutover can require pod restart, rescheduling, or temporary workload movement."

