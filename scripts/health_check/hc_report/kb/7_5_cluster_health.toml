[[checks]]
check_id = "7.5.master_taints"
title = "Control plane taints"
description = "On clusters with dedicated workers, control plane nodes should have the\n`node-role.kubernetes.io/master:NoSchedule` taint so user workloads stay off\nthe control plane. Compact and single-node clusters are an exception: those\ncontrol-plane nodes are also workers, and the taint must not be added.\n"
# why-rec
# CORRECTED — wrong story on compact. Evaluator already INFO when masters are also workers. Rec
# must inspect taints and mastersSchedulable first and must not add NoSchedule on compact/SNO.
# Lab: no master taints, mastersSchedulable=true.
recommendation = "1. Inspect control-plane taints:\n   `oc get nodes -l node-role.kubernetes.io/control-plane -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints`\n2. Check whether masters are meant to be schedulable:\n   `oc get scheduler cluster -o jsonpath='{.spec.mastersSchedulable}'`\n3. On compact or SNO clusters, missing NoSchedule is expected.\n4. On HA clusters with dedicated workers, apply the taint:\n   `oc adm taint nodes <node> node-role.kubernetes.io/master=:NoSchedule`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "control-plane scheduling"
impact_detail = "Adding the taint stops new user workloads from landing on control-plane nodes, but it does not reboot nodes or evict existing pods automatically."

