[[checks]]
check_id = "7.5.tsr.5_6_node_role_values"
title = "TSR node-role values"
description = "This check verifies that each node has the correct role labels (master, worker, infra) and associated taints. Missing or incorrect labels can cause user workloads to run on control plane nodes, infrastructure workloads to land on worker nodes, or subscription entitlements to be miscounted."
recommendation = "Keep node-role labels matching the intended worker, infra, and control-plane split. Missing infra labels is not a defect unless this cluster was meant to have dedicated infra nodes. On compact/SNO, masters are the workers — do not add NoSchedule there.\n\nVerification:\n1. Review current node roles and labels:\n   `oc get nodes --show-labels | grep node-role`\n2. If infra workloads (monitoring, logging, routers) should run on dedicated nodes, label them:\n   `oc label node <node> node-role.kubernetes.io/infra=\"\"`\n3. Add taints to infra nodes to prevent user workloads from scheduling there:\n   `oc adm taint nodes <node> node-role.kubernetes.io/infra=:NoSchedule`\n4. On HA clusters with dedicated workers, confirm control-plane nodes have the standard NoSchedule taint. On compact or SNO clusters those nodes are the workers; missing NoSchedule is expected."
priority_hint = ""
impact = "workload-shift"
impact_scope = "node scheduling and infra workload placement"
impact_detail = "Changing node roles or taints affects where future workloads land and may require workload migration or rollout to move existing infra pods."
summary_patterns = [
  { contains = "NoSchedule", text = "Expected NoSchedule taint is missing on one or more nodes." },
]

