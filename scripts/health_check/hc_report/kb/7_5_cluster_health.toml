[[checks]]
check_id = "7.5.tsr.5_11_1_control_plane_alerts"
title = "5.11.1. Control Plane Alerts"
description = "Evaluates alerts specific to control plane components — API server, etcd,\nscheduler, and controller-manager. Control plane alerts indicate conditions\nthat can affect cluster-wide API responsiveness and scheduling.\n"
recommendation = "Resolve firing alerts from openshift-etcd and openshift-kube-* using the alertname runbook. A firing critical here is cluster-wide; next reads are etcd health and API latency."
verification = "1. List alerts from control-plane namespaces (openshift-etcd, openshift-kube-*), showing state, alertname, and severity:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.namespace != null and (.labels.namespace | test(\"openshift-etcd|openshift-kube\"))) | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n2. Cross-reference firing alerts with etcd health, API server latency, and scheduler queue depth."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "openshift-etcd and openshift-kube-*"
impact_detail = "Fixing etcd disk-performance problems usually requires control-plane infrastructure or storage changes that can reduce API capacity while nodes are remediated."

