title = "5.11.3. Overcommit Alerts"
description = "Evaluates alerts related to resource overcommitment — when the sum of pod\nresource requests exceeds node allocatable capacity. Overcommitment risks\nOOMKills and scheduling failures under load.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Evaluates alerts related to resource overcommitment — when the sum of pod resource
# requests exceeds node allocatable capacity.
# The rec remediates THAT story by starting at `oc adm top nodes` — the live object/command for
# this check, not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check cluster-level overcommit by comparing actual usage vs allocatable:\n   `oc adm top nodes`\n2. Review node allocatable vs requested resources:\n   `oc describe nodes | grep -A5 Allocated`\n3. Identify namespaces driving overcommit:\n   `oc adm top pods -A --sort-by=memory`\n4. Right-size resource requests.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

