[[checks]]
check_id = "7.5.pods.failed"
title = "Pod Health"
description = "This check lists pods in phase Failed or Unknown. Failed often includes completed Jobs and leftover debug pods. Unknown means the kubelet did not report status. It is not the CrashLoopBackOff check."
recommendation = "Classify each Failed or Unknown pod before deleting it. Treat Job and `*-debug-*` pods as leftover work unless they belong to a required pipeline. Treat application pods as a workload failure: events, then logs. Do not use CrashLoopBackOff-only queries to close this finding. Delete a Failed Job pod only after the Job owner is understood; Unknown pods need node/kubelet investigation."
verification = """1. List Failed pods. Empty output means none in Failed.
   `oc get pods -A --field-selector=status.phase=Failed`
2. List Unknown pods. Empty output means none in Unknown.
   `oc get pods -A --field-selector=status.phase=Unknown`
3. For each remaining application pod, print events.
   `oc describe pod <pod> -n <namespace>`"""
priority_hint = ""
impact = "workload-shift"
impact_scope = "Failed or Unknown application pods"
impact_detail = "Fixing or replacing a failed application pod restarts that workload. Unknown pods can require node or kubelet recovery in a maintenance window."

