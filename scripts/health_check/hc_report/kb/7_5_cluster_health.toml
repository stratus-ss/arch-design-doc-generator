[[checks]]
check_id = "7.5.tsr.5_12_dns_health"
title = "5.12. DNS Health"
description = "Validates CoreDNS pod health, DNS resolution latency, and DNS operator status.\nDNS failures cascade into service discovery issues, health probe failures,\nand operator degradation across the entire cluster.\n"
recommendation = "Keep dns.operator default `Available=True`, `Progressing=False`, `Degraded=False`. DNS failures cascade into service discovery, probes, and operators. SERVFAIL in CoreDNS logs is the usual next read after a degraded operator."
verification = "1. Check `dns.operator default` status. Healthy means `Available=True`, `Progressing=False`, `Degraded=False`:\n   `oc get dns.operator default -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}' | awk -F= '$1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`\n2. If the operator is not healthy, list its conditions for details:\n   `oc get dns.operator default -o jsonpath='{range .status.conditions[*]}{.type}={.status} reason={.reason}{\"\\n\"}{end}'`\n3. Verify DNS pods are running:\n   `oc get pods -n openshift-dns`\n4. Check CoreDNS logs for SERVFAIL entries:\n   `oc -n openshift-dns logs -l dns.operator.openshift.io/daemonset-dns --tail=100`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "dns.operator and CoreDNS"
impact_detail = "Restoring dns.operator default rolls CoreDNS and can briefly break name resolution. It does not reboot nodes."
finding_group = "dns-operator-health"
finding_group_title = "DNS Operator / CoreDNS health"

