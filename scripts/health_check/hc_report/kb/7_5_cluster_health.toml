[[checks]]
check_id = "7.5.pruning.pods"
title = "Pod pruning"
description = "Accumulated completed pods consume etcd storage and slow list operations.\nConfigure cleanup behavior so finished workloads do not persist indefinitely.\n"
recommendation = "1. Review completed-object buildup:\n   `oc get pods -A --field-selector=status.phase=Succeeded`\n   `oc get jobs -A`\n2. Configure automatic pruning for completed pods and jobs.\n3. Set `ttlSecondsAfterFinished` on Job specs, or deploy the image-pruner CronJob.\n4. For builds, configure the build-pruning settings in the BuildConfig workflow.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "completed pod and build object cleanup"
impact_detail = "Pruning settings affect completed-object retention and future cleanup behavior without rebooting nodes or interrupting running workloads."

