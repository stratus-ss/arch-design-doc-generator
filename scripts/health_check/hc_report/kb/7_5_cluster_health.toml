[[checks]]
check_id = "7.5.k8s_version"
title = "Kubelet version skew"
description = "This check is kubeletVersion consistency. One KUBELET value cluster-wide = PASS. Mixed = WARNING. STATE=Done and CURRENT=DESIRED means the kubelet machine-config applied; anything else is a stuck kubelet rollout. MCP UPDATED/UPDATING/DEGRADED/PAUSED is the pool. OCP release image consistency is 7.2.tsr.2_1_1_consistent_ocp_release."
recommendation = "1. Print KUBELET per node. One value = PASS. Mixed = WARNING. Empty = INFO n/a-kubelet:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,KUBELET:.status.nodeInfo.kubeletVersion --no-headers | awk '{k[$2]++; print \"NAME=\"$1, \"KUBELET=\"$2} END{n=0; for(x in k)n++; if(NR==0) print \"INFO n/a-kubelet\"; else print (n<=1?\"PASS\":\"WARNING\"), \"KUBELET_VALUES=\"n}'`\n2. Print machine-config STATE, CURRENT, and DESIRED. STATE=Done and CURRENT=DESIRED = PASS. Else FAIL:\n   `oc get nodes -o 'custom-columns=NAME:.metadata.name,STATE:.metadata.annotations.machineconfiguration\\.openshift\\.io/state,CURRENT:.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig,DESIRED:.metadata.annotations.machineconfiguration\\.openshift\\.io/desiredConfig' --no-headers | awk '{r=\"PASS\"; if($2!=\"Done\" || $3!=$4) r=\"FAIL\"; print r, \"NAME=\"$1, \"STATE=\"$2, \"CURRENT=\"$3, \"DESIRED=\"$4} END{if(NR==0) print \"INFO n/a-kubelet\"}'`\n3. Print MCP UPDATED, UPDATING, DEGRADED. DEGRADED or DEGRADEDMC>0 = FAIL. UPDATING=True = INFO. Else PASS:\n   `oc get mcp | awk 'NR==1{next} {r=\"PASS\"; if($5==\"True\" || $9+0>0) r=\"FAIL\"; else if($4==\"True\") r=\"INFO\"; print r, \"NAME=\"$1, \"UPDATED=\"$3, \"UPDATING=\"$4, \"DEGRADED=\"$5, \"READY=\"$7, \"UPDATEDMC=\"$8, \"DEGRADEDMC=\"$9}'`\n4. Print MCP PAUSED. true = FAIL:\n   `oc get mcp -o custom-columns=NAME:.metadata.name,PAUSED:.spec.paused --no-headers | awk '{r=\"PASS\"; if($2==\"true\") r=\"FAIL\"; print r, \"NAME=\"$1, \"PAUSED=\"$2}'`\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the affected MachineConfigPool"
impact_detail = "Scoring versions is read-only. Completing a stalled kubelet or machine-config rollout drains and reboots lagging nodes one at a time. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

