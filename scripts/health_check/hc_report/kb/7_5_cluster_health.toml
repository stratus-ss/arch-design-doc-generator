check_id = "7.5.tsr.5_7_machine_config_pool"
title = "5.7. Machine Config Pool"
description = "Assesses `MachineConfigPool` update status and degradation. Pools stuck in\nUpdating or Degraded state block node rollouts and cluster upgrades.\n"
recommendation = "Resolve any Updating or Degraded `MachineConfigPool` condition before starting the next node rollout or cluster upgrade. First inspect the affected pool and node-level Machine Config Daemon errors to identify the cause; do not unpause the pool or increase `maxUnavailable` until it is understood and corrected, because the MCO cords, drains, applies configuration to, and often reboots affected nodes during rollout."
verification = "1. List `MachineConfigPool` status:\n   `oc get mcp`\n2. Inspect any degraded pool for error details:\n   `oc describe mcp <pool>`\n3. List nodes that are updating or degraded:\n   `oc get nodes -l node.openshift.io/os_id=rhcos --sort-by=.metadata.name`\n4. Confirm `maxUnavailable` allows progress without over-draining capacity, especially on compact 3-node clusters."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the degraded or updating MachineConfigPool"
impact_detail = "Resolving MCP degradation may require the MCO to drain and reboot stuck nodes to complete configuration rollout."
finding_group = "mcp-pool-health"
finding_group_title = "MachineConfigPool degraded or updating"

