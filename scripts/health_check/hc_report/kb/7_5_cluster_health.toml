[[checks]]
check_id = "7.5.pruning.pods"
title = "Pod pruning"
description = "This check is Succeeded and Failed pod counts in the API. SUCCEEDED<=200 and FAILED<=50 = PASS. Else WARNING. Cluster-wide prune is KubeControllerManager terminated-pod-gc-threshold (unset = 12500 default). Job TTL is 7.5.pruning.jobs. Build history is 7.6.tsr.6_1_5_2_build_pruning."
recommendation = "Keep Succeeded pods at or below 200 and Failed at or below 50, or lower terminated-pod-gc-threshold so kube-controller-manager prunes them. Counts above that are clutter, not an outage. Unset threshold is the 12500 default. Patching the threshold restarts kube-controller-manager pods.\n\nVerification:\n1. Print Succeeded pod count. <=200 is healthy. Else WARNING:\n   `oc get pods -A --field-selector=status.phase=Succeeded --no-headers | awk 'END{c=NR; r=(c<=200?\"PASS\":\"WARNING\"); print r, \"SUCCEEDED=\"c}'`\n2. Print Failed pod count. <=50 is healthy. Else WARNING:\n   `oc get pods -A --field-selector=status.phase=Failed --no-headers | awk 'END{c=NR; r=(c<=50?\"PASS\":\"WARNING\"); print r, \"FAILED=\"c}'`\n3. Print OWNERKIND counts for Succeeded and Failed pods. Job-owned cleanup is 7.5.pruning.jobs:\n   `oc get pods -A -o json | jq -r '.items[] | select(.status.phase==\"Succeeded\" or .status.phase==\"Failed\") | [.status.phase, ((.metadata.ownerReferences[0].kind)//\"none\")] | @tsv' | awk -F'\\t' '{c[$1 SUBSEP $2]++} END{for (x in c){split(x,a,SUBSEP); print \"PHASE=\"a[1], \"OWNERKIND=\"a[2], \"COUNT=\"c[x]}}'`\n4. Print KubeControllerManager terminated-pod-gc-threshold. Unset is informational GCTHRESHOLD=12500-default:\n   `oc get kubecontrollermanager cluster -o json | jq -r '((.spec.unsupportedConfigOverrides // {}).extendedArguments // {})[\"terminated-pod-gc-threshold\"][0] // \"\"' | awk '{v=$0} END{if(v==\"\") print \"INFO GCTHRESHOLD=12500-default\"; else print \"PASS GCTHRESHOLD=\"v}'`\n5. Set the threshold on KubeControllerManager. Example 200 matches the Succeeded cutoff. Drop --dry-run=client to apply (restarts kube-controller-manager pods):\n   `oc patch kubecontrollermanager cluster --type merge --dry-run=client -o json -p '{\"spec\":{\"unsupportedConfigOverrides\":{\"extendedArguments\":{\"terminated-pod-gc-threshold\":[\"200\"]}}}}' | jq -r '.spec.unsupportedConfigOverrides.extendedArguments[\"terminated-pod-gc-threshold\"][0]' | awk '{print \"GCTHRESHOLD=\"$0}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "kube-controller-manager pods"
impact_detail = "Counting pods is read-only. Patching terminated-pod-gc-threshold restarts kube-controller-manager pods; it does not reboot nodes."

