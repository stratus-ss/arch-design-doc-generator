[[checks]]
check_id = "7.5.tsr.5_9_pod_disruption_budget"
title = "5.9. Pod Disruption Budget"
description = "Evaluates PodDisruptionBudget configuration to ensure voluntary disruptions\n(drains, upgrades) cannot violate application availability requirements.\nMissing or misconfigured PDBs risk downtime during maintenance.\n"
recommendation = "Review PDBs with `disruptionsAllowed=0` to determine whether they are intentionally protecting a workload or unnecessarily preventing node drains and upgrades. Where maintenance must proceed, restore sufficient healthy replicas and adjust the PDB's `minAvailable` or `maxUnavailable` so at least one voluntary disruption is permitted without violating the application's availability requirement. The absence of a PDB is not inherently a defect; however, confirm that every existing PDB selector matches the intended workload pods and that its availability settings reflect the application's actual redundancy and recovery capabilities."
verification = "1. List all PodDisruptionBudgets with their allowed disruptions, minAvailable, and `maxUnavailable`:\n   `oc get pdb -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,ALLOWED:.status.disruptionsAllowed,MIN:.spec.minAvailable,MAX:.spec.maxUnavailable`\n2. Filter for PDBs that block voluntary eviction, where `ALLOWED` is 0:\n   `oc get pdb -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,ALLOWED:.status.disruptionsAllowed --no-headers | awk '$3==\"0\" {print}'`\n3. Confirm each PDB selector matches the intended pods. Widening `maxUnavailable` or lowering minAvailable is the usual fix; deleting the PDB is a last resort."
priority_hint = ""
impact = "workload-shift"
impact_scope = "pods matching PDBs with `disruptionsAllowed=0`"
impact_detail = "A PDB with `disruptionsAllowed=0` blocks voluntary eviction of its matching pods, not a reboot directly. In practice, that can prevent the node from draining and therefore block or delay a controlled reboot, Machine Config rollout, node replacement, maintenance activity, or a rolling cluster upgrade on that node. Increasing allowed disruptions above zero, either by reducing `minAvailable` or increasing `maxUnavailable`, permits those evictions but can temporarily reduce the production workload's available replica count; only do so after confirming the application has enough replicas, capacity, health, and failover tolerance to remain available during the disruption. Do not bypass the PDB with forced eviction unless you explicitly accept the availability risk, because that can terminate protected pods regardless of the intended budget."

