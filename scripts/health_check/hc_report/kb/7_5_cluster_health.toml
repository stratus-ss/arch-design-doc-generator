[[checks]]
check_id = "7.5.master_taints"
title = "Control plane taints"
description = "On clusters with dedicated workers, control plane nodes should have the\n`node-role.kubernetes.io/master:NoSchedule` taint so user workloads stay off\nthe control plane. Compact and single-node clusters are an exception: those\ncontrol-plane nodes are also workers, and the taint must not be added.\n"
recommendation = "On HA clusters with dedicated workers, taint masters NoSchedule so user pods stay off the control plane. Do not add that taint on compact or SNO — those masters are the workers and NoSchedule will strand workloads. Read taints and mastersSchedulable before you taint anything."
verification = "1. List control-plane node taints:\n   `oc get nodes -l node-role.kubernetes.io/control-plane -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints`\n2. Check whether masters are configured as schedulable:\n   `oc get scheduler cluster -o jsonpath='{.spec.mastersSchedulable}'`\n3. On compact or SNO clusters, a missing NoSchedule taint is expected.\n4. On HA clusters with dedicated workers, apply the NoSchedule taint:\n   `oc adm taint nodes <node> node-role.kubernetes.io/master=:NoSchedule`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "control-plane scheduling"
impact_detail = "Adding the taint stops new user workloads from landing on control-plane nodes, but it does not reboot nodes or evict existing pods automatically."

