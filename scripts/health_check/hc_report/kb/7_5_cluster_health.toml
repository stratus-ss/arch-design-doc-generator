[[checks]]
check_id = "7.5.tsr.5_8_machine_set"
title = "5.8. Machine Set"
description = "Validates MachineSet desired vs actual replica counts and machine provisioning\nstate. Mismatched replicas or stuck machines indicate infrastructure provisioning\nfailures or capacity constraints.\n"
recommendation = "Bring MachineSet available count to desired, or treat empty as n/a on bare-metal UPI. Stuck machines are an infrastructure-provider problem (quota, PXE, BMC), not a scheduler problem."
