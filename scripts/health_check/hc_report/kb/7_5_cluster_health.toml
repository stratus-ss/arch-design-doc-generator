[[checks]]
check_id = "7.5.registry_health"
title = "Internal registry health"
description = "The internal image registry's managementState and pod health directly affect\nbuild and ImageStream-based deployment reliability. A `Removed` state or\nunhealthy registry pods will fail any workload that depends on the internal\nregistry.\n"
recommendation = "1. Review the registry configuration:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o yaml`\n2. Confirm `spec.managementState` matches the cluster's intended usage.\n3. If `Managed`, verify registry pods are healthy:\n   `oc get pods -n openshift-image-registry`\n4. Ensure the configured storage backend is reachable and has capacity.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and internal image workflows"
impact_detail = "Changing registry state or storage rolls registry pods and can briefly interrupt builds or internal image pulls/pushes."

