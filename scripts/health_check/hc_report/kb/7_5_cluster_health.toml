[[checks]]
check_id = "7.5.k8s_version"
title = "Kubelet version skew"
description = "Mixed kubelet versions usually indicate that some nodes have not completed the\nMachineConfig update rollout. Review MachineConfigPool status and investigate\nany degraded nodes before proceeding with upgrades.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Mixed kubelet versions usually indicate that some nodes have not completed the
# MachineConfig update rollout.
# The rec remediates THAT story by starting at `oc get mcp` — the live object/command for this
# check, not a neighboring TSR item.
# Impact `rolling-restart`: Completing a stalled kubelet or machine-config rollout drains and
# reboots lagging nodes one at a time. On compact 3-node clusters where all nodes serve as both
# control-plane and worker, this affects 100% of cluster capacity.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check MachineConfigPool status:\n   `oc get mcp`\n2. Identify any pools still `Updating` or `Degraded`.\n3. Review node versions:\n   `oc get nodes -o custom-columns=NAME:.metadata.name,KUBELET:.status.nodeInfo.kubeletVersion`\n4. Wait until all nodes complete the current rollout before starting another upgrade.\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the affected MachineConfigPool"
impact_detail = "Completing a stalled kubelet or machine-config rollout drains and reboots lagging nodes one at a time. On compact 3-node clusters where all nodes serve as both control-plane and worker, this affects 100% of cluster capacity."

