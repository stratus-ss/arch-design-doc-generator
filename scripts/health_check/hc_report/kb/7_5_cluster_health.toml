[[checks]]
check_id = "7.5.tsr.5_3_operator_state"
title = "5.3. Operator State"
description = "This check is ClusterOperator AVAILABLE, PROGRESSING, and DEGRADED. `AVAILABLE=True` `PROGRESSING=False` `DEGRADED=False` = **PASS**. Else **FAIL**."
recommendation = "Restore ClusterOperators to `Available=True`, `Progressing=False`, `Degraded=False`. Read conditions on the degraded operator next; do not start from a cluster-wide `oc get co` dump."
verification = "1. List each ClusterOperator with AVAILABLE, PROGRESSING, and DEGRADED columns. `AVAILABLE=True`, `PROGRESSING=False`, `DEGRADED=False` is healthy; any other combination needs action. If no operators exist the command reports it:\n   `oc get co --no-headers | awk '{r=\"PASS\"; if($3!=\"True\" || $4!=\"False\" || $5!=\"False\") r=\"FAIL\"; print r, \"NAME=\"$1, \"AVAILABLE=\"$3, \"PROGRESSING=\"$4, \"DEGRADED=\"$5} END{if(NR==0) print \"INFO n/a-co\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "the degraded ClusterOperator's operands"
impact_detail = "Fixing the named dependency then reconciling the operator rolls its pods. It does not reboot nodes by itself; Machine Config, etcd, and network children can require a heavier window."

