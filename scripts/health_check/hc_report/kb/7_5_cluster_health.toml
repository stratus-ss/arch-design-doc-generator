[[checks]]
check_id = "7.5.tsr.5_7_machine_config_pool"
title = "5.7. Machine Config Pool"
description = "Assesses MachineConfigPool update status and degradation. Pools stuck in\nUpdating or Degraded state block node rollouts and cluster upgrades.\n"
recommendation = "Clear a MachineConfigPool stuck Updating or Degraded before the next node rollout or cluster upgrade. Describe the degraded pool before you unpause or raise maxUnavailable — those actions drain nodes.\n\nVerification:\n1. Check pool status:\n   `oc get mcp`\n2. Investigate degraded pools:\n   `oc describe mcp <pool>`\n3. Review which nodes are updating or degraded:\n   `oc get nodes -l node.openshift.io/os_id=rhcos --sort-by=.metadata.name`\n4. Ensure `maxUnavailable` settings allow progress without over-draining capacity (especially on compact 3-node clusters)."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the degraded or updating MachineConfigPool"
impact_detail = "Resolving MCP degradation may require the MCO to drain and reboot stuck nodes to complete configuration rollout."

