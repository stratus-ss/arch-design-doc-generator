[[checks]]
check_id = "7.5.pruning.jobs"
title = "Job pruning"
description = "Stale completed Jobs accumulate in etcd and slow API list operations. Add TTL\ncleanup to Job specs so completed objects are removed automatically.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Stale completed Jobs accumulate in etcd and slow API list operations.
# The rec remediates THAT story by starting at `oc get jobs -A` — the live object/command for
# this check, not a neighboring TSR item.
# Impact `non-disruptive`: Job TTL and history-limit changes affect cleanup behavior for
# completed jobs without disrupting running workloads.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Set `ttlSecondsAfterFinished` on Job templates.\n2. Configure CronJob `successfulJobsHistoryLimit` and `failedJobsHistoryLimit` to keep completed jobs from accumulating indefinitely.\n3. Review large namespaces:\n   `oc get jobs -A`\n4. Delete stale completed jobs after confirming they are no longer needed.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "completed job retention"
impact_detail = "Job TTL and history-limit changes affect cleanup behavior for completed jobs without disrupting running workloads."

