[[checks]]
check_id = "7.5.alerts.warning"
title = "Warning alerts"
description = "Warning alerts indicate conditions that may become critical if not addressed.\nReview the firing warnings and decide whether they represent accepted risk or\nrequire remediation.\n"
recommendation = "Classify each firing warning as accepted risk, tuning debt, or an incident. Do not treat the warning list as a page-now queue. Use the console runbook before changing thresholds or silences."
verification = "1. List firing warning alerts, showing `state`, `alertname`, and `severity`:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.severity==\"warning\") | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n2. Classify each row as accepted risk, tuning debt, or a real incident. Look up runbooks under `Observe -> Alerting`."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "alert routing or the named component"
impact_detail = "Classifying a warning as accepted risk or tuning changes monitoring config and does not reboot nodes. The underlying fix follows the runbook."

