[[checks]]
check_id = "7.5.kubelet_health"
title = "Node kubelet health"
description = "This check validates the Kubernetes node Ready condition. A node is available to accept pods when `Ready=True`; `Ready=False` means the node is not accepting workloads, while `Ready=Unknown` means the control plane has stopped receiving kubelet heartbeats. Any state other than `Ready=True` is WARNING. This check does not FAIL. It is limited to node readiness.\n"
recommendation = "Restore every node to `Ready=True` before relying on it for workload placement or VM operations. For each non-ready node, inspect its condition reason, recent events, kubelet and CRI-O status, node networking, certificate state, and Machine Config Operator status; cordon the node and migrate or drain workloads safely where appropriate before remediation."
verification = "1. List each node and its STATUS. Ready is PASS; any other status is WARNING. If no nodes exist the command reports it:\n   `oc get nodes --no-headers | awk '{r=\"PASS\"; if($2!=\"Ready\") r=\"WARNING\"; print r, \"NAME=\"$1, \"STATUS=\"$2} END{if(NR==0) print \"INFO n/a-node\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "NotReady nodes and their workloads"
impact_detail = "Cordon, drain, then repair kubelet, CRI-O, or Machine Config. Node recovery can reboot that node and shift its workloads."
finding_group = "kubelet-health"
finding_group_title = "Node kubelet health"

