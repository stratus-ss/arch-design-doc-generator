[[checks]]
check_id = "7.5.pruning.jobs"
title = "Job pruning"
description = "Stale completed Jobs accumulate in etcd and slow API list operations. Add TTL\ncleanup to Job specs so completed objects are removed automatically.\n"
recommendation = "Set ttlSecondsAfterFinished on Job templates, and cap CronJob history limits, so completed Jobs age out of etcd. Deleting rows by hand is a one-shot. Confirm a Job is no longer needed before you drop it."
verification = "1. List completed Jobs across all namespaces:\n   `oc get jobs -A`\n2. Set `ttlSecondsAfterFinished` on Job templates so finished objects are removed automatically.\n3. Cap CronJob `successfulJobsHistoryLimit` and `failedJobsHistoryLimit` to prevent unbounded growth.\n4. Delete stale completed Jobs only after confirming they are no longer needed."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "completed job retention"
impact_detail = "Job TTL and history-limit changes affect cleanup behavior for completed jobs without disrupting running workloads."

