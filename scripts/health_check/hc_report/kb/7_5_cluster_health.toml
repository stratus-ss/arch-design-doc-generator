[[checks]]
check_id = "7.5.tsr.5_1_node_kubelet_health"
title = "5.1. Node Kubelet Health"
description = "This check validates the Kubernetes node Ready condition. A node is healthy and available to accept pods only when `Ready=True`; `Ready=False` means the node is unhealthy and not accepting workloads, while `Ready=Unknown` means the control plane has stopped receiving kubelet heartbeats. Any state other than `Ready=True` is a node-availability failure and can disrupt scheduling, VM placement, live migration, and workload recovery. This check is limited to node readiness.\n"
recommendation = "Restore every node to `Ready=True` before relying on it for workload placement or VM operations. For each non-ready node, inspect its condition reason, recent events, kubelet and CRI-O status, node networking, certificate state, and Machine Config Operator status; cordon the node and migrate or drain workloads safely where appropriate before remediation."
verification = "1. List each node and its STATUS. Ready is healthy; any other status needs action. If no nodes exist the command reports it:\n   `oc get nodes --no-headers | awk '{r=\"PASS\"; if($2!=\"Ready\") r=\"FAIL\"; print r, \"NAME=\"$1, \"STATUS=\"$2} END{if(NR==0) print \"INFO n/a-node\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "NotReady nodes and their workloads"
impact_detail = "Cordon, drain, then repair kubelet, CRI-O, or Machine Config. Node recovery can reboot that node and shift its workloads."

