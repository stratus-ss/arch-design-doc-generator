check_id = "7.5.pods.crashloop"
title = "CrashLoopBackOff pods"
description = "One or more pods are in CrashLoopBackOff state, meaning the container is\nrepeatedly crashing after startup. This typically indicates application errors,\nmissing configuration, failed dependency connections, or resource exhaustion.\nPods in this state consume restart cycles and may mask other cluster issues.\n"
