[[checks]]
check_id = "7.5.pods.crashloop"
title = "CrashLoopBackOff pods"
description = "This check identifies containers currently in the Waiting state with the reason `CrashLoopBackOff`, which means the container is repeatedly starting, terminating, and being restarted with an increasing delay between attempts. The output captures the waiting reason, last termination reason, exit code, and restart count to support root-cause analysis. Any container in `CrashLoopBackOff` is reported as **FAIL**.\n"
recommendation = "Investigate and remediate each `CrashLoopBackOff` container before deleting or restarting the pod. Review the container's waiting reason, previous termination reason, exit code, pod events, and prior container logs. Treat OOMKilled as termination evidence that requires memory-limit, workload-demand, or node-memory-pressure analysis; it is not a log message and should be correlated with events and container logs."
verification = "1. List containers in `CrashLoopBackOff` with their wait reason, exit reason, exit code, and restart count. Any row in the output needs investigation. If none are in `CrashLoopBackOff` the command reports that:\n   `oc get pods -A -o json | jq -r '.items[] | . as $p | (($p.status.containerStatuses // []) + ($p.status.initContainerStatuses // []))[] | [$p.metadata.namespace, $p.metadata.name, .name, (.state.waiting.reason // \"-\"), (.lastState.terminated.reason // \"-\"), ((.lastState.terminated.exitCode // \"-\")|tostring), (.restartCount|tostring)] | @tsv' | awk -F'\\t' '$4==\"CrashLoopBackOff\"{print \"FAIL\", \"NS=\"$1, \"NAME=\"$2, \"CONTAINER=\"$3, \"WAIT=\"$4, \"EXIT=\"$5, \"EXITCODE=\"$6, \"RESTARTS=\"$7; n=1} END{if(!n) print \"INFO n/a-crashloop\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "CrashLoopBackOff containers"
impact_detail = "Correcting image, configuration, or memory limits restarts those pods. OOMKilled can also mean node memory pressure that needs capacity work."
finding_group = "crashloop-pods"
finding_group_title = "CrashLoopBackOff pods"

