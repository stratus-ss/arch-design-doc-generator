[[checks]]
check_id = "7.5.pods.crashloop"
title = "CrashLoopBackOff pods"
description = "This check is containers whose waiting reason is CrashLoopBackOff. Print WAIT, EXIT, EXITCODE, and RESTARTS. Any such row = FAIL. None = INFO n/a-crashloop. High restart without CrashLoop is 7.5.pod_restarts."
recommendation = "Stop CrashLoopBackOff containers. Read WAIT, EXIT, and EXITCODE before you delete the pod — OOMKilled is an exit reason, not a log dump. High restartCount without CrashLoop is a restart-storm row, not this one. An empty list means no container is crash-looping.\n\nVerification:\n1. Print CrashLoopBackOff containers with WAIT, EXIT, EXITCODE, and RESTARTS. Any listed row needs action. An empty list means this is not in use (n/a-crashloop):\n   `oc get pods -A -o json | jq -r '.items[] | . as $p | (($p.status.containerStatuses // []) + ($p.status.initContainerStatuses // []))[] | [$p.metadata.namespace, $p.metadata.name, .name, (.state.waiting.reason // \"-\"), (.lastState.terminated.reason // \"-\"), ((.lastState.terminated.exitCode // \"-\")|tostring), (.restartCount|tostring)] | @tsv' | awk -F'\\t' '$4==\"CrashLoopBackOff\"{print \"FAIL\", \"NS=\"$1, \"NAME=\"$2, \"CONTAINER=\"$3, \"WAIT=\"$4, \"EXIT=\"$5, \"EXITCODE=\"$6, \"RESTARTS=\"$7; n=1} END{if(!n) print \"INFO n/a-crashloop\"}'`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

