[[checks]]
check_id = "7.5.alerts.critical"
title = "Critical alerts"
description = "Critical alerts indicate conditions that require immediate attention. All\ncritical alerts should be investigated and resolved as quickly as possible.\n"
recommendation = "Resolve the firing critical alert immediately using the console runbook for that alert name. Empty Prometheus output is healthy. Do not silence or inhibit a critical alert to clear the finding.\n\nVerification:\n1. Print firing **critical** alerts only (`state`, `alertname`, `severity`):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.severity==\"critical\") | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n      Empty output means none are critical.\n2. Runbooks: OpenShift console `Observe -> Alerting`."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

