title = "5.9. Pod Disruption Budget"
description = "Evaluates PodDisruptionBudget configuration to ensure voluntary disruptions\n(drains, upgrades) cannot violate application availability requirements.\nMissing or misconfigured PDBs risk downtime during maintenance.\n"
recommendation = "Raise disruptionsAllowed above 0 on PDBs that would block a drain or upgrade. Missing PDBs are not a defect by themselves. Confirm the selector still matches the pods you think it does.\n\nVerification:\n1. List PDBs with allowed disruptions:\n   `oc get pdb -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,ALLOWED:.status.disruptionsAllowed,MIN:.spec.minAvailable,MAX:.spec.maxUnavailable`\n2. Print rows that block drains (`ALLOWED` is 0):\n   `oc get pdb -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,ALLOWED:.status.disruptionsAllowed --no-headers | awk '$3==\"0\" {print}'`\n3. Ensure PDB selectors match the intended pod labels. Widening maxUnavailable (or lowering minAvailable) is the usual fix; deleting the PDB is last resort."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

