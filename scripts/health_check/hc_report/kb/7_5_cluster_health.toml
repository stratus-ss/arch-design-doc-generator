[[checks]]
check_id = "7.5.tsr.5_11_3_overcommit_alerts"
title = "5.11.3. Overcommit Alerts"
description = "This check evaluates CPU and memory request overcommit using Overcommit/Quota alerts and the ratio of requested resources to node allocatable capacity. A ratio greater than 1.0 is a **WARNING** because scheduled requests exceed available allocatable resources.\n"
recommendation = "Review workloads scheduled to node pools where CPU or memory requests exceed available allocatable capacity, then right-size requests based on sustained demand or add node capacity. Do not rely on `oc adm top` to assess this condition, as it reports current usage rather than scheduler reservations and can show idle nodes even when the cluster is overcommitted. Avoid increasing allocatable values solely to suppress the alert."
verification = "1. List firing Overcommit or Quota alerts by state, alertname, and severity. If none are firing the command reports it:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | select(.labels.alertname | test(\"Overcommit|Quota\"; \"i\")) | [.state, .labels.alertname, .labels.severity] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"STATE=\"$1, \"ALERT=\"$2, \"SEVERITY=\"$3} END{if(NR==0) print \"INFO n/a-overcommit-alert\"}'`\n2. Show CPU request-to-allocatable ratio per node. A ratio above 1 means CPU requests exceed allocatable capacity. If no data is returned the command reports it:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"}) / sum by (node) (kube_node_status_allocatable{resource=\"cpu\"})' | jq -r '.data.result[] | [.metric.node, .value[1]] | @tsv' | awk -F'\\t' '{r=\"PASS\"; if($2+0>1) r=\"WARNING\"; printf \"%s NODE=%s CPU_REQ_RATIO=%.2f\\n\", r, $1, $2} END{if(NR==0) print \"INFO n/a-cpu-overcommit\"}'`\n3. Show memory request-to-allocatable ratio per node. A ratio above 1 means memory requests exceed allocatable capacity. If no data is returned the command reports it:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"})' | jq -r '.data.result[] | [.metric.node, .value[1]] | @tsv' | awk -F'\\t' '{r=\"PASS\"; if($2+0>1) r=\"WARNING\"; printf \"%s NODE=%s MEM_REQ_RATIO=%.2f\\n\", r, $1, $2} END{if(NR==0) print \"INFO n/a-mem-overcommit\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads whose requests exceed allocatable"
impact_detail = "Right-sizing requests from sustained demand reschedules or rolls those workloads. Adding nodes is a maintenance window. Do not raise allocatable to hide the alert."

