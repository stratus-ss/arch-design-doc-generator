[[checks]]
check_id = "7.5.alerts.critical"
title = "Critical alerts"
description = "Critical alerts indicate conditions that require immediate attention. All\ncritical alerts should be investigated and resolved as quickly as possible.\n"
recommendation = "Resolve the firing critical alert immediately using the console runbook for that alert name. Empty Prometheus output is healthy. Do not silence or inhibit a critical alert to clear the finding."
verification = "1. List firing critical alerts, showing `state`, `alertname`, and `severity`. Empty output means no critical alerts are firing:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | select(.labels.severity==\"critical\") | {state, alertname: .labels.alertname, severity: .labels.severity}'`\n2. Look up runbooks in the OpenShift console under `Observe -> Alerting`."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "whatever the alertname names, often control plane"
impact_detail = "Clearing a firing critical alert follows that alert's runbook. Do not silence it. The remediating change is usually planned control-plane or node work."

