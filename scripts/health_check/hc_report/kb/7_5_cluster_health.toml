[[checks]]
check_id = "7.5.pruning.jobs"
title = "Job pruning"
description = "Stale completed Jobs accumulate in etcd and slow API list operations. Add TTL\ncleanup to Job specs so completed objects are removed automatically.\n"
recommendation = "Set ttlSecondsAfterFinished on Job templates, and cap CronJob history limits, so completed Jobs age out of etcd. Deleting rows by hand is a one-shot. Confirm a Job is no longer needed before you drop it.\n\nVerification:\n1. Review completed Jobs in large namespaces:\n   `oc get jobs -A`\n2. Set `ttlSecondsAfterFinished` on Job templates so finished objects age out.\n3. Cap CronJob `successfulJobsHistoryLimit` and `failedJobsHistoryLimit` so history cannot grow without bound.\n4. Delete stale completed jobs only after confirming they are no longer needed."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "completed job retention"
impact_detail = "Job TTL and history-limit changes affect cleanup behavior for completed jobs without disrupting running workloads."

