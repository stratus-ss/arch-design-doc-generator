[[checks]]
check_id = "7.5.registry_health"
title = "Internal registry health"
finding_on_info = true
description = "This reads the Image Registry Operator spec.managementState (not spec.storage.managementState). Managed means the Operator reconciles the registry. Unmanaged means the Operator ignores config changes — confirm that is intentional. Removed means the Operator has torn down the registry instance (the post-install default on platforms without shareable object storage until someone sets Managed and attaches storage) — confirm that is intentional."
recommendation = "Keep Image Registry Operator `spec.managementState` at Managed when the platform should reconcile the registry. Leave Unmanaged only as an accepted exception. Removed is the post-install default until someone sets Managed and attaches storage. Changing state rolls registry pods."
verification = "1. Show the Image Registry Operator managementState, replicas, and storage backend:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o custom-columns=STATE:.spec.managementState,REPLICAS:.spec.replicas,EMPTYDIR:.spec.storage.emptyDir,PVC:.spec.storage.pvc.claim`\n2. Confirm `STATE` matches the cluster's intended usage.\n3. If `Managed`, verify registry pods are running:\n   `oc get pods -n openshift-image-registry`\n4. If the cluster needs an Operator-reconciled registry and `STATE` is `Removed`, set `Managed` and configure storage. `Unmanaged` with user-provided storage is valid."
priority_hint = ""
impact = "workload-shift"
impact_scope = "image registry pods and internal image workflows"
impact_detail = "Changing registry state or storage rolls registry pods and can briefly interrupt builds or internal image pulls/pushes."
summary_patterns = [
  { contains = "managementState: Unmanaged", text = "Image Registry Operator is Unmanaged; it will not reconcile registry config." },
  { contains = "managementState: Removed", text = "Image Registry Operator is Removed; there is no Operator-managed internal registry." },
]

