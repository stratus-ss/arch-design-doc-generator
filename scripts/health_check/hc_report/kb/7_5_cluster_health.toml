[[checks]]
check_id = "7.5.pod_restarts"
title = "Pod frequent restarts"
description = "Pods with high restart counts indicate recurring failures — OOMKills, liveness\nprobe failures, application crashes, or dependency unavailability. High restart\ncounts waste cluster resources and may indicate production reliability issues.\nThe engine selects pods whose container restartCount is greater than 10 and lists the first 3 of N in evidence. The TSR 5.5 worksheet may list a different set. The engine does not copy the TSR list."
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Pods with high restart counts indicate recurring failures — OOMKills, liveness
# probe failures, application crashes, or dependency unavailability.
# The rec remediates THAT story by starting at `oc get pods -A
# --sort-by='.status.containerStatuses[0].restartCount'` — the live object/command for this
# check, not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Identify high-restart pods:\n   `oc get pods -A --sort-by='.status.containerStatuses[0].restartCount'`\n2. Investigate each affected pod:\n   `oc describe pod <pod> -n <ns>`\n   `oc logs <pod> -n <ns> --previous`\n3. Check for `OOMKilled` status in container `lastState`.\n4. Review resource limits, liveness probe timeouts, and external dependency availability.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

