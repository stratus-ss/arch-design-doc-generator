check_id = "7.5.tsr.5_12_dns_health"
title = "5.12. DNS Health"
description = "Validates CoreDNS pod health, DNS resolution latency, and DNS operator status.\nDNS failures cascade into service discovery issues, health probe failures,\nand operator degradation across the entire cluster.\n"
# why-rec
# CORRECTED. Same PASS/FAIL as 7.3.dns.operator (`oc get dns.operator` is NAME/AGE only).
# Pods and CoreDNS SERVFAIL logs stay on this 5.12 row.
recommendation = "1. PASS/FAIL `dns.operator default` (`Available=True`, `Progressing=False`, `Degraded=False`):\n   `oc get dns.operator default -o jsonpath='{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}' | awk -F= '$1==\"Available\"{a=$2} $1==\"Progressing\"{p=$2} $1==\"Degraded\"{d=$2} END{print (a==\"True\" && p==\"False\" && d==\"False\"?\"PASS\":\"FAIL\"), \"Available=\"a, \"Progressing=\"p, \"Degraded=\"d}'`\n2. Print conditions if FAIL:\n   `oc get dns.operator default -o jsonpath='{range .status.conditions[*]}{.type}={.status} reason={.reason}{\"\\n\"}{end}'`\n3. Check DNS pod health:\n   `oc get pods -n openshift-dns`\n4. Review CoreDNS logs for SERVFAIL:\n   `oc -n openshift-dns logs -l dns.operator.openshift.io/daemonset-dns --tail=100`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""
