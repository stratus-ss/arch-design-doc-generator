[[checks]]
check_id = "7.5.tsr.5_11_3_overcommit_alerts"
title = "5.11.3. Overcommit Alerts"
description = "This check is request overcommit: Overcommit/Quota alerts, and CPU/memory request vs allocatable ratio. Ratio >1 = WARNING. oc adm top is usage, not requests."
recommendation = "Reduce requests or add nodes where request overcommit ratio is greater than 1. The node can still look idle on `oc adm top`. Do not raise allocatable to hide it.\n\nVerification:\n1. Print firing Overcommit or Quota alerts (state, alertname, severity). An empty list means this is not in use (n/a-overcommit-alert):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | select(.labels.alertname | test(\"Overcommit|Quota\"; \"i\")) | [.state, .labels.alertname, .labels.severity] | @tsv' | awk -F'\\t' '{print \"WARNING\", \"STATE=\"$1, \"ALERT=\"$2, \"SEVERITY=\"$3} END{if(NR==0) print \"INFO n/a-overcommit-alert\"}'`\n2. Print CPU request / allocatable per node. >1 needs review. An empty list means this is not in use (n/a-cpu-overcommit):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"}) / sum by (node) (kube_node_status_allocatable{resource=\"cpu\"})' | jq -r '.data.result[] | [.metric.node, .value[1]] | @tsv' | awk -F'\\t' '{r=\"PASS\"; if($2+0>1) r=\"WARNING\"; printf \"%s NODE=%s CPU_REQ_RATIO=%.2f\\n\", r, $1, $2} END{if(NR==0) print \"INFO n/a-cpu-overcommit\"}'`\n3. Print memory request / allocatable per node. >1 needs review. An empty list means this is not in use (n/a-mem-overcommit):\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"})' | jq -r '.data.result[] | [.metric.node, .value[1]] | @tsv' | awk -F'\\t' '{r=\"PASS\"; if($2+0>1) r=\"WARNING\"; printf \"%s NODE=%s MEM_REQ_RATIO=%.2f\\n\", r, $1, $2} END{if(NR==0) print \"INFO n/a-mem-overcommit\"}'`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

