[[checks]]
check_id = "7.5.volume.mount_p99"
title = "Volume mount p99 duration"
description = "This check scores kubelet CSI volume mount duration at the 99th percentile over 15 minutes. A pod cannot start until Kubernetes and the CSI driver attach, stage, and mount its volumes. Slow mounts delay application recovery, VM startup, node drains, and rollouts. This is not PVC used percent.\n"
recommendation = "Treat p99 above 2 seconds as a storage attach or mount delay. Review FailedMount and FailedAttachVolume events, VolumeAttachment, CSI controller and node-plugin pods, and backend connectivity. Do not scrape host mount tables. Do not delete VolumeAttachment objects as a default fix. Empty PromQL is informational, not a pass.\n"
verification = "1. Query kubelet storage-operation duration p99 for volume_mount and mount operations. At or below 2 seconds is PASS. Above 2 seconds and at most 10 seconds is WARNING. Above 10 seconds is FAIL. An empty result is INFO — the metric was not scraped:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=histogram_quantile(0.99, sum(rate(storage_operation_duration_seconds_bucket{operation=~\"volume_mount|mount\"}[15m])) by (le))' | jq -r '.data.result[] | .value[1]' | awk '{if($1==\"NaN\"||$1==\"+Inf\"||$1==\"-Inf\"){print \"INFO\", \"P99=not-a-number\"; next} r=\"PASS\"; if($1+0>10) r=\"FAIL\"; else if($1+0>2) r=\"WARNING\"; printf \"%s P99=%.2fs\\n\", r, $1+0} END{if(NR==0) print \"INFO empty vector\"}'`"
priority_hint = "P1"
impact = "workload-shift"
impact_scope = "pods waiting on volume attach or mount"
impact_detail = "Fixing slow CSI mount usually restarts or reschedules the waiting pods. It does not reboot nodes by itself."
finding_group = "volume-mount-duration"
finding_group_title = "Volume mount duration"

