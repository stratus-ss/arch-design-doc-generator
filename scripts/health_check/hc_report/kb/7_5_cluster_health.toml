[[checks]]
check_id = "7.5.pod_restarts"
title = "Pod frequent restarts"
description = "This check identifies any container whose `restartCount` is greater than 10. It inspects each `containerStatuses` entry, not a pod-wide sum. The first container over 10 is enough for WARNING.\n"
recommendation = "Investigate pods with a container restart count greater than 10 first, using pod events and previous container logs to identify causes such as OOMKilled, failing probes, application errors, or invalid configuration. Correct the underlying issue and confirm that that container's restart count stops increasing."
verification = "1. List each container restart count. A container with more than 10 restarts is WARNING. If no pods exist the command reports it:\n   `oc get pods -A -o json | jq -r '.items[] | . as $p | ($p.status.containerStatuses // [])[] | [(.restartCount // 0), $p.metadata.name, $p.metadata.namespace, .name] | @tsv' | awk -F'\\t' '{r=\"PASS\"; if($1+0>10) r=\"WARNING\"; print r, \"RESTARTS=\"$1, \"NAME=\"$2, \"NS=\"$3, \"CONTAINER=\"$4} END{if(NR==0) print \"INFO n/a-pod\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "pods with rising restart counts"
impact_detail = "Correcting image, configuration, or memory limits restarts those pods. OOMKilled can also mean node memory pressure that needs capacity work."

[checks.links]
