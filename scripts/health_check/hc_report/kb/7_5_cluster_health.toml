[[checks]]
check_id = "7.5.pods.crashloop"
title = "CrashLoopBackOff pods"
description = "One or more pods are in CrashLoopBackOff state, meaning the container is\nrepeatedly crashing after startup. This typically indicates application errors,\nmissing configuration, failed dependency connections, or resource exhaustion.\nPods in this state consume restart cycles and may mask other cluster issues.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: One or more pods are in CrashLoopBackOff state, meaning the container is
# repeatedly crashing after startup.
# The rec remediates THAT story by starting at `oc logs <pod> -p` — the live object/command for
# this check, not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. View the previous container exit logs:\n   `oc logs <pod> -p`\n2. Check for OOM kills:\n   `oc describe pod <pod>`\n3. Investigate application errors, missing dependencies, or resource constraints.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

