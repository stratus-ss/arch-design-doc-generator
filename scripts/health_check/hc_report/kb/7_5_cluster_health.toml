[[checks]]
check_id = "7.5.tsr.5_4_registry_health"
title = "5.4. Registry Health"
description = "Validates internal image registry pod health, storage backend availability, and\nmanagementState. A degraded registry blocks builds, ImageStream imports, and\ninternal image distribution.\n"
recommendation = "Restore registry pods and the image-registry ClusterOperator, and configure storage if it is missing. A degraded registry blocks builds and ImageStream imports. Operator managementState is ownership of the registry, not the storage backend."
verification = "1. Check the image-registry ClusterOperator status. A healthy operator shows `AVAILABLE=True`, `PROGRESSING=False`, `DEGRADED=False`:\n   `oc get co image-registry --no-headers | awk '{print ($3==\"True\" && $4==\"False\" && $5==\"False\"?\"PASS\":\"FAIL\"), $0}'`\n2. Verify registry pods are running:\n   `oc get pods -n openshift-image-registry`\n3. Show the managementState and storage backend configuration:\n   `oc get configs.imageregistry.operator.openshift.io cluster -o custom-columns=STATE:.spec.managementState,REPLICAS:.spec.replicas,EMPTYDIR:.spec.storage.emptyDir,PVC:.spec.storage.pvc.claim`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "image-registry pods and internal image workflows"
impact_detail = "Changing registry state or storage rolls registry pods and can briefly interrupt builds or internal image pulls/pushes."
finding_group = "registry-health-pods"
finding_group_title = "Image registry health (pods and ClusterOperator)"

