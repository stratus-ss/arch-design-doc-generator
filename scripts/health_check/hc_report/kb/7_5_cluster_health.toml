title = "Current node load"
description = "This check is cluster current node load from `oc adm top nodes`. Per-node rows `7.5.node.{short}.utilization` still emit. WARNING if any node CPU percent is greater than 80 or memory percent is greater than 85. INFO if any node CPU percent is greater than 60 or memory percent is greater than 70 and none are WARNING. PASS when every parsed node is below those INFO bars. Missing or unparseable top output is N/A.\n"
recommendation = "Add workers, spread load, or right-size requests when `oc adm top` shows nodes consistently above 80% CPU or 85% memory. That is usage, not requests. Per-node rows remain in chapter 7."
verification = "1. Print node CPU and memory utilization. WARNING if CPU percent is greater than 80 or memory percent is greater than 85. INFO if CPU percent is greater than 60 or memory percent is greater than 70.\n   `oc adm top nodes`\n2. Scale by adding workers, rebalance with pod anti-affinity or topology-spread constraints, or right-size pod resource requests."
priority_hint = ""
impact = "workload-shift"
impact_scope = "workloads on nodes above 80% CPU or 85% memory"
impact_detail = "Spreading load or right-sizing requests reschedules those pods. Adding workers is a maintenance window."
finding_group = "node-utilization"
finding_group_title = "Current node load"

