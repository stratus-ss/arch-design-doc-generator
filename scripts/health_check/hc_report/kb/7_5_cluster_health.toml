check_id = "7.5.tsr.5_5_pod_frequent_restarts"
title = "5.5. Pod Frequent Restarts"
description = "This check is total pod restartCount (sum of containerStatuses), not container [0]. RESTARTS>10 = WARNING. Same command as 7.5.pod_restarts. CrashLoopBackOff is 7.5.pods.crashloop."
recommendation = "Investigate pods with RESTARTS>10; they are running but cycling. CrashLoopBackOff is a different failure: the container never stays up. This row is the same restartCount story as the cluster-wide restart check.\n\nVerification:\n1. Print total RESTARTS (sum of containerStatuses), NAME, and NS. sort -n. >10 needs review. Otherwise the row is healthy. An empty list means this is not in use (n/a-pod):\n   `oc get pods -A -o json | jq -r '.items[] | [((.status.containerStatuses // []) | map(.restartCount) | add // 0), .metadata.name, .metadata.namespace] | @tsv' | sort -n | awk -F'\\t' '{r=\"PASS\"; if($1+0>10) r=\"WARNING\"; print r, \"RESTARTS=\"$1, \"NAME=\"$2, \"NS=\"$3} END{if(NR==0) print \"INFO n/a-pod\"}'`"
priority_hint = ""
impact = "none"
