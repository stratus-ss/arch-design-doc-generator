[[checks]]
check_id = "7.5.pruning.pods"
title = "Pod pruning"
description = "This check counts terminated pods reported by the API: **Succeeded** pods and **Failed** pods. Counts at or below 200 succeeded and 50 failed are considered acceptable; higher counts generate a **WARNING** because terminated objects add API inventory clutter and can make troubleshooting noisier. Cluster-wide cleanup is controlled by the kube-controller-manager `terminated-pod-gc-threshold`. When unset, the default is 12,500 terminated pods, so normal garbage collection may not begin until far above this check’s thresholds.\n"
recommendation = "Keep terminated pod counts within the check thresholds by configuring TTL cleanup for recurring Jobs and pruning obsolete workload resources where appropriate. If terminated-pod accumulation is persistent across the cluster, review and tune `terminated-pod-gc-threshold` to a value appropriate for cluster size and workload churn. Counts above the threshold are a housekeeping and API-management warning, not an outage."
verification = "1. Count Succeeded pods across the cluster. 200 or fewer is healthy; above that is a warning:\n   `oc get pods -A --field-selector=status.phase=Succeeded --no-headers | awk 'END{c=NR; r=(c<=200?\"PASS\":\"WARNING\"); print r, \"SUCCEEDED=\"c}'`\n2. Count Failed pods across the cluster. 50 or fewer is healthy; above that is a warning:\n   `oc get pods -A --field-selector=status.phase=Failed --no-headers | awk 'END{c=NR; r=(c<=50?\"PASS\":\"WARNING\"); print r, \"FAILED=\"c}'`\n3. Break down Succeeded and Failed pods by owner kind:\n   `oc get pods -A -o json | jq -r '.items[] | select(.status.phase==\"Succeeded\" or .status.phase==\"Failed\") | [.status.phase, ((.metadata.ownerReferences[0].kind)//\"none\")] | @tsv' | awk -F'\\t' '{c[$1 SUBSEP $2]++} END{for (x in c){split(x,a,SUBSEP); print \"PHASE=\"a[1], \"OWNERKIND=\"a[2], \"COUNT=\"c[x]}}'`\n4. Show the KubeControllerManager `terminated-pod-gc-threshold` setting. If unset, the default is 12500:\n   `oc get kubecontrollermanager cluster -o json | jq -r '((.spec.unsupportedConfigOverrides // {}).extendedArguments // {})[\"terminated-pod-gc-threshold\"][0] // \"\"' | awk '{v=$0} END{if(v==\"\") print \"INFO GCTHRESHOLD=12500-default\"; else print \"PASS GCTHRESHOLD=\"v}'`\n5. Preview a threshold change on KubeControllerManager. Remove --dry-`run=client` to apply; this restarts kube-controller-manager pods:\n   `oc patch kubecontrollermanager cluster --type merge --dry-run=client -o json -p '{\"spec\":{\"unsupportedConfigOverrides\":{\"extendedArguments\":{\"terminated-pod-gc-threshold\":[\"200\"]}}}}' | jq -r '.spec.unsupportedConfigOverrides.extendedArguments[\"terminated-pod-gc-threshold\"][0]' | awk '{print \"GCTHRESHOLD=\"$0}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "kube-controller-manager pods"
impact_detail = "Counting pods is read-only. Patching `terminated-pod-gc-threshold` restarts kube-controller-manager pods; it does not reboot nodes."

