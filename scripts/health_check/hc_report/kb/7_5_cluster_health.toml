[[checks]]
check_id = "7.5.tsr.5_5_pod_frequent_restarts"
title = "5.5. Pod Frequent Restarts"
description = "This check identifies pods with a combined container restart count greater than 10. It measures total restarts across all containers in a pod and is intended to detect running workloads that are repeatedly cycling.\n"
recommendation = "Investigate pods with the highest restart totals first, using pod events and previous container logs to identify causes such as OOMKilled, failing probes, application errors, or invalid configuration. Correct the underlying issue and confirm that restart counts stop increasing."
verification = "1. List pods sorted by total restart count across all containers. Any pod with more than 10 restarts needs investigation. If no pods exist the command reports it:\n   `oc get pods -A -o json | jq -r '.items[] | [((.status.containerStatuses // []) | map(.restartCount) | add // 0), .metadata.name, .metadata.namespace] | @tsv' | sort -n | awk -F'\\t' '{r=\"PASS\"; if($1+0>10) r=\"WARNING\"; print r, \"RESTARTS=\"$1, \"NAME=\"$2, \"NS=\"$3} END{if(NR==0) print \"INFO n/a-pod\"}'`"
priority_hint = ""
impact = "workload-shift"
impact_scope = "pods with rising restart counts"
impact_detail = "Correcting image, configuration, or memory limits restarts those pods. OOMKilled can also mean node memory pressure that needs capacity work."

