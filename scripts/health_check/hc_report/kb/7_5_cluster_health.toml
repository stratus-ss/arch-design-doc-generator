[[checks]]
check_id = "7.5.tsr.5_11_2_node_alerts"
title = "5.11.2. Node Alerts"
description = "This check is node READY and MEMORY/DISK/PID pressure. `READY=True` and pressures False = **PASS**. Else **FAIL**."
recommendation = "Restore `Ready=True` and MEMORY/DISK/PID pressure False on every node. Pressure True means the kubelet is protecting the node — find the consumer before you add more workload."
verification = "1. List each node with READY, MEMORY pressure, DISK pressure, and PID pressure. `READY=True` with all pressures False is healthy; any other combination needs action. If no nodes exist the command reports it. Quote the custom-columns value so bash does not parse the jsonpath:\n   `oc get nodes -o 'custom-columns=NAME:.metadata.name,READY:.status.conditions[?(@.type==\"Ready\")].status,MEMORY:.status.conditions[?(@.type==\"MemoryPressure\")].status,DISK:.status.conditions[?(@.type==\"DiskPressure\")].status,PID:.status.conditions[?(@.type==\"PIDPressure\")].status' --no-headers | awk '{r=\"PASS\"; if($2!=\"True\" || $3!=\"False\" || $4!=\"False\" || $5!=\"False\") r=\"FAIL\"; print r, \"NAME=\"$1, \"READY=\"$2, \"MEMORY=\"$3, \"DISK=\"$4, \"PID=\"$5} END{if(NR==0) print \"INFO n/a-node\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "nodes with Ready false or MEMORY, DISK, or PID pressure"
impact_detail = "Pressure True means the kubelet is protecting the node. Finding the consumer or adding capacity can require a drain or node replacement."

