[[checks]]
check_id = "7.5.tsr.5_2_machine_config"
title = "5.2. Machine Config"
description = "This check is MachineConfig drift: node STATE, CURRENT, and DESIRED, and MCP DEGRADED. `STATE=Done` and `CURRENT=DESIRED` = **PASS**. `DEGRADED=True` = **FAIL**."
recommendation = "Bring every node CURRENT annotation to DESIRED, and clear MCP Degraded. This row is read-only; applying the desired config drains and reboots that pool."
verification = "1. List each node's machine-config state, current config, and desired config. `STATE=Done` with CURRENT matching DESIRED is healthy; otherwise the row needs action. If no nodes exist the command reports it:\n   `oc get nodes -o 'custom-columns=NAME:.metadata.name,STATE:.metadata.annotations.machineconfiguration\\.openshift\\.io/state,CURRENT:.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig,DESIRED:.metadata.annotations.machineconfiguration\\.openshift\\.io/desiredConfig' --no-headers | awk '{r=\"PASS\"; if($2!=\"Done\" || $3!=$4) r=\"FAIL\"; print r, \"NAME=\"$1, \"STATE=\"$2, \"CURRENT=\"$3, \"DESIRED=\"$4} END{if(NR==0) print \"INFO n/a-node\"}'`\n2. List `MachineConfigPool` rendered config and degradation status. `DEGRADED=True` needs action; `UPDATING=True` is informational. If no pools exist the command reports it:\n   `oc get mcp --no-headers | awk '{r=\"PASS\"; if($5==\"True\") r=\"FAIL\"; else if($4==\"True\") r=\"INFO\"; print r, \"NAME=\"$1, \"CONFIG=\"$2, \"UPDATED=\"$3, \"UPDATING=\"$4, \"DEGRADED=\"$5} END{if(NR==0) print \"INFO n/a-mcp\"}'`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the affected MachineConfigPool"
impact_detail = "Scoring drift is read-only. Applying a desired MachineConfig drains and reboots nodes in that pool."

