[[checks]]
check_id = "7.5.master_taints"
title = "Control plane taints"
description = "Control plane nodes should have the `node-role.kubernetes.io/master:NoSchedule`\ntaint to prevent user workloads from being scheduled there. This taint is\nnormally applied during installation but may be missing on manually adjusted\nnodes.\n"
recommendation = "1. Apply the standard `NoSchedule` taint to all control plane nodes:\n   `oc adm taint nodes <node> node-role.kubernetes.io/master=:NoSchedule`\n2. Prevent user workloads from competing with etcd, the API server, and the scheduler for critical resources.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "control-plane scheduling"
impact_detail = "Adding the taint stops new user workloads from landing on control-plane nodes, but it does not reboot nodes or evict existing pods automatically."

