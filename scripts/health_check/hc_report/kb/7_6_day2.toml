title = "6.6.1. Machine Config Pool Max Unavailable"
description = "Evaluates the maxUnavailable setting on MachineConfigPools which controls how\nmany nodes can be drained simultaneously during upgrades. Too high a value\nrisks capacity loss; too low extends maintenance windows unnecessarily.\n"
recommendation = "Keep production MCP `maxUnavailable` at 1, or a small percent. Compact 3-node clusters cannot spare more than 1 without losing a third of capacity."
verification = "1. Print maxUnavailable per pool:\n   `oc get mcp -o custom-columns=NAME:.metadata.name,MAXUNAVAILABLE:.spec.maxUnavailable,MACHINECOUNT:.status.machineCount,READY:.status.readyMachineCount`\n2. For production clusters, set maxUnavailable to 1 or a small percentage to minimize capacity loss during rolling updates.\n3. For non-production clusters, use higher values to accelerate rollout."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "MachineConfigPool rollout behavior"
impact_detail = "Changing maxUnavailable affects how future upgrades are paced but does not itself trigger node reboots."

