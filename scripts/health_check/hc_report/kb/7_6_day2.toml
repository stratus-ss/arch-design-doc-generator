verification = "1. List user-namespace NetworkPolicies. Skip openshift-* kube-* default and openshift. POD-SELECTOR <none> is all pods in the namespace (usually default-deny), not orphaned. An empty list means this is not in use (n/a-user-netpol):\n   `oc get networkpolicy -A | awk 'NR==1{hdr=$0; next} $1 ~ /^(openshift-|kube-)/ || $1==\"openshift\" || $1==\"default\" {next} {if(!c) print hdr; print; c++} END{if(!c) print \"INFO n/a-user-netpol\"}'`\n2. For a remaining row with a label POD-SELECTOR, count matching pods. MATCH=0 needs action:\n   `oc get pods -n <ns> -l '<POD-SELECTOR>' --no-headers | awk 'END{c=NR; r=(c==0?\"FAIL\":\"PASS\"); print r, \"MATCH=\"c}'`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "network policy rule tables"
impact_detail = "Removing unused NetworkPolicies updates OVN/iptables rules without disrupting existing pod connectivity."

