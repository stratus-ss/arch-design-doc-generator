title = "6.5. Node SSH Accessed"
description = "Detects evidence of SSH access to cluster nodes, which may indicate manual\nchanges outside of MachineConfig management. Direct node modifications create\nconfiguration drift and are overwritten on next MCO render.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Detects evidence of SSH access to cluster nodes, which may indicate manual changes
# outside of MachineConfig management.
# The rec remediates THAT story by starting at `oc adm node-logs <node> -u sshd --since=-30d` —
# the live object/command for this check, not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check for SSH session evidence across all nodes:\n   `oc adm node-logs <node> -u sshd --since=-30d`\n2. Codify any manual changes made via SSH in MachineConfig so they survive node\n   reboots and scaling events.\n3. Restrict SSH access via firewall rules or remove SSH keys from node\n   configuration.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

