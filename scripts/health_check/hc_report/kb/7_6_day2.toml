[[checks]]
check_id = "7.6.apiserver.tls"
title = "API server TLS profile"
description = "The TLS security profile controls which cipher suites and TLS versions are\naccepted by the API server and other components. `Old` should not be used in\nproduction unless compatibility requirements are explicitly documented.\n"
recommendation = "Keep API `tlsSecurityProfile` at Intermediate. Unset is that OpenShift default and is acceptable. Old is too weak for production; Custom means you own the cipher set. Patching rolls API servers; confirm clients support the cipher set first."
verification = "1. Print the TLS security profile TYPE on the API server. **PASS** if empty, Intermediate, or Modern; **FAIL** if Old; **INFO** if Custom.\n   `oc get apiserver cluster -o custom-columns=TYPE:.spec.tlsSecurityProfile.type --no-headers | awk '{t=$1; r=\"PASS\"; if(t==\"Old\") r=\"FAIL\"; if(t==\"Custom\") r=\"INFO\"; if(t==\"<none>\"||t==\"\") t=\"default-Intermediate\"; print r, \"TYPE=\"t}'`\n2. If TYPE is Old, patch to Intermediate (this rolls API servers).\n   `oc patch apiserver cluster --type=merge -p '{\"spec\":{\"tlsSecurityProfile\":{\"type\":\"Intermediate\"}}}'`\n3. Confirm external clients support the target cipher set before applying. Custom profiles stay **INFO** until the cipher set is documented."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "API server and related control-plane components"
impact_detail = "TLS profile changes propagate across multiple control-plane components and trigger an operator-managed rollout that can briefly reset API connections."
finding_group = "apiserver-tls"
finding_group_title = "API server TLS profile"

