[[checks]]
check_id = "7.6.limitranges"
title = "LimitRanges"
description = "LimitRanges enforce default resource requests and limits on containers.\nWithout them, workloads can bypass namespace-level guardrails and create noisy\nneighbor problems.\n"
recommendation = "1. Review existing coverage and inspect namespace resource defaults before\n   adding new policies:\n   `oc get limitrange -A`\n2. Create LimitRanges in application namespaces to set sane default requests\n   and limits for CPU and memory.\n3. Apply the policy through templates or GitOps for consistency:\n   `oc apply -f <limitrange.yaml> -n <ns>`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "namespace admission defaults"
impact_detail = "LimitRanges affect new or updated pods by applying default requests and limits; existing pods continue running unchanged."

