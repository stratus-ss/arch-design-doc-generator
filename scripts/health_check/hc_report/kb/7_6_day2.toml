[[checks]]
check_id = "7.6.tsr.6_2_3_images_patch_management"
title = "6.2.3. Images Patch Management"
description = "This check reviews the cluster Image configuration’s `registrySources` policy: `allowedRegistries`, `blockedRegistries`, and `insecureRegistries`. These settings control which external registries nodes may use for image pulls and pushes; they do not govern the internal OpenShift image registry. `allowedRegistries` permits only listed registries, while `blockedRegistries` denies listed registries. These two settings are mutually exclusive. An empty configuration is the normal connected-cluster default.\n"
recommendation = "Keep registry-source settings aligned with the approved image supply chain policy. Use an allowlist where registry access must be tightly controlled, or a blocklist for specific prohibited sources—never configure both. When using an allowlist, include all registries required for platform updates, Operators, workloads, and the internal registry as applicable. Avoid `insecureRegistries` whenever possible."
verification = "1. Print allowed registries from image.config. An empty list is **INFO** (the connected-cluster default).\n   `oc get image.config cluster -o json | jq -r '(.spec.registrySources.allowedRegistries | if type==\"array\" then . else [] end)[]' | awk 'NF{print \"INFO\", \"ALLOWED=\"$0; c++} END{if(!c) print \"INFO none-allowed\"}'`\n2. Print blocked registries. An empty list is **INFO**.\n   `oc get image.config cluster -o json | jq -r '(.spec.registrySources.blockedRegistries | if type==\"array\" then . else [] end)[]' | awk 'NF{print \"INFO\", \"BLOCKED=\"$0; c++} END{if(!c) print \"INFO none-blocked\"}'`\n3. Print insecure registries. **WARNING** for each listed row; **PASS** if the list is empty.\n   `oc get image.config cluster -o json | jq -r '(.spec.registrySources.insecureRegistries | if type==\"array\" then . else [] end)[]' | awk 'NF{print \"WARNING\", \"INSECURE=\"$0; c++} END{if(!c) print \"PASS none-insecure\"}'`"
priority_hint = ""
impact = "none"
