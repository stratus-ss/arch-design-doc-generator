[[checks]]
check_id = "7.6.upgrade.history"
title = "Upgrade history"
description = "Regular upgrade cadence is important for security patching and supportability.\nLong delays between z-stream or minor upgrades increase lifecycle and security\nrisk.\n"
# why-rec
# CORRECTED. `{.status.history}` dumps the JSON array. Stock `oc get clusterversion` has
# no history columns. Rec prints STATE VERSION COMPLETED only (cadence). Completed =
# PASS. Any other STATE = FAIL. Lab: compact BareMetal, all history rows Completed.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Print STATE VERSION COMPLETED from ClusterVersion history. Completed = PASS. Any other STATE = FAIL:\n   `oc get clusterversion version -o jsonpath='{range .status.history[*]}{.state}{\"\\t\"}{.version}{\"\\t\"}{.completionTime}{\"\\n\"}{end}' | awk '{print ($1==\"Completed\"?\"PASS\":\"FAIL\"), \"STATE=\"$1, \"VERSION=\"$2, \"COMPLETED=\"$3}'`\n2. Use the OCP Upgrade Graph to plan the next supported update path.\n3. If the cluster is multiple releases behind, test the target path in non-production and schedule a maintenance window before applying the update.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Addressing stale upgrade history usually means performing a cluster upgrade, which rolls operators, nodes, and workloads over time."

