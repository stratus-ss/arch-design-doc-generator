[[checks]]
check_id = "7.6.rq"
title = "Resource quotas"
description = "ResourceQuotas limit total resource consumption per namespace. Without them, a\nsingle namespace can consume cluster capacity and starve other tenants.\n"
recommendation = "1. Review current namespace consumption:\n   `oc describe quota -n <ns>`\n2. Apply ResourceQuotas to tenant or application namespaces based on expected\n   CPU, memory, storage, and object-count usage.\n3. Use project templates so new namespaces receive quotas automatically.\n"
