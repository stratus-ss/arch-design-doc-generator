[[checks]]
check_id = "7.6.tsr.6_1_5_5_node_garbage_collection"
title = "TSR node garbage collection"
description = "This check verifies that each node is properly cleaning up unused container images. When images accumulate beyond the garbage collection threshold (default: 85% disk usage), the kubelet should automatically remove unused images. A failure here means images are consuming excessive disk space and the automatic cleanup is not keeping pace."
recommendation = "Keep kubelet image-GC filesystem fill below the applied HIGH threshold (default 85%). USED% at or above HIGH means prune unused images or add disk; do not lower HIGH to hide fill. This is fill versus HIGH, not `crictl images` count. Changing the threshold through KubeletConfig rolls the MCP."
verification = "1. Print image filesystem fill against the applied GC high threshold. USED% is (capacity-available)/capacity of imageFs, not crictl image count. USED% >= HIGH needs action. HIGH comes from configz (no KubeletConfig CR uses 85):\n   `oc get nodes --no-headers -o custom-columns=NAME:.metadata.name | while read -r node; do high=$(oc get --raw /api/v1/nodes/${node}/proxy/configz | jq -r '.kubeletconfig.imageGCHighThresholdPercent // 85'); oc get --raw /api/v1/nodes/${node}/proxy/stats/summary | jq -r --arg node \"$node\" --arg high \"$high\" '(.node.runtime.imageFs // .node.fs) as $fs | [$node, $high, $fs.capacityBytes, $fs.availableBytes] | @tsv'; done | awk '{used=int(($3-$4)*100/$3); r=\"PASS\"; if(used>=$2+0) r=\"FAIL\"; print r, \"NODE=\"$1, \"USED=\"used\"%\", \"HIGH=\"$2}'`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the targeted MachineConfigPool"
impact_detail = "Changing kubelet garbage-collection settings through KubeletConfig or MachineConfig drains and reboots affected nodes one at a time."
summary_patterns = [
  { contains = "more than half of the total disk", text = "Node image storage uses more than half of disk; garbage collection is not keeping up." },
