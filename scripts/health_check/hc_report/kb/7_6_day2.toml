[[checks]]
check_id = "7.6.tsr.6_6_1_machine_config_pool_max_unavailable"
title = "6.6.1. Machine Config Pool Max Unavailable"
description = "Evaluates the maxUnavailable setting on MachineConfigPools which controls how\nmany nodes can be drained simultaneously during upgrades. Too high a value\nrisks capacity loss; too low extends maintenance windows unnecessarily.\n"
recommendation = "1. Check current settings:\n   `oc get mcp -o json | jq '.items[] | {name: .metadata.name, maxUnavailable: .spec.maxUnavailable}'`\n2. For production clusters, set maxUnavailable to 1 or a small percentage to\n   minimize capacity loss during rolling updates.\n3. For non-production clusters, use higher values to accelerate rollout.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "MachineConfigPool rollout behavior"
impact_detail = "Changing maxUnavailable affects how future upgrades are paced but does not itself trigger node reboots."

