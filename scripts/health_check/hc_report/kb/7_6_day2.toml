check_id = "7.6.tsr.6_3_2_alert_receivers"
title = "6.3.2. Alert Receivers"
description = "Validates that Alertmanager has configured receivers (email, PagerDuty, Slack,\nwebhook) to route alerts to operations teams. Without receivers, firing alerts\ngo unnoticed and incidents are detected only by user impact.\n"
