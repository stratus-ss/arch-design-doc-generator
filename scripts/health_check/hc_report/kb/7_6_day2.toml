[[checks]]
check_id = "7.6.proxy"
title = "Cluster-wide proxy"
description = "Cluster-wide proxy configuration affects operator updates, Telemetry, and\nRed Hat Insights. Ensure `noProxy` includes the cluster network CIDRs to avoid\nrouting loops and unnecessary proxy traversal.\n"
recommendation = "1. Review the cluster Proxy object and confirm `httpProxy`, `httpsProxy`,\n   `noProxy`, and any trusted CA settings are correct:\n   `oc get proxy/cluster -o yaml`\n2. Include service, pod, and machine-network CIDRs plus internal endpoints in\n   `noProxy` before applying changes.\n3. After patching, watch MachineConfigPools and cluster operators until rollout\n   completes successfully:\n   `oc get mcp`\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "cluster-wide nodes and system egress"
impact_detail = "Changing the Proxy object causes the Machine Config Operator to roll and reboot nodes so system components inherit the new proxy settings."

