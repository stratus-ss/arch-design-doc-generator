[[checks]]
check_id = "7.6.csr_pending"
title = "Pending CSRs"
description = "Pending CSRs typically indicate new nodes waiting for certificate approval. In\nmanual approval mode they block node join; in auto-approve mode they often\nindicate a bootstrap or node-health issue.\n"
# why-rec
# CORRECTED. Stock CONDITION is Approved, Denied, or Pending. Pending or Denied = FAIL.
# Approved = PASS. Empty list (`No resources found`) = PASS none-pending: CSRs are GC'd
# after approval, that is not a missing type. Missing CRD = INFO n/a-csr. Rec scores
# CONDITION; it does not run a live approve. Lab: compact BareMetal, empty CSR list.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Score each CSR CONDITION. Pending or Denied = FAIL. Approved = PASS. Empty list = PASS none-pending. Missing type = INFO n/a-csr:\n   `oc get csr --no-headers 2>&1 | awk '/have a resource type/{print \"INFO n/a-csr\"; n=1; next} /No resources found/{print \"PASS none-pending\"; n=1; next} {r=\"PASS\"; if($NF==\"Pending\" || $NF==\"Denied\") r=\"FAIL\"; print r, \"NAME=\"$1, \"REQUESTOR=\"$4, \"CONDITION=\"$NF} END{if(!n && NR==0) print \"PASS none-pending\"}'`\n2. On FAIL Pending, inspect REQUESTOR then approve only trusted node CSRs:\n   `oc adm certificate approve <csr>`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "pending node joins and certificate approval"
impact_detail = "Approving trusted CSRs allows nodes to finish joining the cluster without rebooting existing nodes or evicting workloads."

