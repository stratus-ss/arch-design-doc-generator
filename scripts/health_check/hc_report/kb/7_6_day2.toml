[[checks]]
check_id = "7.6.apiserver.audit"
title = "API server audit profile"
description = "Audit logging is essential for compliance and incident investigation. Higher\naudit profiles collect more detail but require deliberate sizing and retention\nplanning for log storage.\n"
recommendation = "Leave audit at metadata-only unless compliance requires `WriteRequestBodies` or `AllRequestBodies`. Those profiles roll API servers. Read the current profile before you patch, and size audit storage before you raise verbosity."
verification = "1. Check the current audit profile before changing it:\n   `oc get apiserver cluster -o jsonpath='{.spec.audit.profile}'`\n2. `Default` records metadata only. For compliance that needs request bodies, set `WriteRequestBodies` or `AllRequestBodies`:\n   `oc patch apiserver cluster --type=merge -p '{\"spec\":{\"audit\":{\"profile\":\"WriteRequestBodies\"}}}'`\n3. Size audit log storage before increasing verbosity."
priority_hint = ""
impact = "rolling-restart"
impact_scope = "API server audit pipeline"
impact_detail = "Audit-profile changes roll API server configuration and can briefly reset API connections while control-plane pods reconcile."
