title = "6.1.5.6. Pruning Namespaces"
description = "Identifies inactive or abandoned namespaces that consume API resources and\nincrease management overhead. Namespace sprawl complicates RBAC auditing and\nresource accounting.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Identifies inactive or abandoned namespaces that consume API resources and
# increase management overhead.
# The rec remediates THAT story by starting at `oc get ns --no-headers | while read ns _; do
# count=$(oc get pods -n "$ns" --no-headers 2>/dev/null | wc -l); echo "$ns: $count pods"; done`
# — the live object/command for this check, not a neighboring TSR item.
# Impact `non-disruptive`: Deleting a namespace permanently removes all resources within it;
# other namespaces are unaffected.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Audit namespace activity by checking workload counts:\n   `oc get ns --no-headers | while read ns _; do count=$(oc get pods -n \"$ns\" --no-headers 2>/dev/null | wc -l); echo \"$ns: $count pods\"; done`\n2. Delete namespaces confirmed unused.\n3. Archive any manifests that must be preserved before deletion.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "targeted unused namespaces"
impact_detail = "Deleting a namespace permanently removes all resources within it; other namespaces are unaffected."

