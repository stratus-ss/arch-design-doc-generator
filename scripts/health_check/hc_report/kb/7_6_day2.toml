[[checks]]
check_id = "7.6.tsr.6_1_5_4_job_pruning"
title = "TSR job pruning"
description = "Completed Jobs without TTL settings persist indefinitely in etcd, increasing\ndatabase size and slowing list operations. CronJobs that spawn many runs are\nparticularly impactful.\n"
recommendation = "1. Review accumulated jobs:\n   `oc get jobs -A --field-selector=status.successful=1`\n2. Add `spec.ttlSecondsAfterFinished` to Job templates (recommended: 86400 for\n   daily cleanup).\n3. For CronJobs, set `successfulJobsHistoryLimit` and\n   `failedJobsHistoryLimit`.\n4. Delete stale completed job entries.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "completed job retention"
impact_detail = "Job TTL and history-limit settings affect future cleanup behavior without restarting nodes or interrupting running workloads."

