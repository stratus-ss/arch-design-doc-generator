title = "TSR update history"
description = "This check reviews the cluster's upgrade history to identify how current the cluster version is and whether any previous upgrades failed. Clusters that fall behind on updates accumulate known security vulnerabilities and may face more complex upgrade paths to catch up."
recommendation = "Keep the cluster current on a hop the Upgrade Graph allows; do not jump a minor the graph does not allow. Test in non-production first. A failed previous upgrade must be resolved before the next hop."
verification = "1. Review the cluster's upgrade history:\n   `oc get clusterversion -o jsonpath='{.items[0].status.history[*].version}'`\n2. Check available update paths using the OCP Upgrade Graph:\n      https://access.redhat.com/labs/ocpupgradegraph/\n3. For clusters multiple minor versions behind, follow the supported upgrade\n      path (direct jumps may not be available).\n4. Always test the upgrade in a non-production cluster first."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Remediating stale update history usually means performing one or more supported cluster upgrades, which roll operators, nodes, and workloads over time."

