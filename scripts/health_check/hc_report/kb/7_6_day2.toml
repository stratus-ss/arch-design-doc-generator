[[checks]]
check_id = "7.6.tsr.6_4_1_pending_certificate_requests"
title = "6.4.1. Pending Certificate Requests"
description = "Identifies CSRs stuck in pending state, which may indicate new nodes unable\nto join, certificate rotation failures, or machine-api issues requiring\nmanual intervention.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Identifies CSRs stuck in pending state, which may indicate new nodes unable to
# join, certificate rotation failures, or machine-api issues requiring manual intervention.
# The rec remediates THAT story by starting at `oc get csr | grep Pending` — the live
# object/command for this check, not a neighboring TSR item.
# Impact `non-disruptive`: Approving trusted CSRs allows nodes to finish joining without
# rebooting existing nodes or evicting workloads.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. List pending CSRs and inspect requester identity before approval:\n   `oc get csr | grep Pending`\n2. Approve trusted node CSRs:\n   `oc adm certificate approve <csr>`\n3. Investigate repeated pending CSRs as potential indicators of node bootstrap\n   or kubelet health issues.\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "pending node joins and certificate approval"
impact_detail = "Approving trusted CSRs allows nodes to finish joining without rebooting existing nodes or evicting workloads."

