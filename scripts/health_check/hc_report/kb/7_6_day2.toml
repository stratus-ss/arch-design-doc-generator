check_id = "7.6.tsr.6_1_1_2_cluster_quota_configuration"
title = "6.1.1.2. Cluster Quota Configuration"
description = "This check evaluates ClusterResourceQuota objects, which enforce a shared resource limit across multiple OpenShift namespaces selected by project labels or annotations. Unlike a namespace-scoped ResourceQuota, usage is aggregated across all matching projects, so an incorrect selector or undersized hard limit can block workload creation or scaling in multiple namespaces.\n"
recommendation = "Keep each ClusterResourceQuota selector narrowly scoped to the intended projects and size its hard limits for the combined CPU, memory, storage, pod, and object capacity those projects are allowed to consume. Review aggregate used versus hard before onboarding namespaces or scaling workloads. An empty selector, no matching namespaces, or no ClusterResourceQuota is not inherently unhealthy. It may simply mean no shared cross-project cap is intended."
verification = "1. List ClusterResourceQuota objects with their selectors and hard limits.\n   `oc get clusterresourcequota -o custom-columns=NAME:.metadata.name,SELECTOR:.spec.selector,HARD:.spec.quota.hard`\n2. Check actual consumption against limits for a specific quota.\n   `oc describe clusterresourcequota <name>`"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "cross-namespace resource admission"
impact_detail = "ClusterResourceQuota changes affect admission for new creates across selected namespaces without restarting nodes."

