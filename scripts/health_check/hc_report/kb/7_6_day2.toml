[[checks]]
check_id = "7.6.apiserver.tls"
title = "API server TLS profile"
description = "The TLS security profile controls which cipher suites and TLS versions are\naccepted by the API server and other components. `Old` should not be used in\nproduction unless compatibility requirements are explicitly documented.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: The TLS security profile controls which cipher suites and TLS versions are
# accepted by the API server and other components.
# The rec remediates THAT story by starting at `oc get apiserver cluster -o
# jsonpath='{.spec.tlsSecurityProfile}'` — the live object/command for this check, not a
# neighboring TSR item.
# Impact `rolling-restart`: TLS profile changes propagate across multiple control-plane
# components and trigger an operator-managed rollout that can briefly reset API connections.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check the current profile:\n   `oc get apiserver cluster -o jsonpath='{.spec.tlsSecurityProfile}'`\n2. If the APIServer is using `Old` or an unsupported custom profile, patch\n   `spec.tlsSecurityProfile` on `apiserver/cluster` back to `Intermediate` or a\n   validated custom profile:\n   `oc patch apiserver cluster --type=merge -p '{\"spec\":{\"tlsSecurityProfile\":{\"type\":\"Intermediate\"}}}'`\n3. Confirm external clients and integrations support the target cipher set\n   before rollout.\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "API server and related control-plane components"
impact_detail = "TLS profile changes propagate across multiple control-plane components and trigger an operator-managed rollout that can briefly reset API connections."

