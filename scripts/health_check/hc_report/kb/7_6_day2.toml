[[checks]]
check_id = "7.6.rq"
title = "Resource quotas"
description = "ResourceQuotas limit total resource consumption per namespace. Without them, a\nsingle namespace can consume cluster capacity and starve other tenants.\n"
recommendation = "Set a ResourceQuota so one namespace cannot starve the rest of the cluster. Quota hits new creates and scale-outs, not pods that are already Running. Size to expected CPU, memory, and object count; a project-request template covers the next namespace."
verification = "1. Show the ResourceQuota detail for a namespace. Review whether usage is approaching HARD limits.\n   `oc describe quota -n <ns>`\n2. Apply ResourceQuotas to tenant namespaces sized to expected CPU, memory, storage, and object count.\n3. Use project templates so new namespaces receive quotas automatically."
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "namespace admission and capacity guardrails"
impact_detail = "Quota changes take effect immediately for new creates and scale-outs, but they do not restart nodes or stop already running workloads."

