[[checks]]
check_id = "7.6.upgrade.history"
title = "Upgrade history"
description = "Regular upgrade cadence is important for security patching and supportability.\nLong delays between z-stream or minor upgrades increase lifecycle and security\nrisk.\n"
recommendation = "Plan the next hop on the Upgrade Graph before you apply. Completed history is the healthy end state; any other STATE is a failed or incomplete upgrade. If the cluster is multiple minors behind, test the supported path in non-production and schedule a maintenance window. Partial history is not cleared by ignoring it."
verification = "1. Print STATE VERSION COMPLETED from ClusterVersion history. Completed is healthy. Any other STATE needs action:\n   `oc get clusterversion version -o jsonpath='{range .status.history[*]}{.state}{\"\\t\"}{.version}{\"\\t\"}{.completionTime}{\"\\n\"}{end}' | awk '{print ($1==\"Completed\"?\"PASS\":\"FAIL\"), \"STATE=\"$1, \"VERSION=\"$2, \"COMPLETED=\"$3}'`\n2. Use the OCP Upgrade Graph to plan the next supported update path.\n3. If the cluster is multiple releases behind, test the target path in non-production and schedule a maintenance window before applying the update."
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Addressing stale upgrade history usually means performing a cluster upgrade, which rolls operators, nodes, and workloads over time."

