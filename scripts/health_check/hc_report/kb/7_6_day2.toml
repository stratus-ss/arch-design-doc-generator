[[checks]]
check_id = "7.6.tsr.6_1_5_5_node_garbage_collection"
title = "TSR node garbage collection"
description = "This check verifies that each node is properly cleaning up unused container images. When images accumulate beyond the garbage collection threshold (default: 85% disk usage), the kubelet should automatically remove unused images. A failure here means images are consuming excessive disk space and the automatic cleanup is not keeping pace."
# why-rec
# CORRECTED. `crictl images | tail -1` is image list size, not disk fill, and is not the
# 85% GC trigger. Rec prints applied HIGH from configz (empty KubeletConfig = 85) and
# imageFs USED% = (capacity-available)/capacity from stats/summary. Overlay usedBytes
# is not the metric. USED% >= HIGH = FAIL. Lab: 3 nodes, all USED below HIGH. Did not
# run oc debug.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Print image filesystem fill against the applied GC high threshold. USED% is (capacity-available)/capacity of imageFs, not crictl image count. USED% >= HIGH = FAIL. HIGH comes from configz (no KubeletConfig CR uses 85):\n   `oc get nodes --no-headers -o custom-columns=NAME:.metadata.name | while read -r node; do high=$(oc get --raw /api/v1/nodes/${node}/proxy/configz | jq -r '.kubeletconfig.imageGCHighThresholdPercent // 85'); oc get --raw /api/v1/nodes/${node}/proxy/stats/summary | jq -r --arg node \"$node\" --arg high \"$high\" '(.node.runtime.imageFs // .node.fs) as $fs | [$node, $high, $fs.capacityBytes, $fs.availableBytes] | @tsv'; done | awk '{used=int(($3-$4)*100/$3); r=\"PASS\"; if(used>=$2+0) r=\"FAIL\"; print r, \"NODE=\"$1, \"USED=\"used\"%\", \"HIGH=\"$2}'`\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the targeted MachineConfigPool"
impact_detail = "Changing kubelet garbage-collection settings through KubeletConfig or MachineConfig drains and reboots affected nodes one at a time."
summary_patterns = [
  { contains = "more than half of the total disk", text = "Node image storage uses more than half of disk; garbage collection is not keeping up." },
]

