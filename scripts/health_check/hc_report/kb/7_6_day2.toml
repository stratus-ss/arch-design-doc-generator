[[checks]]
check_id = "7.6.tsr.6_1_5_1_pod_pruning"
title = "TSR pod pruning"
description = "Completed and failed pods that accumulate beyond GC limits consume etcd storage\nand slow API list operations. Proper pruning keeps the cluster responsive and\nprevents etcd size growth.\n"
recommendation = "1. Review completed pods:\n   `oc get pods -A --field-selector=status.phase=Succeeded`\n2. Configure terminated pod GC threshold in the KubeletConfig CR (default: 12500\n   terminated pods).\n3. For build pods, configure pruning in BuildConfig\n   `successfulBuildsHistoryLimit` and `failedBuildsHistoryLimit`.\n4. Clean up stale completed pod entries.\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "nodes in the targeted MachineConfigPool"
impact_detail = "If pod-GC thresholds are changed through KubeletConfig, affected nodes drain and reboot; build-history settings themselves apply live."

