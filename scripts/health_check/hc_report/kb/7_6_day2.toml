[[checks]]
check_id = "7.6.tsr.6_1_1_1_quota_resources_project_assignment"
title = "TSR quota resources project assignment"
description = "This check identifies projects with no ResourceQuota or LimitRange. Without quotas, a namespace can consume unbounded CPU, memory, and storage. This is a project-admission finding, not a statement about VM template defaults."
recommendation = "Define a ResourceQuota and, where appropriate, a LimitRange for application and user-managed projects that run workloads to establish enforceable CPU, memory, and object-consumption boundaries. Size quotas using observed workload requests, limits, storage requirements, expected growth, and VM resource profiles so that the controls prevent uncontrolled consumption without blocking legitimate deployments."
verification = "1. List ResourceQuota across all namespaces (first column is the namespace).\n   `oc get resourcequota -A`\n2. List LimitRange across all namespaces.\n   `oc get limitrange -A`\n3. Find user projects with no quota or limit coverage. **FAIL** for each uncovered project; **PASS** if all user projects are covered. Platform namespaces (openshift-*, kube-*, default, openshift) are skipped.\n   `comm -23 <(oc get ns --no-headers -o custom-columns=NS:.metadata.name | awk '$1 !~ /^(openshift-|kube-)/ && $1 != \"openshift\" && $1 != \"default\"' | sort) <({ oc get resourcequota -A --no-headers; oc get limitrange -A --no-headers; } 2>/dev/null | awk 'NF{print $1}' | sort -u) | awk '{print \"FAIL NS=\"$1} END{if(NR==0) print \"PASS none-uncovered\"}'`\n4. On **FAIL**, create a ResourceQuota sized to that project.\n   `oc create quota compute --hard=requests.cpu=8,requests.memory=16Gi,pods=25 -n <ns> --dry-run=client -o name`\n5. Print the project-request template. If the template is missing, the command prints **INFO** — that is not a **FAIL**.\n   `oc get template project-request -n openshift-config 2>&1 | awk '/NotFound|No resources found/{print \"INFO n/a-project-request\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-project-request\"}'`\nMissing `project-request` is **INFO**, not a **FAIL**. Drop `--dry-run=client` to apply."
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "namespace admission and capacity guardrails"
impact_detail = "ResourceQuota changes affect future creates and scale-outs but do not restart nodes or terminate running workloads."
summary_patterns = [
  { contains = "no quota nor limits", text = "One or more projects have no ResourceQuota or LimitRange." },
]

