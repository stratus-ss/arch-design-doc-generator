[[checks]]
check_id = "7.6.apiserver.tls"
title = "API server TLS profile"
description = "The TLS security profile controls which cipher suites and TLS versions are\naccepted by the API server and other components. `Old` should not be used in\nproduction unless compatibility requirements are explicitly documented.\n"
# why-rec
# CORRECTED. Unset tlsSecurityProfile is the OpenShift default (Intermediate) = PASS.
# jsonpath on the object prints nothing and looks like a failed command. Rec prints
# TYPE=; <none>/empty = default-Intermediate. Old = FAIL. Custom = INFO. Intermediate
# or Modern = PASS. Lab: compact BareMetal, spec has no tlsSecurityProfile.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Print TYPE. Empty or <none> is the default Intermediate = PASS. Intermediate or Modern = PASS. Old = FAIL. Custom = INFO:\n   `oc get apiserver cluster -o custom-columns=TYPE:.spec.tlsSecurityProfile.type --no-headers | awk '{t=$1; r=\"PASS\"; if(t==\"Old\") r=\"FAIL\"; if(t==\"Custom\") r=\"INFO\"; if(t==\"<none>\"||t==\"\") t=\"default-Intermediate\"; print r, \"TYPE=\"t}'`\n2. If TYPE is Old, set Intermediate (rolls API servers):\n   `oc patch apiserver cluster --type=merge -p '{\"spec\":{\"tlsSecurityProfile\":{\"type\":\"Intermediate\"}}}'`\n3. Confirm external clients support the target cipher set before that rollout.\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "API server and related control-plane components"
impact_detail = "TLS profile changes propagate across multiple control-plane components and trigger an operator-managed rollout that can briefly reset API connections."

