[[checks]]
check_id = "7.6.proxy"
title = "Cluster-wide proxy"
description = "Cluster-wide proxy configuration affects operator updates, Telemetry, and\nRed Hat Insights. Ensure `noProxy` includes the cluster network CIDRs to avoid\nrouting loops and unnecessary proxy traversal.\n"
recommendation = "Put service, pod, and machine CIDRs in `noProxy` before you patch the cluster Proxy. Changing the Proxy object rolls every node through the MCO. Watch `MachineConfigPool`s until `UPDATED=True` after the patch."
verification = "1. Print the Proxy object endpoints (httpProxy, httpsProxy, noProxy).\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. Print the trustedCA ConfigMap name.\n   `oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}{\"\\n\"}'`\n3. Include service, pod, and machine-network CIDRs plus internal endpoints in `noProxy` before applying changes.\n4. After patching, watch `MachineConfigPool`s until all show `UPDATED=True`.\n   `oc get mcp`"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "cluster-wide nodes and system egress"
impact_detail = "Changing the Proxy object causes the Machine Config Operator to roll and reboot nodes so system components inherit the new proxy settings."

