# MachineConfig drift is 7.5.tsr.5_2. Lab: WARNING rows. Did not print logs here.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "This check is sshd Accepted publickey or session opened. A log dump of all sshd is not the finding. MachineConfig drift is 7.5.tsr.5_2_machine_config.\n\n1. Print Accepted publickey or session opened on all nodes. Any row = WARNING. Empty = PASS none-ssh. Missing nodes or node-logs deny = INFO n/a-node-logs:\n   `oc adm node-logs $(oc get nodes -o jsonpath='{.items[*].metadata.name}') -u sshd -g 'Accepted publickey|session opened' --since=-30d 2>&1 | awk '/at least one node name|Forbidden/{print \"INFO n/a-node-logs\"; n=1; next} n{next} NF{print \"WARNING\", $0; c++} END{if(!n && !c) print \"PASS none-ssh\"}'`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

