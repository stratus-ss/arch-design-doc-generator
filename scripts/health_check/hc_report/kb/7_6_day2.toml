[[checks]]
check_id = "7.6.tsr.6_1_4_persistent_volume_usage"
title = "6.1.4. Persistent Volume Usage"
description = "Monitors PersistentVolume capacity utilization and identifies volumes at risk\nof exhaustion. Full PVs cause application write failures, pod crashes, and\npotential data loss.\n"
recommendation = "Grow or replace volumes before kubelet USED% and KubePersistentVolumeFillingUp cross about 90% used, and plan ahead once they pass 75%. This is filesystem fill, not `oc adm top`. `EXPAND=true` can grow in place; `EXPAND=false` needs a larger volume or a new PVC."
verification = "1. Print PVC USED% from kubelet volume stats via Prometheus. **FAIL** if above 90%; **WARNING** if above 75%; **PASS** otherwise. If no PVCs report data, the command prints **INFO**.\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100' | jq -r '.data.result[] | [.metric.namespace, .metric.persistentvolumeclaim, .value[1]] | @tsv' | awk -F'\\t' '{pct=$3+0; r=\"PASS\"; if(pct>90) r=\"FAIL\"; else if(pct>75) r=\"WARNING\"; print r, \"NS=\"$1, \"PVC=\"$2, \"USED=\"int(pct)\"%\"} END{if(NR==0) print \"INFO n/a-pvc-util\"}'`\n2. Print firing KubePersistentVolumeFillingUp alerts. **FAIL** for each listed row. If no alerts are firing, the command prints **INFO**.\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | select(.labels.alertname==\"KubePersistentVolumeFillingUp\") | [.state, .labels.namespace, .labels.persistentvolumeclaim, .labels.severity] | @tsv' | awk -F'\\t' '{print \"FAIL\", \"STATE=\"$1, \"NS=\"$2, \"PVC=\"$3, \"SEVERITY=\"$4} END{if(NR==0) print \"INFO n/a-fillingup-alert\"}'`\n3. Print StorageClass volume expansion support. **FAIL** or **WARNING** PVCs with `EXPAND=true` can grow in place; `EXPAND=false` needs a new, larger volume.\n   `oc get sc -o custom-columns=NAME:.metadata.name,EXPAND:.allowVolumeExpansion --no-headers | awk '{print \"NAME=\"$1, \"EXPAND=\"$2}'`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

