[[checks]]
check_id = "7.6.tsr.6_1_5_5_node_garbage_collection"
title = "TSR node garbage collection"
description = "This check verifies that each node is properly cleaning up unused container images. When images accumulate beyond the garbage collection threshold (default: 85% disk usage), the kubelet should automatically remove unused images. A failure here means images are consuming excessive disk space and the automatic cleanup is not keeping pace."
recommendation = "Keep the node filesystem used for container images below the kubelet image garbage-collection high threshold (85% by default). When usage reaches or exceeds the applied `imageGCHighThresholdPercent`, identify and remove unused images through normal kubelet garbage collection, reduce image churn, or expand the affected node storage; do not raise the threshold merely to suppress the warning. Validate the relevant image filesystem’s actual USED% against the applied kubelet threshold rather than relying on `crictl images` counts. If a threshold change is required, apply it through a targeted `KubeletConfig`, account for Machine Config Pool rollout and node disruption, and verify that the resulting low/high thresholds leave adequate space to avoid DiskPressure and pod eviction."
verification = "1. Print image filesystem fill against the applied garbage-collection HIGH threshold per node. **FAIL** if USED% >= HIGH; **PASS** otherwise. HIGH defaults to 85 when no `KubeletConfig` overrides it.\n   `oc get nodes --no-headers -o custom-columns=NAME:.metadata.name | while read -r node; do high=$(oc get --raw /api/v1/nodes/${node}/proxy/configz | jq -r '.kubeletconfig.imageGCHighThresholdPercent // 85'); oc get --raw /api/v1/nodes/${node}/proxy/stats/summary | jq -r --arg node \"$node\" --arg high \"$high\" '(.node.runtime.imageFs // .node.fs) as $fs | [$node, $high, $fs.capacityBytes, $fs.availableBytes] | @tsv'; done | awk '{used=int(($3-$4)*100/$3); r=\"PASS\"; if(used>=$2+0) r=\"FAIL\"; print r, \"NODE=\"$1, \"USED=\"used\"%\", \"HIGH=\"$2}'`"
