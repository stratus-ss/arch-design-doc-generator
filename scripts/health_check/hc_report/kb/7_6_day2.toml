[[checks]]
check_id = "7.6.tsr.6_1_1_1_quota_resources_project_assignment"
title = "TSR quota resources project assignment"
description = "This check identifies projects with no ResourceQuota or LimitRange. Without quotas, a namespace can consume unbounded CPU, memory, and storage. This is a project-admission finding, not a statement about VM template defaults."
recommendation = "Put ResourceQuota and LimitRange on user projects so they cannot consume unbounded CPU, memory, and storage. Skip openshift-*, kube-*, `default`, and `openshift`. Create stays `--dry-run=client` until you size the quota."
verification = "1. List ResourceQuota (first column is the namespace):\n   `oc get resourcequota -A`\n2. List LimitRange:\n   `oc get limitrange -A`\n3. User projects that appear in neither list are FAIL. Skip openshift-* kube-* default and openshift. An empty list is healthy (none-uncovered:\n   `comm -23 <(oc get ns --no-headers -o custom-columns=NS:.metadata.name | awk '$1 !~ /^(openshift-|kube-)/ && $1 != \"openshift\" && $1 != \"default\"' | sort) <({ oc get resourcequota -A --no-headers; oc get limitrange -A --no-headers; } 2>/dev/null | awk 'NF{print $1}' | sort -u) | awk '{print \"FAIL NS=\"$1} END{if(NR==0) print \"PASS none-uncovered\"}'`\n4. On FAIL, create a ResourceQuota sized to that project (drop --dry-run=client to apply):\n   `oc create quota compute --hard=requests.cpu=8,requests.memory=16Gi,pods=25 -n <ns> --dry-run=client -o name`\n5. Print the project-request template. Missing is informational n/a-project-request:\n   `oc get template project-request -n openshift-config 2>&1 | awk '/NotFound|No resources found/{print \"INFO n/a-project-request\"; n=1; next} {print} END{if(!n && NR==0) print \"INFO n/a-project-request\"}'`\nMissing `project-request` is INFO n/a-project-request, not a FAIL. Drop `--dry-run=client` to apply."
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "namespace admission and capacity guardrails"
impact_detail = "ResourceQuota changes affect future creates and scale-outs but do not restart nodes or terminate running workloads."
summary_patterns = [
  { contains = "no quota nor limits", text = "One or more projects have no ResourceQuota or LimitRange." },
]

