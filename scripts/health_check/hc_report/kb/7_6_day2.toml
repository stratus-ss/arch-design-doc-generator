[[checks]]
check_id = "7.6.tsr.6_1_4_persistent_volume_usage"
title = "6.1.4. Persistent Volume Usage"
description = "Monitors PersistentVolume capacity utilization and identifies volumes at risk\nof exhaustion. Full PVs cause application write failures, pod crashes, and\npotential data loss.\n"
# why-rec
# CORRECTED. `oc get pv` CAPACITY is provisioned size, not fill. Rec scores
# kubelet_volume_stats used/capacity. USED>90 = FAIL. USED>75 = WARNING. Else
# PASS. Empty = INFO n/a-pvc-util. FillingUp alert empty = INFO n/a-fillingup-alert.
# Lab: 2 PVCs, USED below 75. Did not patch PVCs. Expansion patch is 7.8.pvc.util.critical.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Print PVC USED% from kubelet volume stats. >90 = FAIL. >75 = WARNING. Else PASS. Empty = INFO n/a-pvc-util:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100' | jq -r '.data.result[] | [.metric.namespace, .metric.persistentvolumeclaim, .value[1]] | @tsv' | awk -F'\\t' '{pct=$3+0; r=\"PASS\"; if(pct>90) r=\"FAIL\"; else if(pct>75) r=\"WARNING\"; print r, \"NS=\"$1, \"PVC=\"$2, \"USED=\"int(pct)\"%\"} END{if(NR==0) print \"INFO n/a-pvc-util\"}'`\n2. Print firing KubePersistentVolumeFillingUp. Any row = FAIL. Empty = INFO n/a-fillingup-alert:\n   `oc -n openshift-monitoring exec prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | select(.labels.alertname==\"KubePersistentVolumeFillingUp\") | [.state, .labels.namespace, .labels.persistentvolumeclaim, .labels.severity] | @tsv' | awk -F'\\t' '{print \"FAIL\", \"STATE=\"$1, \"NS=\"$2, \"PVC=\"$3, \"SEVERITY=\"$4} END{if(NR==0) print \"INFO n/a-fillingup-alert\"}'`\n3. Print StorageClass EXPAND. FAIL or WARNING PVCs with EXPAND=true can grow; EXPAND=false needs a larger volume:\n   `oc get sc -o custom-columns=NAME:.metadata.name,EXPAND:.allowVolumeExpansion --no-headers | awk '{print \"NAME=\"$1, \"EXPAND=\"$2}'`\n"
priority_hint = ""
