title = "TSR quota resources project assignment"
description = "This check identifies namespaces (projects) that have no ResourceQuota or LimitRange configured. Without quotas, any workload in that namespace can consume unlimited CPU, memory, and storage — potentially starving other namespaces and destabilizing the cluster."
recommendation = "1. List namespaces without quotas:\n   `oc get namespaces --no-headers | while read ns _; do oc get resourcequota -n \"$ns\" --no-headers 2>/dev/null | grep -q . || echo \"$ns\"; done`\n2. For each production namespace, apply a ResourceQuota that limits CPU,\n   memory, and pod counts appropriate for the workload.\n3. Configure a project template to automatically apply default quotas and\n   limit ranges when new namespaces are created:\n   `oc get template project-request -n openshift-config -o yaml`\n"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "namespace admission and capacity guardrails"
impact_detail = "ResourceQuota changes affect future creates and scale-outs but do not restart nodes or terminate running workloads."

