# more supported cluster upgrades, which roll operators, nodes, and workloads over time.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Review the cluster's upgrade history:\n   `oc get clusterversion -o jsonpath='{.items[0].status.history[*].version}'`\n2. Check available update paths using the OCP Upgrade Graph:\n   https://access.redhat.com/labs/ocpupgradegraph/\n3. For clusters multiple minor versions behind, follow the supported upgrade\n   path (direct jumps may not be available).\n4. Always test the upgrade in a non-production cluster first.\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "cluster-wide"
impact_detail = "Remediating stale update history usually means performing one or more supported cluster upgrades, which roll operators, nodes, and workloads over time."

