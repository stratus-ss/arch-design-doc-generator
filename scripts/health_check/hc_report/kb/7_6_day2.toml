# Check story: ResourceQuotas limit total resource consumption per namespace.
# The rec remediates THAT story by starting at `oc describe quota -n <ns>` — the live
# object/command for this check, not a neighboring TSR item.
# Impact `non-disruptive`: Quota changes take effect immediately for new creates and scale-outs,
# but they do not restart nodes or stop already running workloads.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Review current namespace consumption:\n   `oc describe quota -n <ns>`\n2. Apply ResourceQuotas to tenant or application namespaces based on expected\n   CPU, memory, storage, and object-count usage.\n3. Use project templates so new namespaces receive quotas automatically.\n"
priority_hint = "P3"
impact = "non-disruptive"
impact_scope = "namespace admission and capacity guardrails"
impact_detail = "Quota changes take effect immediately for new creates and scale-outs, but they do not restart nodes or stop already running workloads."

