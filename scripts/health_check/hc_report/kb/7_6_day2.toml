[[checks]]
check_id = "7.6.tsr.6_1_2_requests_and_limits"
title = "6.1.2. Requests and Limits"
description = "Checks that pods specify CPU and memory requests and limits. Pods without\nrequests cannot be effectively scheduled; pods without limits risk consuming\nunbounded resources and causing OOMKills on co-located workloads.\n"
recommendation = "Set realistic CPU and memory requests for all production pods, then add limits where appropriate. Requests allow the scheduler to reserve capacity; pods with no CPU or memory requests are **BestEffort** and are first to be evicted during node resource pressure. Use a namespace LimitRange to apply safe default requests and limits where application manifests omit them, then review and tune those defaults against observed utilization to avoid under-sizing workloads or overcommitting nodes."
verification = "1. List pods with missing CPU or memory requests. Any printed row is a pod without requests — it runs as **BestEffort** and is first to evict.\n   `oc get pods -A --no-headers -o custom-columns=NS:.metadata.namespace,POD:.metadata.name,CPU:.spec.containers[*].resources.requests.cpu,MEM:.spec.containers[*].resources.requests.memory | awk '$3==\"<none>\" || $4==\"<none>\" {print}'`\n2. Apply LimitRanges to set defaults.\n3. Enforce minimum and maximum resource boundaries per container in each namespace."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "namespace admission defaults"
impact_detail = "LimitRange enforcement applies to new or updated pods; existing pods continue running unchanged."

