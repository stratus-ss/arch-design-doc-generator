[[checks]]
check_id = "7.6.proxy"
title = "Cluster-wide proxy"
description = "Cluster-wide proxy configuration affects operator updates, Telemetry, and\nRed Hat Insights. Ensure `noProxy` includes the cluster network CIDRs to avoid\nrouting loops and unnecessary proxy traversal.\n"
# why-rec
# CORRECTED. Dumping Proxy YAML can include trustedCA names plus full spec. Rec prints
# httpProxy, httpsProxy, noProxy, and trustedCA.name only (same fields as 1.5.6).
recommendation = "1. Print proxy endpoints only:\n   `oc get proxy cluster -o jsonpath='{.spec.httpProxy}{\"\\t\"}{.spec.httpsProxy}{\"\\t\"}{.spec.noProxy}{\"\\n\"}'`\n2. Print trustedCA ConfigMap name only:\n   `oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}{\"\\n\"}'`\n3. Include service, pod, and machine-network CIDRs plus internal endpoints in `noProxy` before applying changes.\n4. After patching, watch MachineConfigPools:\n   `oc get mcp`\n"
priority_hint = ""
impact = "rolling-restart"
impact_scope = "cluster-wide nodes and system egress"
impact_detail = "Changing the Proxy object causes the Machine Config Operator to roll and reboot nodes so system components inherit the new proxy settings."

