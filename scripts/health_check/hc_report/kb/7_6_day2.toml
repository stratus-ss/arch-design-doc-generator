[[checks]]
check_id = "7.6.tsr.6_4_2_custom_certificates"
title = "6.4.2. Custom Certificates"
description = "Evaluates user-provided certificates for API server, ingress, and custom routes\nfor expiration risk. Unlike internal OCP certificates that auto-rotate, custom\ncertificates require manual renewal before expiry.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Evaluates user-provided certificates for API server, ingress, and custom routes
# for expiration risk.
# The rec remediates THAT story by starting at `oc get secret -n openshift-ingress
# router-certs-default -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -enddate`
# — the live object/command for this check, not a neighboring TSR item.
# Impact `workload-shift`: Renewing certificates rolls the components that mount those secrets
# and can briefly reset TLS sessions.
# Why the check fires (thresholds) is in docs/HC_CHECK_RATIONALE.md. This note is why the rec
# text is the right response.
recommendation = "1. Check ingress certificate expiry:\n   `oc get secret -n openshift-ingress router-certs-default -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -enddate`\n2. Review API server serving certs and any custom route certificates.\n3. Plan renewal at least 30 days before expiration.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "affected ingress or API endpoints"
impact_detail = "Renewing certificates rolls the components that mount those secrets and can briefly reset TLS sessions."

