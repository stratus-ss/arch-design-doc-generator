[[checks]]
check_id = "7.6.tsr.6_6_1_machine_config_pool_max_unavailable"
title = "6.6.1. Machine Config Pool Max Unavailable"
description = "Evaluates the `maxUnavailable` setting on `MachineConfigPool`s which controls how\nmany nodes can be drained simultaneously during upgrades. Too high a value\nrisks capacity loss; too low extends maintenance windows unnecessarily.\n"
recommendation = "Keep control-plane MCP `maxUnavailable` at 1. For worker MCPs, set `maxUnavailable` to the largest absolute number or percentage of nodes that can be unavailable while preserving application capacity, replica availability, disruption budgets, and VM migration headroom. The number or percentage is dependent on the capacity of the cluster. If the cluster is N+1 then a single unavailable is the best that can be done."
verification = "1. Print `maxUnavailable`, machine count, and ready count per `MachineConfigPool`.\n   `oc get mcp -o custom-columns=NAME:.metadata.name,MAXUNAVAILABLE:.spec.maxUnavailable,MACHINECOUNT:.status.machineCount,READY:.status.readyMachineCount`\n2. For production clusters, set `maxUnavailable` to 1 or a small percentage to minimize capacity loss during rolling updates.\n3. For non-production clusters, higher values accelerate rollout."
priority_hint = ""
impact = "non-disruptive"
impact_scope = "MachineConfigPool rollout behavior"
impact_detail = "Changing `maxUnavailable` affects how future upgrades are paced but does not itself trigger node reboots."

