[[checks]]
check_id = "7.6.csr_pending"
title = "Pending CSRs"
description = "Pending CSRs typically indicate new nodes waiting for certificate approval. In\nmanual approval mode they block node join; in auto-approve mode they often\nindicate a bootstrap or node-health issue.\n"
recommendation = "Approve pending CSRs only for REQUESTORs you trust so nodes can join in manual approval mode. An empty list means there is nothing waiting — approved CSRs are garbage-collected. A Denied CSR needs a new request; do not re-approve a Denied CSR to clear the finding."
verification = "1. Confirm each CSR CONDITION. Pending or Denied needs action. Approved is healthy. Empty list is healthy none-pending. Missing type is informational n/a-csr:\n   `oc get csr --no-headers 2>&1 | awk '/have a resource type/{print \"INFO n/a-csr\"; n=1; next} /No resources found/{print \"PASS none-pending\"; n=1; next} {r=\"PASS\"; if($NF==\"Pending\" || $NF==\"Denied\") r=\"FAIL\"; print r, \"NAME=\"$1, \"REQUESTOR=\"$4, \"CONDITION=\"$NF} END{if(!n && NR==0) print \"PASS none-pending\"}'`\n2. On FAIL Pending, inspect REQUESTOR then approve only trusted node CSRs:\n   `oc adm certificate approve <csr>`"
priority_hint = ""
impact = "non-disruptive"
impact_scope = "pending node joins and certificate approval"
impact_detail = "Approving trusted CSRs allows nodes to finish joining the cluster without rebooting existing nodes or evicting workloads."

