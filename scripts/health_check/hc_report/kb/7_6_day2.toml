recommendation = "1. Check ingress certificate expiry:\n   `oc get secret -n openshift-ingress router-certs-default -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -enddate`\n2. Review API server serving certs and any custom route certificates.\n3. Plan renewal at least 30 days before expiration.\n"
priority_hint = ""
impact = "workload-shift"
impact_scope = "affected ingress or API endpoints"
impact_detail = "Renewing certificates rolls the components that mount those secrets and can briefly reset TLS sessions."

