title = "6.6. Upgrade Management"
description = "Parent section covering upgrade planning including MachineConfigPool\nconfiguration for controlled rollout. Proper upgrade management minimizes\nworkload disruption during cluster updates.\n"
recommendation = "1. Review upgrade readiness:\n   `oc get clusterversion`\n2. Review MachineConfigPool status:\n   `oc get mcp`\n3. Ensure MachineConfigPool maxUnavailable is set appropriately for the upgrade\n   window.\n4. Verify PDBs protect critical workloads during node drains.\n"
