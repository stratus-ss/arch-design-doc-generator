[[checks]]
check_id = "7.9.hw.*.identity"
title = "Hardware Identity"
description = "Server vendor, model, and BIOS version provide context for hardware support,\nfirmware advisories, and capacity planning. Verifying these details against the\nvendor support matrix ensures the platform runs on certified hardware.\n"
recommendation = "1. Review the hardware vendor, server model, and BIOS version reported by each node.\n2. Verify that the server model appears on the Red Hat certified hardware list.\n3. Ensure BIOS or UEFI firmware is current per the vendor's advisory channel.\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

