[[checks]]
check_id = "7.9.hw.*.cpu"
title = "CPU"
description = "CPU model and core count determine the node's compute capacity. Control plane\nnodes require a minimum of 4 vCPUs; worker nodes should be sized according to\nthe expected workload profile.\n"
recommendation = "1. Verify that CPU core counts meet or exceed the minimum requirements for each node role.\n2. Confirm that every control plane node has at least 4 vCPUs.\n3. For worker nodes, validate sizing against the workload profile and monitor utilization:\n   `oc adm top nodes`\n"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

