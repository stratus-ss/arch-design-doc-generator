[[checks]]
check_id = "7.9.hw.*.identity"
title = "Hardware Identity"
description = "Server vendor, model, and BIOS version provide context for hardware support,\nfirmware advisories, and capacity planning. Verifying these details against the\nvendor support matrix ensures the platform runs on certified hardware.\n"
recommendation = "Record vendor, product, and BIOS against the catalog. A catalog miss is not a cluster defect; it means the SKU is undocumented. On metal, `BareMetalHost` `status.hardware` is the live object — do not dump the BMH YAML (BMC credentials live there). No BMH means this is not a metal cluster; then read DMI via `oc debug`. Firmware is a host replace or update window, not an `oc` patch."
verification = "1. Server identity from `BareMetalHost` (status.hardware.systemVendor). Each row prints **INFO** with vendor, product, and BIOS version. An empty result means the CRD is absent or this is not bare metal:\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | [.metadata.name, (.status.hardware.systemVendor.manufacturer // \"-\"), (.status.hardware.systemVendor.productName // \"-\"), (.status.hardware.firmware.bios.version // \"-\"), (.status.hardware.firmware.bios.date // \"-\")] | @tsv' | awk -F'\\t' '{print \"INFO\", \"NAME=\"$1, \"VENDOR=\"$2, \"PRODUCT=\"$3, \"BIOS=\"$4, \"BIOSDATE=\"$5} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. If step 1 returned no results, read DMI identity directly on the node:\n   `oc debug node/<name> --quiet -- chroot /host sh -c 'printf \"VENDOR=\"; cat /sys/class/dmi/id/sys_vendor; printf \"PRODUCT=\"; cat /sys/class/dmi/id/product_name; printf \"BIOS=\"; cat /sys/class/dmi/id/bios_version; printf \"BIOSDATE=\"; cat /sys/class/dmi/id/bios_date'`\n3. Compare the product name to the Red Hat certified hardware catalog using the link in the reference.\n4. Compare the BIOS version to the vendor firmware advisory for that product."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

