[[checks]]
check_id = "7.9.hw.*.disk"
title = "Disk"
description = "Disk type and capacity affect cluster performance and supportability. Rotational\n(HDD) storage causes etcd latency and raft timeouts on control plane nodes.\nSSD or NVMe storage is strongly recommended for all nodes, especially those\nrunning etcd.\n"
recommendation = "Replace rotational disks when lsblk shows `ROTA=1` and TRAN is not virtio. Guest ROTA on virtio is not a maintenance-window HDD swap. `BareMetalHost` ROTA is the guest flag, not the hypervisor backing store. Empty BMH means this is not a metal cluster. Do not dump BMH YAML (BMC)."
verification = "1. Guest rotational flag from `BareMetalHost` (status.hardware.storage). `ROTA=true` is the guest-advertised flag, not proof of a physical HDD; a virtio disk name indicates KVM. An empty result means the CRD is absent or this is not bare metal:\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | .metadata.name as $n | (.status.hardware.storage // [])[] | [$n, (.name // \"-\"), ((.rotational|tostring) // \"-\"), (.sizeBytes // 0), (.type // \"-\")] | @tsv' | awk -F'\\t' '{tag=\"n/a-guest-rota\"; if($2 ~ /virtio/) tag=\"n/a-virtio-rota\"; r=\"PASS\"; if($3==\"true\") r=\"INFO \" tag; printf \"%s NAME=%s DISK=%s GUEST_ROTA=%s SIZE_GIB=%.0f TYPE=%s\\n\", r, $1, $2, $3, $4/1024/1024/1024, $5} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. Actual disk media via lsblk on the node. `ROTA=0` is **PASS**. `ROTA=1` with `TRAN=virtio` is **INFO** (guest flag only). `ROTA=1` with any other transport is **WARNING**:\n   `oc debug node/<name> --quiet -- chroot /host lsblk -d -o NAME,SIZE,ROTA,TYPE,TRAN -n -e 7,11 | awk '{r=\"PASS\"; if($3==\"1\" && $5==\"virtio\") r=\"INFO n/a-virtio-rota\"; else if($3==\"1\") r=\"WARNING\"; print r, \"DISK=\"$1, \"SIZE=\"$2, \"ROTA=\"$3, \"TYPE=\"$4, \"TRAN=\"$5} END{if(NR==0) print \"INFO n/a-disks\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane storage and etcd performance"
impact_detail = "Replacing rotational storage with SSD/NVMe on control plane nodes requires a maintenance window and may involve node drain, reinstallation, or disk migration."

