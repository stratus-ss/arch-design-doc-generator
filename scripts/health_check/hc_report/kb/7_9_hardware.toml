title = "Memory"
description = "Physical RAM determines the node's memory capacity. Control plane nodes require\na minimum of 16 GiB; worker nodes should be sized for the expected workload\nfootprint including kubelet, container runtime, and application pods.\n"
# why-rec
# `✅ VERIFIED`. Lab: OCP 4.21.5 compact BareMetal, 2026-08-21.
# Check story: Physical RAM determines the node's memory capacity.
# The rec remediates THAT story by starting at `oc adm top nodes` — the live object/command for
# this check, not a neighboring TSR item.
# Impact `none` is honest: the rec is investigation. It does not require patch/taint/upgrade.
