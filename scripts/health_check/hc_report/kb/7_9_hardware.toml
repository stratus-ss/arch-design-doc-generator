[[checks]]
check_id = "7.9.hw.*.memory"
title = "Memory"
description = "Physical RAM determines the node's memory capacity. Control plane nodes require\na minimum of 16 GiB; worker nodes should be sized for the expected workload\nfootprint including kubelet, container runtime, and application pods.\n"
recommendation = "Resize or replace the node if you need more RAM. This is live memory capacity, not the 16 GiB install floor. On metal, BareMetalHost `status.hardware.ramMebibytes` is the live object — do not dump the BMH YAML. No BMH means this is not a metal cluster; then read MemTotal via `oc debug`. Control-plane and worker memory floors belong on the platform sizing rows. `oc adm top` is usage, not capacity."
verification = "1. Print NAME RAM_GIB from BareMetalHost. empty or missing CRD means this is not metal (n/a-bmh):\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | [.metadata.name, (.status.hardware.ramMebibytes // 0)] | @tsv' | awk -F'\\t' '{printf \"INFO NAME=%s RAM_GIB=%.1f\\n\", $1, $2/1024} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. If step 1 is n/a-bmh, read MemTotal on the node (Ki to GiB):\n   `oc debug node/<name> --quiet -- chroot /host awk '/MemTotal/{printf \"RAM_GIB=%.1f\\n\", $2/1024/1024}' /proc/meminfo`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

