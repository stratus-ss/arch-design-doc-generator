recommendation = "1. Verify that each node's physical RAM meets or exceeds the minimum for its role.\n2. Confirm that every control plane node has at least 16 GiB of memory.\n3. Monitor memory pressure and investigate nodes approaching capacity limits:\n   `oc adm top nodes`\n"
