[[checks]]
check_id = "7.9.hw.*.disk"
title = "Disk"
description = "Disk type and capacity affect cluster performance and supportability. Rotational\n(HDD) storage causes etcd latency and raft timeouts on control plane nodes.\nSSD or NVMe storage is strongly recommended for all nodes, especially those\nrunning etcd.\n"
recommendation = "1. Verify that all control plane nodes use SSD or NVMe storage.\n2. If rotational disks are detected, plan migration to solid-state storage.\n3. Validate etcd disk performance with fio benchmarks on control plane nodes to confirm the storage meets the minimum 50 sequential IOPS and <10ms P99 fsync latency requirement.\n4. Review etcd backend health:\n   `oc -n openshift-etcd exec -c etcd etcd-<member> -- etcdctl endpoint status --cluster -w table`\n"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane storage and etcd performance"
impact_detail = "Replacing rotational storage with SSD/NVMe on control plane nodes requires a maintenance window and may involve node drain, reinstallation, or disk migration."

