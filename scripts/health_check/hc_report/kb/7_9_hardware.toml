[[checks]]
check_id = "7.9.hw.*.memory"
title = "Memory"
description = "Physical RAM determines the node's memory capacity. Control plane nodes require\na minimum of 16 GiB; worker nodes should be sized for the expected workload\nfootprint including kubelet, container runtime, and application pods.\n"
recommendation = "Resize or replace the node if you need more RAM. This is live memory capacity, not the 16 GiB install floor. On metal, `BareMetalHost` `status.hardware.ramMebibytes` is the live object — do not dump the BMH YAML. No BMH means this is not a metal cluster; then read MemTotal via `oc debug`. `oc adm top` is usage, not capacity."
verification = "1. RAM from `BareMetalHost` (status.hardware.ramMebibytes). Each row prints **INFO** with total memory in GiB. An empty result means the CRD is absent or this is not bare metal:\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | [.metadata.name, (.status.hardware.ramMebibytes // 0)] | @tsv' | awk -F'\\t' '{printf \"INFO NAME=%s RAM_GIB=%.1f\\n\", $1, $2/1024} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. If step 1 returned no results, read MemTotal on the node:\n   `oc debug node/<name> --quiet -- chroot /host awk '/MemTotal/{printf \"RAM_GIB=%.1f\\n\", $2/1024/1024}' /proc/meminfo`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "the node being resized or replaced"
impact_detail = "Resizing or replacing a node to add memory requires a maintenance window and may involve node drain, reinstallation, or host replacement."

