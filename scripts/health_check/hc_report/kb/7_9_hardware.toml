[[checks]]
check_id = "7.9.hw.*.cpu"
title = "CPU"
description = "CPU model and core count determine the node's compute capacity. Control plane\nnodes require a minimum of 4 vCPUs; worker nodes should be sized according to\nthe expected workload profile.\n"
recommendation = "Resize or replace the node if you need more cores. This is live CPU capacity, not the 4 vCPU install floor. On metal, BareMetalHost `status.hardware.cpu` is the live object — do not dump the BMH YAML. No BMH means this is not a metal cluster; then read `/proc` via `oc debug`. Control-plane and worker CPU floors belong on the platform sizing rows. `oc adm top` is usage, not capacity."
verification = "1. Print NAME MODEL CORES ARCH from BareMetalHost. empty or missing CRD means this is not metal (n/a-bmh):\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | [.metadata.name, (.status.hardware.cpu.model // \"-\"), (.status.hardware.cpu.count // \"-\"), (.status.hardware.cpu.arch // \"-\")] | @tsv' | awk -F'\\t' '{print \"INFO\", \"NAME=\"$1, \"MODEL=\"$2, \"CORES=\"$3, \"ARCH=\"$4} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. If step 1 is n/a-bmh, read CPU model and logical core count on the node:\n   `oc debug node/<name> --quiet -- chroot /host grep -m1 'model name' /proc/cpuinfo`\n   `oc debug node/<name> --quiet -- chroot /host grep -c ^processor /proc/cpuinfo`"
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

