[[checks]]
check_id = "7.9.hw.*.identity"
title = "Hardware Identity"
description = "Server vendor, model, and BIOS version provide context for hardware support,\nfirmware advisories, and capacity planning. Verifying these details against the\nvendor support matrix ensures the platform runs on certified hardware.\n"
recommendation = "Record vendor, product, and BIOS against the catalog. A catalog miss is not a cluster defect; it means the SKU is undocumented. On metal, BareMetalHost `status.hardware` is the live object — do not dump the BMH YAML (BMC credentials live there). No BMH means this is not a metal cluster; then read DMI via `oc debug`. Firmware is a host replace or update window, not an `oc` patch. CPU, memory, and disk capacity are separate hardware rows."
verification = "1. Print NAME VENDOR PRODUCT BIOS from BareMetalHost. empty or missing CRD means this is not metal (n/a-bmh):\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | [.metadata.name, (.status.hardware.systemVendor.manufacturer // \"-\"), (.status.hardware.systemVendor.productName // \"-\"), (.status.hardware.firmware.bios.version // \"-\"), (.status.hardware.firmware.bios.date // \"-\")] | @tsv' | awk -F'\\t' '{print \"INFO\", \"NAME=\"$1, \"VENDOR=\"$2, \"PRODUCT=\"$3, \"BIOS=\"$4, \"BIOSDATE=\"$5} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. If step 1 is n/a-bmh, read DMI on the node:\n   `oc debug node/<name> --quiet -- chroot /host sh -c 'printf \"VENDOR=\"; cat /sys/class/dmi/id/sys_vendor; printf \"PRODUCT=\"; cat /sys/class/dmi/id/product_name; printf \"BIOS=\"; cat /sys/class/dmi/id/bios_version; printf \"BIOSDATE=\"; cat /sys/class/dmi/id/bios_date'`\n3. Compare PRODUCT to the Red Hat certified hardware catalog:\n      https://catalog.redhat.com/hardware\n4. Compare BIOS= to the vendor advisory for that PRODUCT."
priority_hint = ""
impact = "none"
impact_scope = ""
impact_detail = ""

