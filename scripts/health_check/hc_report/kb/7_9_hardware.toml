[[checks]]
check_id = "7.9.hw.*.disk"
title = "Disk"
description = "Disk type and capacity affect cluster performance and supportability. Rotational\n(HDD) storage causes etcd latency and raft timeouts on control plane nodes.\nSSD or NVMe storage is strongly recommended for all nodes, especially those\nrunning etcd.\n"
# why-rec
# CORRECTED. Lab: OCP 4.21.5 compact BareMetal, 2026-08-22.
# Check story: rotational vs SSD for etcd. Ironic/BMH GUEST_ROTA=true on KVM
# virtio is the guest advertising HDD even when the qcow/raw file is on NVMe.
# Rec no longer WARNING from BMH ROTA=true. That is INFO n/a-guest-rota /
# n/a-virtio-rota. WARNING only from lsblk ROTA=1 with TRAN not virtio.
# Do not dump BMH YAML (BMC). Size floor is 7.1.tsr.1_4_1_4. WAL is 7.8.etcd.wal*.
recommendation = "Replace rotational disks when lsblk shows ROTA=1 and TRAN is not virtio. Guest ROTA on virtio is not a maintenance-window HDD swap. BareMetalHost ROTA is the guest flag, not the hypervisor backing store. Empty BMH means this is not a metal cluster. Size floors belong on the platform disk rows. WAL fsync belongs on the etcd WAL row. Do not dump BMH YAML (BMC)."
verification = "1. Print guest ROTA from BareMetalHost. ROTA=true is guest rotational (n/a-guest-rota), not a host HDD finding. virtio in DISK= is KVM. empty or missing CRD means this is not metal (n/a-bmh):\n   `oc get bmh -A -o json 2>/dev/null | jq -r '.items[]? | .metadata.name as $n | (.status.hardware.storage // [])[] | [$n, (.name // \"-\"), ((.rotational|tostring) // \"-\"), (.sizeBytes // 0), (.type // \"-\")] | @tsv' | awk -F'\\t' '{tag=\"n/a-guest-rota\"; if($2 ~ /virtio/) tag=\"n/a-virtio-rota\"; r=\"PASS\"; if($3==\"true\") r=\"INFO \" tag; printf \"%s NAME=%s DISK=%s GUEST_ROTA=%s SIZE_GIB=%.0f TYPE=%s\\n\", r, $1, $2, $3, $4/1024/1024/1024, $5} END{if(NR==0) print \"INFO n/a-bmh\"}'`\n2. Confirm the real media with lsblk TRAN. ROTA=0 is healthy. ROTA=1 and TRAN=virtio is informational n/a-virtio-rota. ROTA=1 and TRAN not virtio needs review:\n   `oc debug node/<name> --quiet -- chroot /host lsblk -d -o NAME,SIZE,ROTA,TYPE,TRAN -n -e 7,11 | awk '{r=\"PASS\"; if($3==\"1\" && $5==\"virtio\") r=\"INFO n/a-virtio-rota\"; else if($3==\"1\") r=\"WARNING\"; print r, \"DISK=\"$1, \"SIZE=\"$2, \"ROTA=\"$3, \"TYPE=\"$4, \"TRAN=\"$5} END{if(NR==0) print \"INFO n/a-disks\"}'`"
priority_hint = ""
impact = "maintenance-window"
impact_scope = "control plane storage and etcd performance"
impact_detail = "Replacing rotational storage with SSD/NVMe on control plane nodes requires a maintenance window and may involve node drain, reinstallation, or disk migration."

